      '费用管理-云币充值.html':'billing-coin',
      '费用管理-订单管理.html':'billing-orders',
      '费用管理-开票管理.html':'billing-invoice',
      '费用管理-优惠券.html':'billing-coupons',
      '商城-代理.html':'store',
      '商城-套餐.html':'store',
      '商城-购物车.html':'store',
      '代理管理.html':'proxy',
      '新建浏览器.html':'create',
      '编辑浏览器.html':'environment',
      '环境管理.html':'environment',
      '设置.html':'settings',
      '帮助.html':'help',
      '回收站.html':'recycle'
    };
    // 公共入口只接受稳定 page key；保留历史中文文案和曾经生成的“费管理”参数，避免旧书签回退到首页。
    const legacyPageAliases = Object.freeze({
      '首页':'home',
      '环境管理':'environment',
      '代理管理':'proxy',
      '商城':'store',
      'billing':'billing-coin',
      '费用管理':'billing-coin',
      '费管理':'billing-coin',
      '云币充值':'billing-coin',
      '订单管理':'billing-orders',
      '开票管理':'billing-invoice',
      '优惠券':'billing-coupons',
      '团队管理':'team-management',
      '成员管理':'members',
      '账号管理':'account-management',
      '分享转移':'transfer',
      '日志管理':'logs',
      '账号设置':'account-settings',
      '插件管理':'plugins',
      'API':'api',
      'RPA':'rpa',
      '回收站':'recycle',
      '新建浏览器':'create',
      '设置':'settings',
      '帮助':'help'
    });
    function normalizePageKey(value) {
      const raw = String(value || '').trim();
      return legacyPageAliases[raw] || raw;
    }
    function prototypeHref(item) {
      if (item.id === 'onboarding') return 'index.html?page=home&guide=1';
      if (item.id === 'design-system') return `${PROTOTYPE_ROOT}设计系统.html`;
      if (item.file === '系统框架.html') return 'index.html?page=home';
      const page = systemRouteByFile[item.file];
      if (!page) return `${PROTOTYPE_ROOT}${item.file}`;
      const params = new URLSearchParams({ page });
      if (item.file === '编辑浏览器.html') params.set('module', item.file);
      return `index.html?${params.toString()}`;
    }
    const $ = id => document.getElementById(id);
    const toneClass = tone => ({success:'bg-success-bg text-success',info:'bg-info-bg text-info',primary:'bg-primary-bg text-primary'}[tone] || 'bg-page text-ink-sub');
    $('pageCounter').querySelector('.mono').textContent = `${prototypes.length} / ${prototypes.length}`;
    function renderFilters() {
      $('filterTabs').innerHTML = filters.map(filter => `<button type="button" role="tab" aria-selected="${filter.id===activeFilter}" data-filter="${filter.id}" class="filter-tab ${filter.id===activeFilter?'active':''}"><i data-lucide="${filter.icon}" class="w-4 h-4"></i>${filter.label}<span class="mono text-[11px]">${filter.id==='全部'?prototypes.length:prototypes.filter(item=>item.group===filter.id).length}</span></button>`).join('');
      $('filterTabs').querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => { activeFilter=button.dataset.filter; renderFilters(); renderPrototypes(); }));
    }
    function getVisiblePrototypes() {
      const keyword = $('searchInput').value.trim().toLowerCase();
      return prototypes.filter(item => {
        const inGroup = activeFilter === '全部' || item.group === activeFilter;
        const searchable = [item.title,item.description,item.file,item.group,...item.tags].join(' ').toLowerCase();
        return inGroup && (!keyword || searchable.includes(keyword));
      });
    }
    function renderPrototypes() {
      const visible = getVisiblePrototypes();
      const groups = [...new Set(visible.map(item=>item.group))];
      $('prototypeGroups').innerHTML = groups.map(group => {
        const items = visible.filter(item=>item.group===group);
        return `<section aria-labelledby="group-${group}">
          <div class="flex items-center gap-2 mb-3"><h3 id="group-${group}" class="text-[13px] font-semibold text-ink-title">${group}</h3><span class="mono text-[11px] text-ink-muted">${items.length}</span><span class="h-px bg-line-lighter flex-1"></span></div>
          <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${items.map((item,index)=>cardTemplate(item,index)).join('')}</div>
        </section>`;
      }).join('');
      $('prototypeGroups').classList.toggle('hidden', visible.length===0);
      $('emptyState').classList.toggle('hidden', visible.length!==0);
      $('emptyState').classList.toggle('flex', visible.length===0);
      $('resultSummary').textContent = visible.length === prototypes.length ? `共 ${prototypes.length} 个页面，全部入口可直接访问` : `当前显示 ${visible.length} / ${prototypes.length} 个页面`;
      const filtered = activeFilter!=='全部' || $('searchInput').value.trim();
      $('resetButton').classList.toggle('hidden', !filtered);
      $('resetButton').classList.toggle('flex', !!filtered);
      lucide.createIcons();
    }
    function cardTemplate(item,index) {
      return `<article class="prototype-card card-enter rounded-lg border border-line bg-card p-5 flex flex-col min-h-[260px]" style="animation-delay:${index*45}ms">
        <div class="flex items-start justify-between gap-4">
          <span class="w-10 h-10 rounded bg-primary-bg text-primary flex items-center justify-center shrink-0"><i data-lucide="${item.icon}" class="w-5 h-5"></i></span>
          <span class="h-6 px-2 rounded ${toneClass(item.statusTone)} text-[11px] font-medium flex items-center">${item.status}</span>
        </div>
        <div class="mt-4 flex-1">
          <a href="${prototypeHref(item)}" class="inline-flex items-center gap-1.5 text-[16px] font-semibold text-ink-title hover:text-primary focus:outline-none"><span>${item.title}</span><i data-lucide="arrow-up-right" class="w-4 h-4"></i></a>
          <p class="mt-2 text-[13px] leading-6 text-ink-sub">${item.description}</p>
          <div class="mt-3 flex flex-wrap gap-1.5">${item.tags.map(tag=>`<span class="h-6 px-2 rounded bg-page text-[11px] text-ink-sub flex items-center">${tag}</span>`).join('')}</div>
        </div>
        <div class="mt-5 pt-4 border-t border-line-lighter flex items-center justify-between gap-3">
          <div class="min-w-0 text-[11px] text-ink-muted"><span class="mono">${item.updated}</span><span class="mx-1.5">·</span><span class="mono">${item.size}</span></div>
          <a href="${prototypeHref(item)}" class="h-8 px-3 rounded bg-primary hover:bg-primary-hover active:bg-primary-active text-white flex items-center gap-1.5 shrink-0"><span>打开页面</span><i data-lucide="arrow-right" class="w-4 h-4"></i></a>
        </div>
      </article>`;
    }
    function resetFilters() { activeFilter='全部'; $('searchInput').value=''; renderFilters(); renderPrototypes(); $('searchInput').focus(); }
    function normalizeInitialRoute() {
      const params = new URLSearchParams(location.search);
      const rawPage = params.get('page');
      const normalizedPage = normalizePageKey(rawPage);
      if (rawPage && normalizedPage && normalizedPage !== rawPage) {
        params.set('page', normalizedPage);
        const url = new URL('index.html', location.href);
        url.search = params.toString();
        history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
      }
      return normalizedPage || rawPage;
    }
    const indexRoutePage = normalizeInitialRoute();
    function indexFrameUrl(search) {
      const params = new URLSearchParams(search || '');
      if (params.has('page')) params.set('page', normalizePageKey(params.get('page')));
      params.set('indexHost', '1');
      const frameUrl = new URL(SYSTEM_FRAME, location.href);
      frameUrl.search = params.toString();
      return frameUrl.href;
    }
    function indexOuterUrl(search) {
      const params = new URLSearchParams(search || '');
      if (params.has('page')) params.set('page', normalizePageKey(params.get('page')));
      params.delete('indexHost');
      const url = new URL('index.html', location.href);
      url.search = params.toString();
      return `${url.pathname}${url.search}${url.hash}`;
    }
    function syncIndexTitle(search) {
      const params = new URLSearchParams(search || '');
      const page = normalizePageKey(params.get('page')) || 'home';
      if (params.get('module') === '编辑浏览器.html') {
        document.title = '云登 · 编辑浏览器';
        return;
      }
      const item = prototypes.find(candidate => candidate.id === page || systemRouteByFile[candidate.file] === page);
      document.title = item ? `云登 · ${item.title}` : '云登 · PC端产品原型导航';
    }
    function mountIndexRouteHost() {
      syncIndexTitle(location.search);
      document.body.classList.add('index-route-host');
      document.body.innerHTML = '';
      const frame = document.createElement('iframe');
      frame.id = 'indexRouteFrame';
      frame.title = '云登系统框架';
      frame.src = indexFrameUrl(location.search);
      document.body.append(frame);
      const replaceFrameRoute = search => {
        const next = indexFrameUrl(search);
        try { frame.contentWindow.location.replace(next); } catch (_) { frame.src = next; }
      };
      let firstRouteReport = true;
      let pendingRoute = null;
      const applyOuterRoute = (search, replace = false) => {
        const next = indexOuterUrl(search);
        const current = `${location.pathname}${location.search}${location.hash}`;
        syncIndexTitle(search);
        if (next === current) { firstRouteReport = false; return; }
        if (replace || firstRouteReport) history.replaceState({}, '', next);
        else history.pushState({}, '', next);
        firstRouteReport = false;
      };
      window.addEventListener('message', event => {
        if (event.source !== frame.contentWindow || !event.data) return;
        if (event.data.type === 'yundeng:index-route-state') {
          const search = event.data.search || `?page=${encodeURIComponent(event.data.page || 'home')}`;
          const next = indexOuterUrl(search);
          if (pendingRoute && next !== pendingRoute) return;
          if (pendingRoute === next) pendingRoute = null;
          applyOuterRoute(search);
        } else if (event.data.type === 'yundeng:index-route-request') {
          const target = new URL(event.data.href || SYSTEM_FRAME, frame.src);
          const search = target.search || '?page=home';
          pendingRoute = indexOuterUrl(search);
          applyOuterRoute(search);
          replaceFrameRoute(search);
        } else if (event.data.type === 'yundeng:index-history') {
          const delta = Number(event.data.delta);
          if (Number.isInteger(delta) && delta !== 0) history.go(delta);
        }
      });
      window.addEventListener('popstate', () => {
        if (!new URLSearchParams(location.search).get('page')) { location.reload(); return; }
        pendingRoute = `${location.pathname}${location.search}${location.hash}`;
        replaceFrameRoute(location.search);
      });
    }
    $('searchInput').addEventListener('input',renderPrototypes);
    $('resetButton').addEventListener('click',resetFilters);
    $('emptyResetButton').addEventListener('click',resetFilters);
    document.addEventListener('keydown',event=>{
      if(event.key==='/' && document.activeElement!==$('searchInput')) { event.preventDefault(); $('searchInput').focus(); }
    });
    if (indexRoutePage) {
      mountIndexRouteHost();
    } else {
      renderFilters();
      renderPrototypes();
      lucide.createIcons();
    }
  </script>
</body>
</html>
