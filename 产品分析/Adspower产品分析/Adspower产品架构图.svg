<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D39C4"/>
      <stop offset="1" stop-color="#1677FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1D39C4" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
      .layer { font-size: 26px; font-weight: 700; fill: #1F2D3D; }
      .group { font-size: 23px; font-weight: 700; fill: #173B63; }
      .card { font-size: 20px; font-weight: 600; fill: #174A7A; }
      .pill { font-size: 17px; fill: #324A5F; }
      .small { font-size: 15px; fill: #5D7083; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#F7FAFF"/>
  <rect x="48" y="30" width="1824" height="84" rx="18" fill="url(#titleGrad)"/>
  <text class="font" x="960" y="75" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="700" fill="#FFFFFF">AdsPower 产品架构</text>
  <text class="font" x="960" y="102" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#D6E4FF">围绕浏览器环境形成的多账号运营、自动化协作与商业化能力体系</text>

  <!-- 产品边界 -->
  <rect x="132" y="132" width="1740" height="870" rx="20" fill="none" stroke="#91CAFF" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="150" y="124" width="150" height="28" rx="14" fill="#E6F4FF"/>
  <text class="font small" x="225" y="143" text-anchor="middle">AdsPower 产品边界</text>

  <!-- 触点层 -->
  <rect x="48" y="160" width="78" height="102" rx="14" fill="#D6E4FF"/>
  <text class="font layer" x="87" y="211" text-anchor="middle" dominant-baseline="middle">触点</text>
  <rect x="160" y="160" width="1680" height="102" rx="16" fill="#FFFFFF" stroke="#ADC6FF" filter="url(#shadow)"/>
  <rect x="188" y="184" width="356" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="568" y="184" width="356" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="948" y="184" width="356" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="1328" y="184" width="484" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <text class="font card" x="366" y="212" text-anchor="middle" dominant-baseline="middle">官网 · 下载 · 帮助中心</text>
  <text class="font card" x="746" y="212" text-anchor="middle" dominant-baseline="middle">桌面客户端（Win / macOS / Linux）</text>
  <text class="font card" x="1126" y="212" text-anchor="middle" dominant-baseline="middle">SunBrowser · FlowerBrowser</text>
  <text class="font card" x="1570" y="212" text-anchor="middle" dominant-baseline="middle">Local API · MCP · 自动化框架</text>

  <!-- 用户层 -->
  <rect x="48" y="278" width="78" height="92" rx="14" fill="#D9F7BE"/>
  <text class="font layer" x="87" y="324" text-anchor="middle" dominant-baseline="middle">用户</text>
  <rect x="160" y="278" width="1680" height="92" rx="16" fill="#FFFFFF" stroke="#B7EB8F" filter="url(#shadow)"/>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="188" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="333" y="325">个人运营者</text>
    <rect x="500" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="645" y="325">团队管理员</text>
    <rect x="812" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="957" y="325">团队成员</text>
    <rect x="1124" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="1269" y="325">自动化开发者</text>
    <rect x="1436" y="300" width="376" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="1624" y="325">采购 · 财务 · 合作伙伴</text>
  </g>

  <!-- 应用层 -->
  <rect x="48" y="386" width="78" height="130" rx="14" fill="#BAE7FF"/>
  <text class="font layer" x="87" y="451" text-anchor="middle" dominant-baseline="middle">应用</text>
  <rect x="160" y="386" width="1360" height="130" rx="16" fill="#FFFFFF" stroke="#91D5FF" filter="url(#shadow)"/>
  <text class="font group" x="188" y="416">业务应用与运营工作台</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="188" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="309" y="466">环境运营台</text>
    <rect x="452" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="573" y="466">代理资源台</text>
    <rect x="716" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="837" y="466">自动化中心</text>
    <rect x="980" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="1101" y="466">团队管理台</text>
    <rect x="1244" y="438" width="248" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="1368" y="466">商业与费用中心</text>
  </g>

  <!-- 横向支撑 -->
  <rect x="1544" y="386" width="296" height="478" rx="16" fill="#F0F5FF" stroke="#ADC6FF" filter="url(#shadow)"/>
  <text class="font group" x="1692" y="421" text-anchor="middle">横向能力支撑</text>
  <rect x="1570" y="444" width="244" height="116" rx="12" fill="#FFFFFF" stroke="#ADC6FF"/>
  <text class="font card" x="1692" y="473" text-anchor="middle">账号与安全</text>
  <text class="font pill" x="1692" y="505" text-anchor="middle">注册登录 · 二次验证</text>
  <text class="font pill" x="1692" y="533" text-anchor="middle">权限策略 · 账号安全</text>
  <rect x="1570" y="578" width="244" height="116" rx="12" fill="#FFFFFF" stroke="#ADC6FF"/>
  <text class="font card" x="1692" y="607" text-anchor="middle">运营与服务</text>
  <text class="font pill" x="1692" y="639" text-anchor="middle">帮助 · 消息 · 任务</text>
  <text class="font pill" x="1692" y="667" text-anchor="middle">更新 · 网络诊断 · 多语言</text>
  <rect x="1570" y="712" width="244" height="126" rx="12" fill="#FFFFFF" stroke="#ADC6FF"/>
  <text class="font card" x="1692" y="741" text-anchor="middle">治理与恢复</text>
  <text class="font pill" x="1692" y="773" text-anchor="middle">操作日志 · 运行记录</text>
  <text class="font pill" x="1692" y="801" text-anchor="middle">回收站 · 快照 · 数据同步</text>

  <!-- 核心域 -->
  <rect x="48" y="532" width="78" height="332" rx="14" fill="#FFF1B8"/>
  <text class="font layer" x="87" y="698" text-anchor="middle" dominant-baseline="middle">核心域</text>
  <rect x="160" y="532" width="1360" height="332" rx="16" fill="#FFFFFF" stroke="#FFD666" filter="url(#shadow)"/>
  <text class="font group" x="188" y="566">围绕“浏览器环境”的核心业务域</text>

  <rect x="188" y="588" width="412" height="248" rx="14" fill="#FFFBE6" stroke="#FFD666"/>
  <text class="font group" x="394" y="621" text-anchor="middle">环境与指纹核心</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="210" y="645" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="295" y="667">环境生命周期</text>
    <rect x="400" y="645" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="489" y="667">指纹与浏览器内核</text>
    <rect x="210" y="701" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="295" y="723">平台账号与 2FA</text>
    <rect x="400" y="701" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="489" y="723">Cookie 与本地数据</text>
    <rect x="210" y="757" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="295" y="779">分组 · 标签 · 备注</text>
    <rect x="400" y="757" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="489" y="779">分享 · 导出 · 恢复</text>
  </g>

  <rect x="620" y="588" width="412" height="248" rx="14" fill="#F6FFED" stroke="#B7EB8F"/>
  <text class="font group" x="826" y="621" text-anchor="middle">代理与自动化核心</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="642" y="645" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="727" y="667">代理导入与检查</text>
    <rect x="832" y="645" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="921" y="667">动态与集成代理</text>
    <rect x="642" y="701" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="727" y="723">窗口同步</text>
    <rect x="832" y="701" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="921" y="723">RPA 流程与模板</text>
    <rect x="642" y="757" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="727" y="779">任务计划与记录</text>
    <rect x="832" y="757" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="921" y="779">Local API · MCP</text>
  </g>

  <rect x="1052" y="588" width="440" height="248" rx="14" fill="#FFF0F6" stroke="#FFADD2"/>
  <text class="font group" x="1272" y="621" text-anchor="middle">组织治理与商业核心</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="1074" y="645" width="186" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1167" y="667">团队 · 成员 · 成员组</text>
    <rect x="1280" y="645" width="190" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1375" y="667">功能权限 · 分组授权</text>
    <rect x="1074" y="701" width="186" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1167" y="723">套餐与权益</text>
    <rect x="1280" y="701" width="190" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1375" y="723">环境数 · 成员数计费</text>
    <rect x="1074" y="757" width="186" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1167" y="779">钱包 · 订单 · 续期</text>
    <rect x="1280" y="757" width="190" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1375" y="779">终身环境 · 推广奖励</text>
  </g>

  <!-- 基础能力 -->
  <rect x="48" y="882" width="78" height="120" rx="14" fill="#E8E8E8"/>
  <text class="font layer" x="87" y="942" text-anchor="middle" dominant-baseline="middle">基础</text>
  <rect x="160" y="882" width="1680" height="120" rx="16" fill="#FFFFFF" stroke="#D9D9D9" filter="url(#shadow)"/>
  <text class="font group" x="188" y="915">通用基础能力</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="188" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="280" y="955">身份认证</text>
    <rect x="390" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="482" y="955">环境隔离</text>
    <rect x="592" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="684" y="955">浏览器内核</text>
    <rect x="794" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="886" y="955">代理连通</text>
    <rect x="996" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1088" y="955">流程调度</text>
    <rect x="1198" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1290" y="955">数据同步</text>
    <rect x="1400" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1492" y="955">计费与权益</text>
    <rect x="1602" y="932" width="210" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1707" y="955">日志审计与恢复</text>
  </g>

  <!-- 外部生态 -->
  <rect x="48" y="1026" width="78" height="118" rx="14" fill="#E6FFFB"/>
  <text class="font layer" x="87" y="1085" text-anchor="middle" dominant-baseline="middle">生态</text>
  <rect x="160" y="1026" width="1680" height="118" rx="16" fill="#F6FFED" stroke="#87E8DE" filter="url(#shadow)"/>
  <text class="font group" x="188" y="1058">外部资源与合作生态</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="188" y="1074" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="336" y="1097">Facebook · Amazon · TikTok 等平台</text>
    <rect x="504" y="1074" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="652" y="1097">FlashID 与代理供应商</text>
    <rect x="820" y="1074" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="968" y="1097">DuoPlus 云手机</text>
    <rect x="1136" y="1074" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="1284" y="1097">Chrome 扩展与应用生态</text>
    <rect x="1452" y="1074" width="360" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="1632" y="1097">Alipay · WeChat Pay · Card · PayPal</text>
  </g>

  <text class="font small" x="48" y="1177">图例：虚线框为 AdsPower 产品边界；底部为外部平台与资源；本图表达产品能力及关系，不表示技术部署拓扑。</text>
</svg>
