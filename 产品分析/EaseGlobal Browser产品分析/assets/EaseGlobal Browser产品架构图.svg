  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="188" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="309" y="466">首页与新手引导</text>
    <rect x="452" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="573" y="466">店铺运营台</text>
    <rect x="716" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="837" y="466">设备资源台</text>
    <rect x="980" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="1101" y="466">团队与安全治理台</text>
    <rect x="1244" y="438" width="248" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="1368" y="466">插件 · Agent · 费用服务</text>
