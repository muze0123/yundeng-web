    <rect x="390" y="934" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="482" y="957">权限校验与敏感遮罩</text>
    <rect x="592" y="934" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="684" y="957">浏览器环境与内核配置</text>
    <rect x="794" y="934" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="886" y="957">网络检测与站点可达</text>
    <rect x="996" y="934" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1088" y="957">凭证辅助与环境状态</text>
    <rect x="1198" y="934" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1290" y="957">搜索 · 筛选 · 标签 · 批量</text>
    <rect x="1400" y="934" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1492" y="957">消息提醒与状态反馈</text>
    <rect x="1602" y="934" width="210" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1707" y="957">账务记录与权益生效</text>
