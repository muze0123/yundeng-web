<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5CAD"/>
      <stop offset="1" stop-color="#1677FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#174A7A" flood-opacity="0.09"/>
    </filter>
    <style>
      .font { font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
      .layer { font-size: 26px; font-weight: 700; fill: #1F2D3D; }
      .group { font-size: 22px; font-weight: 700; fill: #173B63; }
      .card { font-size: 19px; font-weight: 600; fill: #174A7A; }
      .pill { font-size: 16px; fill: #324A5F; }
      .corepill { font-size: 14px; fill: #324A5F; }
      .small { font-size: 14px; fill: #5D7083; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#F7FAFC"/>
  <rect x="48" y="28" width="1824" height="88" rx="16" fill="url(#titleGrad)"/>
  <text class="font" x="960" y="70" text-anchor="middle" dominant-baseline="middle" font-size="35" font-weight="700" fill="#FFFFFF">EaseGlobal Browser 产品架构</text>
  <text class="font" x="960" y="100" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#D6E4FF">以店铺环境为核心资产，以团队为治理边界，以设备 / IP 为使用前提与当前明确付费资源</text>

  <!-- 产品边界：只覆盖触点、应用、核心域和基础能力；生态层在边界外 -->
  <rect x="132" y="132" width="1740" height="872" rx="20" fill="none" stroke="#69B1FF" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="150" y="124" width="222" height="28" rx="14" fill="#E6F4FF"/>
  <text class="font small" x="261" y="143" text-anchor="middle">EaseGlobal Browser 产品边界</text>

  <!-- 触点层 -->
  <rect x="48" y="160" width="78" height="102" rx="14" fill="#D6E4FF"/>
  <text class="font layer" x="87" y="211" text-anchor="middle" dominant-baseline="middle">触点</text>
  <rect x="160" y="160" width="1680" height="102" rx="16" fill="#FFFFFF" stroke="#ADC6FF" filter="url(#shadow)"/>
  <rect x="188" y="184" width="370" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="582" y="184" width="370" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="976" y="184" width="370" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="1370" y="184" width="442" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <text class="font card" x="373" y="212" text-anchor="middle" dominant-baseline="middle">官网 · 注册 · 下载 · 帮助中心</text>
  <text class="font card" x="767" y="212" text-anchor="middle" dominant-baseline="middle">Windows / macOS 桌面客户端</text>
  <text class="font card" x="1161" y="212" text-anchor="middle" dominant-baseline="middle">店铺隔离浏览器窗口</text>
  <text class="font card" x="1591" y="212" text-anchor="middle" dominant-baseline="middle">微信小程序远程入口 · 客服与反馈</text>

  <!-- 用户层 -->
