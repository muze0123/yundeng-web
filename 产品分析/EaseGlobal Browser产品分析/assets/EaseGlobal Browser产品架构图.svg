  <text class="font pill" x="1692" y="505" text-anchor="middle">手机号 / 团队账号认证</text>
  <text class="font pill" x="1692" y="533" text-anchor="middle">角色 · 数据范围 · 对象授权</text>
  <rect x="1570" y="578" width="244" height="116" rx="12" fill="#FFFFFF" stroke="#ADC6FF"/>
  <text class="font card" x="1692" y="607" text-anchor="middle">安全策略与审计</text>
  <text class="font pill" x="1692" y="639" text-anchor="middle">登录 / 页面 / 元素策略</text>
