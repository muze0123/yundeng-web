    <rect x="500" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="645" y="325">BOSS · 团队创建者</text>
    <rect x="812" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="957" y="325">超级管理员 · 管理员</text>
    <rect x="1124" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="1269" y="325">店铺管理员 · 运营成员</text>
    <rect x="1436" y="300" width="376" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="1624" y="325">安全风控 · 财务采购 · 客服支持</text>
  </g>

