    <rect x="1010" y="645" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1075" y="667">角色 · 功能权限</text>
    <rect x="870" y="701" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="935" y="723">店铺 · 凭证授权</text>
    <rect x="1010" y="701" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1075" y="723">登录限制 · 审批</text>
    <rect x="870" y="757" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="935" y="779">访问策略 · 水印</text>
    <rect x="1010" y="757" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1075" y="779">监控 · 审计日志</text>
