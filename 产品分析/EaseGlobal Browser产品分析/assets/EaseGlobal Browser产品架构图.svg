    <rect x="350" y="645" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="415" y="667">平台 · 站点 · 标签</text>
    <rect x="210" y="701" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="275" y="723">内核 · UA · 缓存</text>
