    <rect x="680" y="645" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="745" y="667">地域 · 供应 · SKU</text>
    <rect x="540" y="701" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="605" y="723">购买 · 交付 · 检测</text>
    <rect x="680" y="701" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="745" y="723">绑定 · 解绑</text>
    <rect x="540" y="757" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="605" y="779">换 IP · 权益</text>
    <rect x="680" y="757" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="745" y="779">到期 · 续费 · 移除</text>
