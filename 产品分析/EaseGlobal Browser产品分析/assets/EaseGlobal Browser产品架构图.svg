  <text class="font layer" x="87" y="1087" text-anchor="middle" dominant-baseline="middle">生态</text>
  <rect x="160" y="1028" width="1680" height="118" rx="16" fill="#F6FFED" stroke="#87E8DE" filter="url(#shadow)"/>
  <text class="font group" x="188" y="1060">产品边界外的目标平台、资源供应与服务生态</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
