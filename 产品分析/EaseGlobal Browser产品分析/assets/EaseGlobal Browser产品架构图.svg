    <rect x="1340" y="645" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#91D5FF"/><text x="1405" y="667">充值 · 开票 · 续费</text>
    <rect x="1200" y="701" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#91D5FF"/><text x="1265" y="723">插件市场 · 上传</text>
    <rect x="1340" y="701" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#91D5FF"/><text x="1405" y="723">插件权限 · 分配</text>
    <rect x="1200" y="757" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#91D5FF" stroke-dasharray="5 4"/><text x="1265" y="779">Agent 应用 · 定制*</text>
    <rect x="1340" y="757" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#91D5FF"/><text x="1405" y="779">活动 · 邀请 · 反馈</text>
