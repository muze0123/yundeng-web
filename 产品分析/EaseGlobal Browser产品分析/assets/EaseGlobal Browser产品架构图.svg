  <text class="font small" x="48" y="1178">图例：虚线大框为产品边界；底部生态属于外部依赖；* Agent 入口已确认，任务执行、SLA、外部调用与收费边界待核实。本图不表示技术部署。版本：2026-08-14。</text>
</svg>
