    <rect x="210" y="645" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="295" y="667">创建 · 导入 · 迁移</text>
    <rect x="400" y="645" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#FFE58F"/><text x="489" y="667">指纹 · 内核 · UA</text>
