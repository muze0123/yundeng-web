    <rect x="1074" y="645" width="186" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1167" y="667">团队 · 部门 · 成员</text>
    <rect x="1280" y="645" width="190" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1375" y="667">角色 · 权限 · 数据范围</text>
    <rect x="1074" y="701" width="186" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1167" y="723">商城 · 多选购物车</text>
    <rect x="1280" y="701" width="190" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1375" y="723">套餐 · 环境数 · 成员数</text>
    <rect x="1074" y="757" width="186" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1167" y="779">云币 · 优惠券 · 支付</text>
    <rect x="1280" y="757" width="190" height="42" rx="8" fill="#FFFFFF" stroke="#FFADD2"/><text x="1375" y="779">订单 · 续费 · 退款状态</text>
  </g>

  <rect x="48" y="882" width="78" height="120" rx="14" fill="#E8E8E8"/>
