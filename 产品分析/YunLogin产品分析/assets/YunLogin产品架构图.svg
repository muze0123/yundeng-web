  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="642" y="645" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="727" y="667">平台代理 · 自有代理</text>
    <rect x="832" y="645" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="921" y="667">代理 API · 提取 · 检测</text>
    <rect x="642" y="701" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="727" y="723">RPA 模板 · 流程编排</text>
    <rect x="832" y="701" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="921" y="723">即时 · 优先 · 计划任务</text>
    <rect x="642" y="757" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="727" y="779">任务日志 · 异常策略</text>
    <rect x="832" y="757" width="178" height="42" rx="8" fill="#FFFFFF" stroke="#B7EB8F"/><text x="921" y="779">Local API · 自动化框架</text>
