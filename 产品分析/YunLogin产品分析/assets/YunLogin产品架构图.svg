<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D39C4"/>
      <stop offset="1" stop-color="#1677FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1D39C4" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
      .layer { font-size: 26px; font-weight: 700; fill: #1F2D3D; }
      .group { font-size: 23px; font-weight: 700; fill: #173B63; }
      .card { font-size: 20px; font-weight: 600; fill: #174A7A; }
      .pill { font-size: 17px; fill: #324A5F; }
      .small { font-size: 15px; fill: #5D7083; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#F7FAFF"/>
  <rect x="48" y="30" width="1824" height="84" rx="18" fill="url(#titleGrad)"/>
  <text class="font" x="960" y="75" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="700" fill="#FFFFFF">YunLogin 产品架构</text>
  <text class="font" x="960" y="102" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#D6E4FF">围绕浏览器环境形成的多账号隔离、团队治理、自动化运营与商业交易能力体系</text>

  <rect x="132" y="132" width="1740" height="870" rx="20" fill="none" stroke="#91CAFF" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="150" y="124" width="154" height="28" rx="14" fill="#E6F4FF"/>
  <text class="font small" x="227" y="143" text-anchor="middle">YunLogin 产品边界</text>

  <rect x="48" y="160" width="78" height="102" rx="14" fill="#D6E4FF"/>
  <text class="font layer" x="87" y="211" text-anchor="middle" dominant-baseline="middle">触点</text>
  <rect x="160" y="160" width="1680" height="102" rx="16" fill="#FFFFFF" stroke="#ADC6FF" filter="url(#shadow)"/>
  <rect x="188" y="184" width="370" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="582" y="184" width="370" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="976" y="184" width="370" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <rect x="1370" y="184" width="442" height="54" rx="10" fill="#E6F4FF" stroke="#91CAFF"/>
  <text class="font card" x="373" y="212" text-anchor="middle" dominant-baseline="middle">管理中心桌面客户端</text>
  <text class="font card" x="767" y="212" text-anchor="middle" dominant-baseline="middle">隔离浏览器环境窗口</text>
  <text class="font card" x="1161" y="212" text-anchor="middle" dominant-baseline="middle">云登助手 · 帮助 · 消息</text>
  <text class="font card" x="1591" y="212" text-anchor="middle" dominant-baseline="middle">Local API · Selenium · Puppeteer</text>

  <rect x="48" y="278" width="78" height="92" rx="14" fill="#D9F7BE"/>
  <text class="font layer" x="87" y="324" text-anchor="middle" dominant-baseline="middle">用户</text>
  <rect x="160" y="278" width="1680" height="92" rx="16" fill="#FFFFFF" stroke="#B7EB8F" filter="url(#shadow)"/>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="188" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="333" y="325">个人运营者</text>
    <rect x="500" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="645" y="325">团队创始人 · 管理员</text>
    <rect x="812" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="957" y="325">配置员 · 操作员</text>
    <rect x="1124" y="300" width="290" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="1269" y="325">自动化开发者</text>
    <rect x="1436" y="300" width="376" height="48" rx="10" fill="#F6FFED" stroke="#B7EB8F"/><text x="1624" y="325">采购 · 财务 · 部门管理员</text>
  </g>

  <rect x="48" y="386" width="78" height="130" rx="14" fill="#BAE7FF"/>
