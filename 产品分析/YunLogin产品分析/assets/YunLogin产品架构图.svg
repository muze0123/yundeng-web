  <text class="font group" x="188" y="416">业务应用与运营工作台</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="188" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="309" y="466">环境运营台</text>
    <rect x="452" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="573" y="466">代理与账号资源台</text>
    <rect x="716" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="837" y="466">RPA 与 API 中心</text>
    <rect x="980" y="438" width="242" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="1101" y="466">团队治理台</text>
    <rect x="1244" y="438" width="248" height="54" rx="10" fill="#E6F7FF" stroke="#69C0FF"/><text x="1368" y="466">商城与费用中心</text>
