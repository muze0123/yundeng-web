    <rect x="390" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="482" y="955">环境隔离</text>
    <rect x="592" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="684" y="955">浏览器内核</text>
    <rect x="794" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="886" y="955">代理连通</text>
    <rect x="996" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1088" y="955">任务调度</text>
    <rect x="1198" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1290" y="955">数据同步</text>
    <rect x="1400" y="932" width="184" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1492" y="955">计费与权益</text>
    <rect x="1602" y="932" width="210" height="44" rx="8" fill="#FAFAFA" stroke="#D9D9D9"/><text x="1707" y="955">日志审计与恢复</text>
  </g>

  <rect x="48" y="1026" width="78" height="118" rx="14" fill="#E6FFFB"/>
  <text class="font layer" x="87" y="1085" text-anchor="middle" dominant-baseline="middle">生态</text>
  <rect x="160" y="1026" width="1680" height="118" rx="16" fill="#F6FFED" stroke="#87E8DE" filter="url(#shadow)"/>
  <text class="font group" x="188" y="1058">外部资源与合作生态</text>
  <g class="font pill" text-anchor="middle" dominant-baseline="middle">
    <rect x="188" y="1074" width="332" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="354" y="1097">Facebook · Amazon · TikTok 等平台</text>
    <rect x="540" y="1074" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="688" y="1097">住宅代理 · 云平台代理供应商</text>
    <rect x="856" y="1074" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="1004" y="1097">Chrome · Firefox 插件生态</text>
    <rect x="1172" y="1074" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="1320" y="1097">微信 · 钉钉账号生态</text>
    <rect x="1488" y="1074" width="324" height="44" rx="8" fill="#FFFFFF" stroke="#87E8DE"/><text x="1650" y="1097">支付宝 · 微信支付 · 外部客服</text>
  </g>

  <text class="font small" x="48" y="1177">图例：虚线框为 YunLogin 产品边界；底部为外部平台与资源；本图表达产品能力及关系，不表示技术部署拓扑。版本：2026-08-12。</text>
</svg>
