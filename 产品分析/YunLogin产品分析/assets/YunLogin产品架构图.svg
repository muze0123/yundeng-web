  <text class="font pill" x="1692" y="505" text-anchor="middle">注册登录 · 实名认证</text>
  <text class="font pill" x="1692" y="533" text-anchor="middle">设备管理 · 高风险提醒</text>
  <rect x="1570" y="578" width="244" height="116" rx="12" fill="#FFFFFF" stroke="#ADC6FF"/>
  <text class="font card" x="1692" y="607" text-anchor="middle">运营与服务</text>
  <text class="font pill" x="1692" y="639" text-anchor="middle">消息 · 任务 · 新手教程</text>
  <text class="font pill" x="1692" y="667" text-anchor="middle">客户经理 · 7×24 客服 · 资源看板</text>
  <rect x="1570" y="712" width="244" height="126" rx="12" fill="#FFFFFF" stroke="#ADC6FF"/>
