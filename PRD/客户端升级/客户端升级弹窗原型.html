<style>

*{box-sizing:border-box}body{margin:0;background:#F7F8FA;color:#3A3F4A;font:13px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #0066FF;outline-offset:2px}.mono{font-family:'JetBrains Mono',monospace}h1,h2,h3,p{margin:0}.review h1{font-size:24px;font-weight:700;color:#1A1D24}.review h2,.review h3{font-size:16px;font-weight:600;color:#1A1D24}.muted{color:#6E7685}.small{font-size:12px}.review{max-width:1280px;margin:auto;padding:32px 24px}.review-head{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:20px}.tag{display:inline-flex;padding:0 8px;line-height:24px;background:#E6F0FF;color:#0066FF;border-radius:4px;border:1px solid #0066FF;white-space:nowrap}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:12px;padding:20px;background:white;border-radius:8px;margin-bottom:16px}.controls label{display:grid;gap:6px}.controls select{height:32px;border:1px solid #DFE1E5;border-radius:4px;background:white;padding:0 12px;max-width:100%;color:#3A3F4A}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 16px;border:1px solid #DFE1E5;border-radius:4px;background:#FFFFFF;color:#3A3F4A;white-space:nowrap;transition:background .15s}.btn:hover{background:#F3F4F6}.btn.primary{background:#0066FF;border-color:#0066FF;color:white}.btn.primary:hover{background:#0052CC;border-color:#0052CC}.btn.primary:active{background:#0047B3;border-color:#0047B3}.btn:disabled{background:#F0F1F3;color:#9DA2AC;border-color:#DFE1E5;cursor:not-allowed}.btn svg{width:16px;height:16px}.preview-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 20px;background:#FFFFFF;border-bottom:1px solid #E8EAED}.stage{position:relative;min-height:800px;overflow:hidden;border-radius:8px;background:#FFFFFF;border:1px solid #DFE1E5}.workspace{padding:24px}.workspace-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:640px;text-align:left}th{font-size:12px;color:#6E7685;background:#F0F1F3;padding:9px 12px}td{padding:12px;border-bottom:1px solid #F0F1F3}.good{color:#0FC060}.notice{padding:12px 16px;background:#E6F0FF;border-radius:4px;color:#0066FF;margin-bottom:16px}.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);padding:24px;z-index:2}.layer[hidden]{display:none}.dialog{width:760px;max-width:100%;max-height:752px;border-radius:8px;background:white;box-shadow:0 6px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden}.dialog:focus{outline:none}[hidden]{display:none!important}.dialog-header{min-height:56px;flex-shrink:0;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #E8EAED}.dialog-header h2{display:flex;gap:10px;align-items:center}.dialog-header svg{width:20px;height:20px;flex-shrink:0}.close{border:0;background:transparent;color:#9DA2AC;width:32px;height:32px;display:flex;justify-content:center;align-items:center;border-radius:4px}.close:hover{background:#F3F4F6;color:#3A3F4A}.dialog-body{padding:32px 24px;overflow:auto;min-height:0}.dialog-footer{padding:16px 24px;border-top:1px solid #E8EAED;display:flex;justify-content:flex-end;gap:12px;flex-shrink:0;flex-wrap:wrap}.lead{font-size:13px;line-height:1.8}.alert{margin-top:16px;padding:12px 16px;background:#FDF2E9;color:#E7772D;border-radius:4px}.alert.error{background:#FFE8EB;color:#D9001B}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin:24px 0;padding:16px;background:#F7F8FA;border-radius:8px}.facts div{display:flex;justify-content:space-between;gap:12px}.facts dt{color:#6E7685}.facts dd{margin:0}.release{margin-top:20px}.release ul{margin:12px 0 0;padding-left:20px}.release li{margin:8px 0}.check{display:flex;align-items:center;gap:8px;margin-top:24px;color:#6E7685}.check input{accent-color:#0066FF;width:16px;height:16px}.progress-track{height:8px;background:#F0F1F3;border-radius:4px;overflow:hidden;margin:24px 0 12px}.progress-fill{height:100%;background:#0066FF;width:0;transition:width .15s}.progress-caption{display:flex;justify-content:space-between}.state-banner{display:flex;align-items:center;gap:12px;margin-top:24px;padding:16px;background:#F7F8FA;border-radius:8px}.state-banner svg{width:24px;height:24px;color:#0066FF}.history{margin-top:16px;padding:16px 20px;background:white;border-radius:8px}.history ol{margin:8px 0 0;padding-left:20px;color:#6E7685;font-size:12px;max-height:120px;overflow:auto}.footnote{margin-top:16px}.task-summary{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.task-summary span{padding:12px 16px;background:#F7F8FA;border-radius:4px}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:767px){.review{padding:16px}.review-head{flex-direction:column}.controls{padding:16px}.controls label{width:100%}.controls select{width:100%}.layer{padding:16px}.facts{grid-template-columns:1fr}.dialog-body{padding:24px}.dialog-header{padding:16px 24px}.workspace{padding:16px}.preview-bar{flex-wrap:wrap}.stage{min-height:880px}.dialog{max-height:848px}.task-summary span{flex:1;white-space:nowrap}}

<body>
<main class="review">
<header class="review-head"><div><h1>客户端升级 · 弹窗与交互</h1><p class="muted" style="margin-top:8px">YunLogin Windows / macOS · 产品设计评审</p></div><span class="tag">可交互原型</span></header>
<!-- 评审控制区：不进入真实客户端用户流程 -->
<section class="controls" aria-label="评审场景控制">
<label>更新类型<select id="mode"><option value="forced">强制升级 · 4.0.1.9</option><option value="optional">可选升级 · 4.0.2.0</option></select></label>
<label>客户端系统<select id="platform"><option>Windows · x64</option><option>macOS · Apple Silicon</option><option>macOS · Intel</option></select></label>
<label>查看场景<select id="scene"></select></label>
<button class="btn" id="start">从头体验</button><button class="btn" id="startup">模拟完整重启</button><button class="btn" id="push">模拟运行中通知</button>
</section>
<p class="small muted" style="margin:0 0 12px">评审区外控件用于切换场景；下方为弹窗预览区域。版本、包大小、任务及更新内容均为 Mock；计时已加速，不会真实下载、安装或关闭任务。</p>
<section class="stage" aria-label="客户端升级预览">
<div class="preview-bar"><span id="modeNote"></span><span class="mono small muted" id="stageState"></span></div>
<section class="workspace" id="workspace"><div id="inlineNotice" class="notice" hidden></div><div class="workspace-heading"><div><h3>运行任务</h3><p class="small muted">用于演示升级前的任务关闭确认</p></div><button class="btn" id="manual"><i data-lucide="refresh-cw"></i>检查更新</button></div><div class="table-wrap"><table><thead><tr><th>任务编号</th><th>任务名称</th><th>类型</th><th>状态</th></tr></thead><tbody id="tasks"></tbody></table></div></section>
<div class="layer" id="layer" hidden><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogLead" tabindex="-1"><header class="dialog-header"><h2 id="dialogTitle"></h2><button class="close" id="close" aria-label="关闭升级提醒"><i data-lucide="x"></i></button></header><div class="dialog-body" id="body"></div><footer class="dialog-footer" id="footer"></footer></section></div>
</section>
<section class="history"><h3>交互记录</h3><ol id="log" aria-live="polite"></ol></section>
<p class="footnote small muted">强制门槛：低于 <span class="mono">4.0.2.0</span>。仅在完整启动时主动提醒；下载中断自动从零重下。生产弹窗由现有客户端全局弹层承载。</p>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenarios=[['prompt','发现更新'],['downloading','正在下载'],['offline','断网与自动重下'],['retry','自动重试'],['ready','等待重启'],['tasks','关闭任务确认'],['checkError','检查更新失败'],['disk','磁盘空间不足'],['incompatible','无兼容安装包'],['verifyError','更新包校验失败'],['downloadError','自动重试用尽'],['revoked','目标版本撤回'],['taskError','运行任务关闭失败'],['permission','未获得安装权限'],['installError','安装更新失败'],['bootError','新版启动验证失败'],['recoveryError','旧版恢复失败'],['success','升级成功']];
const taskData=Array.from({length:10},(_,i)=>({id:'YL-T'+String(i+1).padStart(4,'0'),name:['跨境店铺日常运营','商品资料核对','每日数据采集','图片素材下载','运营报表导出','订单详情同步','库存信息核对','店铺巡检','商品截图归档','素材整理'][i],type:i===2?'RPA 任务':i===3?'下载任务':'浏览器环境',active:i<4}));
const releaseNotes=['优化客户端启动与运行体验。','修复已知问题，提高使用稳定性。','改进更新流程与异常提示。'];
const state={mode:'forced',current:'4.0.1.9',target:'4.0.3.0',scene:'prompt',progress:0,retries:0,manual:false,pending:false,downloadApproved:false,ready:false,background:false,log:[],generation:0};
let timers=[],lastFocus=null,exitReturn='prompt',taskReturn='ready';
function icon(name){return '<i data-lucide="'+name+'" aria-hidden="true"></i>'}
function icons(){window.lucide?.createIcons()}
function log(text){state.log.unshift(text);$('#log').innerHTML=state.log.slice(0,8).map(x=>'<li>'+esc(x)+'</li>').join('')}
function clearTimers(){timers.forEach(clearTimeout);timers=[];state.generation++}
function later(fn,ms){const generation=state.generation;const timer=setTimeout(()=>{if(generation===state.generation)fn()},ms);timers.push(timer)}
function forced(){return state.mode==='forced'&&compare(state.current,'4.0.2.0')<0}
function compare(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<4;i++){if(x[i]!==y[i])return x[i]-y[i]}return 0}
function ignoreKey(){return 'yunlogin.upgrade.design.ignore.'+$('#platform').value+'.'+state.target}
function ignored(){try{return localStorage.getItem(ignoreKey())==='yes'}catch{return false}}
function rememberIgnore(){try{if($('#ignore')?.checked)localStorage.setItem(ignoreKey(),'yes')}catch{} }
function summary(){const tasks=taskData.filter(t=>t.active);return ['浏览器环境','RPA 任务','下载任务'].map(type=>({type,count:tasks.filter(t=>t.type===type).length}))}
function facts(){return '<dl class="facts"><div><dt>当前版本</dt><dd class="mono">'+esc(state.current)+'</dd></div><div><dt>升级版本</dt><dd class="mono">'+esc(state.target)+'</dd></div><div><dt>当前设备</dt><dd>'+esc($('#platform').value)+'</dd></div><div><dt>更新包大小</dt><dd class="mono">128 MB</dd></div></dl>'}
function alertBox(text,error=false){return '<p class="alert'+(error?' error':'')+'">'+text+'</p>'}
function spinner(text){return '<div class="state-banner">'+icon('loader-circle')+'<span>'+text+'</span></div>'}
function btn(label,action,primary=false,disabled=false){return '<button type="button" class="btn'+(primary?' primary':'')+'" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+label+'</button>'}
function errorButtons(primary='重试',action='retryState'){return btn(forced()?'退出客户端':'稍后再说',forced()?'exit':'dismiss')+btn(primary,action,true)}
function closable(){return !forced()&&['prompt','ready','checkError','disk','incompatible','downloadError','taskError','permission','installError','bootError','revoked','downloading','offline','retry'].includes(state.scene)}
function show(scene){clearTimers();state.scene=scene;state.background=false;render();}
function render(){
 const focusAction=document.activeElement?.dataset?.action;
 $('#modeNote').textContent=forced()?'强制升级 · 业务操作已锁定':'可选升级 · 可以继续使用';$('#stageState').textContent=state.scene;
 $('#tasks').innerHTML=taskData.map(t=>'<tr><td class="mono">'+t.id+'</td><td>'+t.name+'</td><td>'+t.type+'</td><td class="'+(t.active?'good':'muted')+'">'+(t.active?'运行中':'已结束')+'</td></tr>').join('');
 const hidden=['idle','exited'].includes(state.scene)||state.background;
 $('#layer').hidden=hidden;$('#workspace').inert=!hidden||forced()||state.scene==='exited';
 $('#inlineNotice').hidden=!hidden;$('#inlineNotice').textContent=state.scene==='exited'?'客户端已退出（演示），可点击上方“模拟完整重启”重新进入。':state.pending?'已收到新版本通知。本次会话不弹窗，下次完整启动时检查。':state.background?'更新正在后台处理。你可以继续使用客户端。':'可以继续使用当前版本，或主动检查更新。';
 if(hidden){icons();return}
 let title='',lead='',content='',buttons='';
 switch(state.scene){
 case 'prompt':title=forced()?'当前版本过旧，请升级后继续使用':'发现新版本 '+state.target;lead=forced()?'当前版本 '+state.current+' 已不再支持使用。请升级至 '+state.target+'，完成后即可继续使用 YunLogin。':'升级以体验新功能和改进。你也可以稍后升级，继续使用当前版本。';content=facts()+'<section class="release"><h3>更新内容</h3><p class="muted small">发布于 2026-09-10（演示）</p><ul>'+releaseNotes.map(x=>'<li>'+x+'</li>').join('')+'</ul></section>'+(forced()?alertBox('完成升级前，暂时无法使用客户端业务功能。'):'<label class="check"><input id="ignore" type="checkbox">不再提醒此版本</label>');buttons=btn(forced()?'退出客户端':'稍后再说',forced()?'exit':'dismiss')+btn('立即升级','download',true);break;
 case 'downloading':title='正在下载更新';lead='正在下载 YunLogin '+state.target+'，请保持网络连接。';content='<div class="progress-track" role="progressbar" aria-label="更新包下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+state.progress+'"><div class="progress-fill" style="width:'+state.progress+'%"></div></div><div class="progress-caption mono"><span>'+state.progress+'%</span><span>'+Math.round(128*state.progress/100)+' / 128 MB</span></div><p class="small muted" style="margin-top:20px">下载中断后将重新下载，不支持断点续传。</p>';buttons=(forced()?'':btn('后台下载','background'))+btn('退出客户端','exit');break;
 case 'offline':title='网络连接已断开';lead='网络恢复后将自动重新下载，下载进度从 0% 开始。';content=alertBox('本次未完成的更新包已作废。')+spinner('正在等待网络恢复');buttons=(forced()?'':btn('稍后再说','background'))+btn('退出客户端','exit');break;
 case 'retry':title='下载中断，正在准备重新下载';lead='将在 '+[5,15,30][Math.min(state.retries,2)]+' 秒后从 0% 重新下载。';content=spinner('自动重试 '+Math.min(state.retries+1,3)+'/3（原型加速演示）');buttons=(forced()?'':btn('后台等待','background'))+btn('退出客户端','exit');break;
 case 'verifying':title='正在校验更新包';lead='下载已完成，正在检查更新包是否完整且适用于当前客户端。';content=spinner('校验通过后即可重启升级');buttons=btn('正在校验','noop',false,true);break;
 case 'ready':title='更新包已下载，重启后完成升级';lead='YunLogin '+state.target+' 已准备就绪。重启将关闭当前客户端，请先保存工作。';content=facts()+alertBox('点击“立即重启”后将安装更新。当前客户端尚未升级。');buttons=btn(forced()?'退出客户端':'稍后重启',forced()?'exit':'dismiss')+btn('立即重启','restart',true);break;
 case 'tasks':title='关闭运行任务并重启？';lead='重启会关闭以下任务，未保存的内容可能丢失。请确认已保存工作。';content='<div class="task-summary">'+summary().map(x=>'<span><strong class="mono">'+x.count+'</strong> 个'+x.type+'</span>').join('')+'</div>'+alertBox('确认后将停止运行任务，再重启并安装更新。');buttons=btn('返回','returnReady')+btn('关闭任务并重启','closeTasks',true);break;
 case 'closing':title='正在关闭运行任务';lead='正在结束运行任务，请稍候。结束后将重启并安装更新。';content=spinner('请勿关闭电脑');buttons=btn('正在处理','noop',false,true);break;
 case 'installing':title='正在安装更新';lead='正在安装 YunLogin '+state.target+'，完成后将自动启动。请勿关闭电脑。';content=spinner('安装更新中');buttons=btn('正在安装','noop',false,true);break;
 case 'booting':title='正在启动新版本';lead='正在确认更新后的客户端可以正常使用。';content=spinner('启动验证中');buttons=btn('正在验证','noop',false,true);break;
 case 'success':title='YunLogin 已更新至 '+state.target;lead='客户端升级已完成，可以继续使用。';content='<div class="state-banner">'+icon('circle-check')+'<span>当前运行版本 <strong class="mono">'+state.target+'</strong></span></div>';buttons=btn('开始使用','finish',true);break;
 case 'latest':title='当前已是最新可用版本';lead='当前版本 '+state.current+'，暂时没有适用于此设备的更新。';buttons=btn('知道了','dismiss',true);break;
 case 'checkError':title='暂时无法检查更新';lead='请检查网络连接后重试。';content=forced()?alertBox('当前版本过旧，完成升级后才能继续使用。'):alertBox('你可以继续使用当前版本，稍后再检查更新。');buttons=errorButtons('重试检查','check');break;
 case 'disk':title='磁盘空间不足';lead='无法下载或安装更新，请清理空间后重试。';content='<dl class="facts"><div><dt>需要可用空间</dt><dd class="mono">1.2 GB</dd></div><div><dt>当前可用空间</dt><dd class="mono">480 MB</dd></div></dl>';buttons=errorButtons('重新检查','download');break;
 case 'incompatible':title='暂未找到适用的更新包';lead='当前设备暂时没有兼容的更新包。请稍后重试或联系支持。';content=alertBox('当前设备：'+esc($('#platform').value)+'。不会安装不匹配的更新包。');buttons=errorButtons('重新检查','check');break;
 case 'verifyError':title='更新包校验失败';lead='将自动重新下载更新包，请稍候。';content=alertBox('本次更新包不可使用，下载进度将从 0% 开始。',true);buttons=btn('退出客户端','exit');break;
 case 'downloadError':title='更新包下载失败';lead='已自动重试 3 次。请检查网络后重新下载。';content=alertBox('重新下载将从 0% 开始。',true);buttons=errorButtons('重新下载','download');break;
 case 'revoked':title='此更新版本暂不可用';lead='当前更新已撤回，请重新检查可用版本。';content=alertBox('不会安装已撤回的更新包。确认新的版本后再开始下载。');buttons=errorButtons('重新检查','newTarget');break;
 case 'taskError':title='部分任务未能关闭';lead='暂时无法重启升级。请检查运行任务后重试。';content=alertBox('客户端尚未进入安装阶段。',true);buttons=btn('返回更新','returnReady')+btn('重试关闭','restart',true);break;
 case 'permission':title='未获得安装权限';lead='未获得安装更新所需权限。请授权后重试。';content=alertBox('重新安装时将再次请求系统授权。');buttons=errorButtons('重试安装','installRetry');break;
 case 'installError':title='更新安装未完成';lead='已保留可恢复的原版本，请重试升级。';content=alertBox(forced()?'当前原版本过旧，恢复后仍需完成升级才能使用。':'当前原版本可以继续使用，稍后可再次升级。',true);buttons=errorButtons('重试安装','installRetry');break;
 case 'bootError':title='新版本未能正常启动';lead='已恢复至 '+state.current+'，请重试升级。';content=alertBox(forced()?'当前版本过旧，完成升级后才能继续使用。':'你可以继续使用原版本，稍后重试升级。',true);buttons=errorButtons('重试升级','download');break;
 case 'recoveryError':title='客户端恢复失败';lead='暂时无法恢复客户端，请重试修复或联系支持。';content=alertBox('错误编号：UPD-RECOVERY-001',true);buttons=btn('退出客户端','exit')+btn('重试修复','repair',true);break;
 case 'exit':title='确认退出客户端？';lead=['downloading','offline','retry','verifyError'].includes(exitReturn)?'退出会中断本次下载，下次升级将重新下载。':state.ready?'已下载的完整更新包将保留。':'退出后，下次启动将重新检查更新。';content=taskData.some(x=>x.active)?alertBox('当前仍有运行任务，退出将关闭这些任务，未保存的内容可能丢失。'):'';buttons=btn('返回','cancelExit')+btn('退出客户端','confirmExit',true);break;
 }
 $('#dialogTitle').innerHTML=icon(['downloadError','installError','bootError','recoveryError'].includes(state.scene)?'circle-alert':state.scene==='success'?'circle-check':'arrow-up-circle')+'<span>'+esc(title)+'</span>';
 $('#body').innerHTML='<p class="lead" id="dialogLead">'+esc(lead)+'</p>'+content;$('#footer').innerHTML=buttons;$('#close').hidden=!closable();icons();
 if(focusAction){const target=$('#footer [data-action="'+focusAction+'"]');if(target&&!target.disabled)target.focus({preventScroll:true})}
 if(!$('#dialog').contains(document.activeElement)){lastFocus=document.activeElement;$('#dialog').focus({preventScroll:true})}
}
// 每轮异步任务使用 generation 取消旧回调；演示进度与真实网络无关。
function startDownload(resetBudget=true){clearTimers();state.downloadApproved=true;state.ready=false;if(resetBudget)state.retries=0;state.progress=0;state.scene='downloading';state.background=false;render();log('用户授权下载 '+state.target+'，从 0% 开始');downloadTick()}
function downloadTick(){later(()=>{state.progress=Math.min(100,state.progress+20);if(state.progress===100){state.scene='verifying';render();later(()=>{state.ready=true;state.scene='ready';state.background=false;render();log('完整包校验通过，等待用户重启')},600)}else{render();downloadTick()}},450)}
function autoRetry(){if(state.retries>=3){show('downloadError');return}state.scene='retry';render();later(()=>{state.retries++;const used=state.retries;startDownload(false);log('自动重试 '+used+'/3，已归零，无续传')},1200)}
function beginInstall(){show('installing');log('任务全部结束，升级器接管安装');later(()=>{state.scene='booting';render();later(()=>{state.current=state.target;show('success');log('实际运行版本与启动验证通过')},900)},1500)}
function check(manual=false){if(manual&&state.downloadApproved&&['downloading','offline','retry','verifying'].includes(state.scene)){state.background=false;render();log('返回正在进行的升级任务，不重复下载');return}clearTimers();state.manual=manual;state.pending=false;if(compare(state.current,state.target)>=0){show('latest');return}if(!forced()&&!manual&&ignored()){show('idle');log('当前目标已被忽略，本次完整启动不提醒');return}show(state.ready?'ready':'prompt');log(manual?'手动检查更新，不受忽略偏好限制':'完整启动检查，展示'+(forced()?'强制':'可选')+'升级')}
function dispatch(action){
 switch(action){
 case 'dismiss':if(forced()&&!['latest'].includes(state.scene))return;if(state.scene==='prompt')rememberIgnore();show('idle');lastFocus?.focus?.();log('稍后升级，继续使用当前版本');break;
 case 'download':startDownload();break;
 case 'background':if(forced())return;state.background=true;render();log('更新继续在后台处理');break;
 case 'restart':state.ready=true;taskReturn='ready';show(taskData.some(t=>t.active)?'tasks':'closing');if(state.scene==='closing')later(beginInstall,500);break;
 case 'returnReady':show(taskReturn);break;
 case 'closeTasks':show('closing');later(()=>{taskData.forEach(t=>t.active=false);beginInstall()},900);break;
 case 'installRetry':dispatch('restart');break;
 case 'finish':state.current=state.target;state.ready=false;show('idle');log('进入新版客户端');break;
 case 'check':check(true);break;
 case 'newTarget':state.target='4.0.3.1';state.ready=false;check(true);log('已匹配新的有效版本，等待重新授权下载');break;
 case 'repair':show('bootError');log('恢复原版本（演示），重新遵守版本门槛');break;
 case 'exit':exitReturn=state.scene;show('exit');break;
 case 'cancelExit':show(exitReturn);if(exitReturn==='downloading')downloadTick();else if(['retry','verifyError'].includes(exitReturn))autoRetry();else if(exitReturn==='offline')later(autoRetry,2200);break;
 case 'confirmExit':clearTimers();taskData.forEach(t=>t.active=false);state.progress=0;show('exited');log('已确认并关闭任务，客户端退出（演示）');break;
 }
}
$('#footer').onclick=e=>{const button=e.target.closest('[data-action]');if(button&&!button.disabled)dispatch(button.dataset.action)};
$('#close').onclick=()=>dispatch(['downloading','retry','offline'].includes(state.scene)?'background':'dismiss');
$('#layer').onclick=e=>{if(e.target===$('#layer')&&closable())$('#close').click()};
document.addEventListener('keydown',e=>{if($('#layer').hidden)return;if(e.key==='Escape'){e.preventDefault();if(closable())$('#close').click()}if(e.key==='Tab'){const nodes=[...$('#dialog').querySelectorAll('button:not([disabled]),input')].filter(el=>!el.hidden);if(!nodes.length){e.preventDefault();return}const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#dialog'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('#dialog'))){e.preventDefault();first.focus()}}});
function loadScenario(){clearTimers();state.mode=$('#mode').value;state.current=state.mode==='forced'?'4.0.1.9':'4.0.2.0';state.target='4.0.3.0';state.retries=0;state.ready=false;state.pending=false;state.progress=0;taskData.forEach((t,i)=>t.active=i<4);const scene=$('#scene').value;show(scene);log('切换评审场景：'+scenarios.find(x=>x[0]===scene)[1]);if(scene==='downloading')startDownload();if(scene==='offline')later(()=>{log('模拟网络恢复，自动从零下载');autoRetry()},2200);if(scene==='retry')autoRetry();if(scene==='verifyError')later(autoRetry,1600);if(scene==='ready')state.ready=true;if(scene==='success'){state.current=state.target;render()}}
$('#scene').innerHTML=scenarios.map(([value,label])=>'<option value="'+value+'">'+label+'</option>').join('');$('#scene').onchange=loadScenario;$('#mode').onchange=loadScenario;$('#platform').onchange=loadScenario;
$('#start').onclick=()=>{$('#scene').value='prompt';loadScenario()};$('#startup').onclick=()=>check(false);$('#manual').onclick=()=>check(true);$('#push').onclick=()=>{state.pending=true;log('记录更新通知，不弹窗、不自动下载；下次完整启动再检查');if($('#layer').hidden)render()};
loadScenario();
</script>
