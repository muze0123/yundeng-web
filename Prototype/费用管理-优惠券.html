<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>云登 · 优惠券</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../src/styles/global.css?v=20260821a">
  <link rel="stylesheet" href="公共导航.css?v=20260825a">
  <script>
    window.tailwind=window.tailwind||{};window.lucide=window.lucide||{createIcons(){}};tailwind.config={theme:{extend:{colors:{primary:'#0066FF','primary-hover':'#0052CC','primary-active':'#0047B3','primary-bg':'#E6F0FF','ink-title':'#1A1D24','ink-body':'#3A3F4A','ink-sub':'#6E7685','ink-muted':'#9DA2AC',line:'#DFE1E5','line-light':'#E8EAED','line-lighter':'#F0F1F3',page:'#F7F8FA',card:'#FFFFFF',hover:'#F3F4F6',success:'#0FC060','success-bg':'#E7F9F0',warning:'#E7772D','warning-bg':'#FDF2E9',danger:'#D9001B','danger-bg':'#FFE8EB',info:'#0091D5','info-bg':'#E4F4FB'}}}};
  </script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F7F8FA;color:#3A3F4A}
    button,input,select,textarea{font:inherit}.page-content{padding:0}.hidden{display:none!important}.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
    .btn{height:32px;padding:0 12px;border:1px solid transparent;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;text-decoration:none;cursor:pointer}
    .btn-primary{background:#0066FF;color:#fff}.btn-primary:hover{background:#0052CC}.btn-default{border-color:#DFE1E5;background:#fff;color:#3A3F4A}.btn-default:hover{background:#F3F4F6}
    .card{min-height:100%;background:#fff;border-radius:8px}.coupon-tabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:20px}.coupon-tab{height:34px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:#6E7685;cursor:pointer}.coupon-tab:hover{background:#F3F4F6;color:#3A3F4A}.coupon-tab.active{background:#E6F0FF;color:#0066FF;font-weight:600}
    .coupon-grid{display:grid;grid-template-columns:repeat(auto-fill,360px);gap:12px;align-items:start;justify-content:start}.coupon-item{position:relative;width:360px;min-width:0;min-height:148px;border:0;border-radius:8px;display:grid;grid-template-columns:96px minmax(0,1fr);overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:box-shadow .15s}.coupon-item:hover{box-shadow:0 6px 24px rgba(0,0,0,.12)}
    .coupon-value-pane{position:relative;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#E6F0FF}.coupon-value-pane::before,.coupon-value-pane::after{content:'';position:absolute;right:-6px;z-index:2;width:12px;height:12px;border-radius:50%;background:#fff}.coupon-value-pane::before{top:-6px}.coupon-value-pane::after{bottom:-6px}.coupon-ticket-type{color:#6E7685;font-size:11px}.coupon-benefit{margin-top:4px;color:#0066FF;font-size:22px;font-weight:600;white-space:nowrap}.coupon-condition{max-width:88px;margin-top:2px;overflow:hidden;color:#6E7685;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.coupon-detail{min-width:0;padding:10px 12px 8px 16px;border-left:1px dashed #DFE1E5;display:flex;flex-direction:column}.coupon-name{margin:0;overflow:hidden;color:#1A1D24;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.coupon-info{min-width:0;margin-top:7px;display:grid;gap:5px}.coupon-info-row{min-width:0;display:flex;align-items:center;gap:4px;color:#6E7685;font-size:11px}.coupon-info-row svg{width:12px;height:12px;flex:none}.coupon-info-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.coupon-info-row.coupon-expiring{align-items:flex-start}.coupon-info-row.coupon-expiring span{overflow:visible;text-overflow:clip;white-space:normal;word-break:break-all;line-height:16px}.coupon-expiring{color:#E7772D}.coupon-actions{min-height:28px;margin-top:auto;padding-top:7px;display:flex;align-items:center;justify-content:flex-end}.coupon-actions .btn{height:28px;padding-inline:8px;font-size:12px}.coupon-item.is-disabled .coupon-value-pane{background:#F7F8FA}.coupon-item.is-disabled .coupon-benefit{color:#9DA2AC}
    .modal-bg{position:fixed;inset:0;z-index:9999;padding:16px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
    .anno-badge{position:fixed;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px sans-serif;text-align:center;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
    @media(max-width:560px){.coupon-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.coupon-item{width:100%}.coupon-tabs{flex-wrap:nowrap;overflow-x:auto}.coupon-tab{flex:none}}
    @media(max-width:380px){.coupon-grid{grid-template-columns:1fr}}
  </style>
  <style>
    .coupon-info-row.coupon-expiring span { overflow: visible; text-overflow: clip; white-space: normal; word-break: break-all; line-height: 16px; }
    .coupon-expiry-remaining { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; line-height: 16px; white-space: nowrap; }
  </style>
  <script src="公共导航.js?v=20260828e"></script>
</head>
<body class="bg-page text-ink-body">
  <script>(function(){if(window===top){try{location.replace(new URL('../index.html?page=billing-coupons',location.href).href)}catch(_){location.replace('../index.html?page=billing-coupons')}}})();</script>

  <main id="mainContent" class="min-h-screen">
    <div class="page-content">
      <section id="couponsPanel">
        <div class="card p-5">
          <div class="coupon-tabs" role="tablist" aria-label="优惠券状态">
            <button data-anno="1" class="coupon-tab active" type="button" data-coupon-tab="未使用" role="tab" aria-selected="true">未使用</button>
            <button class="coupon-tab" type="button" data-coupon-tab="即将过期" role="tab" aria-selected="false">即将过期</button>
            <button class="coupon-tab" type="button" data-coupon-tab="未生效" role="tab" aria-selected="false">未生效</button>
            <button class="coupon-tab" type="button" data-coupon-tab="已使用" role="tab" aria-selected="false">已使用</button>
            <button class="coupon-tab" type="button" data-coupon-tab="已失效" role="tab" aria-selected="false">已失效</button>
          </div>
          <div id="couponGrid" class="coupon-grid"></div>
          <div id="couponEmpty" class="hidden py-20 text-center text-ink-sub"><i data-lucide="ticket-x" class="w-10 mx-auto text-ink-muted mb-3" aria-hidden="true"></i><p>当前状态下没有优惠券</p></div>
        </div>
      </section>
    </div>
  </main>

  <button id="annoToggle" type="button" class="btn btn-default fixed right-2 top-[120px] z-[9997]" aria-pressed="false"><i data-lucide="tags" class="w-4" aria-hidden="true"></i><span>显示标注</span></button>
  <div id="annoLayer" class="fixed inset-0 pointer-events-none z-[9998]"></div>
  <div id="annoPopup" class="modal-bg hidden" role="dialog" aria-modal="true" aria-labelledby="annoTitle"><div class="bg-white rounded-lg shadow-[0_6px_24px_rgba(0,0,0,.12)] w-[520px] max-w-[92vw]"><div class="px-5 py-4 border-b border-line flex items-center justify-between"><h2 id="annoTitle" class="text-[16px] font-semibold text-ink-title"></h2><button id="annoClose" type="button" class="w-8 h-8 rounded text-ink-muted hover:bg-hover" aria-label="关闭标注说明"><i data-lucide="x" class="w-4" aria-hidden="true"></i></button></div><div id="annoBody" class="p-5 text-[14px] leading-7"></div></div></div>

  <script>
    (()=>{
      'use strict';
      const $=selector=>document.querySelector(selector), $$=selector=>[...document.querySelectorAll(selector)];
      const stateKey='yundeng.billing.coupons.v2';
      const today=new Date('2026-08-27T00:00:00');
      const dayMs=24*60*60*1000;
      const readState=()=>{try{const value=JSON.parse(sessionStorage.getItem(stateKey)||'{}');return value&&typeof value==='object'?value:{}}catch(_){return {}}};
      let state=readState();
      const saveState=patch=>{state=Object.assign({},state,patch||{});try{sessionStorage.setItem(stateKey,JSON.stringify(state))}catch(_) {}};
      const coupons=[
        {id:'CP20260827001',name:'全场立减券',type:'立减券',discount:10,validMode:'无限制',scene:'全局',payments:['微信支付','支付宝支付'],lifecycle:'未使用'},
        {id:'CP20260827002',name:'代理采购满减券',type:'满减券',threshold:100,discount:20,validMode:'时间段',start:'2026-08-01',end:'2026-09-30',scene:'代理',payments:['微信支付','支付宝支付'],lifecycle:'未使用'},
        {id:'CP20260827003',name:'套餐续费赠金券',type:'满赠券',threshold:100,gift:20,validMode:'领取后多少天内',claimedAt:'2026-08-24',validDays:6,scene:'套餐',payments:['微信支付'],lifecycle:'未使用'},
        {id:'CP20260827004',name:'充值限时立减券',type:'立减券',discount:15,validMode:'时间段',start:'2026-08-20',end:'2026-08-29',scene:'充值',payments:['支付宝支付'],lifecycle:'未使用'},
        {id:'CP20260827005',name:'九月套餐满减券',type:'满减券',threshold:300,discount:50,validMode:'时间段',start:'2026-09-01',end:'2026-09-30',scene:'套餐',payments:['微信支付','支付宝支付'],lifecycle:'未使用'},
        {id:'CP20260827006',name:'代理加购赠金券',type:'满赠券',threshold:500,gift:80,validMode:'时间段',start:'2026-08-30',end:'2026-10-15',scene:'代理',payments:['支付宝支付'],lifecycle:'未使用'},
        {id:'CP20260827007',name:'充值回馈满减券',type:'满减券',threshold:500,discount:30,validMode:'时间段',start:'2026-08-01',end:'2026-09-15',scene:'充值',payments:['微信支付','支付宝支付'],lifecycle:'已使用'},
        {id:'CP20260827008',name:'代理首购立减券',type:'立减券',discount:8,validMode:'无限制',scene:'代理',payments:['微信支付'],lifecycle:'已使用'},
        {id:'CP20260827009',name:'七月套餐满减券',type:'满减券',threshold:200,discount:20,validMode:'时间段',start:'2026-07-01',end:'2026-08-20',scene:'套餐',payments:['微信支付','支付宝支付'],lifecycle:'未使用'},
        {id:'CP20260827010',name:'充值领取立减券',type:'立减券',discount:5,validMode:'领取后多少天内',claimedAt:'2026-08-15',validDays:5,scene:'充值',payments:['支付宝支付'],lifecycle:'未使用'}
      ];
      const parseDate=value=>value?new Date(value+'T00:00:00'):null;
      const formatDate=date=>date?date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0'):'';
      const addDays=(value,days)=>{const date=parseDate(value);date.setDate(date.getDate()+Number(days||0));return date};
      const endDate=coupon=>coupon.validMode==='时间段'?parseDate(coupon.end):coupon.validMode==='领取后多少天内'&&coupon.claimedAt?addDays(coupon.claimedAt,coupon.validDays):null;
      const startDate=coupon=>coupon.validMode==='时间段'?parseDate(coupon.start):coupon.claimedAt?parseDate(coupon.claimedAt):null;
      const lifecycle=coupon=>{if(coupon.lifecycle==='已使用')return '已使用';const start=startDate(coupon),end=endDate(coupon);if(start&&today<start)return '未生效';if(end&&today>end)return '已失效';return '未使用'};
      const remainingDays=coupon=>{const end=endDate(coupon);return end?Math.ceil((end-today)/dayMs):null};
      const isExpiring=coupon=>lifecycle(coupon)==='未使用'&&remainingDays(coupon)!==null&&remainingDays(coupon)>=0&&remainingDays(coupon)<=3;
      const isUsable=coupon=>lifecycle(coupon)==='未使用';
      const benefit=coupon=>coupon.type==='立减券'?{value:'¥'+coupon.discount,note:'无门槛立减'}:coupon.type==='满减券'?{value:'¥'+coupon.discount,note:'满 ¥'+coupon.threshold+' 可用'}:{value:'赠 ¥'+coupon.gift,note:'满 ¥'+coupon.threshold+' 可赠'};
      const validity=coupon=>{if(coupon.validMode==='无限制')return '无限制';if(coupon.validMode==='时间段')return coupon.start+' 至 '+coupon.end;const end=endDate(coupon);return coupon.claimedAt?'领取后 '+coupon.validDays+' 天内（至 '+formatDate(end)+'）':'领取后 '+coupon.validDays+' 天内'};
      const routeFor=coupon=>({全局:'../index.html?page=store',代理:'../index.html?page=store&moduleSearch=tab%3Dproxy',套餐:'../index.html?page=store&moduleSearch=tab%3Dpackage',充值:'../index.html?page=store-coin'})[coupon.scene];
      const rowsForTab=tab=>coupons.filter(coupon=>tab==='即将过期'?isExpiring(coupon):lifecycle(coupon)===tab);
      const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      function render(tab){
        const tabs=['未使用','即将过期','未生效','已使用','已失效'];
        const current=tabs.includes(tab)?tab:'未使用';
        $$('[data-coupon-tab]').forEach(button=>{const active=button.dataset.couponTab===current;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active))});
        const rows=rowsForTab(current);
        $('#couponGrid').innerHTML=rows.map((coupon,index)=>{const offer=benefit(coupon),days=remainingDays(coupon),expiryClass=isExpiring(coupon)?' coupon-expiring':'',remainingText=isExpiring(coupon)?'<span class="coupon-expiry-remaining">剩余 '+days+' 天</span>':'',payments=coupon.payments.map(item=>item.replace('支付','')).join(' / '),usable=isUsable(coupon),scenePayment=coupon.scene+' · '+payments,validityText=validity(coupon);return '<article class="coupon-item'+(usable?'':' is-disabled')+'"'+(index===0?' data-anno="2"':'')+'><div class="coupon-value-pane"><span class="coupon-ticket-type">'+escapeHtml(coupon.type)+'</span><strong class="coupon-benefit">'+escapeHtml(offer.value)+'</strong><span class="coupon-condition" title="'+escapeHtml(offer.note)+'">'+escapeHtml(offer.note)+'</span></div><div class="coupon-detail"><h3 class="coupon-name" title="'+escapeHtml(coupon.name)+'">'+escapeHtml(coupon.name)+'</h3><div class="coupon-info"><div class="coupon-info-row"><i data-lucide="shopping-bag" aria-hidden="true"></i><span title="'+escapeHtml(scenePayment)+'">'+escapeHtml(scenePayment)+'</span></div><div class="coupon-info-row'+expiryClass+'"><i data-lucide="calendar-days" aria-hidden="true"></i><span class="mono" title="'+escapeHtml(validityText+(isExpiring(coupon)?' · 剩余 '+days+' 天':''))+'">'+escapeHtml(validityText)+remainingText+'</span></div></div><div class="coupon-actions">'+(usable?'<a class="btn btn-primary" href="'+routeFor(coupon)+'"'+(index===0?' data-anno="3"':'')+'>去使用</a>':'')+'</div></div></article>'}).join('');
        $('#couponEmpty').classList.toggle('hidden',rows.length>0);
        saveState({tab:current});
        lucide.createIcons();
        requestAnimationFrame(renderAnno);
      }
      $$('[data-coupon-tab]').forEach(button=>button.addEventListener('click',()=>render(button.dataset.couponTab)));

      const annotations={1:{title:'优惠券状态筛选',desc:['触发：点击状态 Tab','响应：按有效期和使用状态刷新卡券宫格','规则：即将过期为距离到期 3 天内；无限制不进入该筛选']},2:{title:'优惠券卡券',desc:['触发：进入任一状态 Tab','响应：展示金额、门槛、场景、支付限制和有效期','规则：卡面不显示状态，也不提供额外详情入口']},3:{title:'去使用',desc:['触发：点击可用优惠券的去使用','响应：按全局、代理、套餐或充值进入对应页面','规则：未生效、已使用和已失效优惠券不显示按钮']}};
      let annoVisible=false;const annoLayer=$('#annoLayer'),annoPopup=$('#annoPopup');
      function renderAnno(){annoLayer.innerHTML='';if(!annoVisible||!annoPopup.classList.contains('hidden'))return;document.querySelectorAll('[data-anno]').forEach(element=>{if(element.offsetParent===null)return;const rect=element.getBoundingClientRect(),badge=document.createElement('button');badge.type='button';badge.className='anno-badge';badge.textContent=element.dataset.anno;badge.style.left=rect.right-10+'px';badge.style.top=rect.top-10+'px';badge.onclick=()=>{const item=annotations[element.dataset.anno];$('#annoTitle').textContent=element.dataset.anno+'. '+item.title;$('#annoBody').innerHTML='<ul class="list-disc pl-5 space-y-2">'+item.desc.map(text=>'<li>'+text+'</li>').join('')+'</ul>';annoPopup.classList.remove('hidden');renderAnno();$('#annoClose').focus()};annoLayer.appendChild(badge)})}
      $('#annoToggle').addEventListener('click',()=>{annoVisible=!annoVisible;$('#annoToggle').setAttribute('aria-pressed',String(annoVisible));$('#annoToggle span').textContent=annoVisible?'隐藏标注':'显示标注';renderAnno()});$('#annoClose').addEventListener('click',()=>{annoPopup.classList.add('hidden');renderAnno()});annoPopup.addEventListener('click',event=>{if(event.target===annoPopup){annoPopup.classList.add('hidden');renderAnno()}});window.addEventListener('resize',renderAnno);$('#mainContent').addEventListener('scroll',renderAnno);
      render(state.tab||'未使用');
    })();
  </script>
</body>
</html>
