  <script>
    tailwind.config={theme:{extend:{colors:{primary:'#0066FF','primary-hover':'#0052CC','primary-active':'#0047B3','primary-bg':'#E6F0FF','ink-title':'#1A1D24','ink-body':'#3A3F4A','ink-sub':'#6E7685','ink-muted':'#9DA2AC',line:'#DFE1E5','line-light':'#E8EAED','line-lighter':'#F0F1F3',page:'#F7F8FA',card:'#FFFFFF',hover:'#F3F4F6',success:'#0FC060','success-bg':'#E7F9F0',warning:'#E7772D','warning-bg':'#FDF2E9',danger:'#D9001B','danger-bg':'#FFE8EB',info:'#0091D5','info-bg':'#E4F4FB'}}}};

  <style>
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F7F8FA;color:#3A3F4A}.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}.page-content{padding:0}.btn{height:32px;padding:0 12px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;cursor:pointer}.btn-primary{background:#0066FF;color:#fff}.btn-primary:hover{background:#0052CC}.btn-default{border:1px solid #DFE1E5;background:#fff;color:#3A3F4A}.btn-default:hover{background:#F3F4F6}.field{height:32px;border:1px solid #DFE1E5;border-radius:4px;background:#fff;padding:0 10px;outline:none;color:#3A3F4A}.field:focus{border-color:#0066FF;box-shadow:0 0 0 2px #E6F0FF}.card{background:#fff;border-radius:8px}.tab{height:48px;padding:0 22px;border-bottom:2px solid transparent;color:#6E7685;white-space:nowrap;cursor:pointer}.tab.active{color:#0066FF;border-color:#0066FF;font-weight:600}.subtab{height:34px;padding:0 14px;border-radius:4px;color:#6E7685;cursor:pointer}.subtab.active{color:#0066FF;background:#E6F0FF}.hidden{display:none!important}.coupon-filter-flow{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:16px;column-gap:24px;min-width:0}.coupon-filter-item{display:flex;flex:0 0 374px;width:374px;max-width:100%;min-width:0;align-items:flex-start;column-gap:0}.coupon-filter-label{width:74px;flex:0 0 74px;color:#3A3F4A;font-size:14px;line-height:32px;text-align:right;white-space:nowrap}.coupon-filter-control{width:300px;max-width:100%;flex:0 1 300px}.coupon-list{width:100%;border-collapse:collapse;font-size:13px}.coupon-list th{padding:9px 12px;background:#F0F1F3;color:#6E7685;font-size:12px;font-weight:600;text-align:left;border-bottom:1px solid #DFE1E5;white-space:nowrap}.coupon-list td{padding:12px;border-bottom:1px solid #F0F1F3;color:#3A3F4A;white-space:nowrap}.coupon-list tbody tr:hover{background:#F3F4F6}.coupon-status{font-weight:500}.coupon-status[data-status="未使用"]{color:#0FC060}.coupon-status[data-status="已使用"],.coupon-status[data-status="已失效"]{color:#9DA2AC}.anno-badge{position:fixed;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px sans-serif;text-align:center;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}.modal-bg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:16px}.toast{position:fixed;left:50%;top:24px;z-index:9996;display:flex;align-items:center;gap:10px;min-width:320px;max-width:min(480px,calc(100vw - 32px));min-height:44px;padding:10px 14px;border-radius:8px;background:#fff;color:#3A3F4A;box-shadow:0 6px 24px rgba(0,0,0,.12);transform:translateX(-50%)}.toast[data-tone="success"] .toast-icon{color:#0FC060}.toast[data-tone="info"] .toast-icon{color:#0091D5}.toast[data-tone="warning"] .toast-icon{color:#E7772D}.toast[data-tone="danger"] .toast-icon{color:#D9001B}.toast-icon{width:18px;height:18px;flex:0 0 18px}@media(max-width:720px){.page-tabs{overflow-x:auto}.coupon-filter-item{flex-basis:100%;width:100%}.coupon-filter-control{width:calc(100% - 74px)}.coupon-list{min-width:760px}}
  </style>

<body class="bg-page text-ink-body">
  <script>(function(){if(window===top){try{location.replace(new URL('../index.html?page=billing-coupons',location.href).href)}catch(_){}}})();</script>
  <main id="mainContent" class="min-h-screen">
    <div id="billingPrimaryTabs" class="bg-white rounded-lg px-6 mb-4"><div class="page-tabs flex" role="tablist" aria-label="费用管理">
      <button data-anno="1" class="tab" type="button" data-billing-page="billing-coin" role="tab" aria-selected="false"><i data-lucide="circle-dollar-sign" class="w-4 inline mr-1" aria-hidden="true"></i>云币充值</button>
      <button class="tab" type="button" data-billing-page="billing-orders" role="tab" aria-selected="false"><i data-lucide="receipt-text" class="w-4 inline mr-1" aria-hidden="true"></i>订单管理</button>
      <button class="tab" type="button" data-billing-page="billing-invoice" role="tab" aria-selected="false"><i data-lucide="file-text" class="w-4 inline mr-1" aria-hidden="true"></i>开票管理</button>
      <button data-anno="2" class="tab active" type="button" data-billing-page="billing-coupons" role="tab" aria-selected="true"><i data-lucide="ticket-percent" class="w-4 inline mr-1" aria-hidden="true"></i>优惠券</button>
    </div></div>
    <div class="page-content">
      <section id="couponsPanel">
        <div class="card p-5 mb-4">
          <div class="coupon-filter-flow">
            <label class="coupon-filter-item"><span class="coupon-filter-label">关键词：</span><input id="couponKeyword" class="field coupon-filter-control" placeholder="请输入券名称或适用范围" autocomplete="off"></label>
            <label class="coupon-filter-item"><span class="coupon-filter-label">优惠券状态：</span><select id="couponStatusFilter" class="field coupon-filter-control"><option>全部</option><option>未使用</option><option>已使用</option><option>已失效</option></select></label>
            <label class="coupon-filter-item"><span class="coupon-filter-label">适用范围：</span><select id="couponScopeFilter" class="field coupon-filter-control"><option>全部</option><option>云币充值</option><option>代理与套餐</option><option>平台代理</option><option>环境套餐</option></select></label>
            <div class="flex items-center gap-3"><button id="couponReset" type="button" class="btn btn-default">重置</button><button id="couponSearch" type="button" class="btn btn-primary">查询</button></div>
          </div>
        </div>
        <div class="card overflow-hidden p-5">
          <div class="flex items-center justify-between flex-wrap gap-3 pb-4"><div class="flex items-center gap-3"><h2 data-anno="3" class="inline-block text-[16px] font-semibold text-ink-title">优惠券列表</h2><span id="couponCount" class="text-[12px] text-ink-sub" role="status" aria-live="polite"></span></div><button id="couponClearFilter" type="button" class="btn btn-default hidden">清空筛选</button></div>
          <div class="overflow-x-auto"><table class="coupon-list"><thead><tr><th>券名称</th><th>抵扣规则</th><th>适用范围</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody id="couponBody"></tbody></table></div>
          <div id="couponEmpty" class="hidden py-20 text-center text-ink-sub"><i data-lucide="ticket-x" class="w-10 mx-auto text-ink-muted mb-3" aria-hidden="true"></i><p>当前条件下没有优惠券</p></div>
          <div id="couponPagination" class="pt-5" aria-label="优惠券列表分页"></div>
        </div>
      </section>
    </div>
  </main>
  <div id="modal" class="modal-bg hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="bg-white rounded-lg shadow-[0_6px_24px_rgba(0,0,0,.12)] w-[520px] max-w-[92vw]"><div class="px-5 py-4 border-b border-line flex items-center justify-between"><h3 id="modalTitle" class="text-[16px] font-semibold text-ink-title">确认</h3><button type="button" data-close aria-label="关闭"><i data-lucide="x" class="w-4" aria-hidden="true"></i></button></div><div id="modalBody" class="p-5"></div><div class="px-5 py-4 border-t border-line flex justify-end gap-2"><button type="button" data-close class="btn btn-default">取消</button><button id="modalConfirm" type="button" class="btn btn-primary">确定</button></div></div></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <button id="annoToggle" type="button" class="btn btn-default fixed right-2 top-[120px] z-[9997]" aria-pressed="false"><i data-lucide="tags" class="w-4" aria-hidden="true"></i><span>显示标注</span></button><div id="annoLayer" class="fixed inset-0 pointer-events-none z-[9998]"></div><div id="annoPopup" class="modal-bg hidden" role="dialog" aria-modal="true" aria-labelledby="annoTitle"><div class="bg-white rounded-lg shadow-[0_6px_24px_rgba(0,0,0,.12)] w-[520px] max-w-[92vw]"><div class="px-5 py-4 border-b border-line flex items-center justify-between"><h2 id="annoTitle" class="text-[16px] font-semibold text-ink-title"></h2><button id="annoClose" type="button" class="w-8 h-8 rounded text-ink-muted hover:bg-hover" aria-label="关闭标注说明"><i data-lucide="x" class="w-4" aria-hidden="true"></i></button></div><div id="annoBody" class="p-5 text-[14px] leading-7"></div></div></div>
  <script src="分页器.js?v=20260814"></script>
  <script>
    (()=>{ 'use strict'; const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], routes={coin:'billing-coin',orders:'billing-orders',invoice:'billing-invoice',coupons:'billing-coupons'}, files={'billing-coin':'费用管理-云币充值.html','billing-orders':'费用管理-订单管理.html','billing-invoice':'费用管理-开票管理.html','billing-coupons':'费用管理-优惠券.html'}, key='yundeng.billing.coupons.v1';
      const read=()=>{try{const v=JSON.parse(sessionStorage.getItem(key)||'{}');return v&&typeof v==='object'?v:{}}catch(_){return {}}};let state=read();const save=patch=>{state=Object.assign({},state,patch||{});try{sessionStorage.setItem(key,JSON.stringify(state))}catch(_){}}, go=page=>{save();const file=files[page];if(window.parent!==window&&file){window.parent.postMessage({type:'yundeng:route',file,search:'',hash:''},'*');return}location.assign(new URL('../index.html?page='+encodeURIComponent(page),location.href).href)};$$('[data-billing-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.billingPage)));
      const coupons=[{name:'商城通用券',value:'满 ¥100 减 ¥10',scope:'代理与套餐',expiry:'2026-09-30',status:'未使用'},{name:'充值优惠券',value:'充值满 ¥50 减 ¥5',scope:'云币充值',expiry:'2026-08-31',status:'未使用'},{name:'新客代理券',value:'代理订单减 ¥8',scope:'平台代理',expiry:'2026-07-31',status:'已使用'},{name:'套餐升级券',value:'满 ¥200 减 ¥20',scope:'环境套餐',expiry:'2026-07-15',status:'已失效'},{name:'代理续费券',value:'续费满 ¥80 减 ¥12',scope:'代理与套餐',expiry:'2026-10-15',status:'未使用'},{name:'云币回馈券',value:'充值满 ¥500 减 ¥30',scope:'云币充值',expiry:'2026-11-30',status:'未使用'}];let rows=[];let pager;
      function toast(message,tone='info'){const node=$('#toast'),icons={success:'circle-check',info:'info',warning:'triangle-alert',danger:'circle-x'};node.dataset.tone=tone;node.innerHTML='<i data-lucide="'+icons[tone]+'" class="toast-icon" aria-hidden="true"></i><span></span>';node.querySelector('span').textContent=message;node.classList.remove('hidden');lucide.createIcons();clearTimeout(node.timer);node.timer=setTimeout(()=>node.classList.add('hidden'),3000)}
      function render(stateReset=true){const keyword=$('#couponKeyword').value.trim().toLowerCase(),status=$('#couponStatusFilter').value,scope=$('#couponScopeFilter').value;rows=coupons.filter(c=>(!keyword||(c.name+' '+c.scope+' '+c.value).toLowerCase().includes(keyword))&&(status==='全部'||c.status===status)&&(scope==='全部'||c.scope===scope));$('#couponCount').textContent='共 '+rows.length+' 条';const active=Boolean(keyword||status!=='全部'||scope!=='全部');$('#couponClearFilter').classList.toggle('hidden',!active);if(!pager)pager=new YDPager('#couponPagination',{total_count:rows.length,current_page:1,page_size:10,page_size_options:[10,20,50],onChange:draw,toast});else pager.setState({total_count:rows.length,current_page:stateReset?1:Math.min(pager.getState().current_page,Math.max(1,Math.ceil(rows.length/pager.getState().page_size)))},{silent:true});draw(pager.getState());save({keyword:$('#couponKeyword').value,status,scope})}
      function draw(s){const start=(s.current_page-1)*s.page_size,list=rows.slice(start,start+s.page_size);$('#couponBody').innerHTML=list.map(c=>'<tr><td class="font-medium text-ink-title">'+c.name+'</td><td class="mono">'+c.value+'</td><td>'+c.scope+'</td><td class="mono">'+c.expiry+'</td><td><span class="coupon-status" data-status="'+c.status+'">'+c.status+'</span></td><td>'+(c.status==='未使用'?'<button type="button" class="text-primary" data-coupon-use="'+c.name+'">去使用</button>':'<span class="text-ink-muted">—</span>')+'</td></tr>').join('');$('#couponEmpty').classList.toggle('hidden',list.length>0);lucide.createIcons()}
      function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden');$('#modalConfirm').focus()};function closeModal(){$('#modal').classList.add('hidden')};$$('[data-close]').forEach(b=>b.addEventListener('click',closeModal));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});$('#modalConfirm').addEventListener('click',()=>{closeModal();toast('演示操作已完成，未影响真实数据','success')});
      $('#couponSearch').addEventListener('click',()=>render(true));$('#couponReset').addEventListener('click',()=>{$('#couponKeyword').value='';$('#couponStatusFilter').value='全部';$('#couponScopeFilter').value='全部';render(true)});$('#couponClearFilter').addEventListener('click',()=>{$('#couponKeyword').value='';$('#couponStatusFilter').value='全部';$('#couponScopeFilter').value='全部';render(true)});$('#couponBody').addEventListener('click',e=>{const b=e.target.closest('[data-coupon-use]');if(b)openModal('使用优惠券','<p>将返回商城选择适用商品使用“'+b.dataset.couponUse+'”。</p><p class="text-ink-sub mt-2">原型仅演示跳转反馈，不会真实核销优惠券。</p>')});
      const anno={1:{title:'费用管理页签',desc:['触发：点击顶部页签','响应：通过 SystemFrame 进入对应费用管理页面','规则：四个页面使用相同顺序与选中态']},2:{title:'优惠券页签',desc:['触发：进入优惠券页面','响应：展示优惠券筛选与数据列表','规则：本次访问期间保留筛选状态']},3:{title:'优惠券列表',desc:['触发：查询、重置或切换分页','响应：展示匹配的优惠券及可用操作','规则：状态和有效期按 Mock 数据渲染']}};let visible=false;const layer=$('#annoLayer'),popup=$('#annoPopup');function renderAnno(){layer.innerHTML='';if(!visible||!popup.classList.contains('hidden'))return;document.querySelectorAll('[data-anno]').forEach(el=>{if(el.offsetParent===null)return;const r=el.getBoundingClientRect(),b=document.createElement('button');b.type='button';b.className='anno-badge';b.textContent=el.dataset.anno;b.style.left=r.right-10+'px';b.style.top=r.top-10+'px';b.onclick=()=>{const item=anno[el.dataset.anno];$('#annoTitle').textContent=el.dataset.anno+'. '+item.title;$('#annoBody').innerHTML='<ul class="list-disc pl-5 space-y-2">'+item.desc.map(x=>'<li>'+x+'</li>').join('')+'</ul>';popup.classList.remove('hidden');renderAnno();$('#annoClose').focus()};layer.appendChild(b)})}$('#annoToggle').addEventListener('click',()=>{visible=!visible;$('#annoToggle').setAttribute('aria-pressed',String(visible));$('#annoToggle span').textContent=visible?'隐藏标注':'显示标注';renderAnno()});$('#annoClose').addEventListener('click',()=>{popup.classList.add('hidden');renderAnno()});popup.addEventListener('click',e=>{if(e.target===popup){popup.classList.add('hidden');renderAnno()}});window.addEventListener('resize',renderAnno);$('#mainContent').addEventListener('scroll',renderAnno);
      $('#couponKeyword').value=state.keyword||'';$('#couponStatusFilter').value=state.status||'全部';$('#couponScopeFilter').value=state.scope||'全部';render(false);lucide.createIcons();
    })();
  </script>
