<body>
<main id="mainContent" class="audit-page"><section class="audit-surface" aria-label="访问拦截日志">

<!-- 五个业务页签 -->
<nav id="mainTabs" class="tabs" role="tablist" aria-label="日志视图">
<button class="tab" id="tab-dashboard" role="tab" data-tab="dashboard" aria-controls="dashboardView">审计看板</button><button class="tab" id="tab-members" role="tab" data-tab="members" aria-controls="listView">成员</button><button class="tab" id="tab-accounts" role="tab" data-tab="accounts" aria-controls="listView">平台账号</button><button class="tab" id="tab-urls" role="tab" data-tab="urls" aria-controls="listView">网页 URL</button><button class="tab" id="tab-all" role="tab" data-tab="all" aria-controls="listView">全部</button>
</nav>
<!-- 共享时间范围；列表的结构化条件收纳至筛选抽屉 -->
<div class="toolbar"><form id="dateForm" class="date-tools"><label for="rangePreset">操作时间：</label><span class="select-wrap range-select"><select id="rangePreset" class="control"><option value="7">近7天</option><option value="1">今天</option><option value="30">近30天</option><option value="custom">自定义</option></select><i data-lucide="chevron-down" aria-hidden="true"></i></span><input id="dateFrom" type="date" class="control" aria-label="开始日期"><span aria-hidden="true">至</span><input id="dateTo" type="date" class="control" aria-label="结束日期"><button id="dateApply" type="submit" class="btn" hidden>应用</button></form>
<form id="searchForm" class="filter-group" hidden role="search"><div class="search"><input id="keyword" type="search" aria-label="搜索日志" placeholder="请输入关键词，多个用中文逗号分隔"><button aria-label="搜索" type="submit"><i data-lucide="search" aria-hidden="true"></i></button><button id="clearSearch" aria-label="清空搜索" type="button" hidden><i data-lucide="x" aria-hidden="true"></i></button></div><button id="filterButton" class="btn filter-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="filterDrawer"><i data-lucide="list-filter" aria-hidden="true"></i>筛选<span id="filterCount" class="filter-count" hidden></span></button><button id="columnsButton" class="icon-button" type="button" aria-label="列设置" aria-haspopup="dialog" aria-controls="columnsDrawer"><i data-lucide="settings-2" aria-hidden="true"></i></button></form></div>
<p id="dateError" class="error" role="alert" hidden></p>
<section id="dashboardView" role="tabpanel" aria-labelledby="tab-dashboard">
<div class="dashboard-top"><div id="metrics" class="metrics-grid"></div><section class="chart-card" aria-labelledby="trendTitle"><div class="chart-title"><h2 id="trendTitle">异常拦截数据</h2><span id="chartDate" class="chart-date mono"></span></div><div class="legend"><span><b class="legend-mark"></b>拦截 URL 访问数</span><span><b class="legend-mark operation"></b>拦截操作数</span></div><div class="trend-canvas" id="trendBox"><canvas id="trendChart" role="img" aria-label="按日显示 URL 访问及操作的拦截次数"></canvas></div><div id="chartFallback" class="chart-fallback" hidden></div><p id="trendSummary" class="sr-only"></p></section></div>
<div class="ranking-grid"><section class="rank-card"><header class="rank-header"><nav class="tabs" id="actionRankTabs" role="tablist" aria-label="访问与操作排名"><button id="rank-url" class="tab" role="tab" data-action-rank="url" aria-controls="actionRankPanel">拦截访问排名</button><button id="rank-operation" class="tab" role="tab" data-action-rank="operation" aria-controls="actionRankPanel">拦截操作排名</button></nav><button class="link" id="actionRankMore" type="button">查看详情 &gt;</button></header><div id="actionRankPanel" role="tabpanel"><div class="table-wrap"><table class="data-table rank-table" aria-label="拦截访问与操作排名"><thead id="actionRankHead"></thead><tbody id="actionRankRows"></tbody></table></div><div class="empty" id="actionRankEmpty" hidden><i data-lucide="inbox" aria-hidden="true"></i><p>暂无拦截记录</p></div></div></section>
<section class="rank-card"><header class="rank-header"><nav class="tabs" id="entityRankTabs" role="tablist" aria-label="账号与成员排名"><button id="rank-account" class="tab" role="tab" data-entity-rank="account" aria-controls="entityRankPanel">平台账号风控排名</button><button id="rank-member" class="tab" role="tab" data-entity-rank="member" aria-controls="entityRankPanel">成员操作风控排名</button></nav><button class="link" id="entityRankMore" type="button">查看详情 &gt;</button></header><div id="entityRankPanel" role="tabpanel"><div class="table-wrap"><table class="data-table rank-table" aria-label="平台账号与成员排名"><thead id="entityRankHead"></thead><tbody id="entityRankRows"></tbody></table></div><div class="empty" id="entityRankEmpty" hidden><i data-lucide="inbox" aria-hidden="true"></i><p>暂无拦截记录</p></div></div></section></div>
</section>
<section id="listView" role="tabpanel" hidden><div id="listContext" class="context-line"></div><div class="table-wrap" tabindex="0" role="region" aria-label="日志表格，可横向滚动"><table id="logTable" class="data-table"><colgroup id="tableCols"></colgroup><thead id="tableHead"></thead><tbody id="tableRows"></tbody></table></div><div id="listEmpty" class="empty" hidden><i data-lucide="file-search" aria-hidden="true"></i><p>暂无符合条件的日志</p><button id="resetQuery" class="btn" type="button">重置筛选</button></div><div class="table-foot"><nav id="pager" aria-label="日志分页"></nav><p id="pagerError" class="error" role="status" hidden></p></div></section>
</section></main>
<!-- 筛选抽屉 -->

<script>

const ACCOUNTS=Array.from({length:12},(_,i)=>({id:'a'+(i+1),name:['美国旗舰店','英国品牌店','北美直营店','全球专营店'][i%4]+' '+String(i+1).padStart(2,'0'),platform:platforms[i%4],login:'seller'+(i+1)+'***@example.com',members:[MEMBERS[i%10].id,MEMBERS[(i+1)%10].id,MEMBERS[(i+2)%10].id]}));
const URLS=['https://sellercentral.amazon.com/settings/permissions','https://seller.tiktok.com/account/security','https://seller.walmart.com/settings/payments','https://gsp.aliexpress.com/finance','https://sellercentral.amazon.com/payments/reports','https://seller.tiktok.com/analytics/export','https://seller.walmart.com/catalog/items','https://gsp.aliexpress.com/orders','https://sellercentral.amazon.com/orders','https://seller.tiktok.com/products','https://seller.walmart.com/settings/users','https://gsp.aliexpress.com/account'];
function shiftDate(date,days){const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
const EVENTS=Array.from({length:180},(_,i)=>{const account=ACCOUNTS[i%12],member=account.members[Math.floor(i/12)%3],action=ACTIONS[(Math.floor(i/12)+i%3)%6][0],result=i%13===0?'allow':i%9===0?'record':'block';return {id:'EVT-202609-'+String(i+1).padStart(4,'0'),time:shiftDate(DEMO_TODAY,-Math.floor(i/12))+' '+String(9+i%9).padStart(2,'0')+':'+String((i*7)%60).padStart(2,'0')+':'+String((i*11)%60).padStart(2,'0'),member,account:account.id,url:URLS[(i+Math.floor(i/24))%12],action,result,rule:result==='allow'?'店长维护访问特例':action==='url'?'敏感页面访问限制':'业务数据操作限制',ruleId:result==='allow'?'POL-003':action==='url'?'POL-001':'POL-002',ruleVersion:'v1.2',environment:'ENV-'+String(1001+i%12),reason:result==='block'?'命中限制规则，已阻止本次'+ACTIONS.find(([key])=>key===action)[1]:result==='record'?'允许操作并记录行为':'命中访问特例，允许本次操作'};});
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const memberBy=id=>MEMBERS.find(item=>item.id===id),accountBy=id=>ACCOUNTS.find(item=>item.id===id);

const tabNames={dashboard:'审计看板',members:'成员',accounts:'平台账号',urls:'网页 URL',all:'全部'};
const freshFilters=()=>({member:'',account:'',result:'',action:'',url:'',keyword:''});
const state={tab:'dashboard',from:shiftDate(DEMO_TODAY,-6),to:DEMO_TODAY,preset:'7',filters:freshFilters(),page:1,pageSize:10,sort:'total',direction:'desc',actionRank:'url',entityRank:'account',columns:{},columnOrder:{}};
let sparkCharts=[],columnDragKey=null;
let pager=null,charts=[],openPanel=null,returnFocus=null,groupDetail=null,detailAction='',previousOverflow='';
function icons(){window.lucide?.createIcons?.()}
function isDate(value){return /^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value+'T00:00:00Z'))&&new Date(value+'T00:00:00Z').toISOString().slice(0,10)===value}
function readLocation(){const p=new URLSearchParams(location.hash.slice(1));state.tab=Object.hasOwn(tabNames,p.get('tab'))?p.get('tab'):'dashboard';const from=p.get('from'),to=p.get('to');if(isDate(from)&&isDate(to)&&from<=to&&(Date.parse(to)-Date.parse(from))/86400000<=365){state.from=from;state.to=to}else{state.from=shiftDate(DEMO_TODAY,-6);state.to=DEMO_TODAY}state.preset=p.get('preset')||'7';state.filters=freshFilters();for(const key of Object.keys(state.filters))state.filters[key]=p.get(key)||'';if(!memberBy(state.filters.member))state.filters.member='';if(!accountBy(state.filters.account))state.filters.account='';if(!['','block','record','allow'].includes(state.filters.result))state.filters.result='';if(!['','operation',...ACTIONS.map(([key])=>key)].includes(state.filters.action))state.filters.action='';state.sort=p.get('sort')||(state.tab==='all'?'time':'total');state.direction=p.get('direction')==='asc'?'asc':'desc';state.page=Math.max(1,parseInt(p.get('p'))||1);state.pageSize=[10,20,50].includes(Number(p.get('size')))?Number(p.get('size')):10;state.actionRank=p.get('actionRank')==='operation'?'operation':'url';state.entityRank=p.get('entityRank')==='member'?'member':'account';}
function saveLocation(replace=false){const p=new URLSearchParams({tab:state.tab,from:state.from,to:state.to,preset:state.preset,sort:state.sort,direction:state.direction,p:String(state.page),size:String(state.pageSize),actionRank:state.actionRank,entityRank:state.entityRank});for(const [key,value]of Object.entries(state.filters))if(value)p.set(key,value);const href=location.pathname+location.search+'#'+p.toString();if(location.hash!=='#'+p.toString())history[replace?'replaceState':'pushState']({},'',href)}
function distinctEvents(){return [...new Map(EVENTS.map(event=>[event.id,event])).values()]}
function dateEvents(){return distinctEvents().filter(event=>event.time.slice(0,10)>=state.from&&event.time.slice(0,10)<=state.to)}
function filteredEvents(){const f=state.filters,terms=f.keyword.toLowerCase().split('，').map(v=>v.trim()).filter(Boolean);return dateEvents().filter(e=>(!f.member||e.member===f.member)&&(!f.account||e.account===f.account)&&(!f.url||e.url===f.url)&&(!f.result||e.result===f.result)&&(!f.action||(f.action==='operation'?e.action!=='url':e.action===f.action))&&(!terms.length||terms.some(term=>[memberBy(e.member).name,accountBy(e.account).name,e.url,actionLabel(e.action),e.rule,e.reason].join(' ').toLowerCase().includes(term))))}
function metricValues(events){const blocked=events.filter(e=>e.result==='block'),operations=blocked.filter(e=>e.action!=='url');return [blocked.filter(e=>e.action==='url').length,operations.length,new Set(operations.map(e=>e.account)).size,new Set(operations.map(e=>e.member)).size]}
const METRICS=[['拦截 URL 访问数','统计进行违规访问 URL 总数；按被拦截访问事件次数累计，同一 URL 多次访问重复计次。','#0066FF'],['拦截操作数','统计进行了违规操作总数；统计被拦截的上传、下载、复制、打印和开发者模式操作，不含 URL 访问。','#0FC060'],['拦截异常操作账号数','统计进行了违规操作的账号总数；在所选时间内，对非 URL 拦截操作涉及的平台账号去重。','#D9001B'],['拦截异常操作成员数','统计进行了违规操作的成员总数；在所选时间内，对非 URL 拦截操作涉及的成员去重。','#E7772D']];
function days(){const result=[];for(let d=state.from;d<=state.to;d=shiftDate(d,1))result.push(d);return result}
function rankings(events,key){const map=new Map();events.forEach(event=>map.set(event[key],(map.get(event[key])||0)+1));return [...map].map(([id,count])=>({id,count})).sort((a,b)=>b.count-a.count||a.id.localeCompare(b.id))}
function rankHeader(labels){return '<tr>'+labels.map((label,i)=>`<th${i===0?' style="width:60px"':i===labels.length-1?' style="width:88px"':''}>${label}</th>`).join('')+'</tr>'}
function drawRanks(){$('actionRankMore').hidden=state.actionRank==='operation';const blocked=dateEvents().filter(e=>e.result==='block');const actionRows=rankings(blocked.filter(e=>state.actionRank==='url'?e.action==='url':e.action!=='url'),state.actionRank==='url'?'url':'action');$('actionRankHead').innerHTML=rankHeader(['排名',state.actionRank==='url'?'网页地址':'操作内容','拦截次数']);$('actionRankRows').innerHTML=actionRows.slice(0,5).map((row,i)=>`<tr><td class="mono">${i+1}</td><td><button type="button" class="link clip ${state.actionRank==='url'?'mono':''}" title="${esc(row.id)}" data-rank-action="${esc(row.id)}">${esc(state.actionRank==='url'?row.id:actionLabel(row.id))}</button></td><td class="mono">${row.count}</td></tr>`).join('');$('actionRankEmpty').hidden=actionRows.length>0;
const entityRows=rankings(blocked,state.entityRank);$('entityRankHead').innerHTML=rankHeader(['排名',state.entityRank==='account'?'账号名称':'成员',state.entityRank==='account'?'所属平台':'角色','拦截次数']);$('entityRankRows').innerHTML=entityRows.slice(0,5).map((row,i)=>{const entity=state.entityRank==='account'?accountBy(row.id):memberBy(row.id);return `<tr><td class="mono">${i+1}</td><td><button type="button" class="link clip entity-value" data-rank-entity="${row.id}" title="${esc(entity.name)}">${esc(entity.name)}</button></td><td title="${esc(entity.platform||entity.role)}">${esc(entity.platform||entity.role)}</td><td class="mono">${row.count}</td></tr>`}).join('');$('entityRankEmpty').hidden=entityRows.length>0;
for(const [id,attr,value]of [['actionRankTabs','actionRank',state.actionRank],['entityRankTabs','entityRank',state.entityRank]])for(const button of $(id).querySelectorAll('[role=tab]')){const selected=button.dataset[attr]===value;button.setAttribute('aria-selected',selected);button.tabIndex=selected?0:-1}
$('actionRankPanel').setAttribute('aria-labelledby','rank-'+state.actionRank);$('entityRankPanel').setAttribute('aria-labelledby','rank-'+state.entityRank);}
function destroyCharts(){charts.forEach(chart=>chart.destroy());charts=[];sparkCharts.forEach(chart=>chart.dispose());sparkCharts=[]}
function drawDashboard(){destroyCharts();const events=dateEvents(),values=metricValues(events),labels=days(),daily=labels.map(date=>metricValues(events.filter(e=>e.time.startsWith(date))));$('metrics').innerHTML=METRICS.map(([title,help,color],i)=>`<section class="metric"><div class="metric-label"><span>${title}</span><button class="help-dot" type="button" data-tip="${esc(help)}" aria-label="${esc(title+'：'+help)}"><i data-lucide="circle-help" aria-hidden="true"></i></button></div><strong class="metric-value" id="metric-${i}">${values[i]}</strong><div class="spark"><div id="spark-${i}" class="spark-chart" role="img" aria-label="${title}按日趋势"></div></div></section>`).join('');$('chartDate').textContent=state.from+' — '+state.to;$('trendSummary').textContent=labels.map((d,i)=>`${d}：URL 拦截 ${daily[i][0]} 次，操作拦截 ${daily[i][1]} 次`).join('；');
const available=typeof window.Chart==='function';$('trendBox').hidden=!available;$('chartFallback').hidden=available;
if(!available){
  $('chartFallback').innerHTML='<p>图表组件未加载，以下为按日统计。</p><table><thead><tr><th>日期</th><th>URL 拦截</th><th>操作拦截</th></tr></thead><tbody>'+labels.map((date,i)=>`<tr><td class="mono">${date}</td><td>${daily[i][0]}</td><td>${daily[i][1]}</td></tr>`).join('')+'</tbody></table>';

}else{
  const animation=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?false:{duration:200};
  charts.push(new Chart($('trendChart'),{
    type:'line',
    data:{labels:labels.map(v=>v.slice(5)),datasets:[
      {label:'拦截 URL 访问数',data:daily.map(v=>v[0]),borderColor:'#0066FF',backgroundColor:'#0066FF',borderWidth:2,pointRadius:2,tension:.25},
      {label:'拦截操作数',data:daily.map(v=>v[1]),borderColor:'#0FC060',backgroundColor:'#0FC060',borderWidth:2,pointRadius:2,tension:.25}
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#6E7685',maxTicksLimit:8}},y:{beginAtZero:true,ticks:{precision:0,color:'#6E7685'},grid:{color:'#E8EAED'}}}}
  }));

// 指标卡使用 ECharts 平滑折线与语义色渐变面积，仍由逐日统计驱动。
const sparkAvailable=!!window.echarts;
document.querySelectorAll('.spark').forEach(el=>el.hidden=!sparkAvailable);

  const fills=['#E6F0FF','#E7F9F0','#FFE8EB','#FDF2E9'];

}
const counterColumns=ACTIONS.map(([key,label])=>({key,label:'拦截'+label,width:key==='devtools'?180:150,sort:true,counter:true}));
function defaultColumnDefinitions(){if(state.tab==='all')return [{key:'member',label:'操作成员',width:130,required:true},{key:'account',label:'平台账号',width:180},{key:'url',label:'页面 URL',width:280},{key:'action',label:'操作内容',width:130},{key:'time',label:'操作时间',width:190,sort:true},{key:'rule',label:'拦截规则',width:180},{key:'result',label:'处理结果',width:100},{key:'view',label:'操作',width:80,required:true}];return [{key:'name',label:state.tab==='members'?'操作成员':state.tab==='accounts'?'平台账号':'网页 URL',width:state.tab==='urls'?280:160,required:true},{key:'related',label:state.tab==='members'?'授权账号':state.tab==='accounts'?'授权成员':'平台账号',width:200},...counterColumns,{key:'view',label:'操作',width:80,required:true}]}
function columnDefinitions(){
  const defaults=defaultColumnDefinitions(),order=state.columnOrder[state.tab]||[];
  return [...defaults].sort((a,b)=>{
    const rank=c=>order.includes(c.key)?order.indexOf(c.key):order.length+defaults.indexOf(c);
    return rank(a)-rank(b);
  });
}
function aggregate(events,tab=state.tab){const key=tab==='members'?'member':tab==='accounts'?'account':'url',map=new Map();events.filter(e=>e.result==='block').forEach(event=>{const id=event[key];if(!map.has(id)){const entity=tab==='members'?memberBy(id):tab==='accounts'?accountBy(id):null;map.set(id,{id,name:entity?.name||id,events:[],total:0,...Object.fromEntries(ACTIONS.map(([action])=>[action,0]))})}const row=map.get(id);row.events.push(event);row[event.action]++;row.total++});return [...map.values()]}
function currentRows(){const data=filteredEvents(),rows=state.tab==='all'?data:aggregate(data);const sort=state.sort;return rows.sort((a,b)=>{const va=a[sort],vb=b[sort];const diff=typeof va==='number'?va-vb:String(va??'').localeCompare(String(vb??''));return (state.direction==='asc'?diff:-diff)||a.id.localeCompare(b.id)})}

$('filterForm').onsubmit=e=>{e.preventDefault();state.filters.member=state.tab==='urls'?'':$('memberFilter').value;state.filters.account=$('accountFilter').value;state.filters.result=state.tab==='all'?$('resultFilter').value:'';state.filters.action=state.tab==='all'?$('actionFilter').value:'';state.page=1;closeOverlay();render();saveLocation()};
$('restoreColumns').onclick=()=>renderColumnDraft(defaultColumnDefinitions());$('columnsForm').onsubmit=e=>{e.preventDefault();state.columns[state.tab]=[...document.querySelectorAll('#columnOptions input:not(:checked)')].map(input=>input.value);state.columnOrder[state.tab]=[...$('columnOptions').children].map(row=>row.dataset.column);try{localStorage.setItem('yunlogin.access-log-column-order.v1',JSON.stringify(state.columnOrder));localStorage.setItem('yunlogin.access-log-columns.v1',JSON.stringify(state.columns))}catch{}closeOverlay();drawList();icons()};
$('columnOptions').onclick=e=>{
  const button=e.target.closest('[data-move]');if(!button)return;
  const row=button.closest('[data-column]'),other=button.dataset.move==='up'?row.previousElementSibling:row.nextElementSibling;
  if(!other)return;
  if(button.dataset.move==='up')other.before(row);else other.after(row);
  updateColumnMoves();(button.disabled?row.querySelector('button:not(:disabled)'):button)?.focus();
};
$('columnOptions').ondragstart=e=>{const row=e.target.closest('[data-column]');if(!row)return;columnDragKey=row.dataset.column;row.setAttribute('aria-grabbed','true');e.dataTransfer.setData('text/plain',columnDragKey);e.dataTransfer.effectAllowed='move'};
$('columnOptions').ondragover=e=>{if(columnDragKey){e.preventDefault();e.dataTransfer.dropEffect='move'}};
$('columnOptions').ondrop=e=>{e.preventDefault();const target=e.target.closest('[data-column]'),source=[...$('columnOptions').children].find(row=>row.dataset.column===columnDragKey);if(target&&source&&target!==source){const rect=target.getBoundingClientRect();if(e.clientY<rect.top+rect.height/2)target.before(source);else target.after(source);updateColumnMoves()}columnDragKey=null;$('columnOptions').querySelector('[aria-grabbed]')?.removeAttribute('aria-grabbed')};
$('columnOptions').ondragend=()=>{columnDragKey=null;$('columnOptions').querySelector('[aria-grabbed]')?.removeAttribute('aria-grabbed')};
$('tableHead').onclick=e=>{const button=e.target.closest('[data-sort]');if(!button)return;const key=button.dataset.sort;state.direction=state.sort===key&&state.direction==='desc'?'asc':'desc';state.sort=key;state.page=1;drawList();icons();saveLocation();document.querySelector(`[data-sort="${key}"]`)?.focus()};
$('tableRows').onclick=e=>{const view=e.target.closest('[data-view]');if(view){openDetail(view.dataset.view,view);return}const button=e.target.closest('[data-drill]');if(button){openObjectLogs(button.dataset.drill,button.dataset.operation,button)}};
$('actionRankTabs').onclick=e=>{const button=e.target.closest('[data-action-rank]');if(button){state.actionRank=button.dataset.actionRank;drawRanks();saveLocation(true)}};$('entityRankTabs').onclick=e=>{const button=e.target.closest('[data-entity-rank]');if(button){state.entityRank=button.dataset.entityRank;drawRanks();saveLocation(true)}};
$('actionRankMore').onclick=()=>{if(state.actionRank==='url')changeTab('urls');else drill({action:'operation'})};$('entityRankMore').onclick=()=>changeTab(state.entityRank==='account'?'accounts':'members');
$('actionRankRows').onclick=e=>{const button=e.target.closest('[data-rank-action]');if(button)drill({[state.actionRank==='url'?'url':'action']:button.dataset.rankAction})};$('entityRankRows').onclick=e=>{const button=e.target.closest('[data-rank-entity]');if(button)drill({[state.entityRank]:button.dataset.rankEntity})};
$('memberLogFilters').onchange=applyMemberFilters;$('memberLogFilters').onsubmit=e=>{e.preventDefault();applyMemberFilters()};
$('memberFilterToggle').onclick=()=>{const expanded=$('memberFilterToggle').getAttribute('aria-expanded')==='true';document.querySelectorAll('[data-member-extra]').forEach(el=>el.hidden=expanded);$('memberFilterToggle').setAttribute('aria-expanded',String(!expanded));$('memberFilterToggle').textContent=expanded?'展开':'收起'};
$('memberTimeSort').onclick=()=>{memberLog.desc=!memberLog.desc;memberLog.page=1;renderMemberLogs()};
$('memberLogRows').onclick=e=>{const button=e.target.closest('[data-member-event]');if(button)openMemberEvent(button.dataset.memberEvent,button)};
$('detailBody').onclick=e=>{const button=e.target.closest('[data-detail-event]');if(button){eventDetail(button.dataset.detailEvent);$('backToGroup')?.focus()}};
document.querySelectorAll('[data-close]').forEach(button=>button.onclick=closeOverlay);document.querySelectorAll('.overlay').forEach(el=>el.onclick=e=>{if(e.target===el)closeOverlay()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();closeOverlay();return}if(e.key!=='Tab'||!openPanel)return;const focusable=[...openPanel.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')].filter(el=>!el.closest('[hidden]'));const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
document.addEventListener('pointerover',e=>{const target=e.target.closest('[data-tip]');if(target)showTip(target)});document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))hideTip()});document.addEventListener('focusin',e=>{if(e.target.matches('[data-tip]'))showTip(e.target)});document.addEventListener('focusout',hideTip);document.addEventListener('click',e=>{const target=e.target.closest('[data-tip]');if(target)showTip(target);else hideTip()});window.addEventListener('resize',hideTip);window.addEventListener('scroll',hideTip,true);
window.addEventListener('popstate',()=>{closeAllOverlays();readLocation();render()});window.addEventListener('hashchange',()=>{closeAllOverlays();readLocation();render()});}
const annotations_removed={1:{title:'视图切换',desc:['五个页签共用时间范围；切换清除对象筛选']},2:{title:'操作时间',desc:['默认近7天，支持自定义日期和校验']},3:{title:'审计指标',desc:['全部指标来自同一事件集合，事件编号去重']},4:{title:'日志查询',desc:['搜索实时生效，抽屉条件确认后生效']},5:{title:'日志详情',desc:['统计次数可下钻，查看打开业务详情抽屉']}};
try{const stored=JSON.parse(localStorage.getItem('yunlogin.access-log-columns.v1')||'{}');for(const key of ['members','accounts','urls','all'])if(Array.isArray(stored[key]))state.columns[key]=stored[key].filter(v=>typeof v==='string')}catch{}
try{const stored=JSON.parse(localStorage.getItem('yunlogin.access-log-column-order.v1')||'{}');for(const key of ['members','accounts','urls','all'])if(Array.isArray(stored[key]))state.columnOrder[key]=[...new Set(stored[key].filter(v=>typeof v==='string'))]}catch{}
window.addEventListener('resize',()=>sparkCharts.forEach(chart=>chart.resize()));
if(window.ResizeObserver)new ResizeObserver(()=>sparkCharts.forEach(chart=>chart.resize())).observe($('metrics'));
readLocation();populateFilters();initEvents();render();initPager();saveLocation(true);
document.addEventListener('load',event=>{if(event.target.tagName==='SCRIPT'){initPager();icons();if(state.tab==='dashboard'&&((window.Chart&&!charts.length)||(window.echarts&&!sparkCharts.length)))drawDashboard()}},true);
window.addEventListener('load',()=>{initPager();icons()},{once:true});
</script>
</body>
