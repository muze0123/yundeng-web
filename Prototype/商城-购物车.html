<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云登 - 商城-购物车</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@1.34.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    if (window.tailwind) tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#0066FF', hover: '#0052CC', active: '#0047B3', bg: '#E6F0FF' },
            ink: { title: '#1A1D24', body: '#3A3F4A', sub: '#6E7685', muted: '#9DA2AC' },
            line: { DEFAULT: '#DFE1E5', light: '#E8EAED', lighter: '#F0F1F3' },
            page: '#F7F8FA', card: '#FFFFFF', hover: '#F3F4F6', price: '#FE5416',
            success: { DEFAULT: '#0FC060', bg: '#E7F9F0' }, warning: { DEFAULT: '#E7772D', bg: '#FDF2E9' },
            danger: { DEFAULT: '#D9001B', bg: '#FFE8EB' }, info: { DEFAULT: '#0091D5', bg: '#E4F4FB' }
          },
          borderRadius: { DEFAULT: '4px', md: '6px', lg: '8px' },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root { --primary:#0066FF; --primary-hover:#0052CC; --ink-title:#1A1D24; --ink-body:#3A3F4A; --ink-sub:#6E7685; --ink-muted:#9DA2AC; --line:#DFE1E5; --line-light:#E8EAED; --line-lighter:#F0F1F3; --page:#F7F8FA; --card:#FFFFFF; --hover:#F3F4F6; --price:#FE5416; --success:#0FC060; --success-bg:#E7F9F0; --warning:#E7772D; --danger:#D9001B; --danger-bg:#FFE8EB; --info:#0091D5; --info-bg:#E4F4FB; --primary-bg:#E6F0FF; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; letter-spacing: 0; }
    body { color: var(--ink-body); background: var(--page); font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    button, input, select { font: inherit; }
    button { white-space: nowrap; }
    .hidden { display: none !important; }
    .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .store-page { min-width: 0; min-height: 100%; padding-bottom: 24px; overflow: auto; background: var(--page); }
    .surface { min-width: 0; padding: 20px; border-radius: 8px; background: var(--card); }
    .cart-list-wrapper { padding: 0; }
    .store-tabs { min-width: 0; height: 44px; display: flex; align-items: stretch; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .store-tabs::-webkit-scrollbar { display: none; }
    .store-tab { min-width: 104px; height: 44px; padding: 0 16px; border: 0; border-bottom: 2px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none; color: var(--ink-sub); background: transparent; cursor: pointer; font-size: 14px; line-height: 1; }
    .store-tab:hover { color: var(--primary); background: var(--hover); }
    .store-tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; background: var(--card); }
    .store-tab svg { width: 16px; height: 16px; }
    .cart-layout { display: flex; flex-wrap: nowrap; gap: 16px; align-items: flex-start; }
    .cart-list-wrapper { flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: clip; }
    .order-summary { flex: 0 0 320px; width: 320px; min-width: 0; position: sticky; top: 0; }
    .cart-toolbar { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line-lighter); background: var(--card); }
    .cart-toolbar-left, .cart-toolbar-actions { min-width: 0; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .checkbox-line { display: inline-flex; align-items: flex-start; gap: 7px; cursor: pointer; }
    .checkbox-line input { width: 14px; height: 14px; margin: 2px 0 0; accent-color: var(--primary); }
    .cart-toolbar-title { display: flex; align-items: center; gap: 10px; color: var(--ink-title); font-size: 14px; font-weight: 600; }
    .cart-toolbar-title .mono { color: var(--primary); }
    .cart-toolbar-link { padding: 0; border: 0; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-sub); background: transparent; cursor: pointer; }
    .cart-toolbar-link:hover { color: var(--primary); }
    .cart-toolbar-link:disabled { color: var(--ink-muted); cursor: not-allowed; }
    .cart-group-list { display: grid; }
    .cart-group { border-top: 1px solid var(--line-light); background: var(--card); }
    .cart-group:first-child { border-top: 0; }
    .cart-group-header { min-height: 58px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--hover); cursor: pointer; }
    .cart-group-header-main { min-width: 0; display: flex; align-items: center; gap: 10px; flex: 1; }
    .cart-group-summary { min-width: 0; display: inline-flex; align-items: center; gap: 10px; }
    .cart-group-title { min-width: 0; color: var(--ink-title); font-size: 14px; font-weight: 600; }
    .cart-group-count { color: var(--ink-sub); font-size: 13px; font-weight: 500; }
    .cart-group-toggle { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-sub); background: transparent; cursor: pointer; }
    .cart-group-toggle:hover { color: var(--primary); background: var(--primary-bg); }
    .cart-group-toggle svg { width: 16px; height: 16px; }
    .cart-group-body { border-top: 1px solid var(--line-light); overflow: visible; }
    .cart-group.collapsed .cart-group-body { display: none; }
    .cart-row { width: 100%; min-width: 1408px; padding: 18px 20px 16px 48px; display: grid; grid-template-columns: 300px 200px 96px 200px 200px minmax(44px, 1fr); column-gap: 60px; align-items: center; border-top: 1px solid var(--line-lighter); }
    .cart-row.is-dynamic { min-width: 1408px; grid-template-columns: 300px 200px 96px 200px 200px minmax(44px, 1fr); }
    .cart-row:first-child { border-top: 0; }
    .cart-row:hover { background: var(--hover); }
    .cart-row-main { min-width: 0; display: flex; gap: 12px; align-items: flex-start; }
    .cart-row-main .checkbox-line { margin-top: 3px; flex: none; }
    .cart-row-title { min-width: 0; display: grid; gap: 2px; }
    .cart-row-title strong { overflow: hidden; color: var(--ink-title); font-size: 14px; font-weight: 600; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .cart-row-sub { color: var(--ink-sub); font-size: 12px; line-height: 1.4; }
    .cart-traffic-copy { margin-top: 6px; display: grid; gap: 2px; color: var(--ink-sub); font-size: 12px; line-height: 1.4; }
    .cart-traffic-copy span { white-space: nowrap; }
    .cart-traffic-copy .mono { color: var(--ink-body); }
    .cart-dynamic-field { min-width: 0; display: inline-flex; align-items: center; color: var(--ink-body); white-space: nowrap; }
    .cart-dynamic-field.mono { font-family: 'JetBrains Mono', monospace; }
    .cart-dynamic-validity { min-width: 0; display: inline-flex; align-items: center; color: var(--ink-sub); white-space: nowrap; }
    .cart-mini-select { width: 200px; min-width: 200px; max-width: 200px; height: 32px; padding: 0 30px 0 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink-body); background: var(--card); outline: none; }
    .cart-mini-select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,102,255,.12); }
    .cart-mini-select[data-cart-coupon]:focus,
    .cart-mini-select[data-cart-coupon]:focus-visible { outline: 0; outline-offset: 0; box-shadow: none; border-color: var(--primary); }
    .cart-quantity { display: inline-grid; grid-template-columns: 28px 44px 28px; height: 32px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--card); }
    .cart-quantity button { border: 0; color: var(--ink-sub); background: var(--card); cursor: pointer; }
    .cart-quantity button:hover { color: var(--primary); background: var(--primary-bg); }
    .cart-quantity button:disabled { color: var(--ink-muted); background: var(--page); cursor: not-allowed; }
    .cart-quantity input { width: 44px; border: 0; border-inline: 1px solid var(--line-lighter); text-align: center; background: var(--card); outline: none; }
    .cart-price { min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .cart-price-raw { color: var(--ink-title); font-size: 14px; font-weight: 600; }
    .cart-price-paid { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); font-size: 16px; font-weight: 700; }
    .cart-price-info { width: 18px; height: 18px; position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--primary); background: var(--primary-bg); cursor: help; }
    .cart-price-info svg { width: 12px; height: 12px; }
    .cart-price-tip { width: 260px; padding: 10px 12px; position: fixed; left: 0; top: 0; z-index: 200; border-radius: 8px; color: var(--ink-body); background: var(--card); box-shadow: 0 6px 24px rgba(0,0,0,.12); font-size: 12px; line-height: 1.55; opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease; }
    .cart-price-tip.is-visible { opacity: 1; visibility: visible; transform: translateY(0); }
    .cart-price-tip::after { content: ''; width: 10px; height: 10px; position: absolute; right: 16px; bottom: -5px; background: var(--card); transform: rotate(45deg); }
    .cart-price-tip > span { display: block; white-space: nowrap; }
    .cart-price-tip .accent { color: var(--price); }
    .cart-price-tip .free { color: var(--success); }
    .cart-price-tip .amount { color: var(--ink-title); }
    .cart-row-actions { display: flex; align-items: center; justify-content: flex-end; height: 100%; }
    .cart-row-actions .delete-icon-button { margin-left: auto; align-self: center; }
    .delete-icon-button { width: 24px; height: 24px; padding: 0; border: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-muted); background: transparent; cursor: pointer; }
    .delete-icon-button:hover { color: var(--danger); }
    .delete-icon-button svg { width: 17px; height: 17px; }
    .cart-empty { min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink-sub); text-align: center; }
    .cart-empty .empty-icon { width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary); background: var(--primary-bg); }
    .cart-empty h3 { margin: 12px 0 4px; color: var(--ink-title); font-size: 16px; }
    /* 结算区：订单信息 / 支付方式 / 应付金额 合并为同一张卡片，卡片内以分割线区分区块。 */
    .summary-card { width: 100%; padding: 18px 20px; display: flex; flex-direction: column; border: 1px solid var(--line-light); border-radius: 8px; background: var(--card); box-shadow: 0 1px 5px rgba(28,35,49,.07); }
    .summary-block { flex: none; }
    .summary-block + .summary-block { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-light); }
    .summary-title-row, .summary-total-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .summary-title-row h2 { margin: 0; color: var(--ink-title); font-size: 14px; font-weight: 600; }
    .selected-count { color: var(--ink-sub); }
    .summary-selected-list { display: grid; gap: 12px; margin-top: 12px; }
    .summary-selected-item { display: flex; align-items: flex-start; gap: 12px; }
    .summary-item-main { min-width: 0; flex: 1; }
    .summary-item-title { color: var(--ink-title); font-size: 14px; font-weight: 600; }
    .summary-item-spec { margin-top: 4px; color: var(--ink-muted); font-size: 12px; line-height: 1.45; }
    .summary-item-price { margin-left: auto; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .summary-item-close { width: 14px; height: 14px; padding: 0; border: 0; color: var(--ink-sub); background: transparent; cursor: pointer; }
    .summary-item-close svg { width: 14px; height: 14px; }
    .summary-overview { margin: 16px -20px 0; padding: 10px 20px 0; border-top: 1px solid var(--line-lighter); }
    .summary-overview-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 6px 0; color: var(--ink-sub); }
    .summary-overview-row strong, .summary-overview-row span:last-child { color: var(--ink-title); text-align: right; }
    .summary-payment h3 { margin: 0 0 12px; color: var(--ink-title); font-size: 14px; font-weight: 600; }
    .summary-payment-options { display: grid; gap: 12px; }
    .summary-payment-option { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; display: flex; align-items: center; justify-content: flex-start; gap: 8px; color: var(--ink-body); background: var(--card); cursor: pointer; font-size: 14px; }
    .summary-payment-option:hover { color: var(--primary); border-color: var(--primary); background: var(--card); }
    .summary-payment-option.is-selected { color: var(--primary); border-color: var(--primary); background: var(--primary-bg); }
    .payment-label { display: flex; align-items: center; gap: 8px; }
    .payment-label svg { width: 16px; height: 16px; }
    .payment-balance { color: var(--ink-sub); }
    .payment-recharge { margin-left: auto; }
    .payment-recharge button { height: 24px; padding: 0 10px; border: 0; border-radius: 4px; color: var(--primary); background: var(--primary-bg); cursor: pointer; }
    .summary-total-top span { color: var(--ink-title); font-size: 14px; font-weight: 400; }
    .summary-total-top strong { color: var(--ink-title); font: 400 16px/1.4 'JetBrains Mono', monospace; }
    .summary-primary-submit { width: 100%; height: 52px; margin-top: 18px; border: 0; border-radius: 8px; color: var(--card); background: var(--primary); font-size: 16px; font-weight: 600; cursor: pointer; }
    .summary-primary-submit:disabled { color: var(--ink-muted); background: var(--line-lighter); cursor: not-allowed; }
    .summary-agreement { margin-top: 16px; color: var(--ink-sub); font-size: 12px; }
    .summary-agreement a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .summary-agreement a:hover { text-decoration: underline; }
    .store-page { min-height:calc(100vh - 16px); padding-bottom:16px; }
    #cartPanel { min-height:calc(100vh - 68px); }
    .modal-mask { position: fixed; inset: 0; z-index: 2000; padding: 16px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.3); }
    .modal-mask.hidden { display: none; }
    .modal-panel { width: 520px; max-width: 92vw; max-height: 88vh; border-radius: 8px; display: flex; flex-direction: column; background: var(--card); box-shadow: 0 6px 24px rgba(0,0,0,.12); }
    .modal-header { min-height: 56px; padding: 0 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .modal-header h2 { margin: 0; color: var(--ink-title); font-size: 16px; }
    .modal-body { padding: 20px; overflow: auto; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 12px; }
    .btn { height: 32px; padding: 0 16px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
    .btn-default { color: var(--ink-body); border-color: var(--line); background: var(--card); }
    .btn-primary { color: var(--card); background: var(--primary); }
    .detail-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; padding: 6px 0; }
    .info-callout { margin-top: 16px; padding: 12px; border-radius: 4px; color: var(--info); background: var(--info-bg); }
    @media (max-width: 1800px) {
      .cart-list-wrapper { overflow: visible; }
      .cart-row, .cart-row.is-dynamic { min-width: 0; grid-template-columns: minmax(220px, 1.25fr) minmax(150px, 1fr) 96px minmax(150px, 1fr) minmax(145px, 1fr) 24px; column-gap: 20px; }
      .cart-mini-select { width: 100%; min-width: 0; max-width: none; }
      .cart-row-actions { min-width: 24px; }
    }
    /* 1800px 级桌面保留右侧订单区块；更窄时上下排列，避免左右栏失去可读宽度。 */
    @media (max-width: 1400px) {
      .cart-layout { flex-wrap: wrap; }
      .cart-list-wrapper { flex: 1 1 100%; width: 100%; overflow: visible; }
      .order-summary { flex: 0 0 100%; width: 100%; position: static; top: auto; order: 1; }
      .cart-group-body { overflow: visible; }
      .cart-row, .cart-row.is-dynamic { grid-template-columns: minmax(150px, 1.3fr) minmax(110px, 1fr) 80px minmax(110px, 1fr) minmax(120px, 1fr) 24px; column-gap: 8px; }
      .cart-mini-select { width: 100%; min-width: 0; max-width: none; }
      .cart-quantity { width: 100%; grid-template-columns: 24px minmax(0, 1fr) 24px; }
      .cart-quantity input { width: 100%; }
    }
    @media (max-width: 767px) {
      .cart-toolbar { align-items: flex-start; flex-direction: column; }
      .cart-layout { gap: 12px; }
      .cart-row, .cart-row.is-dynamic { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 12px; row-gap: 12px; padding: 16px; }
      .cart-row-actions { min-width: 0; }
    }
    :where(button, input, select):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    /* 左侧列表与右侧结算末区块拉伸至同一底线，页面底部留白 16px。 */
    #mainContent.store-page { display:flex; flex-direction:column; height:100dvh; min-height:0; padding:16px; }
    #mainContent > nav { flex:none; }
    #mainContent > #cartPanel { flex:1 0 auto; min-height:0; align-items:stretch; }
    #cartPanel > .order-summary { position:static; display:flex; flex-direction:column; align-self:stretch; }
    /* 合并后的结算卡片拉伸至左侧列表底线，区块按内容顺序自上而下排列。 */
    .order-summary > .summary-card { flex:1 1 auto; min-height:0; }
  </style>

<body class="overflow-hidden">
  <main id="mainContent" class="store-page" tabindex="-1">
    <h1 class="sr-only">商城-购物车</h1>
    <span id="dirtyBadge" class="hidden" aria-hidden="true"></span>
    <nav class="surface !p-0 mb-2" aria-label="商城业务范围">
      <div id="storeTabs" class="store-tabs" role="tablist" aria-label="商城业务范围">
        <button id="tabProxy" class="store-tab" type="button" role="tab" aria-selected="false" data-tab="proxy"><i data-lucide="server"></i><span>代理</span></button>
        <button id="tabPlan" class="store-tab" type="button" role="tab" aria-selected="false" data-tab="plan" tabindex="-1"><i data-lucide="package"></i><span>套餐</span></button>
        <button id="tabCoin" class="store-tab" type="button" role="tab" aria-selected="false" data-tab="coin" tabindex="-1"><i data-lucide="wallet-cards"></i><span>云币充值</span></button>
        <button id="tabCart" class="store-tab" type="button" role="tab" aria-selected="true" data-tab="cart" tabindex="0"><i data-lucide="shopping-cart"></i><span>购物车</span></button>
      </div>
    </nav>
    <section id="cartPanel" class="cart-layout" aria-labelledby="cartTitle">
      <div class="cart-list-wrapper surface" aria-labelledby="cartTitle">
        <div class="cart-toolbar">
          <div class="cart-toolbar-left">
            <label class="checkbox-line"><input id="checkAll" type="checkbox" aria-label="全选可结算商品"><span class="cart-toolbar-title">购物车 <span id="cartCountText" class="mono">已选择 0（共0条）</span></span></label>
            <button id="clearSelected" class="cart-toolbar-link" type="button"><i data-lucide="trash-2" style="width:18px;height:18px;"></i>批量删除</button>
          </div>
          <div class="cart-toolbar-actions"><button id="clearCart" class="cart-toolbar-link" type="button">清空失效商品</button></div>
        </div>
        <div id="cartEmpty" class="cart-empty hidden"><span class="empty-icon"><i data-lucide="shopping-cart"></i></span><h3>购物车暂无商品</h3><p>可从商城代理或套餐页面添加商品</p></div>
        <div id="cartGroupWrap" class="cart-group-list"></div>
      </div>
      <aside id="cartSummary" class="order-summary" aria-labelledby="cartSummaryTitle"></aside>
    </section>
  </main>
  <div id="orderDialog" class="modal-mask hidden" role="dialog" aria-modal="true" aria-labelledby="orderDialogTitle">
    <section class="modal-panel" tabindex="-1"><header class="modal-header"><h2 id="orderDialogTitle">确认订单</h2><button id="closeDialog" class="icon-button" type="button" aria-label="关闭确认弹窗"><i data-lucide="x"></i></button></header><div id="orderDialogBody" class="modal-body"></div><footer class="modal-footer"><button id="cancelDialog" class="btn btn-default" type="button">取消</button><button id="confirmDemo" class="btn btn-primary" type="button">确认演示</button></footer></section>
  </div>
  <script>
    const paymentMethods = [
      { id:'alipay', label:'支付宝支付', icon:'badge-dollar-sign' },
      { id:'wechat', label:'微信支付', icon:'message-circle' },
      { id:'coin', label:'账户云币支付', icon:'coins', suffix:'（我的云币：300）' }
    ];

      const tabs = $$('[data-tab]');
      const index = tabs.indexOf(event.target.closest('[data-tab]'));
      const next = (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      if (tabs[next].dataset.tab !== 'cart') navigateToStoreTab(tabs[next].dataset.tab);
    });
    $('#cartPanel').addEventListener('change', event => {
      const check = event.target.closest('[data-cart-check]'), groupCheck = event.target.closest('[data-group-check]'), duration = event.target.closest('[data-cart-duration]'), coupon = event.target.closest('[data-cart-coupon]');
      if (check) { const item = cartItemById(check.dataset.cartCheck); if (item) item.checked = check.checked; renderCart(); }
      else if (groupCheck) { state.cart.filter(item => cartGroupKey(item) === groupCheck.dataset.groupCheck && selectable(item)).forEach(item => { item.checked = groupCheck.checked; }); renderCart(); }
      else if (duration) { const item = cartItemById(duration.dataset.cartDuration); if (item) item.duration = Number(duration.value); renderCart(); }
      else if (coupon) { const item = cartItemById(coupon.dataset.cartCoupon); if (item) { item.couponLabel = coupon.value; item.couponDiscount = coupon.value.includes('50') ? 50 : coupon.value.includes('20') ? 20 : 0; item.discount = item.baseDiscount + item.couponDiscount; } renderCart(); }
      if (event.target.id === 'cartNotice') state.cartNotice = event.target.checked;
    });
    $('#checkAll').addEventListener('change', event => { state.cart.forEach(item => { item.checked = event.target.checked && selectable(item); }); renderCart(); });
    $('#clearCart').addEventListener('click', () => { state.cart = state.cart.filter(selectable); renderCart(); });
    $('#closeDialog').addEventListener('click', () => $('#orderDialog').classList.add('hidden'));
    $('#cancelDialog').addEventListener('click', () => $('#orderDialog').classList.add('hidden'));
    $('#confirmDemo').addEventListener('click', () => $('#orderDialog').classList.add('hidden'));
    window.addEventListener('storage', event => {
      if (event.key !== CART_STORAGE_KEY) return;
      const incoming = readStoredCart();
      if (!incoming) return;
      state.cart = incoming.map((item, index) => normalizeCartItem(item, index)).filter(Boolean);
      renderCart();
    });
    renderCart();
  </script>
</body>
</html>
