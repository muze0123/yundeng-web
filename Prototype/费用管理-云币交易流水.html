  <style>
    *{box-sizing:border-box}
    body{font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F7F8FA}
    .mono{font-family:'JetBrains Mono',monospace}
    .page-content{padding:0}
    .btn{height:32px;padding:0 12px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;cursor:pointer}
    .btn-primary{background:#0066FF;color:#fff}.btn-primary:hover{background:#0052CC}
    .btn-default{border:1px solid #DFE1E5;background:#fff;color:#3A3F4A}.btn-default:hover{background:#F3F4F6}
    .field{height:32px;border:1px solid #DFE1E5;border-radius:4px;background:#fff;padding:0 10px;outline:none;color:#3A3F4A}
    .field:focus{border-color:#0066FF;box-shadow:0 0 0 2px #E6F0FF}
    .field.invalid,.field[aria-invalid="true"]{border-color:#D9001B}
    .card{background:#fff;border:0;border-radius:8px}
    .tab{height:48px;padding:0 22px;border-bottom:2px solid transparent;color:#6E7685;white-space:nowrap;cursor:pointer}
    .tab.active{color:#0066FF;border-color:#0066FF;font-weight:600}
    .subtab{height:34px;padding:0 14px;border-radius:4px;color:#6E7685;cursor:pointer}
    .subtab.active{color:#0066FF;background:#E6F0FF}
    .modal-bg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:16px}
    .toast{position:fixed;left:50%;top:24px;z-index:9996;display:flex;align-items:center;gap:10px;min-width:320px;max-width:min(480px,calc(100vw - 32px));min-height:44px;padding:10px 14px;border-radius:8px;background:#fff;color:#3A3F4A;box-shadow:0 6px 24px rgba(0,0,0,.12);transform:translateX(-50%)}
    .toast-icon{width:18px;height:18px;flex:0 0 18px}.toast[data-tone="success"] .toast-icon{color:#0FC060}.toast[data-tone="info"] .toast-icon{color:#0091D5}.toast[data-tone="warning"] .toast-icon{color:#E7772D}.toast[data-tone="danger"] .toast-icon{color:#D9001B}
    .anno-badge{position:fixed;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px sans-serif;text-align:center;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
    .hidden{display:none!important}th{white-space:nowrap;font-weight:500}td{white-space:nowrap}
    .coin-filter-flow{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:16px;column-gap:24px;min-width:0}
    .coin-filter-item{display:flex;flex:0 0 374px;width:374px;max-width:100%;min-width:0;align-items:flex-start;column-gap:0;position:relative}
    .coin-filter-label{width:74px;flex:0 0 74px;color:#3A3F4A;font-size:14px;line-height:32px;text-align:right;white-space:nowrap}
    .coin-filter-control{width:300px;max-width:100%;flex:0 1 300px}.coin-filter-actions{display:flex;align-items:center;gap:12px;min-height:32px;flex:0 0 auto}
    .data-list-title{display:flex;align-items:center;gap:12px}.data-list-count{color:#6E7685;font-size:13px}
    .data-table-row{border-bottom:1px solid #E8EAED}.data-table-row:hover{background:#F3F4F6}
    @media(max-width:720px){.page-tabs{overflow-x:auto}.coin-summary{grid-template-columns:1fr!important}.responsive-field{width:100%!important}.modal-card{width:min(520px,100%)!important}.toast{min-width:0;width:calc(100vw - 32px)}.coin-filter-item{flex-basis:100%;width:100%}.coin-filter-control{width:calc(100% - 74px)}.coin-filter-actions{width:100%;justify-content:flex-start}}
  </style>
  <style>
    /* 余额视觉特例：参考需求图的超大金额层级，颜色仍使用 design.md 既有 token。 */
    .coin-balance-card{position:relative;width:300px;max-width:100%;height:150px;min-height:150px;overflow:hidden;padding:24px;border-radius:8px;background:linear-gradient(135deg,#F7F8FA 0%,#E4F4FB 48%,#E6F0FF 100%)}
    .coin-balance-card::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.48) 0%,rgba(255,255,255,.14) 42%,rgba(255,255,255,0) 68%);pointer-events:none}
    .coin-balance-card__inner{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;min-height:102px}
    .coin-balance-card__meta{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-width:0}
    .coin-balance-title{color:#6E7685;font-size:14px;font-weight:400;line-height:20px}
    .coin-balance-value{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:1;font-weight:600;color:#1A1D24;font-variant-numeric:tabular-nums}
    .coin-balance-refresh{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;color:#9DA2AC;font-size:14px;line-height:1;cursor:pointer}
    .coin-balance-refresh:hover,.coin-balance-refresh:focus-visible{color:#6E7685}
    .coin-balance-refresh svg{width:20px;height:20px}
    .coin-balance-art{position:absolute;right:-20px;top:-2px;width:190px;height:auto;opacity:.46;pointer-events:none}
    .coin-store-nav{margin-bottom:8px;background:#fff;border-radius:8px;overflow:hidden}
    .coin-store-tabs{height:44px;display:flex;align-items:stretch;gap:8px;overflow-x:auto;scrollbar-width:none}
    .coin-store-tabs::-webkit-scrollbar{display:none}
    .coin-store-tab{min-width:104px;height:44px;padding:0 16px;border:0;border-bottom:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;color:#6E7685;background:transparent;cursor:pointer;font-size:14px;line-height:1;white-space:nowrap}
    .coin-store-tab:hover{color:#0066FF;background:#F3F4F6}
    .coin-store-tab.active{color:#0066FF;border-bottom-color:#0066FF;font-weight:600;background:#fff}
    .coin-store-tab svg{width:16px;height:16px}
    .coin-business-card{background:#fff;border-radius:8px;overflow:hidden}
    .coin-tabs{padding:6px 20px 0;border-bottom:1px solid #E8EAED}
    .coin-tabs .subtab{height:40px;padding:0 18px;border-radius:4px}
    .coin-tabs .subtab.active{background:#E6F0FF;color:#0066FF}
    .coin-transaction-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px}
    .coin-search-filter-group{display:flex;align-items:center;justify-content:flex-end;gap:20px;min-width:0;flex:0 1 500px;margin-left:auto}
    .coin-global-search{position:relative;width:400px;max-width:100%;flex:0 1 400px}
    .coin-global-search .field{width:100%;padding-left:10px;padding-right:58px}
    .coin-global-search input[type="search"]::-webkit-search-cancel-button{display:none}
    .coin-search-submit,.coin-search-clear{position:absolute;top:4px;width:24px;height:24px;padding:0;border:0;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#9DA2AC;cursor:pointer;outline:none}
    .coin-search-submit{right:4px}
    .coin-search-clear{right:30px}
    .coin-search-submit:hover,.coin-search-clear:hover,.coin-search-submit:focus-visible,.coin-search-clear:focus-visible{background:#F3F4F6;color:#3A3F4A}
    .coin-filter-button{position:relative;min-width:74px;white-space:nowrap}
    .coin-filter-button.has-active-filters{border-color:#0066FF;background:#fff;color:#0066FF}
    .coin-filter-button.has-active-filters:hover{background:#F3F4F6;color:#0066FF}
    .coin-filter-count{position:absolute;right:-8px;top:-8px;min-width:16px;height:16px;padding:0 4px;border:1px solid #fff;border-radius:8px;background:#D9001B;color:#fff;font:600 11px/14px 'JetBrains Mono',monospace;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
    .coin-list-title{display:flex;align-items:baseline;gap:10px;min-width:0}
    .coin-list-count{font-size:12px;color:#6E7685;white-space:nowrap}
    .coin-cdkey-view{padding:24px}
    .coin-filter-drawer-overlay{align-items:stretch;justify-content:flex-end;padding:0;background:rgba(0,0,0,.3)}
    .coin-filter-drawer-panel{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;display:flex;flex-direction:column;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);animation:coin-drawer-in .22s ease;outline:none}
    .coin-filter-drawer-header{height:56px;flex:0 0 56px;padding:0 20px;border-bottom:1px solid #E8EAED;display:flex;align-items:center;justify-content:space-between}
    .coin-filter-drawer-body{flex:1;min-height:0;overflow-y:auto;padding:20px;background:#FFFFFF}
    .coin-filter-drawer-footer{height:64px;flex:0 0 64px;padding:0 20px;border-top:1px solid #E8EAED;display:flex;align-items:center;justify-content:flex-end;gap:12px;background:#fff}
    .coin-filter-flow{display:flex;flex-direction:column;flex-wrap:nowrap;gap:16px}
    .coin-filter-item{display:flex;flex:0 0 auto;flex-direction:column;align-items:stretch;gap:6px}
    .coin-filter-label{font-size:13px;line-height:18px;color:#3A3F4A;white-space:nowrap}
    .coin-filter-control{width:100%;flex:0 0 auto}
    .coin-date-row{display:flex;align-items:center;gap:4px}
    .coin-date-sep{flex:0 0 auto;color:#9DA2AC;font-size:14px}
    .coin-date-row .field{flex:1 1 0;min-width:0}
    .coin-date-time-control-wrap{position:relative;width:100%}
    .coin-date-time-trigger{position:relative;width:100%;height:32px;padding:0 36px 0 12px;border:1px solid #DFE1E5;border-radius:4px;display:flex;align-items:center;background:#fff;color:#9DA2AC;font:14px/1.5 inherit;text-align:left;cursor:pointer;outline:none}
    .coin-date-time-trigger:hover{background:#F3F4F6}
    .coin-date-time-trigger:focus-visible{border-color:#0066FF;box-shadow:0 0 0 2px #E6F0FF}
    .coin-date-time-trigger[aria-invalid="true"]{border-color:#D9001B;box-shadow:0 0 0 2px #FFE8EB}
    .coin-date-time-trigger-values{display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .coin-date-time-trigger-value{min-width:0;overflow:hidden;text-overflow:ellipsis}
    .coin-date-time-trigger-value.is-selected{color:#3A3F4A;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
    .coin-date-time-trigger-separator{flex:0 0 auto;margin:0 10px;color:#9DA2AC}
    .coin-date-time-trigger svg{position:absolute;right:10px;width:16px;height:16px;color:#9DA2AC}
    .coin-date-time-clear{position:absolute;right:30px;top:4px;z-index:1;width:24px;height:24px;padding:0;border:0;border-radius:4px;display:none;align-items:center;justify-content:center;background:transparent;color:#9DA2AC;cursor:pointer}
    .coin-date-time-clear:not(.hidden){display:inline-flex}
    .coin-date-time-clear:hover,.coin-date-time-clear:focus-visible{background:#F3F4F6;color:#3A3F4A;outline:none}
    .coin-date-time-clear svg{width:16px;height:16px}
    .coin-date-time-picker{position:fixed;z-index:10000;width:620px;max-width:calc(100vw - 32px);padding:16px;border:1px solid #DFE1E5;border-radius:8px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.12)}
    .coin-date-time-picker.hidden{display:none}
    .coin-date-time-months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .coin-date-time-month+.coin-date-time-month{padding-left:16px;border-left:1px solid #E8EAED}
    .coin-date-time-month-head{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;align-items:center;margin-bottom:8px}
    .coin-date-time-nav-group{display:flex;align-items:center;gap:2px}
    .coin-date-time-nav-spacer{width:58px;height:28px;display:block}
    .coin-date-time-nav{width:28px;height:28px;padding:0;border:0;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#6E7685;cursor:pointer}
    .coin-date-time-nav:hover,.coin-date-time-nav:focus-visible{background:#F3F4F6;color:#0066FF;outline:none}
    .coin-date-time-nav svg{width:16px;height:16px}
    .coin-date-time-month-title{margin:0;color:#3A3F4A;font-size:14px;font-weight:500;line-height:28px;text-align:center}
    .coin-date-time-week,.coin-date-time-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
    .coin-date-time-week{margin-bottom:4px;color:#9DA2AC;font-size:11px;text-align:center}
    .coin-date-time-day{height:28px;padding:0;border:0;border-radius:4px;background:#fff;color:#3A3F4A;font:12px 'JetBrains Mono',monospace;cursor:pointer}
    .coin-date-time-day:hover,.coin-date-time-day:focus-visible{background:#F3F4F6;color:#0066FF;outline:none}
    .coin-date-time-day.is-other{color:#C7CAD1}
    .coin-date-time-day.is-range{border-radius:0;background:#E6F0FF}
    .coin-date-time-day.is-start,.coin-date-time-day.is-end{border-radius:4px;background:#0066FF;color:#fff;font-weight:600}
    .coin-date-time-day.is-start:not(.is-end){border-radius:4px 0 0 4px}
    .coin-date-time-day.is-end:not(.is-start){border-radius:0 4px 4px 0}
    .coin-date-time-time-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid #E8EAED}
    .coin-date-time-time-field{display:flex;align-items:center;gap:8px;min-width:0;color:#3A3F4A;font-size:13px;white-space:nowrap}
    .coin-date-time-time-field select{min-width:0;flex:1;height:32px;padding:0 28px 0 10px;border:1px solid #DFE1E5;border-radius:4px;background:#fff;color:#3A3F4A;font:14px 'JetBrains Mono',monospace;outline:none}
    .coin-date-time-time-field select:focus{border-color:#0066FF;box-shadow:0 0 0 2px #E6F0FF}
    .coin-date-time-picker-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid #E8EAED}
    .coin-date-time-picker-value{min-width:0;overflow:hidden;color:#6E7685;font:12px/18px 'JetBrains Mono',monospace;text-overflow:ellipsis;white-space:nowrap}
    .coin-date-time-picker-actions{display:flex;flex:0 0 auto;gap:8px}
    .coin-date-error{margin:0;color:#D9001B;font-size:12px;line-height:18px}
    .coin-filter-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .coin-filter-row .coin-filter-item{gap:6px}
    .coin-filter-row .coin-filter-label{line-height:18px}
    .coin-tab-panel{padding-top:0}
    .coin-recharge-view{min-height:520px;display:flex;flex-direction:column;overflow:hidden}
    .coin-recharge-body{flex:1;min-height:0;padding:28px 30px 24px;overflow:auto}
    .coin-recharge-field + .coin-recharge-field{margin-top:24px}
    .coin-recharge-field-label{display:block;margin-bottom:12px;color:#1A1D24;font-size:16px;font-weight:600;line-height:24px}
    .coin-recharge-section-label{font-size:14px;line-height:20px}
    .coin-recharge-amount-options{display:grid;grid-template-columns:repeat(5,180px);gap:20px}
    .coin-recharge-amount-btn,.coin-recharge-custom-option{position:relative;width:180px;height:80px;padding:12px 16px;border:1px solid #F0F1F3;border-radius:6px;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;color:#0066FF;background:#F7F8FA;cursor:pointer;text-align:left}
    .coin-recharge-amount-btn:hover,.coin-recharge-custom-option:hover,.coin-recharge-amount-btn:focus-visible,.coin-recharge-custom-option:focus-within{border-color:#0066FF;background:#E6F0FF;outline:none}
    .coin-recharge-amount-btn.selected,.coin-recharge-custom-option.selected{border-color:#0066FF;background:#fff;box-shadow:inset 0 0 0 1px #0066FF}
    .coin-recharge-amount-check{position:absolute;top:-1px;right:-1px;width:22px;height:22px;border-radius:0 6px 0 6px;display:none;align-items:center;justify-content:center;color:#fff;background:#0066FF}
    .coin-recharge-amount-btn.selected .coin-recharge-amount-check,.coin-recharge-custom-option.selected .coin-recharge-amount-check{display:inline-flex}
    .coin-recharge-amount-check svg{width:12px;height:12px;stroke-width:3}
    .coin-recharge-amount-value{color:#0066FF;font:500 28px/34px 'JetBrains Mono',monospace;white-space:nowrap}
    .coin-recharge-custom-option .coin-recharge-custom-prefix{color:#0066FF;font:500 28px/34px 'JetBrains Mono',monospace}
    .coin-recharge-custom-input{display:flex;align-items:center;gap:2px}
    .coin-recharge-custom-option input{width:122px;height:34px;padding:0 4px;border:0;outline:none;color:#3A3F4A;background:transparent;font:500 28px/34px 'JetBrains Mono',monospace}
    .coin-recharge-custom-option input::placeholder{color:#9DA2AC}
    .coin-recharge-amount-gift,.coin-recharge-amount-total,.coin-recharge-custom-benefit{font-size:11px;line-height:15px;white-space:nowrap}
    .coin-recharge-amount-gift{color:#0066FF}
    .coin-recharge-amount-total,.coin-recharge-custom-benefit{color:#6E7685}

    .coin-recharge-info-list li{position:relative;padding-left:14px}
    .coin-recharge-info-list li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:#0066FF}
    .coin-recharge-control-row{display:grid;grid-template-columns:84px minmax(220px,326px);align-items:center;gap:12px}
    .coin-recharge-control-row .coin-recharge-field-label{margin:0;font-size:14px;font-weight:400;line-height:32px;text-align:right;white-space:nowrap}
    .coin-recharge-select{width:326px;max-width:100%}
    .coin-recharge-payment-options{display:flex;gap:10px}
    .coin-recharge-payment-btn{position:relative;flex:0 0 158px;height:40px;padding:0 12px;border:1px solid #DFE1E5;border-radius:4px;display:flex;align-items:center;justify-content:flex-start;gap:8px;color:#3A3F4A;background:#fff;cursor:pointer;font-size:14px}
    .coin-recharge-payment-btn:hover,.coin-recharge-payment-btn:focus-visible{border-color:#0066FF;outline:none}
    .coin-recharge-payment-btn.active,.coin-recharge-payment-btn.selected{border-color:#0066FF;color:#0066FF;background:#E6F0FF}
    .coin-recharge-payment-check{width:14px;height:14px;border:1px solid #DFE1E5;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:transparent;background:#fff;flex:0 0 14px}

    .coin-recharge-payment-icon{width:18px;height:18px;flex:0 0 18px;object-fit:contain}

    .coin-recharge-more-label{color:#3A3F4A;font-size:14px;line-height:32px;text-align:right;white-space:nowrap}
    .coin-recharge-more-methods{height:34px;padding:0 10px;border:1px solid #DFE1E5;border-radius:4px;display:inline-flex;align-items:center;gap:8px;color:#6E7685;background:#fff}

    .coin-recharge-more-link{color:#0066FF;font-size:14px;text-decoration:none}
    .coin-recharge-more-link:hover{text-decoration:underline;text-underline-offset:3px}
    .coin-recharge-footer{min-height:64px;padding:0 20px;border-top:1px solid #E8EAED;display:flex;align-items:center;justify-content:flex-start;gap:16px;background:#fff}

    .coin-recharge-support a{color:#0066FF;text-decoration:none}
    .coin-recharge-support a:hover{text-decoration:underline}

      function matchesFilters(item) {
        const start = txDateTimeBound(appliedTxFilters.startDate, appliedTxFilters.startTime, '00:00');
        const end = txDateTimeBound(appliedTxFilters.endDate, appliedTxFilters.endTime, '23:59');
        return (appliedTxFilters.type === '全部' || item.type === appliedTxFilters.type) &&
          (!appliedTxFilters.no || item.no.toLowerCase().includes(appliedTxFilters.no.toLowerCase())) &&
          (!appliedTxFilters.order || item.order.toLowerCase().includes(appliedTxFilters.order.toLowerCase())) &&
          (!start || item.time >= start) &&
          (!end || item.time <= end);
      }

      function updateFilterButton() {
        const count = Number(appliedTxFilters.type !== '全部') +
          Number(Boolean(appliedTxFilters.no)) +
          Number(Boolean(appliedTxFilters.order)) +
          Number(Boolean(appliedTxFilters.startDate || appliedTxFilters.endDate));
        txFilterCount.textContent = count;
        txFilterCount.classList.toggle('hidden', !count);
        txFilterBtn.classList.toggle('has-active-filters', count > 0);
        txFilterBtn.setAttribute('aria-label', count ? `筛选，已提交 ${count} 个条件` : '筛选云币流水');
      }

      function renderTx(resetPage = false) {
        const terms = tokenize(txSearch);
        filteredTransactions = transactions.filter(item => matchesSearch(item, terms) && matchesFilters(item));
        $('#txCount').textContent = `共 ${filteredTransactions.length} 条`;
        const savedPage = Number(state.txPage) || 1;
        const savedSize = Number(state.txPageSize) || 10;
        const currentPage = resetPage ? 1 : Math.min(savedPage, Math.max(1, Math.ceil(filteredTransactions.length / savedSize)));
        if (!txPager) {
          txPager = new YDPager(txPagerNode, {
            total_count: filteredTransactions.length,
            current_page: currentPage,
            page_size: savedSize,
            page_size_options: [10, 20, 50],
            onChange: pageState => {
              saveState({txPage: pageState.current_page, txPageSize: pageState.page_size});
              drawTxPage(pageState);
            },
            toast
          });
        } else {
          txPager.setState({total_count: filteredTransactions.length, current_page: currentPage}, {silent: true});
        }
        const pagerState = txPager.getState();
        saveState({
          txSearch,
          txType: appliedTxFilters.type,
          txNo: appliedTxFilters.no,
          txOrder: appliedTxFilters.order,
          txStartDate: appliedTxFilters.startDate,
          txEndDate: appliedTxFilters.endDate,
          txStartTime: appliedTxFilters.startTime,
          txEndTime: appliedTxFilters.endTime,
          txPage: pagerState.current_page,
          txPageSize: pagerState.page_size
        });
        drawTxPage(pagerState);
        updateFilterButton();
        renderAnno();
      }

      function txDateKey(date) {
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
      }

      function txDateObject(value) {
        if (!value) return null;
        const parts = value.split('-').map(Number);
        return parts.length === 3 ? new Date(parts[0], parts[1] - 1, parts[2]) : null;
      }

      function txDateTimeBound(date, time, fallback) {
        if (!date) return '';
        const value = time || fallback;
        return date + ' ' + value + (value === '23:59' ? ':59' : ':00');
      }

      function txDateTimeRangeInvalid(start, startTime, end, endTime) {
        return Boolean(start && end && txDateTimeBound(start, startTime, '00:00') > txDateTimeBound(end, endTime, '23:59'));
      }

      function txDateTimeDisplay(date, time, placeholder) {
        return date ? date + ' ' + time : placeholder;
      }

      function populateTxDateTimeOptions() {
        const options = [];
        for (let hour = 0; hour < 24; hour++) {
          [0, 30].forEach(minute => {
            const value = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
            options.push('<option value="' + value + '">' + value + '</option>');
          });
        }
        options.push('<option value="23:59">23:59</option>');
        const markup = options.join('');
        txDateTimeStartTime.innerHTML = markup;
        txDateTimeEndTime.innerHTML = markup;
      }

      function txDateTimeMonthHtml(year, month) {
        const first = new Date(year, month, 1);
        const offset = first.getDay();
        const cells = [];
        for (let index = 0; index < 42; index++) {
          const date = new Date(year, month, index - offset + 1);
          const key = txDateKey(date);
          const current = date.getMonth() === month;
          const start = txDateTimePickerState.draftStart;
          const end = txDateTimePickerState.draftEnd;
          const inRange = Boolean(start && end && key > start && key < end);
          const classes = 'coin-date-time-day ' + (!current ? 'is-other ' : '') + (inRange ? 'is-range ' : '') + (key === start ? 'is-start ' : '') + (key === end ? 'is-end ' : '');
          cells.push('<button data-filter-focusable type="button" class="' + classes + '" data-tx-date="' + key + '" aria-label="' + key + '">' + date.getDate() + '</button>');
        }
        return cells.join('');
      }

      function syncTxDateTimeTrigger() {
        const start = txFilterStartDate.value;
        const end = txFilterEndDate.value;
        const startTime = txFilterStartTime.value || '00:00';
        const endTime = txFilterEndTime.value || '23:59';
        txDateTimeStartDisplay.textContent = txDateTimeDisplay(start, startTime, '开始时间');
        txDateTimeEndDisplay.textContent = txDateTimeDisplay(end, endTime, '结束时间');
        txDateTimeStartDisplay.classList.toggle('is-selected', Boolean(start));
        txDateTimeEndDisplay.classList.toggle('is-selected', Boolean(end));
        txDateTimeClear.classList.toggle('hidden', !start && !end);
        txDateTimeTrigger.setAttribute('aria-label', start || end ? '交易日期时间范围：' + (txDateTimeDisplay(start, startTime, '未设置')) + ' 至 ' + (txDateTimeDisplay(end, endTime, '未设置')) : '选择交易日期时间范围');
      }

      function renderTxDateTimePicker() {
        const state = txDateTimePickerState;
        const left = new Date(state.view.getFullYear(), state.view.getMonth(), 1);
        const right = new Date(left.getFullYear(), left.getMonth() + 1, 1);
        const weeks = '<span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>';
        $('#txDateTimeMonth1').textContent = left.getFullYear() + ' 年 ' + (left.getMonth() + 1) + ' 月';
        $('#txDateTimeMonth2').textContent = right.getFullYear() + ' 年 ' + (right.getMonth() + 1) + ' 月';
        $('#txDateTimeWeeks1').innerHTML = weeks;
        $('#txDateTimeWeeks2').innerHTML = weeks;
        $('#txDateTimeGrid1').innerHTML = txDateTimeMonthHtml(left.getFullYear(), left.getMonth());
        $('#txDateTimeGrid2').innerHTML = txDateTimeMonthHtml(right.getFullYear(), right.getMonth());
        txDateTimeStartTime.value = state.draftStartTime;
        txDateTimeEndTime.value = state.draftEndTime;
        $('#txDateTimePickerValue').textContent = state.draftStart || state.draftEnd ? txDateTimeDisplay(state.draftStart, state.draftStartTime, '未设置') + ' 至 ' + txDateTimeDisplay(state.draftEnd, state.draftEndTime, '未设置') : '未选择';
        txFilterDateError.classList.toggle('hidden', !state.invalid);
        txDateTimeTrigger.toggleAttribute('aria-invalid', state.invalid);
      }

      function positionTxDateTimePicker() {
        if (txDateTimePicker.classList.contains('hidden')) return;
        const anchor = txDateTimeControlWrap.getBoundingClientRect();
        const picker = txDateTimePicker.getBoundingClientRect();
        const left = Math.max(16, Math.min(anchor.right - picker.width, innerWidth - picker.width - 16));
        let top = anchor.bottom + 8;
        if (top + picker.height > innerHeight - 16) top = Math.max(16, anchor.top - picker.height - 8);
        txDateTimePicker.style.left = left + 'px';
        txDateTimePicker.style.top = top + 'px';
      }

      function openTxDateTimePicker() {
        const state = txDateTimePickerState;
        const base = txDateObject(txFilterStartDate.value || txFilterEndDate.value) || new Date(2026, 7, 1);
        state.view = new Date(base.getFullYear(), base.getMonth(), 1);
        state.active = 'start';
        state.draftStart = txFilterStartDate.value;
        state.draftEnd = txFilterEndDate.value;
        state.draftStartTime = txFilterStartTime.value || '00:00';
        state.draftEndTime = txFilterEndTime.value || '23:59';
        state.invalid = false;
        txDateTimePicker.classList.remove('hidden');
        txDateTimeTrigger.setAttribute('aria-expanded', 'true');
        renderTxDateTimePicker();
        requestAnimationFrame(positionTxDateTimePicker);
      }

      function closeTxDateTimePicker(commit) {
        if (commit) {
          const state = txDateTimePickerState;
          state.invalid = txDateTimeRangeInvalid(state.draftStart, state.draftStartTime, state.draftEnd, state.draftEndTime);
          if (state.invalid) {
            renderTxDateTimePicker();
            return false;
          }
          txFilterStartDate.value = state.draftStart;
          txFilterEndDate.value = state.draftEnd;
          txFilterStartTime.value = state.draftStartTime;
          txFilterEndTime.value = state.draftEndTime;
          syncTxDateTimeTrigger();
        }
        txDateTimePicker.classList.add('hidden');
        txDateTimeTrigger.setAttribute('aria-expanded', 'false');
        txFilterDateError.classList.add('hidden');
        txDateTimeTrigger.removeAttribute('aria-invalid');
        return true;
      }

      function clearTxDateTimeDraft() {
        txDateTimePickerState.draftStart = '';
        txDateTimePickerState.draftEnd = '';
        txDateTimePickerState.draftStartTime = '00:00';
        txDateTimePickerState.draftEndTime = '23:59';
        txDateTimePickerState.active = 'start';
        txDateTimePickerState.invalid = false;
        renderTxDateTimePicker();
      }

      function openTxFilter() {
        drawerFocus = document.activeElement;
        previousBodyOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        $('#recordsView').inert = true;
        txFilterType.value = appliedTxFilters.type;
        txFilterNo.value = appliedTxFilters.no;
        txFilterOrder.value = appliedTxFilters.order;
        txFilterStartDate.value = appliedTxFilters.startDate;
        txFilterEndDate.value = appliedTxFilters.endDate;
        txFilterStartTime.value = appliedTxFilters.startTime || '00:00';
        txFilterEndTime.value = appliedTxFilters.endTime || '23:59';
        txFilterDateError.classList.add('hidden');
        txFilterStartDate.removeAttribute('aria-invalid');
        txFilterEndDate.removeAttribute('aria-invalid');
        syncTxDateTimeTrigger();
        txFilterDrawer.classList.remove('hidden');
        txFilterDrawer.setAttribute('aria-hidden', 'false');
        txFilterBtn.setAttribute('aria-expanded', 'true');
        setShellControlsVisible(false);
        requestAnimationFrame(() => { txFilterPanel.focus(); renderAnno(); });
      }

      function closeTxFilter(commit) {
        if (!txDateTimePicker.classList.contains('hidden')) closeTxDateTimePicker(false);
        if (!commit) txFilterDateError.classList.add('hidden');
        txFilterDrawer.classList.add('hidden');
        txFilterDrawer.setAttribute('aria-hidden', 'true');
        txFilterBtn.setAttribute('aria-expanded', 'false');
        $('#recordsView').inert = false;
        setShellControlsVisible(true);
        if (previousBodyOverflow !== null) {
          document.body.style.overflow = previousBodyOverflow;
          previousBodyOverflow = null;
        }
        drawerFocus?.focus?.();
        drawerFocus = null;
        renderAnno();
      }

      function submitTxFilter() {
        const next = {
          type: txFilterType.value,
          no: txFilterNo.value.trim(),
          order: txFilterOrder.value.trim(),
          startDate: txFilterStartDate.value,
          endDate: txFilterEndDate.value,
          startTime: txFilterStartTime.value || '00:00',
          endTime: txFilterEndTime.value || '23:59'
        };
        if (txDateTimeRangeInvalid(next.startDate, next.startTime, next.endDate, next.endTime)) {
          txFilterDateError.classList.remove('hidden');
          txFilterStartDate.setAttribute('aria-invalid', 'true');
          txFilterEndDate.setAttribute('aria-invalid', 'true');
          txDateTimeTrigger.setAttribute('aria-invalid', 'true');
          toast('开始时间不能晚于结束时间', 'warning');
          return;
        }
        txFilterDateError.classList.add('hidden');
        txFilterStartDate.removeAttribute('aria-invalid');
        txFilterEndDate.removeAttribute('aria-invalid');
        txDateTimeTrigger.removeAttribute('aria-invalid');
        appliedTxFilters = next;
        saveState({
          txType: next.type,
          txNo: next.no,
          txOrder: next.order,
          txStartDate: next.startDate,
          txEndDate: next.endDate,
          txStartTime: next.startTime,
          txEndTime: next.endTime,
          txPage: 1
        });
        closeTxFilter(true);
        renderTx(true);
      }

      function updateSearchClear() {
        txSearchClear.classList.toggle('hidden', !txSearchInput.value);
      }

      const annotations = {
        1: {title:'导出流水',desc:['导出当前搜索和筛选结果的全部 Mock 流水，格式为 CSV']},
        2: {title:'流水搜索框',desc:['关键词实时过滤完整结果集，并回到第一页']},
        3: {title:'流水筛选入口',desc:['打开右侧抽屉；取消不提交草稿，确认后应用条件']},
        4: {title:'云币交易流水',desc:['保留交易单号、订单号、类型、时间、项目、金额、账户金额和操作人']},
        5: {title:'提交筛选',desc:['日期范围校验通过后应用条件']}
      };
      let currentAnnotations = annotations;
      const annoToggle = $('#annoToggle');
      const annoLayer = $('#annoLayer');
      const annoPopup = $('#annoPopup');

      function renderAnno() {
        annoLayer.innerHTML = '';
        if (!annoVisible || !annoPopup.classList.contains('hidden')) return;
        document.querySelectorAll('[data-anno]').forEach(el => {
          if (el.offsetParent === null) return;
          const rect = el.getBoundingClientRect();
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'anno-badge';
          button.textContent = el.dataset.anno;
          button.style.left = (rect.right - 10) + 'px';
          button.style.top = (rect.top - 10) + 'px';
          button.setAttribute('aria-label', '查看标注 ' + el.dataset.anno);
          button.onclick = () => {
            const item = currentAnnotations[el.dataset.anno];
            if (!item) return;
            $('#annoTitle').textContent = el.dataset.anno + '. ' + item.title;
            $('#annoBody').innerHTML = '<ul class="list-disc pl-5 space-y-2">' + item.desc.map(text => '<li>' + text + '</li>').join('') + '</ul>';
            annoPopup.classList.remove('hidden');
            renderAnno();
            $('#annoClose').focus();
          };
          annoLayer.appendChild(button);
        });
      }

      function updateSearchFromInput(value) {
        txSearch = value;
        saveState({txSearch, txPage: 1});
        updateSearchClear();
        renderTx(true);
      }

      txSearchInput.addEventListener('input', event => updateSearchFromInput(event.target.value));
      txSearchInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          renderTx(true);
        }
      });
      txSearchSubmit.addEventListener('click', () => renderTx(true));
      txSearchClear.addEventListener('click', () => { txSearchInput.value = ''; updateSearchFromInput(''); txSearchInput.focus(); });
      txFilterBtn.addEventListener('click', openTxFilter);
      $('#txFilterClose').addEventListener('click', () => closeTxFilter(false));
      $('#txFilterCancel').addEventListener('click', () => closeTxFilter(false));
      $('#txFilterSubmit').addEventListener('click', submitTxFilter);
      txFilterDrawer.addEventListener('click', event => { if (event.target === txFilterDrawer) closeTxFilter(false); });
      txDateTimeTrigger.addEventListener('click', openTxDateTimePicker);
      txDateTimeClear.addEventListener('click', () => {
        txFilterStartDate.value = '';
        txFilterEndDate.value = '';
        txFilterStartTime.value = '00:00';
        txFilterEndTime.value = '23:59';
        syncTxDateTimeTrigger();
      });
      txDateTimePicker.addEventListener('click', event => {
        event.stopPropagation();
        const nav = event.target.closest('[data-tx-date-nav]');
        const day = event.target.closest('[data-tx-date]');
        if (nav) {
          const direction = nav.dataset.txDateNav;
          const view = txDateTimePickerState.view;
          const yearDelta = direction === 'prev-year' ? -1 : direction === 'next-year' ? 1 : 0;
          const monthDelta = direction === 'prev-month' ? -1 : direction === 'next-month' ? 1 : 0;
          txDateTimePickerState.view = yearDelta ? new Date(view.getFullYear() + yearDelta, view.getMonth(), 1) : new Date(view.getFullYear(), view.getMonth() + monthDelta, 1);
          renderTxDateTimePicker();
          return;
        }
        if (day) {
          const key = day.dataset.txDate;
          const pickerState = txDateTimePickerState;
          if (pickerState.active === 'start') {
            pickerState.draftStart = key;
            if (pickerState.draftEnd && txDateTimeBound(pickerState.draftEnd, pickerState.draftEndTime, '23:59') < txDateTimeBound(key, pickerState.draftStartTime, '00:00')) pickerState.draftEnd = '';
            pickerState.active = 'end';
          } else if (!pickerState.draftStart) {
            pickerState.draftStart = key;
            pickerState.active = 'end';
          } else {
            pickerState.draftEnd = key;
          }
          pickerState.invalid = txDateTimeRangeInvalid(pickerState.draftStart, pickerState.draftStartTime, pickerState.draftEnd, pickerState.draftEndTime);
          renderTxDateTimePicker();
        }
      });
      txDateTimeStartTime.addEventListener('change', event => {
        txDateTimePickerState.draftStartTime = event.target.value;
        txDateTimePickerState.invalid = txDateTimeRangeInvalid(txDateTimePickerState.draftStart, txDateTimePickerState.draftStartTime, txDateTimePickerState.draftEnd, txDateTimePickerState.draftEndTime);
        renderTxDateTimePicker();
      });
      txDateTimeEndTime.addEventListener('change', event => {
        txDateTimePickerState.draftEndTime = event.target.value;
        txDateTimePickerState.invalid = txDateTimeRangeInvalid(txDateTimePickerState.draftStart, txDateTimePickerState.draftStartTime, txDateTimePickerState.draftEnd, txDateTimePickerState.draftEndTime);
        renderTxDateTimePicker();
      });
      $('#txDateTimePickerClear').addEventListener('click', clearTxDateTimeDraft);
      $('#txDateTimePickerCancel').addEventListener('click', () => closeTxDateTimePicker(false));
      $('#txDateTimePickerConfirm').addEventListener('click', () => closeTxDateTimePicker(true));
      document.addEventListener('click', event => {
        if (!txDateTimePicker.classList.contains('hidden') && !txDateTimeControlWrap.contains(event.target) && !txDateTimePicker.contains(event.target)) closeTxDateTimePicker(false);
      });
      window.addEventListener('resize', positionTxDateTimePicker);
      document.addEventListener('keydown', event => {
        if (!txDateTimePicker.classList.contains('hidden') && event.key === 'Escape') {
          event.preventDefault();
          closeTxDateTimePicker(false);
          txDateTimeTrigger.focus();
          return;
        }
        if (!txFilterDrawer.classList.contains('hidden')) {
          if (event.key === 'Escape') {
            event.preventDefault();
            closeTxFilter(false);
            return;
          }
          if (event.key === 'Tab') {
            const focusable = $$('[data-filter-focusable]').filter(element => !element.disabled && element.offsetParent !== null);
            if (!focusable.length) {
              event.preventDefault();
              txFilterPanel.focus();
              return;
            }
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && (document.activeElement === first || document.activeElement === txFilterPanel)) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          }
          return;
        }
      });

      annoToggle.addEventListener('click', () => {
        annoVisible = !annoVisible;
        annoToggle.setAttribute('aria-pressed', String(annoVisible));
        annoToggle.querySelector('span').textContent = annoVisible ? '隐藏标注' : '显示标注';
        renderAnno();
      });
      $('#annoClose').addEventListener('click', () => { annoPopup.classList.add('hidden'); renderAnno(); });
      annoPopup.addEventListener('click', event => { if (event.target === annoPopup) { annoPopup.classList.add('hidden'); renderAnno(); } });
      window.addEventListener('resize', renderAnno);
      $('#mainContent').addEventListener('scroll', renderAnno);

      // Export the complete filtered result, independent of the current page.
      $('#exportTransactions').addEventListener('click', () => {
        if (!filteredTransactions.length) { toast('暂无可导出的流水', 'warning'); return; }
        const rows = [['交易单号','订单号','交易类型','交易时间','项目','金额','账户金额','操作人'], ...filteredTransactions.map(item => [item.no,item.order,item.type,item.time,item.project,item.amount.toFixed(2),item.balance.toFixed(2),item.user])];
        const csv = rows.map(row => row.map(value => '"' + String(value).replace(/"/g, '""') + '"').join(',')).join('\r\n');
        const url = URL.createObjectURL(new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'}));
        const link = document.createElement('a');
        link.href = url; link.download = '云币交易流水.csv';
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('已导出 ' + filteredTransactions.length + ' 条流水', 'success');
      });
      renderTx(false);
      lucide.createIcons();
      renderAnno();
    })();
  </script>
</body>
</html>
