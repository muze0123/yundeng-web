const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let tab='market',func='热门推荐',biz='全部',modalKey='',annoVisible=false;const funcs=['热门推荐','选品专区','运营工具','店铺运营','推广营销','达人邀约','其他工具'];const bizs=['全部','亚马逊','速卖通','eBay','Etsy','Shopee','Shopify','Lazada','Yahoo'];let plugins=[['Google Translator Assistant','Google 翻译','浏览网页时可轻松查看翻译版本。由 Google 翻译小组提供。','5052万','谷歌','云登商店',true,1],['Cookie Editor','Cookie-Editor','编辑、导入和导出浏览器 Cookie，适合测试与运营排查。','1132万','谷歌','云登商店',false,0],['沉浸式翻译','沉浸式网页双语翻译扩展，支持多个翻译服务。','免费使用，支持 Deepl、Google、有道、腾讯翻译等。','1396万','谷歌','三方应用商店',false,0],['Find Selector','元素选择器','快速定位页面元素名称、属性、ID、CLASS 和结构层级。','1022万','谷歌','云登商店',true,1],['腾讯翻译','腾讯翻译','支持划词翻译、网页翻译、双语对照等功能。','1035万','谷歌','三方应用商店',false,0],['火山翻译','火山翻译-划词和网页翻译','划词翻译、英语辞典、例句和生词本。','1171万','火狐','云登商店',false,0]].map((x,i)=>({id:i+1,name:x[0],sub:x[1],desc:x[2],downloads:x[3],kernel:x[4],source:x[5],added:x[6],envs:x[7],group:'未分组',global:i===0,teamVisible:i%2===0,version:i===0?'v2.0.17（2026-08-03 14:46:48）':'v1.0.1（2026-07-30 21:15:16）'}));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(e.timer);e.timer=setTimeout(()=>e.classList.add('hidden'),1800)}function switchTab(v){tab=v;$$('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===v));$('#marketFilters').classList.toggle('hidden',v!=='market');$$('.owned-filter').forEach(x=>x.classList.toggle('hidden',v==='market'));$('#createGroupBtn').classList.toggle('hidden',v==='market');$('#createGroupBtn span').textContent=v==='team'?'创建团队分组':'创建我的分组';$('#listTitle').textContent={market:'插件市场',mine:'我的插件',team:'团队插件'}[v];render()}
function renderCats(){ $('#funcCats').innerHTML=funcs.map(x=>`<button class="chip ${x===func?'active':''}" data-func="${x}">${x}</button>`).join('');$('#bizCats').innerHTML=bizs.map(x=>`<button class="chip ${x===biz?'active':''}" data-biz="${x}">${x}</button>`).join('')}
function visible(){const q=$('#searchInput').value.trim().toLowerCase(),k=$('#kernelFilter').value,g=$('#globalFilter').value,a=$('#assignFilter').value;return plugins.filter(p=>(tab==='market'||p.added)&&(k==='全部内核'||p.kernel===k)&&(!q||(p.name+p.sub+p.desc).toLowerCase().includes(q))&&(tab==='market'||g==='是否开启全局'||(g==='开启全局')===p.global)&&(tab==='market'||a==='是否分配环境'||(a==='已分配环境')===(p.envs>0)))}
function render(){renderCats();const rows=visible();$('#pluginList').innerHTML=rows.map(p=>`<article class="plugin-card"><div class="flex justify-between gap-3"><div><h3 class="font-semibold text-ink-title">${p.name}</h3><p class="text-ink-sub mt-1">${p.sub}</p></div><span class="badge text-primary border-primary bg-primary-bg">${p.kernel}</span></div><p class="mt-3 text-ink-sub leading-6">${p.desc}</p><div class="mt-3 text-[12px] text-ink-sub">${tab==='market'?`<span class="mono">${p.downloads}</span> 下载`: `来源：${p.source}　添加人：1938<br>${p.version}`}</div><div class="mt-4 flex flex-wrap gap-2">${tab==='market'?marketActions(p):ownedActions(p)}</div></article>`).join('');$('#emptyState').classList.toggle('hidden',rows.length>0);lucide.createIcons();renderAnno()}
function marketActions(p){return p.added?`<button class="btn btn-default" data-assign="${p.id}">分配环境</button>`:`<button data-anno="5" class="btn btn-primary" data-add="${p.id}">添加</button>`}function ownedActions(p){return `<button data-anno="6" class="btn btn-default" data-assign="${p.id}">分配环境</button><button data-anno="7" data-global="${p.id}" class="btn btn-default">${p.global?'关闭全局':'开启全局'}</button><button data-anno="9" data-delete="${p.id}" class="btn btn-default text-danger">删除</button>`}
function openModal(title,body,confirm='确定',key='generic'){modalKey=key;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalConfirm').textContent=confirm;$('#modal').classList.remove('hidden');lucide.createIcons();renderAnno()}function closeModal(){$('#modal').classList.add('hidden');renderAnno()}$$('[data-close]').forEach(x=>x.onclick=closeModal);$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
function uploadBody(){return `<div class="space-y-4"><label class="block"><span>Chrome/Firefox 插件 URL</span><input id="requiredField" class="field w-full mt-1" placeholder="请输入 Chrome 商店或 Firefox 应用商店插件 URL"></label><div class="p-3 rounded bg-warning-bg text-warning">此上传类型需使用非中国大陆网络。应用由第三方提供，最终解释权归第三方所有。</div><div class="border border-line rounded p-4"><b>上传应用</b><p class="mt-2 text-ink-sub leading-7">Chrome：crx、zip 格式，限制 50M。Firefox：xpi 格式，限制 50M。若同时上传谷歌和火狐插件，请将 crx 与 xpi 置于同一文件夹打包成 zip。</p><button class="btn btn-default mt-3">选择安装包</button></div></div>`}
function authBody(p){return `<p class="mb-4">您同意 <b>${p.name}</b> 获取以下权限</p><label class="flex gap-2 mb-3"><input id="agreeUser" type="checkbox">我已阅读并同意《用户授权协议》</label><label class="flex gap-2 mb-3"><input id="agreePrivacy" type="checkbox">我已阅读并同意 ${p.name}《隐私协议》</label><label class="flex gap-2"><input id="toTeam" type="checkbox">收录入团队插件</label>`}
function assignBody(){return `<div class="grid grid-cols-[220px_1fr] gap-4"><div class="border border-line rounded p-3 space-y-2"><label class="flex gap-2"><input type="checkbox">工作台</label><label class="flex gap-2"><input type="checkbox" checked>默认分组</label><label class="flex gap-2"><input type="checkbox">转移分组</label><label class="flex gap-2"><input type="checkbox">007</label></div><div><p class="mb-3 text-ink-sub">请选择需要分配的环境</p>${['RPA测试','云登浏览器_1','指纹测试','test'].map(x=>`<label class="block border border-line rounded p-2 mb-2"><input type="checkbox" data-env> ${x}</label>`).join('')}</div></div><p class="mt-4 text-ink-sub">已选择环境后，点击确定分配。原型不安装真实插件。</p>`}
document.addEventListener('click',e=>{if(e.target.dataset.tab)switchTab(e.target.dataset.tab);if(e.target.dataset.func){func=e.target.dataset.func;render()}if(e.target.dataset.biz){biz=e.target.dataset.biz;render()}if(e.target.dataset.add){const p=plugins.find(x=>x.id==e.target.dataset.add);openModal('插件授权',authBody(p),'确定','add:'+p.id)}if(e.target.dataset.assign){openModal('分配环境',assignBody(),'确定分配','assign:'+e.target.dataset.assign)}if(e.target.dataset.global){const p=plugins.find(x=>x.id==e.target.dataset.global);openModal(p.global?'关闭全局':'开启全局',`<p>${p.global?'关闭后，该插件不再默认加载到我可操作的环境。':'设置后，我可操作的环境将均加载该插件。'}</p>`,'确定','global:'+p.id)}if(e.target.dataset.delete){const p=plugins.find(x=>x.id==e.target.dataset.delete);openModal('删除插件',`<p>确认删除插件 <b>${p.name}</b> 吗？</p>`,'确定','delete:'+p.id)}})
$('#uploadBtn').onclick=()=>openModal('上传插件',uploadBody(),'确定','upload');$('#createGroupBtn').onclick=()=>openModal(tab==='team'?'创建团队分组':'创建我的分组','<label class="block mb-3">名称<input id="requiredField" class="field w-full mt-1" placeholder="请输入名称"></label><label class="block mb-3">备注<textarea class="field w-full h-20 py-2 mt-1" maxlength="30" placeholder="请输入备注信息"></textarea></label><div class="border border-line rounded p-3"><b>所有插件</b><div class="mt-2 space-y-2">'+plugins.filter(p=>p.added).map(p=>`<label class="block"><input type="checkbox"> ${p.name}</label>`).join('')+'</div></div>','确定','group');$('#queryBtn').onclick=render;$('#resetBtn').onclick=()=>{$('#searchInput').value='';$('#kernelFilter').value='全部内核';$('#globalFilter').value='是否开启全局';$('#assignFilter').value='是否分配环境';render()};
$('#modalConfirm').onclick=()=>{if(modalKey.startsWith('add:')){if(!$('#agreeUser').checked||!$('#agreePrivacy').checked)return toast('请先同意授权协议和隐私协议');const p=plugins.find(x=>x.id==modalKey.split(':')[1]);p.added=true;p.teamVisible=$('#toTeam').checked;closeModal();render();return toast('插件已添加为演示数据')}if(modalKey.startsWith('assign:')){const p=plugins.find(x=>x.id==modalKey.split(':')[1]);p.envs=$$('[data-env]:checked').length;closeModal();render();return toast('环境分配已更新')}if(modalKey.startsWith('global:')){const p=plugins.find(x=>x.id==modalKey.split(':')[1]);p.global=!p.global;closeModal();render();return toast('全局状态已更新')}if(modalKey.startsWith('delete:')){const id=+modalKey.split(':')[1];plugins=plugins.filter(p=>p.id!==id);closeModal();render();return toast('插件已从演示列表删除')}if(['upload','group'].includes(modalKey)){const f=$('#requiredField');if(f&&!f.value.trim()){f.classList.add('invalid');return toast('请填写必填项')}}closeModal();toast('演示操作已完成')};
const annotations={1:{title:'上传插件',desc:['支持 URL 与安装包说明','原型不上传真实文件']},2:{title:'市场分类',desc:['按功能分类与电商分类筛选插件']},3:{title:'插件搜索',desc:['搜索名称、简介或副标题']},4:{title:'插件列表',desc:['市场、我的插件、团队插件共用数据卡片']},5:{title:'添加插件',desc:['添加前必须确认授权协议和隐私协议']},6:{title:'分配环境',desc:['选择环境后更新演示分配状态']},7:{title:'开启全局',desc:['影响可操作环境，需二次确认']},8:{title:'创建分组',desc:['我的分组和团队分组均需名称']},9:{title:'删除插件',desc:['删除前二次确认，不影响真实插件']},10:{title:'业务弹窗',desc:['上传、授权、分配、分组和删除均为无副作用演示']}};function renderAnno(){const layer=$('#annoLayer');layer.innerHTML='';if(!annoVisible)return;const scope=$('#modal').classList.contains('hidden')?document:$('#modalCard');scope.querySelectorAll('[data-anno]').forEach(el=>{if(el.offsetParent===null)return;const r=el.getBoundingClientRect(),b=document.createElement('button');b.className='anno-badge';b.textContent=el.dataset.anno;b.style.left=r.right-10+'px';b.style.top=r.top-10+'px';b.onclick=()=>toast(annotations[el.dataset.anno].title+'：'+annotations[el.dataset.anno].desc.join('；'));layer.appendChild(b)})}$('#annoToggle').onclick=()=>{annoVisible=!annoVisible;$('#annoToggle span').textContent=annoVisible?'隐藏标注':'显示标注';renderAnno()};$('#mainContent').onscroll=renderAnno;window.onresize=renderAnno;render();lucide.createIcons();
