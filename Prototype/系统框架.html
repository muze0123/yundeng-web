    .module-global-drawer-info { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 24px; }
    .module-global-drawer-field { min-width:0; display:grid; grid-template-columns:96px minmax(0,1fr); gap:10px; align-items:start; }
    .module-global-drawer-field dt { color:#6E7685; font-size:12px; text-align:right; white-space:nowrap; }
    .module-global-drawer-field dt::after { content:'：'; }
    .module-global-drawer-field dd { min-width:0; margin:0; overflow-wrap:anywhere; color:#3A3F4A; }

    .module-global-drawer-table th { padding:9px 10px; border-bottom:1px solid #DFE1E5; color:#6E7685; background:#F0F1F3; font-weight:500; text-align:left; white-space:nowrap; }

      16:{ title:'语言切换', desc:['触发：鼠标移入或键盘聚焦语言图标时显示名称气泡，点击后打开语言浮层。','响应：选择语言后更新当前会话并显示全局提示。','规则：鼠标离开图标且未进入语言浮层时延迟关闭；原型不加载真实国际化资源。'] },

    const $ = id => document.getElementById(id);
    function restoreFocus(target, fallback) { const next = target?.isConnected ? target : fallback; next?.focus?.(); }
    function dialogFocusable(panel) { return Array.from(panel.querySelectorAll('button:not(:disabled), a[href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])')).filter(element => element.getClientRects().length); }
    function trapDialogFocus(event, panel) { if (event.key !== 'Tab') return; const focusable = dialogFocusable(panel); if (!focusable.length) { event.preventDefault(); panel.focus(); return; } const first = focusable[0], last = focusable[focusable.length - 1]; if (document.activeElement === panel || !panel.contains(document.activeElement)) { event.preventDefault(); (event.shiftKey ? last : first).focus(); } else if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); } else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); } }
    function getLeaf(id) { for (const item of navItems) { if (item.id === id) return item; if (item.children) { const child = item.children.find(x => x.id === id); if (child) return child; } } return navItems[0]; }

      lucide.createIcons();

    function renderRoute() {

    function toast(message, kind='info') { const color={info:'bg-info',success:'bg-success',warning:'bg-warning',danger:'bg-danger'}[kind]; const el=document.createElement('div'); el.className=`toast ${color} text-white px-4 py-2 rounded shadow-[0_2px_8px_rgba(0,0,0,.12)] text-[13px]`; el.textContent=message; $('toastContainer').append(el); setTimeout(()=>el.remove(),2800); }
    function openCreateDialog() { createReturnFocus = document.activeElement; $('createDialog').classList.remove('hidden'); pushAnnoScope($('createPanel')); requestAnimationFrame(() => $('createPanel').focus()); }
    function closeCreateDialog(shouldRestoreFocus = true) { if ($('createDialog').classList.contains('hidden')) return; $('createDialog').classList.add('hidden'); popAnnoScope($('createPanel')); if (shouldRestoreFocus) restoreFocus(createReturnFocus, document.querySelector('.yundeng-create') || $('createBrowserBtn') || $('mainContent')); }
    function openAssistant() { assistantReturnFocus = document.activeElement; $('assistantDrawer').classList.remove('hidden'); pushAnnoScope($('assistantPanel')); requestAnimationFrame(() => $('assistantInput').focus()); }
    function closeDrawer() { if ($('assistantDrawer').classList.contains('hidden')) return; $('assistantDrawer').classList.add('hidden'); popAnnoScope($('assistantPanel')); restoreFocus(assistantReturnFocus, $('assistantBtn')); }
    let moduleGlobalDrawerId = '', moduleGlobalDrawerSource = null, moduleGlobalDrawerOverflow = '';
    function moduleDrawerText(value, maxLength = 200) { return String(value == null || value === '' ? '—' : value).slice(0, maxLength); }
    function appendModuleDrawerValue(parent, rawValue, column = {}) {
      const spec = rawValue && typeof rawValue === 'object' && !Array.isArray(rawValue) ? rawValue : { value: rawValue };
      const value = document.createElement('span');
      value.className = 'module-global-drawer-value';
      value.textContent = moduleDrawerText(spec.value);
      if (spec.mono === true || column.mono === true) value.dataset.mono = 'true';
      if (['success','warning','danger','muted'].includes(spec.tone)) value.dataset.tone = spec.tone;
      parent.append(value);
    }
    function renderModuleGlobalDrawerSection(section, tableIndex) {
      if (!section || !['description-list','table'].includes(section.type)) return null;
      const container = document.createElement('section');
      container.className = 'module-global-drawer-section';
      const heading = document.createElement('h3');
      heading.textContent = moduleDrawerText(section.title || '详情', 40);
      if (section.type === 'table' && tableIndex === 0) heading.dataset.anno = '23';
      container.append(heading);
      if (section.type === 'description-list') {
        const list = document.createElement('dl');
        list.className = 'module-global-drawer-info';
        (Array.isArray(section.items) ? section.items.slice(0, 24) : []).forEach(item => {
          if (!item || typeof item !== 'object') return;
          const field = document.createElement('div');
          field.className = 'module-global-drawer-field';
          const label = document.createElement('dt');
          label.textContent = moduleDrawerText(item.label, 30);
          const value = document.createElement('dd');
          appendModuleDrawerValue(value, item);
          field.append(label, value);
          list.append(field);
        });
        container.append(list);
        return container;
      }
      const columns = (Array.isArray(section.columns) ? section.columns : []).slice(0, 15).filter(column => column && typeof column === 'object');
      const rows = (Array.isArray(section.rows) ? section.rows : []).slice(0, 50);
      const wrap = document.createElement('div');
      wrap.className = 'module-global-drawer-table-wrap';
      const table = document.createElement('table');
      table.className = 'module-global-drawer-table';
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      columns.forEach(column => { const th = document.createElement('th'); th.textContent = moduleDrawerText(column.label, 30); headerRow.append(th); });
      thead.append(headerRow);
      const tbody = document.createElement('tbody');
      rows.forEach(row => {
        const tr = document.createElement('tr');
        columns.forEach((column, index) => {
          const td = document.createElement('td');
          const rawValue = Array.isArray(row) ? row[index] : row?.[column.key];
          appendModuleDrawerValue(td, rawValue, column);
          tr.append(td);
        });
        tbody.append(tr);
      });
      table.append(thead, tbody);
      wrap.append(table);
      container.append(wrap);
      return container;
    }
    function syncModuleGlobalDrawerLayout() {
      const overlay = $('moduleGlobalDrawer'), panel = $('moduleGlobalDrawerPanel');
      if (!overlay || !panel || overlay.classList.contains('hidden')) return;
      const browserBottom = Math.max(0, Math.round(document.getElementById('yundeng-browser-frame')?.getBoundingClientRect().bottom || 0));
      const contentTop = Math.max(browserBottom, Math.round($('mainContent')?.getBoundingClientRect().top || browserBottom));
      overlay.style.top = browserBottom + 'px';
      panel.style.marginTop = Math.max(0, contentTop - browserBottom) + 'px';
      panel.style.height = Math.max(240, window.innerHeight - contentTop) + 'px';
    }
    function openModuleGlobalDrawer(payload, source) {
      if (!payload || typeof payload !== 'object' || payload.id !== 'billing-order-detail') return;
      const overlay = $('moduleGlobalDrawer'), panel = $('moduleGlobalDrawerPanel'), body = $('moduleGlobalDrawerBody');
      if (!overlay || !panel || !body) return;
      moduleGlobalDrawerId = payload.id;
      moduleGlobalDrawerSource = source;
      $('moduleGlobalDrawerTitle').textContent = moduleDrawerText(payload.title || '详情', 40);
      $('moduleGlobalDrawerClose').setAttribute('aria-label', '关闭' + moduleDrawerText(payload.title || '详情', 40));
      body.replaceChildren();
      let tableIndex = 0;
      (Array.isArray(payload.sections) ? payload.sections.slice(0, 6) : []).forEach(section => {
        const rendered = renderModuleGlobalDrawerSection(section, tableIndex);
        if (!rendered) return;
        if (section.type === 'table') tableIndex += 1;
        body.append(rendered);
      });
      const width = Math.max(480, Math.min(1000, Number(payload.width) || 800));
      panel.style.width = width + 'px';
      closeOverlays();
      moduleGlobalDrawerOverflow = document.documentElement.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      overlay.classList.remove('hidden');
      overlay.setAttribute('aria-hidden', 'false');
      syncModuleGlobalDrawerLayout();
      pushAnnoScope(panel);
      requestAnimationFrame(() => $('moduleGlobalDrawerClose').focus({ preventScroll:true }));
      lucide.createIcons();
    }
    function closeModuleGlobalDrawer(notifyModule = true) {
      const overlay = $('moduleGlobalDrawer'), panel = $('moduleGlobalDrawerPanel');
      if (!overlay || overlay.classList.contains('hidden')) return;
      overlay.classList.add('hidden');
      overlay.setAttribute('aria-hidden', 'true');
      document.documentElement.style.overflow = moduleGlobalDrawerOverflow;
      popAnnoScope(panel);
      const source = moduleGlobalDrawerSource, drawerId = moduleGlobalDrawerId;
      moduleGlobalDrawerSource = null;
      moduleGlobalDrawerId = '';
      if (notifyModule) source?.postMessage({ type:'yundeng:global-drawer-closed', id:drawerId }, '*');
    }
    function pushAnnoScope(el) { const index=annoScopeStack.indexOf(el); if(index>=0) annoScopeStack.splice(index,1); annoScopeStack.push(el); renderAnnoBadges(); }
    function popAnnoScope(el) { const index=annoScopeStack.indexOf(el); if(index>=0) annoScopeStack.splice(index,1); renderAnnoBadges(); }
    function resolveAnnoTarget(el) { const rect=el.getBoundingClientRect(); return (rect.width>800 || rect.width>window.innerWidth*.7) ? el.querySelector('h1,h2,h3,button,input') || el : el; }
    function renderAnnoBadges() { const layer=$('annoLayer'); layer.innerHTML=''; if(!annoVisible) return; const root=annoScopeStack.at(-1) || document; root.querySelectorAll('[data-anno]').forEach(el=>{ const target=resolveAnnoTarget(el), rect=target.getBoundingClientRect(); if(rect.width===0||rect.height===0) return; const badge=document.createElement('button'); badge.className='anno-badge'; badge.dataset.annoBadge=el.dataset.anno; badge.textContent=el.dataset.anno; badge.style.top=(rect.top-10)+'px'; badge.style.left=(rect.right-10)+'px'; badge.setAttribute('aria-label','查看交互说明 '+el.dataset.anno); badge.setAttribute('aria-haspopup','dialog'); badge.setAttribute('aria-controls','annoPanel'); badge.onclick=()=>showAnnoPopup(el.dataset.anno,badge); layer.append(badge); }); }
    function showAnnoPopup(id, trigger) { const item=annotations[id]; if(!item) return; annoReturnFocus=trigger||document.activeElement; annoReturnId=String(id); $('annoTitle').textContent=`${id}. ${item.title}`; $('annoDesc').innerHTML='<ul class="list-disc pl-5 space-y-2">'+item.desc.map(x=>`<li>${x}</li>`).join('')+'</ul>'; $('annoPopup').classList.remove('hidden'); requestAnimationFrame(()=>$('annoPanel').focus()); }
    function closeAnnoPopup(shouldRestoreFocus = true) { if ($('annoPopup').classList.contains('hidden')) return; $('annoPopup').classList.add('hidden'); if (shouldRestoreFocus) restoreFocus(annoReturnFocus, $('annoLayer').querySelector(`[data-anno-badge="${annoReturnId}"]`) || $('annoToggle')); }

    // 交互绑定
    document.addEventListener('click', event => {
      const routeBtn=event.target.closest('[data-route]'), groupBtn=event.target.closest('[data-group]'), globalBtn=event.target.closest('[data-global]'), closeBtn=event.target.closest('[data-close]'), recoverBtn=event.target.closest('[data-recover]');
      if(routeBtn){ syncGroupsForRoute(routeBtn.dataset.route); if(routeBtn.dataset.href){ location.href=routeBtn.dataset.href; return; } currentRoute=routeBtn.dataset.route; renderNav(); renderRoute(); }
      if(groupBtn){ const group=navItems.find(x=>x.id===groupBtn.dataset.group); group.expanded=!group.expanded; renderNav(); renderAnnoBadges(); }
      if(closeBtn){ const id=closeBtn.dataset.close; if(id==='assistantDrawer') closeDrawer(); else if(id==='createDialog') closeCreateDialog(); else $(id).classList.add('hidden'); }
      if(recoverBtn){ if(recoverBtn.dataset.recover==='retry'){ getLeaf(currentRoute).state='loading'; renderRoute(); setTimeout(()=>{getLeaf(currentRoute).state='ready';renderRoute();toast('模块已重新加载','success');},900); } else if(recoverBtn.dataset.recover==='environment'){currentRoute='environment';renderNav();renderRoute();} else toast('已向团队管理员提交权限申请','success'); }
      if(globalBtn){ const action=globalBtn.dataset.global; if(action==='help') location.href='系统框架.html?page=help'; else if(action==='settings'||action==='details'||action==='notice-center') toast(action==='details'?'框架事件契约已保留给业务模块接入':'该入口将在对应业务页面实现','info'); }
    });
    $('createBrowserBtn').onclick=openCreateDialog;
    $('handoffCreate').onclick=()=>{ closeCreateDialog(false); location.href='新建浏览器.html'; };
    $('collapseBtn').onclick=()=>{ sidebarCompact=!sidebarCompact; $('sidebar').classList.toggle('compact',sidebarCompact); const button=$('collapseBtn'); button.title=sidebarCompact?'展开侧栏':'收起侧栏'; button.setAttribute('aria-label',button.title); button.innerHTML='<i data-lucide="triangle" class="yundeng-solid-arrow"></i>'; lucide.createIcons(); renderAnnoBadges(); };
    $('mobileMenu').onclick=()=>{ $('sidebar').classList.toggle('compact'); };
    $('noticeBtn').onclick=()=>openPopover('noticePopover');
    $('languageBtn').onclick=()=>openPopover('languagePopover');
    $('helpBtn').onclick=()=>window.openYundengOnboarding?.();
    $('accountBtn').onclick=()=>openPopover('accountPopover');
    $('assistantBtn').onclick=openAssistant;
    $('readAll').onclick=()=>{ notices.forEach(n=>n.unread=false); renderNotices(); toast('全部通知已标记为已读','success'); };
    $('languagePopover').innerHTML=['简体中文','English','日本語'].map(l=>`<button data-language="${l}" class="w-full text-left px-3 py-2 rounded hover:bg-hover ${l===session.language?'text-primary font-medium':'text-ink-body'}">${l}</button>`).join('');
    $('helpPopover').innerHTML='';
    $('accountPopover').innerHTML='<div class="px-3 py-2 text-[12px] text-ink-sub border-b border-line-lighter">团队管理员</div><button class="w-full text-left px-3 py-2 rounded hover:bg-hover">账号信息</button><button class="w-full text-left px-3 py-2 rounded hover:bg-hover">退出登录</button>';
    $('languagePopover').onclick=e=>{ const button=e.target.closest('[data-language]'); if(!button)return; session.language=button.dataset.language; $('languagePopover').querySelectorAll('button').forEach(x=>x.classList.toggle('text-primary',x.dataset.language===session.language)); toast(`语言已切换为 ${session.language}`,'success'); closeOverlays(); };
    $('assistantForm').onsubmit=e=>{ e.preventDefault(); const input=$('assistantInput'); if(!input.value.trim()){ toast('请输入问题后再发送','warning'); return; } $('assistantReply').textContent='已收到你的问题。本原型保留智能助手的交互容器，问答引擎将在后续业务版本接入。'; $('assistantReply').classList.remove('hidden'); input.value=''; };
    document.querySelectorAll('.quick-question').forEach(button=>button.onclick=()=>{ $('assistantInput').value=button.textContent; $('assistantInput').focus(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.popover, #noticeBtn, #languageBtn, #helpBtn, #accountBtn, [data-global="help"]')) closeOverlays(); });
    $('assistantDrawer').onclick=e=>{ if(e.target===$('assistantDrawer')) closeDrawer(); };
    $('createDialog').onclick=e=>{ if(e.target===$('createDialog')) closeCreateDialog(); };
    $('moduleGlobalDrawerClose').onclick=()=>closeModuleGlobalDrawer();
    $('moduleGlobalDrawer').onclick=e=>{ if(e.target===$('moduleGlobalDrawer')) closeModuleGlobalDrawer(); };
    window.addEventListener('message',event=>{
      const frame=document.getElementById('yundengModuleFrame');
      if(!frame||event.source!==frame.contentWindow||!event.data)return;
      if(event.data.type==='yundeng:global-drawer-open')openModuleGlobalDrawer(event.data.drawer,event.source);
      else if(event.data.type==='yundeng:global-drawer-close')closeModuleGlobalDrawer(false);
    });
    let annoToggleDragged=false;
    $('annoToggle').onclick=()=>{ if(annoToggleDragged){ annoToggleDragged=false; return; } annoVisible=!annoVisible; $('annoToggle').classList.toggle('bg-primary',annoVisible); $('annoToggle').classList.toggle('bg-ink-muted',!annoVisible); $('annoToggle').setAttribute('aria-pressed',String(annoVisible)); $('annoToggle').querySelector('span').textContent=annoVisible?'隐藏标注':'显示标注'; renderAnnoBadges(); };
    $('closeAnno').onclick=e=>{ e.stopPropagation(); closeAnnoPopup(); };
    $('annoPopup').onclick=e=>{ if(e.target===$('annoPopup')) closeAnnoPopup(); };
    // 标注说明弹窗支持标题栏拖拽，位置独立于页面文档流。
    let dragState=null;
    $('annoDrag').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; const panel=$('annoDrag').parentElement; const rect=panel.getBoundingClientRect(); dragState={x:e.clientX,y:e.clientY,left:rect.left,top:rect.top,panel}; $('annoDrag').setPointerCapture(e.pointerId); panel.style.position='fixed'; panel.style.margin='0'; });
    $('annoDrag').addEventListener('pointermove',e=>{ if(!dragState)return; dragState.panel.style.left=Math.max(8,Math.min(window.innerWidth-dragState.panel.offsetWidth-8,dragState.left+e.clientX-dragState.x))+'px'; dragState.panel.style.top=Math.max(8,Math.min(window.innerHeight-dragState.panel.offsetHeight-8,dragState.top+e.clientY-dragState.y))+'px'; });
    $('annoDrag').addEventListener('pointerup',()=>{ dragState=null; });
    // 长按后仅沿页面右侧上下拖拽，避免普通点击误触移动。
    function setupAnnoToggleDrag(){ const toggle=$('annoToggle'); toggle.style.touchAction='none'; const savedTop=Number(localStorage.getItem('yundeng-anno-toggle-top')); if(Number.isFinite(savedTop)&&savedTop>0) toggle.style.top=Math.max(8,Math.min(innerHeight-toggle.offsetHeight-8,savedTop))+'px'; let state=null,timer=null; const moveTo=y=>{ if(!state)return; toggle.style.top=Math.max(8,Math.min(innerHeight-toggle.offsetHeight-8,state.top+y-state.startY))+'px'; }; const finish=e=>{ clearTimeout(timer); if(!state)return; if(state.active){ annoToggleDragged=true; moveTo(state.latestY); toggle.classList.remove('cursor-grabbing','scale-105'); toggle.classList.add('cursor-grab'); localStorage.setItem('yundeng-anno-toggle-top',parseInt(toggle.style.top,10)); } if(toggle.hasPointerCapture(e.pointerId))toggle.releasePointerCapture(e.pointerId); state=null; }; toggle.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0)return; state={pointerId:e.pointerId,startY:e.clientY,latestY:e.clientY,top:toggle.getBoundingClientRect().top,active:false}; toggle.setPointerCapture(e.pointerId); timer=setTimeout(()=>{ if(!state)return; state.active=true; annoToggleDragged=true; toggle.classList.remove('cursor-grab'); toggle.classList.add('cursor-grabbing','scale-105'); moveTo(state.latestY); },350); }); toggle.addEventListener('pointermove',e=>{ if(!state||e.pointerId!==state.pointerId)return; state.latestY=e.clientY; if(!state.active)return; e.preventDefault(); moveTo(e.clientY); }); toggle.addEventListener('pointerup',finish); toggle.addEventListener('pointercancel',finish); }
    $('mainContent').addEventListener('scroll',renderAnnoBadges); window.addEventListener('resize',()=>{renderAnnoBadges();syncModuleGlobalDrawerLayout()});
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('annoPopup').classList.contains('hidden')) closeAnnoPopup(); else if(!$('moduleGlobalDrawer').classList.contains('hidden')) closeModuleGlobalDrawer(); else if(!$('createDialog').classList.contains('hidden')) closeCreateDialog(); else if(!$('assistantDrawer').classList.contains('hidden')) closeDrawer(); else closeOverlays(); return; } if(!$('annoPopup').classList.contains('hidden')) trapDialogFocus(e,$('annoPanel')); else if(!$('moduleGlobalDrawer').classList.contains('hidden')) trapDialogFocus(e,$('moduleGlobalDrawerPanel')); else if(!$('createDialog').classList.contains('hidden')) trapDialogFocus(e,$('createPanel')); else if(!$('assistantDrawer').classList.contains('hidden')) trapDialogFocus(e,$('assistantPanel')); });
    renderNav(); renderNotices(); renderRoute(); lucide.createIcons(); setupAnnoToggleDrag();
  </script>
