  <style>

    .module-global-drawer-section { margin:0 0 16px; padding:16px; border:0; border-radius:8px; background:#fff; }
    .module-global-drawer-section:last-child { margin-bottom:0; }
    .module-global-drawer-section h3 { display:inline-block; margin:0 0 16px; color:#1A1D24; font-size:16px; font-weight:600; }
    .module-global-drawer-info { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 24px; }
    .module-global-drawer-field { min-width:0; display:grid; grid-template-columns:96px minmax(0,1fr); gap:10px; align-items:start; }
    .module-global-drawer-field dt { color:#6E7685; font-size:12px; text-align:right; white-space:nowrap; }
    .module-global-drawer-field dt::after { content:'：'; }
    .module-global-drawer-field dd { min-width:0; margin:0; overflow-wrap:anywhere; color:#3A3F4A; }
    .module-global-drawer-table-wrap { width:100%; overflow-x:auto; }
    .module-global-drawer-table { min-width:1080px; width:100%; border-collapse:collapse; font-size:12px; }
    .module-global-drawer-table th { padding:9px 10px; border-bottom:1px solid #DFE1E5; color:#6E7685; background:#F0F1F3; font-weight:500; text-align:left; white-space:nowrap; }
    .module-global-drawer-table td { padding:10px; border-bottom:1px solid #F0F1F3; color:#3A3F4A; white-space:nowrap; }
    .module-global-drawer-table tbody tr:hover { background:#F3F4F6; }
    .module-global-drawer-value[data-mono="true"] { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
    .module-global-drawer-value[data-tone="success"] { color:#0FC060; }
    .module-global-drawer-value[data-tone="info"] { color:#0091D5; }
    .module-global-drawer-value[data-tone="warning"] { color:#E7772D; }
    .module-global-drawer-value[data-tone="danger"] { color:#D9001B; }
    .module-global-drawer-value[data-tone="muted"] { color:#9DA2AC; }
    .module-global-drawer-timeline{list-style:none;margin:0;padding:0 0 0 4px}.module-global-drawer-timeline li{position:relative;border-left:1px solid #DFE1E5;padding:0 0 20px 20px}.module-global-drawer-timeline li:last-child{border-left-color:transparent;padding-bottom:0}.module-global-drawer-timeline li::before{content:"";position:absolute;left:-4px;top:6px;width:8px;height:8px;border-radius:50%;background:#0066FF}.module-global-drawer-timeline-head{display:flex;justify-content:space-between;gap:12px}.module-global-drawer-timeline time{font:12px 'JetBrains Mono',monospace;color:#6E7685}.module-global-drawer-timeline p{margin:8px 0 0;color:#6E7685;font-size:12px}.module-global-drawer-footer{height:64px;flex:0 0 64px;padding:0 24px;border-top:1px solid #E8EAED;background:#fff;display:flex;justify-content:flex-end;align-items:center;gap:12px}
    
    
    /* 发票申请详情底栏按钮：design.md §5.1、§5.7；框架内显式定义，避免依赖 iframe 样式。 */
    .invoice-detail-footer .btn { height:32px; padding:0 16px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:4px; font-family:inherit; font-size:14px; line-height:20px; font-weight:400; white-space:nowrap; cursor:pointer; transition:background-color .15s,border-color .15s,color .15s; }
    .invoice-detail-footer .btn-default { background:#FFFFFF; border-color:#DFE1E5; color:#3A3F4A; }

    .invoice-detail-footer .btn-default:active { background:#F0F1F3; }
    .invoice-detail-footer .btn-primary { background:#0066FF; border-color:#0066FF; color:#FFFFFF; }

    .invoice-detail-footer .btn:focus-visible { outline:2px solid #0066FF; outline-offset:2px; }
    .invoice-detail-footer .btn:disabled { background:#F0F1F3; border-color:#DFE1E5; color:#9DA2AC; cursor:not-allowed; }

    .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

  </style>

      document.documentElement.style.overflow = moduleGlobalDrawerOverflow;
      const appFrame = $('yundeng-app-frame');
      if (appFrame) appFrame.inert = moduleGlobalDrawerAppWasInert;
      const source = moduleGlobalDrawerSource, drawerId = moduleGlobalDrawerId;
      moduleGlobalDrawerSource = null;
      moduleGlobalDrawerId = '';
      if (notifyModule) source?.postMessage({ type:'yundeng:global-drawer-closed', id:drawerId }, '*');
    }
    function navigateFrameRoute(page) {
      const href = `系统框架.html?page=${encodeURIComponent(page)}`;
      if (window.parent !== window) {
        window.parent.postMessage({ type:'yundeng:index-route-request', href }, '*');
        return;
      }
      location.href = href;
    }

    // 交互绑定
    document.addEventListener('click', event => {
      const routeBtn=event.target.closest('[data-route]'), groupBtn=event.target.closest('[data-group]'), globalBtn=event.target.closest('[data-global]'), closeBtn=event.target.closest('[data-close]'), recoverBtn=event.target.closest('[data-recover]');
      if(routeBtn){ syncGroupsForRoute(routeBtn.dataset.route); if(routeBtn.dataset.href){ location.href=routeBtn.dataset.href; return; } currentRoute=routeBtn.dataset.route; renderNav(); renderRoute(); }
      if(groupBtn){ const group=navItems.find(x=>x.id===groupBtn.dataset.group); group.expanded=!group.expanded; renderNav(); }
      if(closeBtn){ const id=closeBtn.dataset.close; if(id==='assistantDrawer') closeDrawer(); else if(id==='createDialog') closeCreateDialog(); else $(id).classList.add('hidden'); }
      if(recoverBtn){ if(recoverBtn.dataset.recover==='retry'){ getLeaf(currentRoute).state='loading'; renderRoute(); setTimeout(()=>{getLeaf(currentRoute).state='ready';renderRoute();toast('模块已重新加载','success');},900); } else if(recoverBtn.dataset.recover==='environment'){currentRoute='environment';renderNav();renderRoute();} else toast('已向团队管理员提交权限申请','success'); }
      if(globalBtn){ const action=globalBtn.dataset.global; if(action==='help') navigateFrameRoute('help'); else if(action==='settings'||action==='details'||action==='notice-center') toast(action==='details'?'框架事件契约已保留给业务模块接入':'该入口将在对应业务页面实现','info'); }
    });
    $('createBrowserBtn').onclick=openCreateDialog;
    $('handoffCreate').onclick=()=>{ closeCreateDialog(false); navigateFrameRoute('create'); };
    $('collapseBtn').onclick=()=>{ sidebarCompact=!sidebarCompact; $('sidebar').classList.toggle('compact',sidebarCompact); const button=$('collapseBtn'); button.title=sidebarCompact?'展开侧栏':'收起侧栏'; button.setAttribute('aria-label',button.title); button.innerHTML='<i data-lucide="triangle" class="yundeng-solid-arrow"></i>'; lucide.createIcons(); };
    $('mobileMenu').onclick=()=>{ $('sidebar').classList.toggle('compact'); };
    $('noticeBtn').onclick=()=>openPopover('noticePopover');
    $('languageBtn').onclick=()=>openPopover('languagePopover');
    $('helpBtn').onclick=()=>window.openYundengOnboarding?.();
    $('accountBtn').onclick=()=>openPopover('accountPopover');
    $('assistantBtn').onclick=openAssistant;
    let noticeDetailIndex=0;function showNoticeDetail(index){noticeDetailIndex=Math.max(0,Math.min(notices.length-1,index));const n=notices[noticeDetailIndex];n.unread=false;$('noticeDetailTitle').textContent=n.title;$('noticeDetailTime').textContent=n.time;$('noticeDetailContent').textContent=n.content||n.desc;$('noticeDetailIndex').textContent=`第${noticeDetailIndex+1}/${notices.length}条`;$('noticePrev').disabled=noticeDetailIndex===0;$('noticeNext').disabled=noticeDetailIndex===notices.length-1;$('noticeDetailModal').classList.remove('hidden');renderNotices();lucide.createIcons()}$('noticeList').onclick=e=>{const b=e.target.closest('[data-notice-index]');if(b)showNoticeDetail(Number(b.dataset.noticeIndex))};$('noticeDetailClose').onclick=()=>$('noticeDetailModal').classList.add('hidden');$('noticePrev').onclick=()=>showNoticeDetail(noticeDetailIndex-1);$('noticeNext').onclick=()=>showNoticeDetail(noticeDetailIndex+1);$('noticeDetailModal').onclick=e=>{if(e.target===$('noticeDetailModal'))$('noticeDetailModal').classList.add('hidden')};$('readAll').onclick=()=>{ notices.forEach(n=>n.unread=false); renderNotices(); toast('全部通知已标记为已读','success'); };
    $('languagePopover').innerHTML=['简体中文','English','日本語'].map(l=>`<button data-language="${l}" class="w-full text-left px-3 py-2 rounded hover:bg-hover ${l===session.language?'text-primary font-medium':'text-ink-body'}">${l}</button>`).join('');
    $('helpPopover').innerHTML='';
    $('accountPopover').innerHTML='<div class="px-3 py-2 text-[12px] text-ink-sub border-b border-line-lighter">团队管理员</div><button class="w-full text-left px-3 py-2 rounded hover:bg-hover">账号信息</button><button class="w-full text-left px-3 py-2 rounded hover:bg-hover">退出登录</button>';
    $('languagePopover').onclick=e=>{ const button=e.target.closest('[data-language]'); if(!button)return; session.language=button.dataset.language; $('languagePopover').querySelectorAll('button').forEach(x=>x.classList.toggle('text-primary',x.dataset.language===session.language)); toast(`语言已切换为 ${session.language}`,'success'); closeOverlays(); };
    $('assistantForm').onsubmit=e=>{ e.preventDefault(); const input=$('assistantInput'); if(!input.value.trim()){ toast('请输入问题后再发送','warning'); return; } $('assistantReply').textContent='已收到你的问题。本原型保留智能助手的交互容器，问答引擎将在后续业务版本接入。'; $('assistantReply').classList.remove('hidden'); input.value=''; };
    document.querySelectorAll('.quick-question').forEach(button=>button.onclick=()=>{ $('assistantInput').value=button.textContent; $('assistantInput').focus(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.popover, #noticeBtn, #languageBtn, #helpBtn, #accountBtn, [data-global="help"]')) closeOverlays(); });
    $('assistantDrawer').onclick=e=>{ if(e.target===$('assistantDrawer')) closeDrawer(); };
    $('createDialog').onclick=e=>{ if(e.target===$('createDialog')) closeCreateDialog(); };
    $('moduleGlobalDrawerClose').onclick=()=>closeModuleGlobalDrawer();
    $('moduleGlobalDrawer').onclick=e=>{ if(e.target===$('moduleGlobalDrawer')) closeModuleGlobalDrawer(); };
    window.addEventListener('message',event=>{
      const frame=document.getElementById('yundengModuleFrame');
      if(!frame||event.source!==frame.contentWindow||!event.data)return;
      if(event.data.type==='yundeng:global-drawer-open')openModuleGlobalDrawer(event.data.drawer,event.source);
      else if(event.data.type==='yundeng:global-drawer-close')closeModuleGlobalDrawer(false);
    });
    window.addEventListener('resize',()=>{syncModuleGlobalDrawerLayout()});
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('moduleGlobalDrawer').classList.contains('hidden')) closeModuleGlobalDrawer(); else if(!$('createDialog').classList.contains('hidden')) closeCreateDialog(); else if(!$('assistantDrawer').classList.contains('hidden')) closeDrawer(); else closeOverlays(); return; } if(!$('moduleGlobalDrawer').classList.contains('hidden')) trapDialogFocus(e,$('moduleGlobalDrawerPanel')); else if(!$('createDialog').classList.contains('hidden')) trapDialogFocus(e,$('createPanel')); else if(!$('assistantDrawer').classList.contains('hidden')) trapDialogFocus(e,$('assistantPanel')); });
    renderNav(); renderNotices(); renderRoute(); lucide.createIcons();
  </script>

</body>
</html>
