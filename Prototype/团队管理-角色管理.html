      // 拖拽排序：系统角色固定置顶，其余角色可拖到任意位置，但不可越过系统角色。
      function reorderRole(id, targetId, after) {
        if (!id || !targetId || id === targetId) return;
        const from = data.roles.findIndex((r) => r.id === id);
        if (from < 0 || data.roles[from].system) return;
        const moved = data.roles.splice(from, 1)[0];
        let to = data.roles.findIndex((r) => r.id === targetId);
        const first = data.roles.findIndex((r) => r.system),
          limit = first < 0 ? 0 : first + 1;
        if (to < 0) {
          data.roles.splice(from, 0, moved);
          return;
        }
        if (!data.roles[to].system && after) to += 1;
        to = Math.max(limit, Math.min(to, data.roles.length));
        data.roles.splice(to, 0, moved);
        saveData();
        renderTable();
        toast("角色顺序已更新");
      }
      // 落点是否合法：系统角色固定置顶，不允许拖到其上方（其下方仍是合法落点）。
      function dropAllowed(target, after) {
        return !(target.system && !after);
      }
      function clearDropMarks() {
        $$("[data-role-row]").forEach((row) =>
          row.classList.remove("drop-before", "drop-after", "drop-invalid"),
        );
      }
      document.addEventListener("dragstart", (e) => {
        const row = e.target.closest?.("tr[data-role-row]");
        // 行内按钮/链接/开关上按下时不启动拖拽，避免遮挡点击；系统角色行不可拖拽。
        if (
          !row?.classList.contains("draggable-row") ||
          e.target.closest("button,a,input")
        ) {
          e.preventDefault();
          return;
        }
        dragSrc = row.dataset.roleRow;
        row.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", dragSrc);
      });
      document.addEventListener("dragover", (e) => {
        if (!dragSrc) return;
        const row = e.target.closest?.("tr[data-role-row]");
        clearDropMarks();
        if (!row) return;
        const target = roleBy(row.dataset.roleRow);
        if (!target || target.id === dragSrc) return;
        // 落点按行的上下半区判定：上半区插入到该行之前，下半区插入到该行之后。
        const rect = row.getBoundingClientRect(),
          after = e.clientY >= rect.top + rect.height / 2;
        if (!dropAllowed(target, after)) {
          row.classList.add("drop-invalid");
          return;
        }
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        row.classList.add(after ? "drop-after" : "drop-before");
      });
      document.addEventListener("drop", (e) => {
        if (!dragSrc) return;
        const row = e.target.closest?.("tr[data-role-row]"),
          from = dragSrc;
        // 排序会重建表格行，因此在此处先重置拖拽状态，避免 dragend 丢失后残留。
        dragSrc = null;
        clearDropMarks();
        if (!row) return;
        const target = roleBy(row.dataset.roleRow);
        if (!target || target.id === from) return;
        const rect = row.getBoundingClientRect(),
          after = e.clientY >= rect.top + rect.height / 2;
        if (!dropAllowed(target, after)) {
          toast("系统角色固定置顶，不可拖到其上方");
          return;
        }
        e.preventDefault();
        reorderRole(from, target.id, after);
      });
      document.addEventListener("dragend", () => {
        dragSrc = null;
        clearDropMarks();
        $$("[data-role-row].dragging").forEach((row) =>
          row.classList.remove("dragging"),
        );
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "chooseMemberSearch") renderMemberChooser();
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "permissionAll") {
          permissionDraft = t.checked ? new Set(allPermissions) : new Set();
          renderPermissionTree();
        }
        if (t.dataset.permissionGroup) {
          JSON.parse(t.dataset.leaves).forEach((k) =>
            t.checked ? permissionDraft.add(k) : permissionDraft.delete(k),
          );
          renderPermissionTree();
        }
        if (t.dataset.permission) {
          const k = t.dataset.permission;
          if (t.checked) permissionDraft.add(k);
          else permissionDraft.delete(k);
          const path = k.slice(0, k.lastIndexOf("/") + 1);
          if (
            [...permissionDraft].some(
              (p) => p.startsWith(path) && p !== path + "查看",
            )
          )
            permissionDraft.add(path + "查看");
          renderPermissionTree();
        }
        if (t.dataset.chooseMember) {
          if (t.checked && memberDraft.size >= 1000) {
            toast("最多选择 1000 名成员");
            t.checked = false;
            return;
          }
          t.checked
            ? memberDraft.add(t.dataset.chooseMember)
            : memberDraft.delete(t.dataset.chooseMember);
          renderMemberChooser();
        }
        if (t.dataset.chooseDept) {
          const role = roleBy(chosenRoleId),
            ids = descendants(t.dataset.chooseDept),
            members = data.members.filter(
              (m) => ids.includes(m.dept) && !(m.owner && role?.system),
            );
          if (
            t.checked &&
            new Set([...memberDraft, ...members.map((m) => m.id)]).size > 1000
          ) {
            toast("最多选择 1000 名成员");
            renderMemberChooser();
            return;
          }
          members.forEach((m) =>
            t.checked ? memberDraft.add(m.id) : memberDraft.delete(m.id),
          );
          renderMemberChooser();
        }
      });
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-action]");
        if (!t) return;
        const { action, id } = t.dataset;
        if (action === "role-add") roleEditor(null, "add");
        if (action === "role-edit") roleEditor(id);
        if (action === "role-copy") copyRole(id);
        if (action === "role-delete") deleteRole(id);
        if (action === "role-members") openRoleMembers(id);
        if (action === "role-permissions") openRolePermissions(id);
        if (action === "role-members-config") configureRoleMembers(id);
        if (action === "role-status") {
          const role = roleBy(id);
          if (!role || role.system) return;
          role.enabled = t.getAttribute("aria-checked") !== "true";
          t.setAttribute("aria-checked", String(role.enabled));
          // 状态切换给出 toast 反馈，文案只说明结果：已启用 / 已停用「角色名」。
          commit(
            role.enabled
              ? `已启用「${role.name}」`
              : `已停用「${role.name}」`,
          );
        }
        if (action === "permission-expand") {
          permissionExpanded.has(id)
            ? permissionExpanded.delete(id)
            : permissionExpanded.add(id);
          renderPermissionTree();
        }
        if (action === "permission-expand-all") {
          permissionExpanded = permissionExpanded.size
            ? new Set()
            : new Set(allPermissionNodes());
          renderPermissionTree();
        }
        if (action === "choose-expand") {
          memberTreeExpanded.has(id)
            ? memberTreeExpanded.delete(id)
            : memberTreeExpanded.add(id);
          renderMemberChooser();
        }
        if (action === "unchoose-member") {
          memberDraft.delete(id);
          renderMemberChooser();
        }
        if (action === "clear-member-draft") {
          const role = roleBy(chosenRoleId);
          memberDraft = new Set(
            role
              ? roleMemberList(role)
                  .filter((m) => m.owner && role.system)
                  .map((m) => m.id)
              : [],
          );
          renderMemberChooser();
        }
      });

      start();
    </script>
  </body>
</html>
