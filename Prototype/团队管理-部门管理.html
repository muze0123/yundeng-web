<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云登 · 部门管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#0066FF",
                hover: "#0052CC",
                active: "#0047B3",
                bg: "#E6F0FF",
              },
              ink: {
                title: "#1A1D24",
                body: "#3A3F4A",
                sub: "#6E7685",
                muted: "#9DA2AC",
              },
              line: {
                DEFAULT: "#DFE1E5",
                light: "#E8EAED",
                lighter: "#F0F1F3",
              },
              page: "#F7F8FA",
              card: "#FFFFFF",
              hover: "#F3F4F6",
              "block-hover": "#F0F1F3",
              price: "#FE5416",
              success: { DEFAULT: "#0FC060", bg: "#E7F9F0" },
              warning: { DEFAULT: "#E7772D", bg: "#FDF2E9" },
              danger: { DEFAULT: "#D9001B", bg: "#FFE8EB" },
              info: { DEFAULT: "#0091D5", bg: "#E4F4FB" },
            },
            borderRadius: { DEFAULT: "4px", md: "6px", lg: "8px" },
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                "Helvetica Neue",
                "Helvetica",
                "Arial",
                "sans-serif",
              ],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      /* 布局、颜色和尺寸取自 design.md §2–5；业务树缩进取 20px 间距梯度。 */
      :root {
        --primary: #0066ff;
        --primary-hover: #0052cc;
        --primary-bg: #e6f0ff;
        --title: #1a1d24;
        --body: #3a3f4a;
        --sub: #6e7685;
        --muted: #9da2ac;
        --line: #dfe1e5;
        --light: #e8eaed;
        --lighter: #f0f1f3;
        --page: #f7f8fa;
        --card: #ffffff;
        --hover: #f3f4f6;
        --danger: #d9001b;
        --danger-bg: #ffe8eb;
        --success: #0fc060;
        --warning: #e7772d;
        --warning-bg: #fdf2e9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        color: var(--body);
        background: var(--page);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      input,
      textarea {
        caret-color: var(--primary);
      }
      input[type="checkbox"],
      input[type="radio"] {
        accent-color: var(--primary);
      }
      ::selection {
        background: var(--primary-bg);
        color: var(--primary);
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      h2,
      h3,
      p {
        margin: 0;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
        color: var(--title);
      }
      h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--title);
      }
      a {
        color: var(--primary);
        text-underline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--sub);
      }
      .small {
        font-size: 12px;
      }
      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .spaced {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .btn {
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--body);
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--card);
      }
      .btn.primary:hover {
        background: var(--primary-hover);
      }
      .btn.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--card);
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--sub);
      }
      .icon-btn:hover {
        background: var(--hover);
        color: var(--body);
      }
      .link {
        border: 0;
        background: transparent;
        color: var(--primary);
        padding: 0;
        white-space: nowrap;
      }
      .link:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link.danger {
        color: var(--danger);
      }
      .row-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
      }
      .field {
        height: 32px;
        width: 100%;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--body);
        min-width: 0;
      }
      .field:focus {
        outline: 0;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-bg);
      }
      textarea.field {
        height: 88px;
        padding: 8px 10px;
        resize: vertical;
      }
      .field[aria-invalid="true"] {
        border-color: var(--danger);
      }
      /* 只读字段：按 design.md 禁用态处理（文字与底色置灰、不可编辑），
         保留完整边框以免视觉上塌陷。 */
      .field[disabled] {
        color: var(--muted);
        background: var(--light);
        cursor: not-allowed;
      }
      .field[disabled]:focus {
        border-color: var(--line);
        box-shadow: none;
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        margin-top: 4px;
        min-height: 0;
      }
      .required {
        color: var(--danger);
        margin-right: 4px;
      }
      .workspace {
        background: var(--card);
        border-radius: 8px;
        padding: 24px;
        min-height: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .team-summary {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        padding-bottom: 20px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--light);
      }
      .team-summary h2 {
        margin-right: 4px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .filter-btn {
        position: relative;
      }
      .filter-btn.active {
        border-color: var(--primary);
        color: var(--primary);
      }
      .filter-count {
        position: absolute;
        right: -8px;
        top: -8px;
        min-width: 16px;
        height: 16px;
        border-radius: 8px;
        background: var(--danger);
        color: var(--card);
        font:
          600 11px/16px "JetBrains Mono",
          monospace;
      }
      .title-row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-bottom: 16px;
      }
      .split {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 20px;
        flex: 1;
        min-width: 0;
      }
      .rail {
        min-width: 0;
        border-right: 1px solid var(--light);
        padding-right: 20px;
      }
      .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .rail .field {
        margin-bottom: 12px;
      }
      .detail {
        min-width: 0;
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        border-radius: 4px;
        padding-right: 4px;
      }
      .tree-row:hover {
        background: var(--hover);
      }
      .tree-row.active {
        background: var(--primary-bg);
        color: var(--primary);
      }
      .tree-row .tree-label {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 6px 0;
        color: inherit;
      }
      .tree-label span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree-row .icon-btn {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }
      .tree-row .node-more {
        opacity: 0;
      }
      .tree-row:hover .node-more,
      .tree-row:focus-within .node-more {
        opacity: 1;
      }
      .table-scroll {
        width: 100%;
        overflow-x: auto;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .data-table th {
        text-align: left;
        font-weight: 600;
        font-size: 12px;
        color: var(--sub);
        padding: 9px 12px;
        background: var(--lighter);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .data-table td {
        text-align: left;
        padding: 9px 12px;
        height: 48px;
        border-bottom: 1px solid var(--lighter);
        white-space: nowrap;
      }
      .data-table tbody tr:hover {
        background: var(--hover);
      }
      .data-table tr.selected {
        background: var(--primary-bg);
      }
      /* 列表整行拖拽排序（交互标准见 design.md §5.14）：可拖拽行给抓取光标，落点用渐变插入线反馈，
         非法落点用 danger 浅底提示；仅同级部门间可排序，跨级拖拽为非法落点。 */
      .data-table tr.draggable-row {
        cursor: grab;
      }
      .data-table tr.draggable-row:active {
        cursor: grabbing;
      }
      .data-table tr.dragging {
        opacity: 0.4;
      }
      /* 落点提示用渐变绘制，避免 border 造成行高抖动。 */
      .data-table tr.drop-before td {
        background-image: linear-gradient(
          to bottom,
          var(--primary) 0 2px,
          transparent 2px
        );
      }
      .data-table tr.drop-after td {
        background-image: linear-gradient(
          to top,
          var(--primary) 0 2px,
          transparent 2px
        );
      }
      .data-table tbody tr.drop-invalid,
      .data-table tbody tr.drop-invalid:hover {
        background: var(--danger-bg);
      }
      .member-table {
        min-width: 1150px;
      }
      .member-cell {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .avatar {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--primary-bg);
        color: var(--primary);
        position: relative;
        font-size: 12px;
        flex-shrink: 0;
      }
      .avatar .owner {
        position: absolute;
        right: -4px;
        top: -4px;
        width: 12px;
        height: 12px;
        color: var(--warning);
        background: var(--card);
        border-radius: 50%;
      }
      .toggle {
        position: relative;
        width: 32px;
        height: 18px;
        background: var(--line);
        border: 0;
        border-radius: 16px;
        padding: 0;
      }
      .toggle::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        left: 2px;
        top: 2px;
        background: var(--card);
        border-radius: 50%;
        transition: transform 0.15s;
      }
      .toggle[aria-checked="true"] {
        background: var(--primary);
      }
      .toggle[aria-checked="true"]::after {
        transform: translateX(14px);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 12px;
        background: var(--page);
        color: var(--sub);
      }
      .badge.success {
        color: var(--success);
        background: #e7f9f0;
      }
      .badge.warning {
        color: var(--warning);
        background: #fdf2e9;
      }
      .badge.danger {
        color: var(--danger);
        background: #ffe8eb;
      }
      .pager {
        padding-top: 20px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 12px;
      }
      .page-nav {
        display: flex;
        gap: 4px;
      }
      .pg-btn {
        height: 30px;
        min-width: 30px;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 4px;
      }
      .pg-btn.current {
        color: var(--card);
        background: var(--primary);
        border-color: var(--primary);
      }
      .pager select {
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
      }
      .jump {
        width: 44px;
        height: 30px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .empty {
        padding: 56px 16px;
        text-align: center;
        color: var(--sub);
      }
      .empty svg {
        display: block;
        width: 32px;
        height: 32px;
        margin: 0 auto 12px;
        color: var(--muted);
      }
      .role-item {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        min-height: 40px;
        border-radius: 4px;
        margin-bottom: 4px;
      }
      .role-item.active {
        background: var(--primary-bg);
        color: var(--primary);
      }
      .role-item:hover {
        background: var(--hover);
      }
      .role-item button {
        border: 0;
        background: none;
        color: inherit;
        text-align: left;
        flex: 1;
        padding: 4px 0;
      }
      .role-item .grip {
        color: var(--muted);
        cursor: grab;
      }
      .role-item .reorder {
        width: 24px;
        flex: 0 0 24px;
        text-align: center;
        opacity: 0;
      }
      .role-item:hover .reorder,
      .role-item:focus-within .reorder {
        opacity: 1;
      }
      .role-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        color: var(--sub);
        font-size: 12px;
        margin: 12px 0 8px;
      }
      .role-note {
        color: var(--sub);
        margin-bottom: 20px;
        overflow-wrap: anywhere;
      }
      .tabs {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid var(--light);
        margin-bottom: 20px;
      }
      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--sub);
        padding: 10px 0;
        white-space: nowrap;
      }
      .tab[aria-selected="true"] {
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 600;
      }
      .tab:hover {
        color: var(--primary);
      }
      dialog.overlay {
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: var(--card);
        color: var(--body);
        width: 760px;
        max-width: 92vw;
        max-height: 90dvh;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      }
      dialog.overlay::backdrop {
        background: rgba(0, 0, 0, 0.3);
      }
      dialog.overlay[open] {
        display: flex;
        flex-direction: column;
      }
      dialog.drawer {
        margin: 0 0 0 auto;
        top: 0;
        right: 0;
        height: 100dvh;
        max-height: 100dvh;
        max-width: 100vw;
        width: 800px;
        border-radius: 0;
      }
      dialog.filter-drawer {
        width: 480px;
      }
      .dialog-head {
        padding: 0 20px;
        height: 56px;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--light);
      }
      .dialog-body {
        padding: 24px;
        overflow-y: auto;
        min-height: 0;
        flex: 1;
      }
      .dialog-foot {
        height: 64px;
        min-height: 64px;
        border-top: 1px solid var(--light);
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
      }
      .form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 96px minmax(0, 400px);
        gap: 6px 12px;
        justify-content: center;
        align-items: start;
      }
      .form-row > label {
        padding-top: 6px;
        text-align: right;
      }
      .form-row .field-wrap {
        min-width: 0;
      }
      /* 部门名称字数统计贴在输入框内右侧（design.md §5.4 输入框内右对齐计数器）。 */
      .field-wrap.has-counter {
        position: relative;
      }
      .field-wrap.has-counter > .field {
        padding-right: 54px;
      }
      .field-wrap.has-counter > .counter {
        position: absolute;
        right: 10px;
        top: 0;
        height: 32px;
        display: flex;
        align-items: center;
        margin-top: 0;
        color: var(--muted);
      }
      .filter-drawer .form-row {
        display: block;
      }
      .filter-drawer .form-row > label {
        display: block;
        text-align: left;
        padding: 0;
        margin-bottom: 6px;
      }
      .counter {
        text-align: right;
        color: var(--sub);
        font-size: 12px;
        margin-top: 4px;
      }
      .form-section {
        padding-top: 20px;
        margin-top: 20px;
        border-top: 1px solid var(--light);
      }
      .form-section h3 {
        margin-bottom: 16px;
      }
      .choice-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 240px;
        overflow: auto;
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
      }
      .picker {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .picker > summary {
        list-style: none;
        min-height: 30px;
        padding: 5px 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .picker > summary::-webkit-details-marker {
        display: none;
      }
      /* 展开时面板脱离表单流并固定到视口，不撑开行高、不被弹层滚动区裁切。 */
      .picker[open] {
        z-index: 30;
      }
      .picker-content {
        position: fixed;
        z-index: 1;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        padding: 8px;
        max-height: 260px;
        overflow: auto;
      }
      .picker-content > .field {
        margin-bottom: 8px;
      }
      .picker-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      .picker-row:hover {
        background: var(--hover);
      }
      /* 单选圈隐藏（不占位），多选复选框保持原生可见。 */
      .picker-row input[type="radio"] {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .picker-row input[type="checkbox"] {
        margin: 0;
        flex-shrink: 0;
      }
      .picker-row.is-selected {
        color: var(--primary);
        font-weight: 600;
      }
      /* 组织树展开箭头固定 16px 宽，叶子节点用等宽占位保持名称对齐。 */
      .picker-caret {
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: transparent;
        color: var(--sub);
      }
      .picker-caret:hover {
        color: var(--primary);
      }
      /* 箭头图标只渲染一次，展开态用旋转表达，避免每次筛选重绘。 */
      .picker-caret[aria-expanded="true"] svg {
        transform: rotate(90deg);
      }
      .picker-caret svg {
        width: 12px;
        height: 12px;
        transition: transform 0.15s;
      }
      .picker-caret-ph {
        width: 16px;
        flex-shrink: 0;
      }
      .placeholder {
        color: var(--muted);
      }
      .chips {
        display: flex;
        gap: 4px;

        if (!d || d.parent === null) return;
        const ids = descendants(id);
        const count = deptCount(id);
        if (count) {
          openDialog(
            "无法删除",
            `<p>部门「${esc(d.name)}」下还有 ${count} 名成员，请先转移成员后再删除。</p>`,
            null,
            { cancel: "我知道了" },
          );
          return;
        }
        const children = ids.length - 1;
        confirmAction(
          "确认删除该部门吗？",
          `将删除“${d.name}”${children ? `及其 ${children} 个子部门` : ""}，删除后不可恢复。`,
          () => {
            data.departments = data.departments.filter(
              (x) => !ids.includes(x.id),
            );
            if (ids.includes(ui.dept)) ui.dept = "d0";
            commit("部门已删除");
          },
        );
      }
      function departmentMenu(id) {
        const d = deptBy(id);
        openDialog(
          d.name,
          `<div class="form">${button("添加子部门", "dept-add-child", id)}${button("编辑部门", "dept-edit", id)}${d.parent !== null ? button("删除部门", "dept-delete", id, "danger") : ""}</div>`,
        );
      }
      function treeRows(query = "", parent = null, level = 0) {
        return data.departments
          .filter((d) => d.parent === parent)
          .map((d) => {
            const children = data.departments.filter((c) => c.parent === d.id);
            const visible =
              !query ||
              descendants(d.id).some((id) => matches(deptBy(id)?.name, query));
            if (!visible) return "";
            return `<div class="tree-row ${ui.dept === d.id ? "active" : ""}" style="padding-left:${level * 20}px">${children.length ? `<button class="icon-btn" data-action="tree-expand" data-id="${d.id}" aria-label="${expanded.has(d.id) ? "收起" : "展开"}${esc(d.name)}" aria-expanded="${expanded.has(d.id)}">${icon(expanded.has(d.id) || query ? "chevron-down" : "chevron-right")}</button>` : '<span style="width:24px;flex-shrink:0"></span>'}<button class="tree-label" data-action="dept-select" data-id="${d.id}" title="${esc(d.name)}"><span>${esc(d.name)}</span><span class="muted small mono">${deptCount(d.id)}</span></button><button class="icon-btn node-more" data-action="dept-menu" data-id="${d.id}" aria-label="管理${esc(d.name)}">${icon("ellipsis")}</button></div>${expanded.has(d.id) || query ? treeRows(query, d.id, level + 1) : ""}`;
          })
          .join("");
      }
      function openFilters() {
        let body = "";
        if (PAGE === "members") {
          body =
            formRow(
              "角色",
              "filterRole",
              select(
                "filterRole",
                [["", "全部角色"], ...data.roles.map((r) => [r.id, r.name])],
                ui.filters.role || "",
              ),
            ) +
            formRow(
              "成员状态",
              "filterStatus",
              select(
                "filterStatus",
                [
                  ["", "全部状态"],
                  ["enabled", "启用"],
                  ["disabled", "禁用"],
                ],
                ui.filters.status || "",
              ),
            );
        } else if (PAGE === "logins") {
          body =
            formRow(
              "开始日期",
              "filterStart",
              field("filterStart", ui.filters.start || "", 'type="date"'),
            ) +
            formRow(
              "结束日期",
              "filterEnd",
              field("filterEnd", ui.filters.end || "", 'type="date"'),
            ) +
            formRow(
              "审批状态",
              "filterStatus",
              select(
                "filterStatus",
                [["", "全部状态"], "待处理", "已允许", "已拒绝"],
                ui.filters.status || "",
              ),
            );
        }
        openDialog(
          "筛选",
          `<form class="form" onsubmit="return false">${body}</form>`,
          () => {
            if (PAGE === "members")
              ui.filters = {
                role: $("#filterRole").value,
                status: $("#filterStatus").value,
              };
            else {
              const start = $("#filterStart").value,
                end = $("#filterEnd").value;
              if (start && end && start > end) {
                error("filterEnd", "结束日期不能早于开始日期");
                return false;
              }
              ui.filters = { start, end, status: $("#filterStatus").value };
            }
            ui.page = 1;
            ui.selected = [];
            remember();
            render();
          },
          { drawer: true, filter: true, confirm: "确认提交" },
        );
        $$("[data-action=filters]").forEach((e) =>
          e.setAttribute("aria-expanded", "true"),
        );
      }
      document.addEventListener("input", (e) => {
        if (e.target.classList.contains("picker-search")) {
          const picker = e.target.closest(".picker");
          const query = e.target.value;
          $$("[data-search]", e.target.parentElement).forEach(
            (row) => (row.hidden = !matches(row.dataset.search, query)),
          );
          if (!query.trim() && picker) renderDeptPickerTree(picker);
        }
        if (e.target.id === "deptSearch") {
          const tree = $("#departmentTree");
          tree.innerHTML = treeRows(e.target.value);
          icons();
        }
        updateCounters();
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "pageSize") {
          ui.size = Number(e.target.value);
          ui.page = 1;
          ui.selected = [];
          remember();
          renderResults();
        }
        if (e.target.dataset.deptPicker) {
          const id = e.target.dataset.deptPicker;
          $("#" + id).value = e.target.value;
          const label = $("#" + id + "Label");
          label.textContent = e.target.dataset.label;
          label.classList.remove("placeholder");
          $$(`input[name="${id}"]`).forEach((i) => {
            const row = i.closest(".picker-row");
            // 根目录只作层级起点，不参与选中高亮。
            row?.classList.toggle(
              "is-selected",
              i.checked && row.dataset.level !== "0",
            );
          });
          $("#" + id + "Picker").open = false;
        }
        if (e.target.dataset.multiPicker) {
          const id = e.target.dataset.multiPicker;
          const checked = $$(`input[name="${id}"]:checked`);
          checked.forEach((i) =>
            i.closest(".picker-row")?.classList.add("is-selected"),
          );
          $$(`input[name="${id}"]:not(:checked)`).forEach((i) =>
            i.closest(".picker-row")?.classList.remove("is-selected"),
          );
          const label = $("#" + id + "Label");
          label.innerHTML =
            checked
              .map(
                (i) =>
                  `<span class="chip">${esc(i.dataset.label)}<button type="button" class="chip-remove" data-chip-remove="${id}" data-chip-value="${esc(i.value)}" aria-label="移除${esc(i.dataset.label)}">${icon("x")}</button></span>`,
              )
              .join("") || '<span class="placeholder">请选择</span>';
          // 标签由 innerHTML 重建，需重新渲染其中的 Lucide 图标。
          icons();
        }
      });
      // 标签内的「×」移除已选项：取消勾选、同步标签与选项行高亮。
      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-chip-remove]");
        if (!btn) return;
        // 标签位于 summary 内，需阻止默认行为避免顺带展开/收起下拉。
        e.preventDefault();
        const id = btn.dataset.chipRemove;
        const input = $$(`input[name="${id}"]`).find(
          (i) => i.value === btn.dataset.chipValue,
        );
        if (input) input.checked = false;
        $$(`input[name="${id}"]`).forEach((i) =>
          i.closest(".picker-row")?.classList.toggle("is-selected", i.checked),
        );
        btn.closest(".chip")?.remove();
        const label = $("#" + id + "Label");
        if (label && !$$(`input[name="${id}"]:checked`).length)
          label.innerHTML = '<span class="placeholder">请选择</span>';
      });
      // 下拉面板固定定位在触发框正下方，空间不足时上翻，跟随滚动实时重算。
      let openPicker = null;
      function placePicker(picker) {
        const content = $(".picker-content", picker);
        if (!content) return;
        const r = picker.getBoundingClientRect();
        const gap = 4;
        const below = window.innerHeight - r.bottom - 12;
        const above = r.top - 12;
        content.style.left = "0px";
        content.style.top = "0px";
        content.style.bottom = "auto";
        content.style.width = `${r.width}px`;
        content.style.maxHeight = "260px";
        const height = content.offsetHeight;
        const flip = below < height && above > below;
        content.style.left = `${Math.max(8, r.left)}px`;
        content.style.maxHeight = `${Math.min(260, Math.max(160, (flip ? above : below) - gap))}px`;
        if (flip) content.style.bottom = `${window.innerHeight - r.top + gap}px`;
        else content.style.top = `${r.bottom + gap}px`;
      }
      function closePickers(except = null) {
        $$(".picker[open]").forEach((picker) => {
          if (picker === except) return;
          picker.open = false;
        });
        openPicker = except;
      }
      function syncPicker() {
        if (openPicker?.open) placePicker(openPicker);
      }
      document.addEventListener("toggle", (e) => {
        const picker = e.target;
        if (!picker.classList?.contains("picker")) return;
        if (picker.open) {
          closePickers(picker);
          openPicker = picker;
          if (!$(".picker-search", picker)?.value.trim())
            renderDeptPickerTree(picker);
          placePicker(picker);
        } else if (openPicker === picker) {
          openPicker = null;
        }
      }, true);
      // 点击触发框与面板以外的任意区域即收起下拉（多选下拉仅收起，已勾选项照常保留）。
      document.addEventListener("mousedown", (e) => {
        if (!openPicker || openPicker.contains(e.target)) return;
        openPicker.open = false;
      });
      window.addEventListener("resize", syncPicker);
      $(".dialog-body")?.addEventListener("scroll", syncPicker);
      window.addEventListener("scroll", syncPicker, true);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && openPicker) {
          openPicker.open = false;
          openPicker = null;
        }
        if (e.target.id === "jumpPage" && e.key === "Enter") {
          ui.page = Math.max(1, Number(e.target.value) || 1);
          remember();
          renderResults();
        }
        const tab = e.target.closest("[role=tab]");
        if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
          e.preventDefault();
          const tabs = $$("[role=tab]", tab.parentElement);
          let index = tabs.indexOf(tab);
          index =
            e.key === "Home"
              ? 0
              : e.key === "End"
                ? tabs.length - 1
                : (index + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                  tabs.length;
          tabs[index].click();
          $$("[role=tab]", document)
            .find((t) => t.dataset.id === tabs[index].dataset.id)
            ?.focus();
        }
      });
      document.addEventListener("click", (e) => {
        const caret = e.target.closest?.(".picker-caret");
        if (caret) {
          e.preventDefault();
          const picker = caret.closest(".picker");
          const id = caret.dataset.caretId;
          const open = pickerExpanded(picker);
          const expanded = open.has(id);
          expanded ? open.delete(id) : open.add(id);
          picker.dataset.expanded = [...open].join(" ");
          caret.setAttribute("aria-expanded", String(!expanded));
          caret.setAttribute("aria-label", `${expanded ? "展开" : "收起"}${caret.dataset.caretName}`);
          renderDeptPickerTree(picker);
          return;
        }
        const target = e.target.closest("[data-action]");
        if (!target) return;
        const { action, id } = target.dataset;
        if (action === "page") {
          ui.page = Number(id);
          ui.selected = [];
          remember();
          renderResults();
        }
        if (action === "filters") openFilters();
        if (action === "reset-filter-draft") resetFilterDraft();
        if (action === "dept-add") departmentEditor();
        if (action === "dept-add-child") {
          closeDialog();
          departmentEditor(null, id, "添加子部门");
        }
        if (action === "dept-edit") {
          closeDialog();
          departmentEditor(id);
        }
        if (action === "dept-delete") deleteDepartment(id);
        if (action === "dept-menu") departmentMenu(id);
        if (action === "tree-expand") {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          renderTree();
        }
        if (action === "dept-select") {
          ui.dept = id;
          ui.page = 1;
          ui.selected = [];
          remember();
          render();
        }
      });

      // 部门管理：层级人数、负责人和组织结构维护。
      function render() {
        $("#workspace").innerHTML =
          `<div class="toolbar"><div class="actions">${button("添加部门", "dept-add", "", "primary")}<button class="btn" data-action="expand-all">${icon("list-tree")}展开 / 收起全部</button></div>${searchBar(false)}</div><div id="results"></div>`;
        initDepartmentSearchBox();
        renderResults();
        icons();
      }
      function renderTree() {
        renderResults();
      }
      function renderResults() {
        const visible = [];
        function visit(parent = null, level = 0) {
          for (const d of data.departments.filter((d) => d.parent === parent)) {
            const matched =
              !window.YDSearchBox.value("#departmentSearchBox") ||
              descendants(d.id).some((id) =>
                window.YDSearchBox.matches("#departmentSearchBox", deptBy(id)),
              );
            if (!matched) continue;
            visible.push({ ...d, level });
            if (expanded.has(d.id) || ui.keyword) visit(d.id, level + 1);
          }
        }
        visit();
        $("#results").innerHTML =
          `<div class="table-scroll"><table class="data-table" style="min-width:720px"><thead><tr><th>部门名称</th><th>部门人数</th><th>负责人</th><th>操作</th></tr></thead><tbody>${
            visible.length
              ? visible
                  .map((d) => {
                    const children = data.departments.some(
                      (c) => c.parent === d.id,
                    );
                    const draggable = d.parent !== null;
                    return `<tr data-dept-row="${d.id}"${draggable ? ` draggable="true" class="draggable-row" title="拖拽调整同级顺序"` : ""}><td><div class="actions" style="padding-left:${d.level * 20}px;flex-wrap:nowrap">${children ? `<button class="icon-btn" data-action="tree-expand" data-id="${d.id}" aria-label="${expanded.has(d.id) ? "收起" : "展开"}${esc(d.name)}" aria-expanded="${expanded.has(d.id)}">${icon(expanded.has(d.id) || ui.keyword ? "chevron-down" : "chevron-right")}</button>` : '<span style="width:32px"></span>'}${d.parent ? "" : icon("building-2")}<span ${!d.parent ? 'style="font-weight:600"' : ""}>${esc(d.name)}</span></div></td><td class="mono">${deptCount(d.id)}</td><td>${esc(
                      d.leaders
                        .map((id) => memberBy(id)?.name)
                        .filter(Boolean)
                        .join("、") || "—",
                    )}</td><td><div class="row-actions">${link("添加子部门", "dept-add-child", d.id)}${link("编辑", "dept-edit", d.id)}${d.parent ? link("删除", "dept-delete", d.id, true) : ""}</div></td></tr>`;
                  })
                  .join("")
              : `<tr><td colspan="4">${empty("暂无搜索结果")}</td></tr>`
          }</tbody></table></div>`;
        icons();
      }
      // 组织树折叠：行上 data-ancestors 记录祖先链，可见性判定为纯查表。
      // 展开集合保存在下拉节点的 data-expanded 上，弹窗关闭后自然失效。
      function pickerExpanded(picker) {
        return new Set((picker.dataset.expanded || "").split(" ").filter(Boolean));
      }
      function renderDeptPickerTree(picker) {
        const content = $(".picker-content", picker);
        if (!content) return;
        if ($(".picker-search", picker)?.value.trim()) return;
        const open = pickerExpanded(picker);
        $$(".picker-row", content).forEach((row) => {
          const chain = (row.dataset.ancestors || "").split(" ").filter(Boolean);
          row.hidden = chain.some((id) => !open.has(id));
        });
      }
      function clearDropMarks() {
        $$("#results tr").forEach((tr) =>
          tr.classList.remove("drop-before", "drop-after", "drop-invalid"),
        );
      }
      function moveDepartment(sourceId, targetId, after) {
        const source = deptBy(sourceId);
        const target = deptBy(targetId);
        if (!source || !target || source.parent !== target.parent) return;
        const list = data.departments;
        list.splice(list.indexOf(source), 1);
        const at = list.indexOf(target) + (after ? 1 : 0);
        list.splice(at, 0, source);
      }
      document.addEventListener("dragstart", (e) => {
        const tr = e.target.closest?.("tr[data-dept-row]");
        // 行内按钮、输入框等交互元素上按下时不启动拖拽，避免遮挡点击。
        if (!tr?.classList.contains("draggable-row") || e.target.closest("button,a,input")) {
          e.preventDefault();
          return;
        }
        dragSrc = tr.dataset.deptRow;
        tr.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", dragSrc);
      });
      document.addEventListener("dragover", (e) => {
        if (!dragSrc) return;
        const tr = e.target.closest?.("tr[data-dept-row]");
        clearDropMarks();
        if (!tr) return;
        const source = deptBy(dragSrc);
        const target = deptBy(tr.dataset.deptRow);
        if (!source || !target || source.id === target.id) return;
        if (source.parent !== target.parent) {
          tr.classList.add("drop-invalid");
          return;
        }
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const r = tr.getBoundingClientRect();
        tr.classList.add(
          e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after",
        );
      });
      document.addEventListener("drop", (e) => {
        if (!dragSrc) return;
        const tr = e.target.closest?.("tr[data-dept-row]");
        const source = deptBy(dragSrc);
        dragSrc = null;
        clearDropMarks();
        if (!tr || !source) return;
        const target = deptBy(tr.dataset.deptRow);
        if (!target || target.id === source.id) return;
        if (source.parent !== target.parent) {
          toast("仅支持同级部门间排序");
          return;
        }
        const r = tr.getBoundingClientRect();
        e.preventDefault();
        moveDepartment(source.id, target.id, e.clientY >= r.top + r.height / 2);
        commit("排序已更新");
      });
      document.addEventListener("dragend", () => {
        dragSrc = null;
        clearDropMarks();
        $$("#results tr.dragging").forEach((tr) =>
          tr.classList.remove("dragging"),
        );
      });
      document.addEventListener("click", (e) => {
        if (e.target.closest('[data-action="expand-all"]')) {
          expanded = expanded.size
            ? new Set()
            : new Set(data.departments.map((d) => d.id));
          renderResults();
        }
      });

      start();
    </script>
  </body>
</html>
