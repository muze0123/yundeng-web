<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云登 · 登录请求</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#0066FF",
                hover: "#0052CC",
                active: "#0047B3",
                bg: "#E6F0FF",
              },
              ink: {
                title: "#1A1D24",
                body: "#3A3F4A",
                sub: "#6E7685",
                muted: "#9DA2AC",
              },
              line: {
                DEFAULT: "#DFE1E5",
                light: "#E8EAED",
                lighter: "#F0F1F3",
              },
              page: "#F7F8FA",
              card: "#FFFFFF",
              hover: "#F3F4F6",
              "block-hover": "#F0F1F3",
              price: "#FE5416",
              success: { DEFAULT: "#0FC060", bg: "#E7F9F0" },
              warning: { DEFAULT: "#E7772D", bg: "#FDF2E9" },
              danger: { DEFAULT: "#D9001B", bg: "#FFE8EB" },
              info: { DEFAULT: "#0091D5", bg: "#E4F4FB" },
            },
            borderRadius: { DEFAULT: "4px", md: "6px", lg: "8px" },
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                "Helvetica Neue",
                "Helvetica",
                "Arial",
                "sans-serif",
              ],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      /* 布局、颜色和尺寸取自 design.md §2–5；业务树缩进取 20px 间距梯度。 */
      :root {
        --primary: #0066ff;
        --primary-hover: #0052cc;
        --primary-bg: #e6f0ff;
        --title: #1a1d24;
        --body: #3a3f4a;
        --sub: #6e7685;
        --muted: #9da2ac;
        --line: #dfe1e5;
        --light: #e8eaed;
        --lighter: #f0f1f3;
        --page: #f7f8fa;
        --card: #ffffff;
        --hover: #f3f4f6;
        --danger: #d9001b;
        --success: #0fc060;
        --warning: #e7772d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        color: var(--body);
        background: var(--page);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      input,
      textarea {
        caret-color: var(--primary);
      }
      input[type="checkbox"],
      input[type="radio"] {
        accent-color: var(--primary);
      }
      ::selection {
        background: var(--primary-bg);
        color: var(--primary);
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      h2,
      h3,
      p {
        margin: 0;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
        color: var(--title);
      }
      h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--title);
      }
      a {
        color: var(--primary);
        text-underline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--sub);
      }
      .small {
        font-size: 12px;
      }
      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .spaced {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .btn {
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--body);
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--card);
      }
      .btn.primary:hover {
        background: var(--primary-hover);
      }
      .btn.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--card);
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--sub);
      }
      .icon-btn:hover {
        background: var(--hover);
        color: var(--body);
      }
      .link {
        border: 0;
        background: transparent;
        color: var(--primary);
        padding: 0;
        white-space: nowrap;
      }
      .link:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link.danger {
        color: var(--danger);
      }
      .row-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
      }
      .field {
        height: 32px;
        width: 100%;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--body);
        min-width: 0;
      }
      .field:focus {
        outline: 0;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-bg);
      }
      textarea.field {
        height: 88px;
        padding: 8px 10px;
        resize: vertical;
      }
      .field[aria-invalid="true"] {
        border-color: var(--danger);
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        margin-top: 4px;
        min-height: 0;
      }
      .required {
        color: var(--danger);
        margin-right: 4px;
      }
      .workspace {
        background: var(--card);
        border-radius: 8px;
        padding: 24px;
        min-height: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .team-summary {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        padding-bottom: 20px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--light);
      }
      .team-summary h2 {
        margin-right: 4px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      /* 登录请求：区块首行（申请状态页签 + 搜索框）与卡片顶部、下方列表的间距同为 20px。 */
      #workspace {
        padding-top: 20px;
      }
      /* 登录请求：申请状态页签与搜索框同处一行并垂直居中对齐，去掉页签下方的横向分隔线。 */
      .login-toolbar {
        align-items: center;
        flex-wrap: nowrap;
        gap: 0 16px;
        margin-bottom: 20px;
      }
      .login-toolbar .tabs {
        flex: 0 1 auto;
        min-width: 0;
        margin-bottom: 0;
        border-bottom: 0;
        overflow-x: auto;
      }
      /* design.md §5.4.2：搜索框的结构、样式与交互统一由公共层 YDSearchBox 提供，页面只声明容器。 */
      .login-toolbar .order-search-filter-group {
        flex: 0 1 320px;
      }
      .login-toolbar .order-global-search {
        min-width: 0;
      }
      .title-row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-bottom: 16px;
      }
      /* 标题与搜索框、筛选按钮同排时，去掉标题行单独占位时的下内边距。 */
      .login-toolbar .title-row {
        padding-bottom: 0;
      }
      .split {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 20px;
        flex: 1;
        min-width: 0;
      }
      .rail {
        min-width: 0;
        border-right: 1px solid var(--light);
        padding-right: 20px;
      }
      .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .rail .field {
        margin-bottom: 12px;
      }
      .detail {
        min-width: 0;
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        border-radius: 4px;
        padding-right: 4px;
      }
      .tree-row:hover {
        background: var(--hover);
      }
      .tree-row.active {
        background: var(--primary-bg);
        color: var(--primary);
      }
      .tree-row .tree-label {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 6px 0;
        color: inherit;
      }
      .tree-label span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree-row .icon-btn {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }
      .tree-row .node-more {
        opacity: 0;
      }
      .tree-row:hover .node-more,
      .tree-row:focus-within .node-more {
        opacity: 1;
      }
      .table-scroll {
        width: 100%;
        overflow-x: auto;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .data-table th {
        text-align: left;
        font-weight: 600;
        font-size: 12px;
        color: var(--sub);
        padding: 9px 12px;
        background: var(--lighter);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .data-table td {
        text-align: left;
        padding: 9px 12px;
        height: 48px;
        border-bottom: 1px solid var(--lighter);
        white-space: nowrap;
      }
      .data-table tbody tr:hover {
        background: var(--hover);
      }
      .data-table tr.selected {
        background: var(--primary-bg);
      }
      .member-table {
        min-width: 1150px;
      }
      .member-cell {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .avatar {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--primary-bg);
        color: var(--primary);
        position: relative;
        font-size: 12px;
        flex-shrink: 0;
      }
      .avatar .owner {
        position: absolute;
        right: -4px;
        top: -4px;
        width: 12px;
        height: 12px;
        color: var(--warning);
        background: var(--card);
        border-radius: 50%;
      }
      .toggle {
        position: relative;
        width: 32px;
        height: 18px;
        background: var(--line);
        border: 0;
        border-radius: 16px;
        padding: 0;
      }
      .toggle::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        left: 2px;
        top: 2px;
        background: var(--card);
        border-radius: 50%;
        transition: transform 0.15s;
      }
      .toggle[aria-checked="true"] {
        background: var(--primary);
      }
      .toggle[aria-checked="true"]::after {
        transform: translateX(14px);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 12px;
        background: var(--page);
        color: var(--sub);
      }
      .badge.success {
        color: var(--success);
        background: #e7f9f0;
      }
      .badge.warning {
        color: var(--warning);
        background: #fdf2e9;
      }
      .badge.danger {
        color: var(--danger);
        background: #ffe8eb;
      }
      .pager {
        padding-top: 20px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 12px;
      }
      .page-nav {
        display: flex;
        gap: 4px;
      }
      .pg-btn {
        height: 30px;
        min-width: 30px;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 4px;
      }
      .pg-btn.current {
        color: var(--card);
        background: var(--primary);
        border-color: var(--primary);
      }
      .pager select {
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
      }
      .jump {
        width: 44px;
        height: 30px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      /* 无数据 / 搜索无结果：表头保留，空状态单元格去掉行 hover 与固定行高。 */
      .data-table tbody tr.empty-row:hover {
        background: transparent;
      }
      .data-table tbody tr.empty-row > td {
        height: auto;
        padding: 0;
        white-space: normal;
      }
      /* 无数据 / 搜索无结果：统一展示插图、主文案与筛选建议。 */
      .empty-state {
        min-height: 360px;
        padding: 48px 16px 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .empty-illustration {
        width: 96px;
        height: 78px;
        margin-bottom: 10px;
        color: var(--primary);
        opacity: 0.22;
      }
      .empty-illustration svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .empty-state h3 {
        margin: 0;
        color: var(--body);
        font-size: 16px;
        font-weight: 600;
        line-height: 24px;
      }
      .empty-state p {
        margin: 12px 0 0;
        padding: 6px 12px;
        border-radius: 4px;
        background: var(--hover);
        color: var(--sub);
        font-size: 13px;
        line-height: 20px;
      }
      .role-item {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        min-height: 40px;
        border-radius: 4px;
        margin-bottom: 4px;
      }
      .role-item.active {
        background: var(--primary-bg);
        color: var(--primary);
      }
      .role-item:hover {
        background: var(--hover);
      }
      .role-item button {
        border: 0;
        background: none;
        color: inherit;
        text-align: left;
        flex: 1;
        padding: 4px 0;
      }
      .role-item .grip {
        color: var(--muted);
        cursor: grab;
      }
      .role-item .reorder {
        width: 24px;
        flex: 0 0 24px;
        text-align: center;
        opacity: 0;
      }
      .role-item:hover .reorder,
      .role-item:focus-within .reorder {
        opacity: 1;
      }
      .role-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        color: var(--sub);
        font-size: 12px;
        margin: 12px 0 8px;
      }
      .role-note {
        color: var(--sub);
        margin-bottom: 20px;
        overflow-wrap: anywhere;
      }
      .tabs {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid var(--light);
        margin-bottom: 20px;
      }
      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--sub);
        padding: 10px 0;
        white-space: nowrap;
      }
      .tab[aria-selected="true"] {
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 600;
      }
      .tab:hover {
        color: var(--primary);
      }
      dialog.overlay {
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: var(--card);
        color: var(--body);
        width: 760px;
        max-width: 92vw;
        max-height: 90dvh;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      }
      dialog.overlay::backdrop {
        background: rgba(0, 0, 0, 0.3);
      }
      dialog.overlay[open] {
        display: flex;
        flex-direction: column;
      }
      dialog.drawer {
        margin: 0 0 0 auto;
        top: 0;
        right: 0;
        height: 100dvh;
        max-height: 100dvh;
        max-width: 100vw;
        width: 800px;
        border-radius: 0;
      }
      dialog.filter-drawer {
        width: 480px;
      }
      .dialog-head {
        padding: 0 20px;
        height: 56px;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--light);
      }
      .dialog-body {
        padding: 24px;
        overflow-y: auto;
        min-height: 0;
        flex: 1;
      }
      .dialog-foot {
        height: 64px;
        min-height: 64px;
        border-top: 1px solid var(--light);
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
      }
      .form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 96px minmax(0, 400px);
        gap: 6px 12px;
        justify-content: center;
        align-items: start;
      }
      .form-row > label {
        padding-top: 6px;
        text-align: right;
      }
      .form-row .field-wrap {
        min-width: 0;
      }
      .filter-drawer .form-row {
        display: block;
      }
      .filter-drawer .dialog-body {
        padding: 20px;
      }
      .filter-drawer .form-row > label {
        display: block;
        text-align: left;
        padding: 0;
        margin-bottom: 6px;
        font-size: 13px;
        line-height: 18px;
        color: var(--body);
        white-space: nowrap;
      }
      /* design.md §5.4.4：申请时间范围采用「开始时间 ~ 结束时间」触发器 + 双月日历面板，样式与开票管理-开票订单「支付时间」一致。 */
      .order-date-control-wrap {
        position: relative;
        display: block;
        width: 100%;
        max-width: 100%;
      }
      .order-date-control-wrap > input[type="hidden"] {
        display: none;
      }
      .order-date-trigger {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 100%;
        height: 32px;
        padding: 0 10px 0 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--muted);
        font: 14px/1.5 inherit;
        text-align: left;
        cursor: pointer;
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }
      .order-date-trigger:hover {
        background: var(--hover);
      }
      .order-date-trigger:focus-visible {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-bg);
      }
      .order-date-trigger[aria-invalid="true"] {
        border-color: var(--danger);
        box-shadow: 0 0 0 2px #ffe8eb;
      }
      .order-date-trigger-values {
        display: flex;
        align-items: center;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .order-date-trigger-value {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .order-date-trigger-value.is-selected {
        color: var(--body);
        font-family: "JetBrains Mono", monospace;
        font-variant-numeric: tabular-nums;
      }
      .order-date-trigger-separator {
        margin: 0 10px;
        color: var(--muted);
        flex: 0 0 auto;
      }
      .order-date-trigger .order-date-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        color: var(--muted);
        pointer-events: none;
      }
      /* 浮层使用 popover 提升到顶层后以 fixed 定位锚定触发器：展开不推动其它筛选条件，允许遮挡下方内容。 */
      .order-date-picker {
        position: fixed;
        inset: auto;
        margin: 0;
        width: 620px;
        max-width: min(620px, calc(100vw - 80px));
        z-index: 1200;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        padding: 16px;
      }
      .order-calendar-months {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .order-calendar-month {
        min-width: 0;
      }
      .order-calendar-month + .order-calendar-month {
        border-left: 1px solid var(--light);
        padding-left: 12px;
      }
      .order-calendar-month-head {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) 58px;
        align-items: center;
        margin-bottom: 8px;
      }
      .order-calendar-nav-group {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .order-calendar-nav {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 4px;
        color: var(--sub);

            return `<div class="tree-row ${ui.dept === d.id ? "active" : ""}" style="padding-left:${level * 20}px">${children.length ? `<button class="icon-btn" data-action="tree-expand" data-id="${d.id}" aria-label="${expanded.has(d.id) ? "收起" : "展开"}${esc(d.name)}" aria-expanded="${expanded.has(d.id)}">${icon(expanded.has(d.id) || query ? "chevron-down" : "chevron-right")}</button>` : '<span style="width:24px;flex-shrink:0"></span>'}<button class="tree-label" data-action="dept-select" data-id="${d.id}" title="${esc(d.name)}"><span>${esc(d.name)}</span><span class="muted small mono">${deptCount(d.id)}</span></button><button class="icon-btn node-more" data-action="dept-menu" data-id="${d.id}" aria-label="管理${esc(d.name)}">${icon("ellipsis")}</button></div>${expanded.has(d.id) || query ? treeRows(query, d.id, level + 1) : ""}`;
          })
          .join("");
      }
      // 登录请求列表已改为「申请状态页签 + 搜索」，筛选按钮与筛选抽屉不再提供。
      function openFilters() {}
      // 列表关键词检索已由公共层 YDSearchBox 接管（提交式搜索：输入不触发查询，点选范围 / 点击搜索 / 回车后才生效，含范围菜单与清空），页面不再重复处理 #keyword。
      document.addEventListener("input", (e) => {
        if (e.target.classList.contains("picker-search"))

      });
      document.addEventListener("keydown", (e) => {
        if (e.target.id === "jumpPage" && e.key === "Enter") {
          ui.page = Math.max(1, Number(e.target.value) || 1);
          remember();
          renderResults();
        }
        const tab = e.target.closest("[role=tab]");
        if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
          e.preventDefault();
          const tabs = $$("[role=tab]", tab.parentElement);
          let index = tabs.indexOf(tab);
          index =
            e.key === "Home"
              ? 0
              : e.key === "End"
                ? tabs.length - 1
                : (index + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                  tabs.length;
          tabs[index].click();
          $$("[role=tab]", document)
            .find((t) => t.dataset.id === tabs[index].dataset.id)
            ?.focus();
        }
      });
      document.addEventListener("click", (e) => {
        const target = e.target.closest("[data-action]");
        if (!target) return;
        const { action, id } = target.dataset;
        if (action === "page") {
          ui.page = Number(id);
          ui.selected = [];
          remember();
          renderResults();
        }
        if (action === "filters") openFilters();
        if (action === "reset-filter-draft") resetFilterDraft();
        if (action === "dept-add") departmentEditor();
        if (action === "dept-add-child") {
          closeDialog();
          departmentEditor(null, id);
        }
        if (action === "dept-edit") {
          closeDialog();
          departmentEditor(id);
        }
        if (action === "dept-delete") deleteDepartment(id);
        if (action === "dept-menu") departmentMenu(id);
        if (action === "tree-expand") {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          renderTree();
        }
        if (action === "dept-select") {
          ui.dept = id;
          ui.page = 1;
          ui.selected = [];
          remember();
          render();
        }
      });

      // 登录请求：申请状态页签筛选（「全部」不做状态过滤）、关键词检索与授权 / 拒绝流程。
      const LOGIN_TABS = ["全部", "等待授权", "授权成功", "授权拒绝"];
      function loginTabCount(status) {
        return status === "全部"
          ? data.logins.length

      }
      function loginRows() {

          (r) =>
            (ui.loginStatus === "全部" || r.status === ui.loginStatus) &&
            loginMatchesSearch(r),
        );
      }
      function render() {
        // 区块首行：申请状态页签（含「全部」，默认选中）与搜索框同处一个 div 内并排对齐。
        $("#workspace").innerHTML =
          `<div class="toolbar login-toolbar"><div class="tabs" role="tablist" aria-label="申请状态">${LOGIN_TABS.map((s) => `<button class="tab" role="tab" aria-selected="${ui.loginStatus === s}" tabindex="${ui.loginStatus === s ? 0 : -1}" data-action="login-tab" data-id="${s}">${s} <span class="mono">${loginTabCount(s)}</span></button>`).join("")}</div>${loginSearchBar()}</div><div id="results" role="tabpanel"></div>`;
        initLoginSearchBox();
        renderResults();
        icons();
        reportNavBadge();
      }
      function renderTree() {}
      function renderResults() {
        const rows = loginRows();
        const head = [
          "请求授权用户",
          "请求授权姓名",
          "终端类型",
          "终端识别码",
          "MAC 地址",
          "本机网络",

          "申请状态",

        // 暂无数据 / 搜索无结果时保留表头，空状态由 tbody 内的合并单元格承载，同时隐藏分页器。
        const body = rows.length
          ? sliceRows(rows)
              .map(
                (r) =>

        $("#results").innerHTML = `<div class="table-scroll"><table class="data-table" style="min-width:1280px"><thead><tr>${head.map((t) => `<th>${t}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>${rows.length ? pager(rows.length) : ""}`;
        icons();

      // 请求用户信息随授权 / 拒绝弹窗一并展示，字段为原始值（手机号或邮箱均不脱敏）。
      function requestUserInfo(r) {
        return `<div class="form">${[
          ["请求用户", r.user + " · " + r.name],
          ["终端类型", r.terminalType || "-"],
          ["终端识别码", r.device],
          ["MAC 地址", r.mac],

      /* ---------- 顶层浮层工具：把日期/时间面板提升为 popover，避免被 <dialog> 裁剪 ---------- */
      // 展开：面板脱离文档流固定定位在触发器下方（空间不足时翻到上方）；关闭：收回并隐藏。
      function openFloatPanel(panel, trigger, align = "left") {
        if (!panel || !trigger) return;
        panel.hidden = false;
        if (typeof panel.showPopover === "function" && !panel.matches(":popover-open")) {
          try {
            panel.showPopover();
          } catch (err) {
            /* 旧内核不支持时降级为普通固定定位浮层 */
          }
        }
        const rect = trigger.getBoundingClientRect(),
          width = panel.offsetWidth,
          height = panel.offsetHeight,
          pad = 12;
        let left = align === "right" ? rect.right - width : rect.left;
        let top = rect.bottom + 8;
        left = Math.max(pad, Math.min(left, window.innerWidth - width - pad));
        if (height && top + height > window.innerHeight - pad) {
          const above = rect.top - height - 8;
          top = above >= pad ? above : Math.max(pad, window.innerHeight - height - pad);
        }
        panel.style.top = Math.round(top) + "px";
        panel.style.left = Math.round(left) + "px";
      }
      function closeFloatPanel(panel) {
        if (!panel) return;
        if (typeof panel.hidePopover === "function" && panel.matches(":popover-open")) {
          try {
            panel.hidePopover();
          } catch (err) {
            /* 忽略重复收起 */
          }
        }
        panel.style.top = "";
        panel.style.left = "";
        panel.hidden = true;
      }

      /* ---------- 授权设置：可登录日期（双月日历浮层） ---------- */
      const authCalState = {
        view: new Date(2026, 6, 1),
        start: "",
        end: "",
        active: "start",
      };
      function authDateKey(date) {
        const y = date.getFullYear(),
          m = String(date.getMonth() + 1).padStart(2, "0"),
          d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }
      function authMaxDate() {
        return authDateKey(new Date());
      }
      function authDateObject(value) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || "");
        return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
      }
      function authDateCalendarMarkup() {
        const monthHead = (index, side) => {
          const nav = (dir, label, ico) =>
            `<button type="button" class="order-calendar-nav" data-auth-date-nav="${dir}" aria-label="${label}" title="${label}">${icon(ico)}</button>`;
          const prev = `${nav("prev-year", "上一年", "chevrons-left")}${nav("prev-month", "上个月", "chevron-left")}`;
          const next = `${nav("next-month", "下个月", "chevron-right")}${nav("next-year", "下一年", "chevrons-right")}`;
          return `<div class="order-calendar-month-head">${side === "left" ? `<div class="order-calendar-nav-group">${prev}</div>` : '<span class="order-calendar-nav-spacer" aria-hidden="true"></span>'}<h3 id="authDateMonth${index}" class="order-calendar-title"></h3>${side === "right" ? `<div class="order-calendar-nav-group">${next}</div>` : '<span class="order-calendar-nav-spacer" aria-hidden="true"></span>'}</div>`;
        };
        const month = (index, side) =>
          `<section class="order-calendar-month">${monthHead(index, side)}<div id="authDateWeeks${index}" class="order-calendar-week"></div><div id="authDateGrid${index}" class="order-calendar-grid"></div></section>`;
        return (
          `<div class="order-calendar-months">${month(1, "left")}${month(2, "right")}</div>` +
          '<div class="order-calendar-foot"><span id="authDateValue" class="order-calendar-value">未选择</span><div class="order-calendar-actions">' +
          '<button type="button" id="authDateClear" class="btn">清空</button><button type="button" id="authDateCancel" class="btn">取消</button><button type="button" id="authDateConfirm" class="btn primary">确定</button>' +
          "</div></div>"
        );
      }
      function authMonthHtml(year, month) {
        const first = new Date(year, month, 1),
          offset = first.getDay(),
          start = authCalState.start,
          end = authCalState.end,
          validRange = Boolean(start && end && end >= start),
          max = authMaxDate(),
          cells = [];
        for (let index = 0; index < 42; index++) {
          const date = new Date(year, month, index - offset + 1),
            key = authDateKey(date),
            current = date.getMonth() === month,
            inRange = validRange && key > start && key < end,
            isStart = key === start,
            isEnd = key === end,
            disabled = key > max;
          cells.push(
            `<button type="button" class="order-calendar-day ${current ? "" : "is-other "}${inRange ? "is-range " : ""}${isStart ? "is-start " : ""}${isEnd ? "is-end " : ""}" data-auth-calendar-date="${key}" ${disabled ? 'disabled aria-disabled="true"' : ""} aria-label="${key}">${date.getDate()}</button>`,
          );
        }
        return cells.join("");
      }
      function authRenderCalendar() {
        const left = new Date(
            authCalState.view.getFullYear(),
            authCalState.view.getMonth(),
            1,
          ),
          right = new Date(left.getFullYear(), left.getMonth() + 1, 1),
          weeks =
            "<span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>";
        [left, right].forEach((month, index) => {
          $("#authDateMonth" + (index + 1)).textContent =
            month.getFullYear() + " 年 " + (month.getMonth() + 1) + " 月";
          $("#authDateWeeks" + (index + 1)).innerHTML = weeks;
          $("#authDateGrid" + (index + 1)).innerHTML = authMonthHtml(
            month.getFullYear(),
            month.getMonth(),
          );
        });
        $("#authDateValue").textContent =
          authCalState.start && authCalState.end
            ? authCalState.start + " 至 " + authCalState.end
            : authCalState.start || authCalState.end || "未选择";
      }
      function authSyncDateTrigger() {
        [
          [$("#authDateStartDisplay"), authCalState.start, "开始日期"],
          [$("#authDateEndDisplay"), authCalState.end, "结束日期"],
        ].forEach(([node, value, placeholder]) => {
          if (!node) return;
          node.textContent = value || placeholder;
          node.classList.toggle("is-selected", Boolean(value));
        });
      }
      function authOpenDatePicker() {
        const picker = $("#authDatePicker");
        const base =
          authDateObject(authCalState.start || authCalState.end) ||
          new Date(2026, 6, 1);
        authCalState.view = new Date(base.getFullYear(), base.getMonth(), 1);
        openFloatPanel(picker, $("#authDateTrigger"));
        $("#authDateTrigger").setAttribute("aria-expanded", "true");
        authRenderCalendar();
      }
      function authCloseDatePicker(commit = false) {
        const picker = $("#authDatePicker");
        if (!picker || picker.hidden) return;
        if (commit) {
          if (authCalState.start && !authCalState.end)
            authCalState.end = authCalState.start;
          authSyncDateTrigger();
        }
        closeFloatPanel(picker);
        $("#authDateTrigger").setAttribute("aria-expanded", "false");
      }
      function authSetupDatePicker() {
        const picker = $("#authDatePicker"),
          trigger = $("#authDateTrigger");
        if (!picker || !trigger) return;
        trigger.onclick = () =>
          picker.hidden ? authOpenDatePicker() : authCloseDatePicker(false);
        picker.onclick = (e) => {
          e.stopPropagation();
          const nav = e.target.closest("[data-auth-date-nav]"),
            day = e.target.closest("[data-auth-calendar-date]");
          if (nav) {
            const d = nav.dataset.authDateNav,
              view = authCalState.view,
              y = d === "prev-year" ? -1 : d === "next-year" ? 1 : 0,
              m = d === "prev-month" ? -1 : d === "next-month" ? 1 : 0;
            authCalState.view = y
              ? new Date(view.getFullYear() + y, view.getMonth(), 1)
              : new Date(view.getFullYear(), view.getMonth() + m, 1);
            authRenderCalendar();
            return;
          }
          if (day) {
            const key = day.dataset.authCalendarDate;
            if (key > authMaxDate()) return;
            if (authCalState.active === "start") {
              authCalState.start = key;
              if (authCalState.end && authCalState.end < key)
                authCalState.end = "";
              authCalState.active = "end";
            } else if (!authCalState.start) {
              authCalState.start = key;
              authCalState.active = "end";
            } else {
              authCalState.end = key;
            }
            authRenderCalendar();
          }
        };
        $("#authDateClear").onclick = () => {
          authCalState.start = "";
          authCalState.end = "";
          authCalState.active = "start";
          authSyncDateTrigger();
          authRenderCalendar();
        };
        $("#authDateCancel").onclick = () => authCloseDatePicker(false);
        $("#authDateConfirm").onclick = () => {
          if (authCalState.start && !authCalState.end)
            authCalState.end = authCalState.start;
          authCloseDatePicker(true);
        };
        authSyncDateTrigger();
      }

      /* ---------- 授权设置：可登录时间（时 / 分 / 秒滚轮浮层） ---------- */
      const authTimeState = {
        start: { hour: 9, minute: 20, second: 27 },
        end: { hour: 10, minute: 20, second: 27 },
      };
      const authPad = (n) => String(n).padStart(2, "0");
      const authTimeString = (t) =>
        `${authPad(t.hour)}:${authPad(t.minute)}:${authPad(t.second)}`;
      function authTimePickerMarkup() {
        const col = (side, title) =>
          `<section class="time-col" data-time-side="${side}"><h4>${title}</h4><div class="time-wheels">${[
            "hour",
            "minute",
            "second",
          ]
            .map((unit) => `<div class="time-wheel" data-unit="${unit}"></div>`)
            .join("")}</div></section>`;
        return `<div class="time-cols">${col("start", "开始时间")}${col("end", "结束时间")}</div><div class="time-picker-foot"><button type="button" id="authTimeCancel" class="text-btn">取消</button><button type="button" id="authTimeConfirm" class="text-btn primary">确定</button></div>`;
      }
      function authHighlightWheel(wheel) {
        const side = wheel.closest("[data-time-side]").dataset.timeSide,
          unit = wheel.dataset.unit,
          value = authTimeState[side][unit];
        $$("button[data-value]", wheel).forEach((b) =>
          b.setAttribute("aria-selected", String(Number(b.dataset.value) === value)),
        );
      }
      function authFillWheels() {
        $$("#authTimePicker .time-wheel").forEach((wheel) => {
          const side = wheel.closest("[data-time-side]").dataset.timeSide,
            unit = wheel.dataset.unit,
            max = unit === "hour" ? 23 : 59;
          wheel.innerHTML = Array.from(
            { length: max + 1 },
            (_, i) =>
              `<button type="button" data-value="${i}" aria-selected="${i === authTimeState[side][unit]}">${authPad(i)}</button>`,
          ).join("");
          const active = wheel.querySelector('[aria-selected="true"]');
          if (active)
            wheel.scrollTop =
              active.offsetTop -
              wheel.clientHeight / 2 +
              active.offsetHeight / 2;
        });
      }
      function authSetupTimePicker() {
        const picker = $("#authTimePicker"),
          trigger = $("#authTimeTrigger");
        if (!picker || !trigger) return;
        let snapshot = null;
        const readState = () => {
          const start = $("#authTimeStartDisplay"),
            end = $("#authTimeEndDisplay");
          start.textContent = authTimeString(authTimeState.start);
          end.textContent = authTimeString(authTimeState.end);
          start.classList.add("is-selected");
          end.classList.add("is-selected");
        };
        trigger.onclick = () => {
          if (picker.hidden) {
            snapshot = JSON.parse(JSON.stringify(authTimeState));
            authFillWheels();
            openFloatPanel(picker, trigger);
            trigger.setAttribute("aria-expanded", "true");
          } else {
            closeFloatPanel(picker);
            trigger.setAttribute("aria-expanded", "false");
          }
        };
        picker.onclick = (e) => {
          e.stopPropagation();
          const wheel = e.target.closest(".time-wheel");
          const btn = e.target.closest("button[data-value]");
          if (wheel && btn) {
            const side = wheel.closest("[data-time-side]").dataset.timeSide;
            authTimeState[side][wheel.dataset.unit] = Number(btn.dataset.value);
            authHighlightWheel(wheel);
          }
        };
        $$("#authTimePicker .time-wheel").forEach((wheel) => {
          wheel.addEventListener("scroll", () => {
            clearTimeout(wheel._scrollTimer);
            wheel._scrollTimer = setTimeout(() => {
              const center = wheel.scrollTop + wheel.clientHeight / 2;
              let best = null,
                bestDist = Infinity;
              $$("button[data-value]", wheel).forEach((b) => {
                const c = b.offsetTop + b.offsetHeight / 2,
                  d = Math.abs(c - center);
                if (d < bestDist) {
                  bestDist = d;
                  best = b;
                }
              });
              if (best) {
                const side = wheel.closest("[data-time-side]").dataset.timeSide;
                authTimeState[side][wheel.dataset.unit] = Number(best.dataset.value);
                authHighlightWheel(wheel);
              }
            }, 120);
          });
        });
        $("#authTimeCancel").onclick = () => {
          if (snapshot) {
            authTimeState.start = { ...snapshot.start };
            authTimeState.end = { ...snapshot.end };
          }
          readState();
          closeFloatPanel(picker);
          trigger.setAttribute("aria-expanded", "false");
        };
        $("#authTimeConfirm").onclick = () => {
          readState();
          closeFloatPanel(picker);
          trigger.setAttribute("aria-expanded", "false");
        };
        readState();
      }
      function setupAuthorizeDialog() {
        const dialog = $("#businessDialog");
        dialog.classList.add("has-floating-panel");
        const fixedWrap = $("#authFixedWrap");
        const modeInputs = $$('input[name="authTimeMode"]');
        const syncMode = () => {
          const mode =
            $('input[name="authTimeMode"]:checked')?.value || "unlimited";
          fixedWrap.hidden = mode !== "fixed";
        };
        modeInputs.forEach((el) => el.addEventListener("change", syncMode));
        syncMode();
        const bindEnable = (checkboxId, wrapId) => {
          const checkbox = $("#" + checkboxId),
            wrap = $("#" + wrapId);
          if (!checkbox || !wrap) return;
          const sync = () => {
            // 勾选后才启用：未勾选时该维度不作为限制条件，触发器也不可操作。
            const on = checkbox.checked;
            wrap.style.opacity = on ? "1" : "0.5";
            wrap.style.pointerEvents = on ? "" : "none";
            const trigger = $("button", wrap);
            if (trigger) {
              trigger.setAttribute("aria-disabled", on ? "false" : "true");
              trigger.tabIndex = on ? 0 : -1;
            }
          };
          checkbox.addEventListener("change", sync);
          sync();
        };
        bindEnable("authDateEnabled", "authDateWrap");
        bindEnable("authTimeEnabled", "authTimeWrap");
        authSetupDatePicker();
        authSetupTimePicker();
        $("#authDateEnabled").addEventListener("change", (e) => {
          if (!e.target.checked) authCloseDatePicker(false);
        });
        $("#authTimeEnabled").addEventListener("change", (e) => {
          if (!e.target.checked) {
            closeFloatPanel($("#authTimePicker"));
            $("#authTimeTrigger").setAttribute("aria-expanded", "false");
          }
        });
      }
      // 授权设置：勾选后才启用并作为限制条件；不勾选表示该维度不限，两项均不勾选也可保存。
      function openAuthorizeDialog(id) {
        const r = data.logins.find((x) => x.id === id);
        if (!r || r.status !== "等待授权") return;
        openDialog(
          "授权设置",
          authorizeMarkup(),
          () => {
            const mode =
              $('input[name="authTimeMode"]:checked')?.value || "unlimited";
            if (mode === "fixed") {
              const dateOn = Boolean($("#authDateEnabled").checked);
              const timeOn = Boolean($("#authTimeEnabled").checked);
              const start = authCalState.start,
                end = authCalState.end;
              if (dateOn && (!start || !end)) {
                toast("请选择完整的可登录日期范围");
                return false;
              }
              if (dateOn && start > end) {
                toast("结束日期不能早于开始日期");
                return false;
              }
              r.authSetting =
                "固定登录时间" +
                [
                  dateOn ? `（可登录日期 ${start} 至 ${end}）` : "",
                  timeOn
                    ? `（可登录时间 ${authTimeString(authTimeState.start)} 至 ${authTimeString(authTimeState.end)}）`
                    : "",
                ].join("");
            } else {
              r.authSetting = "不限";
            }
            r.status = "授权成功";
            r.grantTime = dateTime().slice(0, 16);
            commit("已完成该登录请求的授权设置");
          },
          { confirm: "保存" },
        );
        setupAuthorizeDialog();
      }
      function authorizeMarkup() {
        return `<form class="form auth-form" onsubmit="return false">
          <div class="form-row"><label><span class="required">*</span>时间设置：</label><div class="field-wrap"><div class="radio-row"><label class="radio-opt"><input type="radio" name="authTimeMode" value="unlimited" checked><span>不限</span></label><label class="radio-opt"><input type="radio" name="authTimeMode" value="fixed"><span>固定登录时间</span></label></div></div></div>
          <div id="authFixedWrap" class="auth-fixed-list" hidden>
            <div class="form-row auth-fixed-row"><label class="auth-check"><input type="checkbox" id="authDateEnabled"><span>可登录日期：</span></label><div class="field-wrap"><div id="authDateWrap" class="order-date-control-wrap" role="group" aria-label="可登录日期"><input id="authDateStart" type="hidden" value=""><input id="authDateEnd" type="hidden" value=""><button id="authDateTrigger" type="button" class="order-date-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="authDatePicker"><span class="order-date-trigger-values"><span id="authDateStartDisplay" class="order-date-trigger-value">开始日期</span><span class="order-date-trigger-separator" aria-hidden="true">→</span><span id="authDateEndDisplay" class="order-date-trigger-value">结束日期</span></span>${icon("calendar-days")}</button><div id="authDatePicker" class="order-date-picker" role="dialog" aria-label="可登录日期范围选择" popover="manual" hidden>${authDateCalendarMarkup()}</div></div></div></div>
            <div class="form-row auth-fixed-row"><label class="auth-check"><input type="checkbox" id="authTimeEnabled"><span>可登录时间：</span></label><div class="field-wrap"><div id="authTimeWrap" class="time-range-control" role="group" aria-label="可登录时间"><button id="authTimeTrigger" type="button" class="time-range-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="authTimePicker"><span id="authTimeStartDisplay" class="time-range-value is-selected">09:20:27</span><span class="time-range-separator" aria-hidden="true">→</span><span id="authTimeEndDisplay" class="time-range-value is-selected">10:20:27</span></button><div id="authTimePicker" class="time-range-picker" role="dialog" aria-label="可登录时间范围选择" popover="manual" hidden>${authTimePickerMarkup()}</div></div></div></div>
          </div>
        </form>`;
      }
      // 拒绝授权设置：橙色警示条 + 请求用户信息，二次确认后写入拒绝状态。
      function openRejectDialog(id) {
        const r = data.logins.find((x) => x.id === id);
        if (!r || r.status !== "等待授权") return;
        openDialog(
          "拒绝授权设置",
          `<form class="form" onsubmit="return false"><div class="notice-alert">${icon("alert-triangle")}<span>此操作将阻止申请用户登录,请谨慎操作。</span></div>${requestUserInfo(r)}</form>`,
          () => {
            r.status = "授权拒绝";
            r.grantTime = dateTime().slice(0, 16);
            commit("已拒绝该登录请求");
          },
          { confirm: "确定" },
        );
      }
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-action]");
        if (!t) return;
        const { action, id } = t.dataset;
        if (action === "login-tab") {
          ui.loginStatus = id;
          ui.page = 1;
          remember();
          render();
        }
        if (action === "login-allow") openAuthorizeDialog(id);
        if (action === "login-reject") openRejectDialog(id);
      });
      // 点击日期 / 时间面板之外的区域视为取消展开，不推动其它筛选组件。
      document.addEventListener("click", (e) => {
        const dateWrap = $("#authDateWrap"),
          datePicker = $("#authDatePicker");
        if (dateWrap && datePicker && !datePicker.hidden && !dateWrap.contains(e.target))
          authCloseDatePicker(false);
        const timeWrap = $("#authTimeWrap"),
          timePicker = $("#authTimePicker");
        if (timeWrap && timePicker && !timePicker.hidden && !timeWrap.contains(e.target)) {
          closeFloatPanel(timePicker);
          $("#authTimeTrigger").setAttribute("aria-expanded", "false");
        }
      });
      start();
    </script>
  </body>
</html>
