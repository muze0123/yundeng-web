  <script>
    const $ = id => document.getElementById(id);
    const deepClone = value => JSON.parse(JSON.stringify(value));

xy-permission" data-anno="8" class="section-block scroll-mt-4"><h2 class="text-[17px] font-semibold text-ink-title">代理数据权限</h2>${settingToggleRow('team.proxyDataPermission','是否开启代理数据权限','按创始人、部门管理员与普通成员范围控制可查看代理。',settings.team.proxyDataPermission)}<div class="mt-2 max-w-[760px] rounded bg-info-bg px-4 py-3 text-[12px] leading-5 text-info"><i data-lucide="info" class="inline w-4 h-4 mr-1"></i>代理授权入口：代理管理-平台/自有/代理API对应代理授权列。</div></section><section id="defaults" data-anno="9" class="section-block scroll-mt-4"><h2 class="text-[17px] font-semibold text-ink-title">默认偏好项</h2><p class="mt-1 text-[12px] text-ink-sub">新建环境默认继承以下团队配置，成员实际可修改范围以权限为准。</p><div class="mt-3 divide-y divide-line-lighter"><div class="pref-row"><p class="font-medium text-ink-title">禁止加载图片</p>${segment('team.defaults.images',[['custom','自定义'],['off','关闭']],d.images)}</div>${[['video','禁止加载视频'],['sound','禁止播放声音'],['memory','定时内存回收'],['cache','自动删除缓存'],['cookie','自动删除 Cookie'],['fingerprint','启动时随机生成指纹']].map(([key,label])=>`<div class="pref-row"><p class="font-medium text-ink-title">${label}</p>${segment(`team.defaults.${key}`,[['true','开启'],['false','关闭']],String(d[key]))}</div>`).join('')}</div></section></div>`;

    function navigationRow(item,index,total,parentId='root') {
      return `<div class="sortable-row min-h-[48px] px-3 flex items-center gap-3 border-b border-line-lighter last:border-0" draggable="true" data-sort-id="${item.id}" data-parent="${parentId}"><button class="w-7 h-7 rounded flex items-center justify-center text-ink-muted hover:bg-hover" data-drag-handle aria-label="拖动${item.label}"><i data-lucide="grip-vertical" class="w-4 h-4"></i></button><span class="w-8 h-8 rounded bg-page text-ink-sub flex items-center justify-center">${item.icon?`<i data-lucide="${item.icon}" class="w-4 h-4"></i>`:'<span class="w-1.5 h-1.5 rounded-full bg-line"></span>'}</span><span class="flex-1 text-ink-title ${parentId!=='root'?'text-[12px]':''}">${item.label}</span><div class="flex items-center gap-1"><button class="w-7 h-7 rounded flex items-center justify-center text-ink-muted hover:bg-hover disabled:opacity-30" data-move="up" data-id="${item.id}" data-parent="${parentId}" ${index===0?'disabled':''} aria-label="上移${item.label}"><i data-lucide="chevron-up" class="w-4 h-4"></i></button><button class="w-7 h-7 rounded flex items-center justify-center text-ink-muted hover:bg-hover disabled:opacity-30" data-move="down" data-id="${item.id}" data-parent="${parentId}" ${index===total-1?'disabled':''} aria-label="下移${item.label}"><i data-lucide="chevron-down" class="w-4 h-4"></i></button></div>${switchButton(`navigation.${parentId}.${item.id}`,item.visible,`${item.label}导航`)}</div>`;
    }
    function renderNavigation() {
      const side=settings.sideNavigation.map((item,index)=>`<div>${navigationRow(item,index,settings.sideNavigation.length)}${item.children?`<div class="ml-12 border-l border-line-light">${item.children.map((child,childIndex)=>navigationRow(child,childIndex,item.children.length,item.id)).join('')}</div>`:''}</div>`).join('');
      const groups=settings.tabGroups.map(group=>`<section class="border border-line-light rounded-lg overflow-hidden"><header class="h-12 px-4 bg-page flex items-center gap-2"><i data-lucide="${group.icon}" class="w-4 h-4 text-primary"></i><strong class="text-ink-title">${group.label}</strong></header><div class="divide-y divide-line-lighter">${group.items.map(item=>`<div class="h-12 px-4 flex items-center justify-between gap-3"><span>${item.label}</span>${switchButton(`tabs.${group.id}.${item.id}`,item.visible,`${item.label} Tab`)}</div>`).join('')}</div></section>`).join('');
      return `<div class="grid xl:grid-cols-[minmax(420px,.95fr)_minmax(420px,1.05fr)] gap-6"><section id="side-navigation" data-anno="10" class="scroll-mt-4 min-w-0"><div><h2 class="text-[17px] font-semibold text-ink-title">侧边导航设置</h2><p class="mt-1 text-[12px] text-ink-sub">控制模块显隐与同层顺序。可拖拽手柄，或使用上下移动按钮。</p></div><div class="mt-4 border border-line-light rounded-lg overflow-hidden">${side}</div><p class="mt-3 text-[12px] text-ink-sub flex items-center gap-1.5"><i data-lucide="lock-keyhole" class="w-4 h-4"></i>设置入口固定保留；隐藏导航不改变业务权限。</p></section><section id="tab-navigation" data-anno="11" class="scroll-mt-4 min-w-0"><div><h2 class="text-[17px] font-semibold text-ink-title">Tab 导航设置</h2><p class="mt-1 text-[12px] text-ink-sub">按模块配置可见 Tab，每组至少保留一项。</p></div><div class="mt-4 grid md:grid-cols-2 xl:grid-cols-1 2xl:grid-cols-2 gap-3">${groups}</div></section></div>`;
    }

    function renderAgreement() {
      return `<article id="agreement-content" data-anno="12" class="max-w-[920px] mx-auto scroll-mt-4"><header class="text-center pb-6 border-b border-line-light"><span class="w-11 h-11 rounded-lg bg-primary-bg text-primary mx-auto flex items-center justify-center"><i data-lucide="file-check-2" class="w-5 h-5"></i></span><h2 class="mt-4 text-[22px] font-semibold text-ink-title">服务协议</h2><p class="mt-2 mono text-[12px] text-ink-sub">更新日期：2024年1月1日</p></header><div class="mt-6 h-[min(620px,calc(100vh-310px))] min-h-[360px] overflow-y-auto pr-3 text-[14px] leading-8 text-ink-body"><h3 class="text-[16px] font-semibold text-ink-title">序言</h3><p class="mt-2">云登浏览器由杭州辰链信息科技有限公司（以下简称“辰链公司”或“我们”）开发和运营。请在使用产品与服务前阅读本协议及相关隐私规则。</p><div class="mt-6 space-y-6"><section><h3 class="font-semibold text-ink-title">一、我们如何收集和使用您的个人/企业信息</h3><p class="mt-2">我们仅在提供账号、团队协作、环境运行和安全保障所必要的范围内处理相关信息。具体字段、用途、保存期限和授权方式应以正式发布文本为准。</p></section><section><h3 class="font-semibold text-ink-title">二、我们如何存储您的个人/企业信息</h3><p class="mt-2">信息存储区域、期限、备份与删除机制由正式隐私政策说明；原型页面不构成实际数据处理承诺。</p></section><section><h3 class="font-semibold text-ink-title">三、我们如何转移、公开您的个人/企业信息</h3><p class="mt-2">除法律要求、获得授权或实现已说明的服务目的外，不应擅自转移或公开相关信息。</p></section><section><h3 class="font-semibold text-ink-title">四、我们如何保护您的个人/企业信息</h3><p class="mt-2">通过访问控制、传输保护、审计和安全响应等措施降低信息风险，具体措施以正式政策和安全规范为准。</p></section><section><h3 class="font-semibold text-ink-title">五、您管理个人/企业信息的权利</h3><p class="mt-2">用户可以依法访问、更正、删除或撤回授权；可操作入口和处理时限由正式协议列明。</p></section><section><h3 class="font-semibold text-ink-title">六、未成年人个人信息的保护</h3><p class="mt-2">产品面向企业及专业用户，涉及未成年人信息时应按照适用法律采取额外保护措施。</p></section><section><h3 class="font-semibold text-ink-title">七、隐私政策的变更和修订</h3><p class="mt-2">重大变更应通过合理方式通知，并保留版本、更新时间和生效时间。</p></section><section><h3 class="font-semibold text-ink-title">八、如何联系我们</h3><p class="mt-2">正式联系方式、受理流程和响应时限由法务审定后的服务协议统一发布。</p></section></div><div class="mt-8 rounded bg-warning-bg px-4 py-3 text-[12px] leading-6 text-warning"><strong>原型说明：</strong>以上为结构性代表文本，不是正式法律条款。生产上线必须替换为法务审核并可追溯版本的完整正文。</div></div></article>`;
    }

    function renderContent() {
      const html=activeTab==='local'?renderLocal():activeTab==='personal'?renderPersonal():activeTab==='team'?renderTeam():activeTab==='navigation'?renderNavigation():renderAgreement();
      $('settingContent').innerHTML=html;
      bindContentEvents();
      refreshIconsAndAnno();
    }
    function renderAll() { renderTabs(); renderSubnav(); renderContent(); }

    function updateSetting(path,value) { setPath(settings,path,value); renderContent(); simulateSave(); }
    function validatePreloadUrl() {
      const input=$('preloadUrl'); if(!input) return true;
      const value=input.value.trim(); const valid=/^https?:\/\/[^\s]+$/i.test(value);
      input.classList.toggle('border-danger',!valid); $('preloadError').classList.toggle('hidden',valid);
      if(valid && value!==settings.team.preloadUrl){ settings.team.preloadUrl=value; simulateSave(); }
      return valid;
    }
    function bindContentEvents() {
      $('checkVersionBtn')?.addEventListener('click',event=>{const button=event.currentTarget; button.disabled=true; button.innerHTML='<i data-lucide="loader-circle" class="w-4 h-4 animate-spin"></i>检查中'; lucide.createIcons(); setTimeout(()=>{button.disabled=false;button.innerHTML='<i data-lucide="refresh-cw" class="w-4 h-4"></i>检查更新';lucide.createIcons();toast('当前已是最新版本');},700);});
      $('localDownloadAll')?.addEventListener('click',downloadAll);
      document.querySelectorAll('[data-kernel-action]').forEach(button=>button.addEventListener('click',()=>downloadKernel(button.dataset.kernelAction)));
      document.querySelectorAll('[data-setting]').forEach(control=>control.addEventListener('change',()=>{setPath(settings,control.dataset.setting,control.value);simulateSave();}));
      document.querySelectorAll('[data-launch-rule]').forEach(button=>button.addEventListener('click',()=>{settings.personal.batchLaunchRule=button.dataset.launchRule;simulateSave();renderContent();}));
      document.querySelectorAll('[data-segment]').forEach(button=>button.addEventListener('click',()=>{const path=button.dataset.segment;let value=button.dataset.value;if(value==='true'||value==='false')value=value==='true';setPath(settings,path,value);simulateSave();renderContent();}));
      document.querySelectorAll('[data-switch]').forEach(button=>button.addEventListener('click',()=>handleSwitch(button.dataset.switch,button)));
      $('preloadUrl')?.addEventListener('blur',validatePreloadUrl);
      $('preloadUrl')?.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();validatePreloadUrl();}});
      document.querySelectorAll('[data-move]').forEach(button=>button.addEventListener('click',()=>moveNavigation(button.dataset.parent,button.dataset.id,button.dataset.move)));
      document.querySelectorAll('.sortable-row').forEach(row=>{row.addEventListener('dragstart',()=>{draggedItem={id:row.dataset.sortId,parent:row.dataset.parent};row.classList.add('dragging');});row.addEventListener('dragend',()=>{row.classList.remove('dragging');draggedItem=null;});row.addEventListener('dragover',event=>event.preventDefault());row.addEventListener('drop',event=>{event.preventDefault();if(!draggedItem||draggedItem.parent!==row.dataset.parent||draggedItem.id===row.dataset.sortId)return;reorderNavigation(row.dataset.parent,draggedItem.id,row.dataset.sortId);});});
    }
    function handleSwitch(path,button) {
      if(path==='team.proxyDataPermission' && !settings.team.proxyDataPermission){ permissionTrigger=button; openPermissionModal(); return; }
      if(path.startsWith('navigation.')) { const [,parent,id]=path.split('.'); const collection=parent==='root'?settings.sideNavigation:settings.sideNavigation.find(item=>item.id===parent)?.children; const item=collection?.find(entry=>entry.id===id); if(item){item.visible=!item.visible;simulateSave();renderContent();} return; }
      if(path.startsWith('tabs.')) { const [,groupId,itemId]=path.split('.');const group=settings.tabGroups.find(item=>item.id===groupId);const item=group?.items.find(entry=>entry.id===itemId);if(!item)return;if(item.visible&&group.items.filter(entry=>entry.visible).length===1){toast('每组至少保留一个可见 Tab','warning');return;}item.visible=!item.visible;simulateSave();renderContent();return; }
      updateSetting(path,!getPath(settings,path));
    }
    function moveNavigation(parent,id,direction) { const collection=parent==='root'?settings.sideNavigation:settings.sideNavigation.find(item=>item.id===parent)?.children;if(!collection)return;const index=collection.findIndex(item=>item.id===id);const target=index+(direction==='up'?-1:1);if(target<0||target>=collection.length)return;[collection[index],collection[target]]=[collection[target],collection[index]];simulateSave();renderContent(); }
    function reorderNavigation(parent,sourceId,targetId) { const collection=parent==='root'?settings.sideNavigation:settings.sideNavigation.find(item=>item.id===parent)?.children;if(!collection)return;const source=collection.findIndex(item=>item.id===sourceId),target=collection.findIndex(item=>item.id===targetId);if(source<0||target<0)return;const [item]=collection.splice(source,1);collection.splice(target,0,item);simulateSave();renderContent(); }

    function downloadKernel(id) {
      const kernel=kernels.find(item=>item.id===id); if(!kernel||kernel.status==='downloading'||kernel.status==='latest') return;
      kernel.status='downloading'; kernel.progress=4; renderContent(); renderUpdateCenter();
      if(downloadTimers.has(id))clearInterval(downloadTimers.get(id));
      const timer=setInterval(()=>{kernel.progress=Math.min(100,kernel.progress+Math.floor(Math.random()*13)+7);if(kernel.progress>=100){clearInterval(timer);downloadTimers.delete(id);kernel.status='latest';kernel.progress=100;toast(`${kernel.name} 下载完成`);updateUpdateDot();}if(activeTab==='local')renderContent();renderUpdateCenter();},420);
      downloadTimers.set(id,timer);
    }
    function downloadAll() { const pending=kernels.filter(item=>item.status==='not_downloaded'||item.status==='failed');if(!pending.length){toast('没有待下载的内核','info');return;}pending.forEach(item=>downloadKernel(item.id));toast(`已加入 ${pending.length} 个下载任务`,'info'); }
    function updateUpdateDot() { const pending=kernels.some(item=>item.status==='not_downloaded'||item.status==='update_available');$('updateDot').classList.toggle('hidden',!pending); }
    function renderUpdateCenter() {
      if($('updateDrawer').classList.contains('hidden'))return;
      const visible=kernels.filter(item=>['147','146','107'].includes(item.id)||item.status==='downloading');
      $('updateSummary').textContent=`${kernels.filter(item=>item.status==='not_downloaded'||item.status==='update_available').length} 项可更新`;
      $('updateList').innerHTML=visible.map(kernel=>{const status=statusView(kernel);return `<article class="border border-line-light rounded-lg p-4"><div class="flex items-start justify-between gap-3"><div><div class="flex flex-wrap items-center gap-2"><strong class="text-ink-title">${kernel.name.toLowerCase()} 内核</strong><span class="mono text-[11px] text-ink-sub">${kernel.version}</span>${kernel.id==='147'?'<span class="status-pill bg-danger-bg text-danger">新版本</span>':''}</div><ul class="mt-3 pl-5 list-disc text-[12px] leading-6 text-ink-sub">${releaseNotes.map(note=>`<li>${note}</li>`).join('')}</ul></div><span class="status-pill ${status.tone} shrink-0">${status.label}</span></div>${kernel.status==='downloading'?`<div class="mt-4"><div class="flex justify-between text-[11px] text-ink-sub mb-1.5"><span>下载中</span><span class="mono">${Math.round(kernel.progress)}%</span></div><div class="progress-track"><div class="progress-value" style="width:${kernel.progress}%"></div></div></div>`:`<div class="mt-4 flex justify-end">${kernelAction(kernel)}</div>`}</article>`;}).join('');
      $('updateList').querySelectorAll('[data-kernel-action]').forEach(button=>button.addEventListener('click',()=>downloadKernel(button.dataset.kernelAction)));
      refreshIconsAndAnno();
    }
    function openUpdateCenter() { $('updateOverlay').classList.remove('hidden');$('updateDrawer').classList.remove('hidden');$('updateDrawer').classList.add('flex');$('updateCenterBtn').setAttribute('aria-expanded','true');pushAnnoScope($('updateDrawer'));renderUpdateCenter();setTimeout(()=>$('closeUpdate').focus(),0); }
    function closeUpdateCenter() { $('updateOverlay').classList.add('hidden');$('updateDrawer').classList.add('hidden');$('updateDrawer').classList.remove('flex');$('updateCenterBtn').setAttribute('aria-expanded','false');popAnnoScope($('updateDrawer'));$('updateCenterBtn').focus(); }
    function openPermissionModal() { $('permissionModal').classList.remove('hidden');$('permissionModal').classList.add('flex');pushAnnoScope($('permissionPanel'));setTimeout(()=>$('cancelPermission').focus(),0); }
    function closePermissionModal() { $('permissionModal').classList.add('hidden');$('permissionModal').classList.remove('flex');popAnnoScope($('permissionPanel'));permissionTrigger?.focus();permissionTrigger=null; }
    function confirmPermission() { settings.team.proxyDataPermission=true;closePermissionModal();simulateSave();renderContent(); }

    function pushAnnoScope(element) { if(!annoScopeStack.includes(element))annoScopeStack.push(element);renderAnnoBadges(); }
    function popAnnoScope(element) { annoScopeStack=annoScopeStack.filter(item=>item!==element);renderAnnoBadges(); }
    function renderAnnoBadges() { const layer=$('annoLayer');layer.innerHTML='';if(!annoVisible||!$('annoPopup').classList.contains('hidden'))return;const root=annoScopeStack.at(-1)||document;const seen=new Set();root.querySelectorAll('[data-anno]').forEach(element=>{const id=element.dataset.anno;if(seen.has(id)||!annotations[id])return;const target=(element.getBoundingClientRect().width>innerWidth*.7?element.querySelector('h1,h2,h3,button')||element:element);const rect=target.getBoundingClientRect();if(!rect.width||!rect.height||rect.bottom<0||rect.top>innerHeight)return;seen.add(id);const badge=document.createElement('button');badge.className='anno-badge';badge.textContent=id;badge.style.left=Math.max(2,Math.min(innerWidth-22,rect.right-10))+'px';badge.style.top=Math.max(2,Math.min(innerHeight-22,rect.top-10))+'px';badge.setAttribute('aria-label',`查看标注 ${id}`);badge.onclick=()=>showAnno(id);layer.appendChild(badge);}); }
    function showAnno(id) { const item=annotations[id];if(!item)return;$('annoTitle').textContent=`${id}. ${item.title}`;$('annoDesc').innerHTML=`<ul class="list-disc pl-5 space-y-2">${item.desc.map(text=>`<li>${text}</li>`).join('')}</ul>`;$('annoPopup').classList.remove('hidden');$('annoPopup').classList.add('flex');renderAnnoBadges();$('closeAnno').focus(); }
    function closeAnno() { $('annoPopup').classList.add('hidden');$('annoPopup').classList.remove('flex');renderAnnoBadges(); }

    $('settingNav').addEventListener('click',event=>{const button=event.target.closest('[data-sub]');if(!button)return;activeSub=button.dataset.sub;renderSubnav();document.getElementById(activeSub)?.scrollIntoView({behavior:'smooth',block:'start'});});
    document.querySelectorAll('[data-nav-group]').forEach(button=>button.addEventListener('click',()=>{const group=button.dataset.navGroup,target=$(group+'Nav'),expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!expanded));target.classList.toggle('hidden',expanded);button.querySelector('.nav-chevron').setAttribute('data-lucide',expanded?'chevron-right':'chevron-down');lucide.createIcons();}));
    $('collapseBtn').addEventListener('click',()=>{sidebarCompact=!sidebarCompact;$('sidebar').classList.toggle('compact',sidebarCompact);$('collapseBtn').innerHTML=`<i data-lucide="${sidebarCompact?'panel-left-open':'panel-left-close'}" class="w-[18px] h-[18px]"></i>`;$('collapseBtn').setAttribute('aria-label',sidebarCompact?'展开侧栏':'收起侧栏');lucide.createIcons();renderAnnoBadges();});
    $('mobileMenu').addEventListener('click',()=>{$('sidebar').classList.toggle('compact');});
    $('updateCenterBtn').addEventListener('click',openUpdateCenter);$('closeUpdate').addEventListener('click',closeUpdateCenter);$('updateOverlay').addEventListener('click',closeUpdateCenter);$('downloadAllBtn').addEventListener('click',downloadAll);
    $('closePermission').addEventListener('click',closePermissionModal);$('cancelPermission').addEventListener('click',closePermissionModal);$('confirmPermission').addEventListener('click',confirmPermission);$('permissionModal').addEventListener('click',event=>{if(event.target===$('permissionModal'))closePermissionModal();});
    $('guideBtn').addEventListener('click',()=>{$('helpPopover').classList.toggle('hidden');$('accountPopover').classList.add('hidden');});$('sideHelpBtn').addEventListener('click',()=>{$('helpPopover').classList.toggle('hidden');});$('accountBtn').addEventListener('click',()=>{$('accountPopover').classList.toggle('hidden');$('helpPopover').classList.add('hidden');});$('noticeBtn').addEventListener('click',()=>toast('暂无新通知','info'));
    document.addEventListener('click',event=>{if(!event.target.closest('#guideBtn,#sideHelpBtn,#helpPopover'))$('helpPopover').classList.add('hidden');if(!event.target.closest('#accountBtn,#accountPopover'))$('accountPopover').classList.add('hidden');});
    $('closeAnno').addEventListener('click',closeAnno);$('annoPopup').addEventListener('click',event=>{if(event.target===$('annoPopup'))closeAnno();});
    $('mainContent').addEventListener('scroll',renderAnnoBadges,{passive:true});window.addEventListener('resize',renderAnnoBadges);
    document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(!$('annoPopup').classList.contains('hidden'))closeAnno();else if(!$('permissionModal').classList.contains('hidden'))closePermissionModal();else if(!$('updateDrawer').classList.contains('hidden'))closeUpdateCenter();else{$('helpPopover').classList.add('hidden');$('accountPopover').classList.add('hidden');}});

    const requestedTab=new URLSearchParams(location.search).get('tab');if(tabs.some(tab=>tab.id===requestedTab)){activeTab=requestedTab;activeSub=tabs.find(tab=>tab.id===requestedTab).subs[0][0];}
    renderAll();updateUpdateDot();refreshIconsAndAnno();
    if(new URLSearchParams(location.search).get('panel')==='updates')openUpdateCenter();
  </script>
