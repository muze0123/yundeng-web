    .data-table tbody tr.selected td { background:#E6F0FF; }

    .data-table tbody tr:hover .action-column { background:#F3F4F6; }
    .data-table tbody tr.selected .action-column { background:#E6F0FF; }

    .pg-nav, .pg-right { display:flex; align-items:center; }

    .pg-btn, .pg-ellipsis { min-width:30px; height:30px; padding:0 8px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #DFE1E5; border-radius:4px; background:#FFFFFF; color:#3A3F4A; font-size:12px; font-weight:500; line-height:28px; transition:all .15s; }

    .pg-select { width:92px; height:30px; padding:0 24px 0 8px; border:1px solid #DFE1E5; border-radius:4px; background:#FFFFFF; color:#3A3F4A; font-size:12px; appearance:none; }
    .pg-select:hover, .pg-jump-input:hover { border-color:#9DA2AC; }
    .pg-select:focus, .pg-jump-input:focus { border-color:#0066FF; box-shadow:0 0 0 2px #E6F0FF; outline:none; }

    .pg-stats { color:#9DA2AC; white-space:nowrap; }

    <main id="mainContent" class="min-h-screen min-w-0 overflow-auto p-4">
      <section class="bg-card rounded-lg p-5 md:p-6 mb-4 min-w-0" aria-labelledby="filterTitle">

          <div class="filter-item">
            <label class="filter-label" for="searchInput">关键词</label>
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-ink-muted pointer-events-none"></i>
              <input id="searchInput" data-anno="3" class="control w-full pl-9 pr-9" maxlength="100" placeholder="搜索名称、账号、ID 或备注" aria-label="搜索回收数据">
              <button id="clearSearchBtn" type="button" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 text-ink-muted hover:text-ink-body inline-flex items-center justify-center" title="清空搜索" aria-label="清空搜索"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
          </div>

          <div class="filter-actions">
            <button id="queryBtn" data-anno="4" type="button" class="btn btn-primary"><i data-lucide="search" class="w-4 h-4"></i>查询</button>
            <button id="resetBtn" data-anno="5" type="button" class="btn btn-secondary"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>重置</button>
          </div>
        </div>
      </section>

      <section class="bg-card rounded-lg p-5 md:p-6 min-w-0" aria-labelledby="recycleTitle">

    function getFilteredItems() {
      const config=currentConfig(), filter=state.filters[state.currentType], keyword=filter.keyword.trim().toLowerCase();

        const keywordMatch=!keyword||config.searchKeys.some(key=>{
          const value=Array.isArray(item[key])?item[key].join(' '):item[key];
          return String(value??'').toLowerCase().includes(keyword);
        });
        return groupMatch&&keywordMatch;
      });

    function renderCell(item,key) {
      if(key==='select') return `<input type="checkbox" class="row-check" data-select-id="${item.recycleId}" ${state.selected.has(item.recycleId)?'checked':''} aria-label="选择${escapeHtml(item.name)}">`;

      if(key==='tags') {

        return tags.length?`<div class="flex items-center gap-1">${tags.slice(0,2).map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join('')}${tags.length>2?`<span class="text-[11px] text-ink-muted">+${tags.length-2}</span>`:''}</div>`:'-';

      return `<span class="cell-text" title="${escapeHtml(value)}">${escapeHtml(value)}</span>`;

    function renderTable() {
      const all=getFilteredItems(), totalPages=Math.max(1,Math.ceil(all.length/state.pageSize));

      if(totalPages<=7) return Array.from({length:totalPages},(_,index)=>index+1);

      if(page>=totalPages-3) return [1,'ellipsis',totalPages-4,totalPages-3,totalPages-2,totalPages-1,totalPages];

        <nav class="pg-nav" data-anno="10" aria-label="页码导航">${pageButton('<i data-lucide="chevron-left" class="w-4 h-4"></i>',state.page-1,state.page===1,false,'上一页')}${tokens}${pageButton('<i data-lucide="chevron-right" class="w-4 h-4"></i>',state.page+1,state.page===totalPages,false,'下一页')}</nav>
        <label class="pg-select-wrap"><span class="sr-only">每页条数</span><select id="pageSizeSelect" class="pg-select" aria-label="每页条数"><option value="10">10 条/页</option><option value="20">20 条/页</option><option value="50">50 条/页</option></select></label>
        <div class="pg-right"><label class="pg-jump"><span>跳至</span><input id="jumpInput" class="pg-jump-input mono" value="1" inputmode="numeric" maxlength="3" aria-label="跳转页码"><span>页</span></label><span class="pg-stats">共 <strong class="mono text-ink-title">${total}</strong> 条记录&nbsp;&nbsp;第 <strong class="mono text-ink-title">${state.page}</strong>/<strong class="mono text-ink-title">${totalPages}</strong> 页</span></div>`;
      $('pageSizeSelect').value=String(state.pageSize);
      $('pageSizeSelect').addEventListener('change',event=>{state.pageSize=Number(event.target.value);state.page=1;state.selected.clear();renderAll();});
      $('pagination').querySelectorAll('[data-recycle-page]').forEach(button=>button.addEventListener('click',()=>{if(button.disabled)return;state.page=Number(button.dataset.recyclePage);state.selected.clear();renderAll();}));
      $('jumpInput').addEventListener('input',event=>event.target.removeAttribute('aria-invalid'));
      $('jumpInput').addEventListener('keydown',event=>{if(event.key==='Enter')jumpPage(totalPages);});
    }

    function jumpPage(totalPages) {
      const target=Number($('jumpInput').value);
      if(!Number.isInteger(target)||target<1||target>totalPages){toast(`请输入 1-${totalPages} 之间的页码`,'warning');$('jumpInput').value='1';$('jumpInput').setAttribute('aria-invalid','true');$('jumpInput').focus();return;}
      state.page=target; state.selected.clear(); renderAll();
    }

    function switchType(type) {
      if(type===state.currentType) return;
      state.currentType=type; state.page=1; state.selected.clear();
      history.replaceState(null,'',`#${type}`);
      $('searchInput').value=state.filters[type].keyword;
      renderAll();
    }

    function renderAll() {
      renderTabs(); renderGroupOptions(); renderToolbar(); renderTable();
      $('searchInput').value=state.filters[state.currentType].keyword;
      $('clearSearchBtn').classList.toggle('hidden',!$('searchInput').value);
      lucide.createIcons(); renderAnnoBadges();
    }

    function clearFilters() {
      state.filters[state.currentType]={keyword:'',group:''}; state.page=1; state.selected.clear();
      $('searchInput').value=''; renderAll();
    }

    function getItem(recycleId) { return recycleData[state.currentType].find(item=>item.recycleId===recycleId); }

    function openDetail(recycleId,trigger) {
      const item=getItem(recycleId); if(!item) return;
      state.lastFocus=trigger||document.activeElement;
      const config=currentConfig();
      const hiddenKeys=new Set(['recycleId','groupExists','tags']);
      const labels={id:'原对象 ID',group:'原分组',name:'名称',account:'账号',remark:'备注',operator:'删除操作者',deletedAt:'删除时间',expireAt:'预计清除时间',platform:'平台',proxyInfo:'代理信息',provider:'服务商',proxyType:'代理类型',extractMode:'提取方式',extractUrl:'提取链接'};
      const fields=Object.entries(item).filter(([key])=>!hiddenKeys.has(key)&&labels[key]);
      $('detailContent').innerHTML=`
        <div class="flex items-start gap-3 pb-5 border-b border-line-lighter"><span class="w-10 h-10 rounded bg-primary-bg text-primary flex items-center justify-center"><i data-lucide="${config.icon}" class="w-5 h-5"></i></span><div><p class="text-[15px] font-semibold text-ink-title">${escapeHtml(item.name)}</p><p class="text-[12px] text-ink-muted mt-1">${config.label} · 回收编号 <span class="mono">${escapeHtml(item.recycleId)}</span></p></div></div>
        <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-0 mt-3">${fields.map(([key,value])=>`<div class="py-3 border-b border-line-lighter min-w-0"><dt class="text-[12px] text-ink-muted">${labels[key]}</dt><dd class="mt-1 text-ink-title break-words ${key.endsWith('At')||key==='id'?'mono text-[12px]':''}">${escapeHtml(value)}</dd></div>`).join('')}</dl>
        <div class="mt-5 p-3 rounded bg-info-bg text-info flex items-start gap-2"><i data-lucide="shield-check" class="w-4 h-4 mt-0.5 flex-none"></i><p class="text-[12px] leading-5">详情已隐藏密码、Cookie、令牌、代理认证信息和 API 密钥。恢复前仍由服务端校验权限、到期状态与资源冲突。</p></div>`;
      $('detailModal').classList.remove('hidden');
      document.body.style.overflow='hidden';
      pushAnnoScope($('detailPanel')); lucide.createIcons(); $('detailCloseBtn').focus();
    }

    function closeDetail() {
      $('detailModal').classList.add('hidden'); document.body.style.overflow=''; popAnnoScope($('detailPanel'));
      state.lastFocus?.focus?.();
    }

    function openConfirm(action,ids,trigger) {
      if(!ids.length) return;
      const config=currentConfig(), items=ids.map(getItem).filter(Boolean), count=items.length;
      if(!count) return;
      state.lastFocus=trigger||document.activeElement; state.pendingAction={action,ids:[...ids],type:state.currentType};
      const danger=action==='purge'||action==='clearAll', all=action==='restoreAll'||action==='clearAll';
      const title={restore:count>1?'批量恢复':`恢复${config.singular}`,purge:count>1?'批量删除':`删除${config.singular}`,restoreAll:'全部恢复',clearAll:'清空回收站'}[action];
      let message='';
      if(action==='restore') message=count>1?`确认恢复回收站中的所选的${config.singular}吗？`:`确认恢复回收站中的${config.singular}“${items[0].name}”吗？`;
      if(action==='purge') message=`删除后${config.singular}将不可恢复，确认要删除吗？`;
      if(action==='restoreAll') message=`将恢复“${config.label}”中的 ${count} 项数据，确认继续吗？`;
      if(action==='clearAll') message=`将永久删除“${config.label}”中的 ${count} 项数据，确认清空吗？`;
      $('confirmTitle').textContent=title; $('confirmMessage').textContent=message;
      $('confirmSubtext').textContent=danger?'该操作不可撤销，完成后数据无法从回收站找回。':all?'该操作作用于当前分类的全部回收项，不受当前页和搜索条件限制。':`本次共处理 ${count} 项；恢复成功后可在原业务模块查看。`;
      $('confirmIconWrap').className=`w-10 h-10 rounded-full flex items-center justify-center flex-none ${danger?'bg-danger-bg text-danger':'bg-primary-bg text-primary'}`;
      $('confirmIcon').setAttribute('data-lucide',danger?'triangle-alert':'archive-restore');
      $('confirmSubmitBtn').className=`btn ${danger?'btn-danger':'btn-primary'} min-w-[72px]`;
      $('confirmSubmitBtn').innerHTML='确定'; $('confirmSubmitBtn').disabled=false; state.operationLoading=false;
      $('confirmModal').classList.remove('hidden'); document.body.style.overflow='hidden'; pushAnnoScope($('confirmPanel')); lucide.createIcons(); $('confirmCancelBtn').focus();
    }

    function closeConfirm() {
      if(state.operationLoading) return;
      $('confirmModal').classList.add('hidden'); document.body.style.overflow=''; popAnnoScope($('confirmPanel')); state.pendingAction=null;
      state.lastFocus?.focus?.();
    }

    function executePendingAction() {
      const pending=state.pendingAction; if(!pending||state.operationLoading) return;
      state.operationLoading=true; $('confirmSubmitBtn').disabled=true; $('confirmCancelBtn').disabled=true; $('confirmCloseBtn').disabled=true;
      $('confirmSubmitBtn').innerHTML='<i data-lucide="loader-circle" class="w-4 h-4 animate-spin"></i>处理中'; lucide.createIcons();
      setTimeout(()=>{
        const config=typeConfig[pending.type], list=recycleData[pending.type], restore=pending.action==='restore'||pending.action==='restoreAll';
        const affected=list.filter(item=>pending.ids.includes(item.recycleId));
        recycleData[pending.type]=list.filter(item=>!pending.ids.includes(item.recycleId));
        const missingGroup=restore&&affected.some(item=>item.groupExists===false);
        state.selected.clear(); state.operationLoading=false; $('confirmCancelBtn').disabled=false; $('confirmCloseBtn').disabled=false;
        $('confirmModal').classList.add('hidden'); document.body.style.overflow=''; popAnnoScope($('confirmPanel')); state.pendingAction=null;
        if(pending.type===state.currentType) renderAll();
        if(missingGroup) toast(`已恢复 ${affected.length} 项；原分组不存在的数据已进入未分组`,'warning');
        else if(restore) toast(affected.length===1?`${affected[0].name}已恢复`:`已恢复 ${affected.length} 项`,'success');
        else toast(pending.action==='clearAll'?'当前分类回收站已清空':affected.length===1?`${affected[0].name}已永久删除`:`已永久删除 ${affected.length} 项`,'success');
      },520);
    }

    function toast(message,type='info') {
      const config={success:['circle-check','#0FC060'],warning:['triangle-alert','#E7772D'],danger:['circle-x','#D9001B'],info:['info','#0091D5']}[type];
      const el=document.createElement('div'); el.className='toast';
      el.innerHTML=`<i data-lucide="${config[0]}" class="w-[18px] h-[18px] flex-none mt-0.5" style="color:${config[1]}"></i><span class="flex-1 text-[13px] text-ink-title">${escapeHtml(message)}</span><button type="button" class="text-ink-muted hover:text-ink-body" aria-label="关闭提示"><i data-lucide="x" class="w-4 h-4"></i></button>`;
      $('toastContainer').prepend(el); while($('toastContainer').children.length>3) $('toastContainer').lastElementChild.remove();
      el.querySelector('button').addEventListener('click',()=>el.remove()); lucide.createIcons(); setTimeout(()=>el.remove(),3200);
    }

    function pushAnnoScope(element) {
      const index=state.annoScopeStack.indexOf(element); if(index>=0) state.annoScopeStack.splice(index,1);
      state.annoScopeStack.push(element); renderAnnoBadges();
    }
    function popAnnoScope(element) {
      const index=state.annoScopeStack.indexOf(element); if(index>=0) state.annoScopeStack.splice(index,1);
      renderAnnoBadges();
    }
    function renderAnnoBadges() {
      const layer=$('annoLayer'); layer.innerHTML=''; if(!state.annoVisible) return;
      const root=state.annoScopeStack.at(-1)||document;
      root.querySelectorAll('[data-anno]').forEach(element=>{
        if(element.closest('.hidden')) return;
        const rect=element.getBoundingClientRect(); if(!rect.width||!rect.height||rect.bottom<0||rect.top>innerHeight) return;
        const badge=document.createElement('button'); badge.type='button'; badge.className='anno-badge'; badge.textContent=element.dataset.anno;
        badge.style.top=`${Math.max(2,rect.top-9)}px`; badge.style.left=`${Math.min(innerWidth-22,rect.right-9)}px`;
        badge.setAttribute('aria-label',`查看交互说明 ${element.dataset.anno}`); badge.addEventListener('click',()=>showAnnoPopup(element.dataset.anno)); layer.append(badge);
      });
    }
    function showAnnoPopup(id) {
      const item=annotations[id]; if(!item) return;
      const origin=document.querySelector(`[data-anno="${id}"]`);
      state.annoLastFocus=origin?.matches('button,a,input,select,textarea,[tabindex]')?origin:origin?.querySelector('button,a,input,select,textarea,[tabindex]')||$('annoToggle');
      $('annoTitle').textContent=`${id}. ${item.title}`; $('annoDesc').innerHTML=`<ul class="list-disc pl-5 space-y-2">${item.desc.map(text=>`<li>${escapeHtml(text)}</li>`).join('')}</ul>`;
      $('annoPopup').classList.remove('hidden'); $('annoPopup').classList.add('flex'); $('closeAnno').focus();
    }
    function closeAnnoPopup() { if($('annoPopup').classList.contains('hidden'))return;$('annoPopup').classList.add('hidden'); $('annoPopup').classList.remove('flex');state.annoLastFocus?.focus?.({preventScroll:true});state.annoLastFocus=null; }

    $('groupFilter').addEventListener('change',event=>{state.filters.environment.group=event.target.value;state.page=1;state.selected.clear();renderAll();});
    $('searchInput').addEventListener('input',event=>$('clearSearchBtn').classList.toggle('hidden',!event.target.value));
    $('searchInput').addEventListener('keydown',event=>{if(event.key==='Enter'){state.filters[state.currentType].keyword=event.target.value.trim();state.page=1;state.selected.clear();renderAll();}});
    $('queryBtn').addEventListener('click',()=>{state.filters[state.currentType].keyword=$('searchInput').value.trim();state.page=1;state.selected.clear();renderAll();});
    $('resetBtn').addEventListener('click',clearFilters);
    $('clearSearchBtn').addEventListener('click',()=>{state.filters[state.currentType].keyword='';$('searchInput').value='';state.page=1;state.selected.clear();renderAll();$('searchInput').focus();});
    $('refreshBtn').addEventListener('click',()=>{state.selected.clear();const icon=$('refreshBtn').querySelector('svg');icon?.classList.add('animate-spin');setTimeout(()=>{icon?.classList.remove('animate-spin');renderAll();toast('列表已刷新','success');},420);});
    $('clearSelectionBtn').addEventListener('click',()=>{state.selected.clear();renderAll();});
    $('confirmCloseBtn').addEventListener('click',closeConfirm); $('confirmCancelBtn').addEventListener('click',closeConfirm); $('confirmSubmitBtn').addEventListener('click',executePendingAction);
    $('detailCloseBtn').addEventListener('click',closeDetail); $('detailDoneBtn').addEventListener('click',closeDetail);
    $('annoToggle').addEventListener('click',()=>{state.annoVisible=!state.annoVisible;$('annoToggle').setAttribute('aria-pressed',String(state.annoVisible));$('annoToggle').querySelector('span').textContent=state.annoVisible?'隐藏标注':'显示标注';renderAnnoBadges();});
    $('closeAnno').addEventListener('click',closeAnnoPopup); $('annoPopup').addEventListener('click',event=>{if(event.target===$('annoPopup'))closeAnnoPopup();});
    document.addEventListener('keydown',event=>{
      if(!$('annoPopup').classList.contains('hidden')&&event.key==='Tab'){event.preventDefault();$('closeAnno').focus();return;}
      if(event.key!=='Escape') return;
      if(!$('annoPopup').classList.contains('hidden')) closeAnnoPopup();
      else if(!$('detailModal').classList.contains('hidden')) closeDetail();
      else if(!$('confirmModal').classList.contains('hidden')) closeConfirm();
    });
    window.addEventListener('resize',renderAnnoBadges);
    window.addEventListener('scroll',renderAnnoBadges,true);

    const initialType=location.hash.slice(1); if(typeConfig[initialType]) state.currentType=initialType;
    renderAll();
  </script>

</body>
</html>
