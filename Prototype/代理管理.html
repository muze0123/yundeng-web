function schema(){if(source==='platform')return[['name','代理名称'],['endpoint','代理信息'],['envs','绑定环境'],['auth','授权人'],['service','服务信息'],['tags','标签'],['status','代理状态'],['renew','自动续费'],['expires','到期时间'],['action','操作']];if(source==='owned')return[['name','代理名称'],['endpoint','代理信息'],['protocol','代理类型'],['address','地址类型'],['envs','绑定环境'],['auth','授权人'],['expires','到期时间'],['remark','备注'],['status','状态'],['action','操作']];return[['name','代理名称'],['protocol','代理类型'],['service','提取方式'],['endpoint','提取链接'],['status','检测结果'],['envs','绑定环境'],['auth','授权人'],['action','操作']]}

function render(){renderFilters();const rows=filtered(),cols=schema();$('#listTitle').textContent={platform:'平台代理',owned:'自有代理',api:'代理 API'}[source];$('#resultCount').textContent=`共 ${rows.length} 条`;$('#tableHead').innerHTML='<tr><th><input id="checkAll" type="checkbox"></th><th>序号/ID</th>'+cols.map(x=>`<th>${x[1]}</th>`).join('')+'</tr>';$('#tableBody').innerHTML=rows.map(x=>`<tr><td><input type="checkbox" data-select="${x.id}" ${selected.has(x.id)?'checked':''}></td><td class="mono">${x.id}</td>${cols.map(([k])=>cell(x,k)).join('')}</tr>`).join('');$('#emptyState').classList.toggle('hidden',rows.length>0);$('#tableHead').parentElement.classList.toggle('hidden',rows.length===0);$('#emptyAction').textContent=source==='platform'?'前往购买代理':source==='owned'?'添加代理':'添加代理 API';$('#actions').innerHTML=actionsHtml();$('#selectedCount').textContent=selected.size;$('#batchBar').classList.toggle('hidden',selected.size===0);$('#batchActions').innerHTML=batchHtml();$('#pageNav').innerHTML='<button class="btn btn-default h-[30px]" disabled>‹</button><button class="btn btn-primary h-[30px]">1</button><button class="btn btn-default h-[30px]" disabled>›</button>';$('#pageStats').textContent=`共 ${rows.length} 条记录　第 1/1 页`;if($('#checkAll'))$('#checkAll').checked=rows.length>0&&rows.every(x=>selected.has(x.id));lucide.createIcons();renderAnno()}
function cell(x,k){if(k==='name')return `<td><b class="text-ink-title">${x.name}</b></td>`;if(k==='endpoint')return `<td><span class="mono">${x.endpoint}</span><div class="text-[11px] text-ink-muted">检测于 ${x.checked}</div></td>`;if(k==='envs')return `<td><button data-bind="${x.id}" data-anno="9" class="text-primary">${x.envs.length?`查看详情（${x.envs.length}）`:'分配环境'}</button></td>`;if(k==='tags')return `<td>${x.tags.map(t=>`<span class="px-1.5 py-0.5 rounded bg-primary-bg text-primary mr-1">${t}</span>`).join('')||'-'}</td>`;if(k==='status'){const tone=['运行中','可用','自动续费中'].includes(x.status)?'bg-success-bg text-success':x.status==='即将到期'?'bg-warning-bg text-warning':'bg-danger-bg text-danger';return `<td><span class="px-2 py-0.5 rounded ${tone}">${x.status}</span></td>`}if(k==='renew')return `<td><button data-renew-toggle="${x.id}" class="w-10 h-[22px] rounded-full ${x.renew?'bg-primary':'bg-ink-muted'} relative"><span class="absolute top-0.5 ${x.renew?'right-0.5':'left-0.5'} w-[18px] h-[18px] bg-white rounded-full"></span></button></td>`;if(k==='action')return `<td><button data-view="${x.id}" data-anno="10" class="text-primary mr-3">查看</button><button data-edit="${x.id}" data-anno="11" class="text-primary mr-3">编辑</button><button data-more="${x.id}" class="text-primary">更多</button></td>`;return `<td class="${k==='expires'?'mono':''}">${Array.isArray(x[k])?x[k].join('、')||'-':x[k]??'-'}</td>`}
function actionsHtml(){if(source==='platform')return `<button data-action="renew" data-anno="7" class="btn btn-default">批量续费</button><button data-action="tag" class="btn btn-default">设置标签</button><button data-action="auth" data-anno="8" class="btn btn-default">授权</button>`;if(source==='owned')return `<button data-action="add" data-anno="5" class="btn btn-primary"><i data-lucide="plus" class="w-4"></i>添加代理</button><button data-action="check" data-anno="6" class="btn btn-default">检测代理</button><button data-action="remark" class="btn btn-default">设置备注</button><button data-action="auth" class="btn btn-default">授权</button>`;return `<button data-action="api" data-anno="5" class="btn btn-primary"><i data-lucide="plus" class="w-4"></i>添加代理 API</button><button data-action="check" data-anno="6" class="btn btn-default">检测代理</button><button data-action="auth" class="btn btn-default">授权</button>`}
function batchHtml(){const base=`<button data-action="check" class="btn btn-default">检测</button><button data-action="auth" class="btn btn-default">授权</button>`;return source==='platform'?`<button data-action="renew" class="btn btn-primary">续费</button>${base}<button data-action="tag" class="btn btn-default">设置标签</button>`:`${base}<button data-action="remark" class="btn btn-default">设置备注</button><button data-action="delete" data-anno="12" class="btn border border-danger text-danger">删除</button>`}
function openModal(action,id){modalAction=action;const item=data.find(x=>x.id==id),count=selected.size||1,titles={add:'添加代理',api:'添加代理 API',edit:'编辑代理',bind:'分配环境',auth:'选择成员',remark:'设置备注',tag:'设置标签',renew:'代理续费',view:'代理详情与操作日志'};$('#modalTitle').textContent=titles[action]||'代理操作';if(action==='add')$('#modalBody').innerHTML=`<div class="grid grid-cols-[1fr_280px] gap-5"><div><textarea id="proxyLines" class="control w-full h-64 py-2 mono" placeholder="每行一个代理，例如：&#10;192.168.0.1:8000{备注}&#10;socks5://127.0.0.1:7897"></textarea><div class="flex gap-3 mt-3"><select class="control"><option>HTTP</option><option>HTTPS</option><option>SOCKS5</option></select><select class="control"><option>IP2Location</option><option>IPData</option></select><button data-modal-check class="btn btn-default">检测代理</button></div></div><aside class="p-4 rounded bg-bg-page text-[12px] leading-relaxed"><b>填写说明</b><p class="mt-2">每行一个，一次最多 500 条。支持 IPv4、IPv6 和域名；备注不超过 40 字。</p><label class="flex gap-2 mt-3"><input type="checkbox">仅添加检测成功的代理</label><label class="flex gap-2 mt-2"><input type="checkbox" checked>校验重复项</label></aside></div>`;else if(action==='api')$('#modalBody').innerHTML=formHtml(null,true);else if(action==='edit')$('#modalBody').innerHTML=formHtml(item,false);else if(action==='bind')$('#modalBody').innerHTML=`<div><div class="p-3 rounded bg-warning-bg text-warning mb-4">多个环境使用同一代理可能导致关联风险和网速变慢，请谨慎操作。</div><p class="mb-3"><b>${item.name}</b>　<span class="mono">${item.endpoint}</span>　已绑定 ${item.envs.length} 个环境</p><input class="control w-[400px] mb-3" placeholder="搜索环境名称"><div class="space-y-2">${['14-云登浏览器_1','17-云登浏览器_4','16-云登浏览器_3','11-指纹测试'].map(x=>`<label class="flex gap-2 p-2 rounded hover:bg-hover"><input type="checkbox" ${item.envs.includes(x)?'checked':''}>${x}</label>`).join('')}</div></div>`;else if(action==='auth')$('#modalBody').innerHTML=`<div><input class="control w-[400px] mb-4" placeholder="请输入成员名称"><div class="space-y-2">${['张小登（团队管理员）','李运营（运营成员）','测试员（测试成员）'].map(x=>`<label class="flex gap-2 p-2"><input type="checkbox">${x}</label>`).join('')}</div><p class="mt-3 text-ink-sub">已选择 ${count} 个代理</p></div>`;else if(action==='view')$('#modalBody').innerHTML=`<div><dl class="grid grid-cols-2 gap-4 p-4 bg-bg-page rounded"><div><dt class="text-ink-muted">代理名称</dt><dd>${item.name}</dd></div><div><dt class="text-ink-muted">代理信息</dt><dd class="mono">${item.endpoint}</dd></div><div><dt class="text-ink-muted">绑定环境</dt><dd>${item.envs.join('、')||'-'}</dd></div><div><dt class="text-ink-muted">最后检测</dt><dd class="mono">${item.checked}</dd></div></dl><h4 class="font-semibold mt-5 mb-2">代理操作日志</h4><table class="data-table"><thead><tr><th>操作时间</th><th>操作类型</th><th>操作内容</th><th>操作人</th></tr></thead><tbody><tr><td class="mono">2026-08-12 11:45</td><td>分配代理</td><td>分配给环境 14</td><td>1938</td></tr><tr><td class="mono">2026-08-10 09:20</td><td>检测代理</td><td>检测成功，延迟 48ms</td><td>1938</td></tr></tbody></table></div>`;else $('#modalBody').innerHTML=`<div><p class="mb-4">已选择 <b>${count}</b> 个代理</p>${action==='renew'?'<select class="control w-[400px]"><option>续费 1 个月</option><option>续费 3 个月</option><option>续费 12 个月</option></select>':action==='tag'?'<input class="control w-[400px]" placeholder="请输入或选择标签">':'<textarea class="control w-full h-28 py-2" maxlength="40" placeholder="请输入备注，最多 40 字"></textarea>'}</div>`;$('#modal').classList.remove('hidden');annoScope.push($('#modalPanel'));renderAnno();lucide.createIcons()}
function formHtml(item,isApi){return `<div class="space-y-[18px]">${[['代理名称',item?.name||''],['代理类型',item?.protocol||'HTTP'],[isApi?'提取链接':'代理 IP 或域名',isApi?'':(item?.endpoint.split(':')[0]||'')],[isApi?'提取方式':'端口',isApi?'每次提取':(item?.endpoint.split(':').pop()||'')],['备注',item?.remark||'']].map(([l,v],i)=>`<label class="flex items-center gap-4"><span class="w-28 text-right">${i===0||i===2?'<b class="text-danger">*</b> ':''}${l}：</span><input data-form-index="${i}" class="control w-[400px]" value="${v}"></label>`).join('')}<div class="ml-32 p-3 rounded bg-warning-bg text-warning">${item?.envs.length?'请注意：修改代理将影响所有已绑定环境。':'保存前建议先检测代理可用性。'}</div></div>`}
function closeModal(){if($('#modal').classList.contains('hidden'))return;$('#modal').classList.add('hidden');annoScope.pop();renderAnno()};function confirmDialog(title,desc,action){$('#dialogTitle').textContent=title;$('#dialogDesc').textContent=desc;$('#dialog').classList.remove('hidden');$('#dialogConfirm').onclick=()=>{action();$('#dialog').classList.add('hidden')}}function toast(msg,kind='info'){const c={info:'bg-info',success:'bg-success',warning:'bg-warning',danger:'bg-danger'}[kind],e=document.createElement('div');e.className=`${c} text-white px-4 py-2 rounded shadow`;e.textContent=msg;$('#toastContainer').append(e);setTimeout(()=>e.remove(),2200)}
document.addEventListener('click',e=>{const src=e.target.closest('[data-source]'),st=e.target.closest('[data-status]'),sel=e.target.closest('[data-select]'),act=e.target.closest('[data-action]'),bind=e.target.closest('[data-bind]'),view=e.target.closest('[data-view]'),edit=e.target.closest('[data-edit]'),more=e.target.closest('[data-more]'),renew=e.target.closest('[data-renew-toggle]'),toastBtn=e.target.closest('[data-toast]');if(src){source=src.dataset.source;status='全部代理';selected.clear();$$('[data-source]').forEach(x=>x.classList.toggle('active',x===src));render()}if(st){status=st.dataset.status;render()}if(sel){sel.checked?selected.add(+sel.dataset.select):selected.delete(+sel.dataset.select);render()}if(act){if(act.dataset.action==='delete')deleteSelected();else if(act.dataset.action==='check')checkSelected();else openModal(act.dataset.action)}if(bind)openModal('bind',bind.dataset.bind);if(view)openModal('view',view.dataset.view);if(edit)openModal('edit',edit.dataset.edit);if(more){const m=$('#menu'),r=more.getBoundingClientRect();m.innerHTML=`<button data-bind="${more.dataset.more}">分配环境</button><button data-action="remark">设置备注</button><button data-action="auth">授权</button><button data-delete="${more.dataset.more}" class="text-danger">删除</button>`;m.style.left=Math.min(innerWidth-190,r.left)+'px';m.style.top=r.bottom+4+'px';m.classList.remove('hidden')}else if(!e.target.closest('#menu'))$('#menu').classList.add('hidden');if(e.target.closest('[data-delete]')){selected=new Set([+e.target.closest('[data-delete]').dataset.delete]);deleteSelected()}if(e.target.closest('[data-modal-check]')){const lines=$('#proxyLines').value.trim().split('\n').filter(Boolean);if(!lines.length)return toast('请先输入代理','warning');toast(`检测完成：${lines.length} 条成功，0 条失败`,'success')}if(renew){const x=data.find(v=>v.id==renew.dataset.renewToggle);x.renew=!x.renew;render();toast(x.renew?'已开启自动续费':'已关闭自动续费','success')}if(toastBtn)toast(toastBtn.dataset.toast,'success')});
function deleteSelected(){const items=data.filter(x=>selected.has(x.id)),envs=items.flatMap(x=>x.envs);confirmDialog('删除代理',`确定删除 ${items.length} 个代理吗？${envs.length?' 已绑定环境：'+envs.join('、')+'。':''} 删除后 30 天内可在回收站恢复。`,()=>{items.forEach(x=>data.splice(data.indexOf(x),1));selected.clear();render();toast('代理已移入回收站','success')})}function checkSelected(){const items=selected.size?data.filter(x=>selected.has(x.id)):data.filter(x=>x.source===source);if(!items.length)return toast('暂无可检测代理','warning');toast(`正在检测 ${items.length} 个代理`,'info');setTimeout(()=>{items.forEach(x=>{x.status=x.source==='platform'?'运行中':Math.random()>.2?'可用':'不可用';x.checked='2026-08-12 17:50'});render();toast('代理检测完成','success')},700)}
$('#queryBtn').onclick=()=>{query=$('#searchInput').value.trim();type=$('#typeFilter').value;address=$('#addressFilter').value;render()};$('#resetBtn').onclick=()=>{$('#searchInput').value='';query='';type='全部';address='全部';status='全部代理';render()};$('#searchInput').oninput=e=>$('#clearSearch').classList.toggle('hidden',!e.target.value);$('#clearSearch').onclick=()=>{$('#searchInput').value='';$('#clearSearch').classList.add('hidden')};document.addEventListener('change',e=>{if(e.target.id==='checkAll'){filtered().forEach(x=>e.target.checked?selected.add(x.id):selected.delete(x.id));render()}});$('#emptyAction').onclick=()=>source==='platform'?location.href='商城.html':openModal(source==='owned'?'add':'api');$('#modalConfirm').onclick=()=>{const inputs=$$('#modalBody [data-form-index]');if(inputs.length&&(!inputs[0].value.trim()||!inputs[2].value.trim())){inputs[0].classList.toggle('invalid',!inputs[0].value.trim());inputs[2].classList.toggle('invalid',!inputs[2].value.trim());return toast('请填写必填字段','warning')}closeModal();toast('操作已保存','success');render()};$$('[data-close]').forEach(x=>x.onclick=closeModal);$$('[data-dialog-close]').forEach(x=>x.onclick=()=>$('#dialog').classList.add('hidden'));$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
$('#collapseBtn').onclick=()=>{$('#sidebar').classList.toggle('compact');$('#collapseBtn').innerHTML=`<i data-lucide="${$('#sidebar').classList.contains('compact')?'panel-left-open':'panel-left-close'}" class="w-[18px] mx-auto"></i>`;lucide.createIcons()};$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
function renderAnno(){const l=$('#annoLayer');l.innerHTML='';if(!annoVisible)return;(annoScope.at(-1)||document).querySelectorAll('[data-anno]').forEach(el=>{if(el.closest('.hidden'))return;const r=el.getBoundingClientRect();if(!r.width||!r.height)return;const b=document.createElement('button');b.className='anno-badge';b.textContent=el.dataset.anno;b.style.top=r.top-10+'px';b.style.left=r.right-10+'px';b.onclick=()=>showAnno(el.dataset.anno);l.append(b)})}function showAnno(id){const a=annotations[id];if(!a)return;$('#annoTitle').textContent=`${id}. ${a.title}`;$('#annoDesc').innerHTML='<ul class="list-disc pl-5 space-y-2">'+a.desc.map(x=>`<li>${x}</li>`).join('')+'</ul>';$('#annoPopup').classList.remove('hidden')}$('#annoToggle').onclick=()=>{annoVisible=!annoVisible;$('#annoToggle').classList.toggle('bg-primary',annoVisible);$('#annoToggle').classList.toggle('bg-ink-muted',!annoVisible);$('#annoToggle span').textContent=annoVisible?'隐藏标注':'显示标注';renderAnno()};$('#closeAnno').onclick=()=>$('#annoPopup').classList.add('hidden');$('#mainContent').onscroll=renderAnno;window.onresize=renderAnno;document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#dialog').classList.add('hidden');$('#menu').classList.add('hidden');$('#annoPopup').classList.add('hidden')}});render();lucide.createIcons();
