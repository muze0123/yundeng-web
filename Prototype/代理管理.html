        if (modalMode === 'remark') {
          $('#remarkInput').addEventListener('input', function () { updateCharacterCount('#remarkInput', '#remarkCount', 40); });
        }
        if (modalMode === 'tag') {
          $('#newTagInput').addEventListener('input', function () { updateCharacterCount('#newTagInput', '#newTagCount', 30); });
        }
        if (modalMode === 'renew') {
          $('#renewMonths').addEventListener('change', updateRenewPreview);
          updateRenewPreview();
        }
      }

      function commitAddOwned() {
        clearFieldErrors(modalPanel);
        var result = parseOwnedProxyLines();
        if (!result.total) {
          setFieldError('ownedProxyLines', 'ownedProxyLinesError', '请至少输入一条代理');
          return;
        }
        showOwnedParseResult(result);
        var onlySuccessful = $('#onlySuccessful').checked;
        var successful = result.valid.filter(function (item) { return !onlySuccessful || item.detected; });
        var failedCount = result.errors.length + result.valid.filter(function (item) { return !item.detected; }).length;
        if (!successful.length) {
          setFieldError('ownedProxyLines', 'ownedProxyLinesError', '没有可添加的有效代理，请按失败行号修正');
          return;
        }
        if (failedCount && !onlySuccessful) {
          setFieldError('ownedProxyLines', 'ownedProxyLinesError', '存在失败项。修正后重试，或勾选“仅添加检测成功的代理”');
          return;
        }

        var startIndex = proxyData.filter(function (item) { return item.source === 'owned'; }).length + 1;
        successful.forEach(function (parsed, index) {
          proxyData.unshift({
            id: 'OWN-' + String(startIndex + index).padStart(3, '0'),
            source: 'owned',
            name: parsed.remark || '批量自有代理-' + String(startIndex + index).padStart(2, '0'),
            endpoint: parsed.endpoint,
            protocol: parsed.protocol,
            addressType: parsed.host.startsWith('[') ? 'IPv6' : /^\d{1,3}(?:\.\d{1,3}){3}$/.test(parsed.host) ? 'IPv4' : '域名',
            status: parsed.detected ? '可用' : '待检测',
            expiresAt: '-',
            remark: parsed.remark || '-',
            environments: [],
            authorizedTo: ['***'],
            tags: [],
            lastCheckedAt: parsed.detected ? nowText() : '-',
            checkDetail: parsed.detected
              ? { result: '可用', exitIp: parsed.host, region: '待定位', latency: '58ms', reason: '' }
              : { result: '待检测', exitIp: '-', region: '-', latency: '-', reason: '' }
          });
        });
        setCurrentPageToOne();
        closeFormModal(true);
        render();
        toast('已添加 ' + successful.length + ' 个自有代理' + (failedCount ? '，' + failedCount + ' 条失败未添加' : ''), failedCount ? 'warning' : 'success');
      }

      function commitAddApi() {
        clearFieldErrors(modalPanel);
        var name = $('#apiName').value.trim();
        var urlValue = $('#apiUrl').value.trim();
        var valid = true;
        if (!name) {
          setFieldError('apiName', 'apiNameError', '请输入代理 API 名称');
          valid = false;
        }
        if (name.length > 100) {
          setFieldError('apiName', 'apiNameError', '代理名称不得超过 100 字');
          valid = false;
        }
        try {
          var url = new URL(urlValue);
          if (!/^https?:$/.test(url.protocol)) throw new Error('invalid');
        } catch (_) {
          setFieldError('apiUrl', 'apiUrlError', '请输入有效的 HTTP 或 HTTPS 提取链接');
          valid = false;
        }
        if (!valid) return;

        var nextIndex = proxyData.filter(function (item) { return item.source === 'api'; }).length + 1;
        proxyData.unshift({
          id: 'API-' + String(nextIndex).padStart(3, '0'),
          source: 'api',
          name: name,
          endpoint: maskApiUrl(urlValue),
          protocol: $('#apiProtocol').value,
          addressType: '动态',
          extractMode: $('#apiExtractMode').value,
          status: '待检测',
          remark: '-',
          environments: [],
          authorizedTo: ['***'],
          tags: [],
          lastCheckedAt: '-',
          checkDetail: { result: '待检测', exitIp: '-', region: '-', latency: '-', reason: '' }
        });
        setCurrentPageToOne();
        closeFormModal(true);
        render();
        toast('代理 API 已添加，提取链接已脱敏', 'success');
      }

      function commitEdit() {
        clearFieldErrors(modalPanel);
        var item = modalContext.item;
        var name = $('#editName').value.trim();
        var host = $('#editHost').value.trim();
        var port = Number($('#editPort').value);
        var valid = true;
        if (!name || name.length > 100) {
          setFieldError('editName', 'editNameError', !name ? '请输入代理名称' : '代理名称不得超过 100 字');
          valid = false;
        }
        if (!host || /\s/.test(host)) {
          setFieldError('editHost', 'editHostError', '请输入有效的 IP、方括号 IPv6 或域名');
          valid = false;
        }
        if (!Number.isInteger(port) || port < 1 || port > 65535) {
          setFieldError('editPort', 'editPortError', '端口必须为 1-65535 的整数');
          valid = false;
        }
        if (!valid) return;

        item.name = name;
        item.protocol = $('#editProtocol').value;
        item.addressType = $('#editAddressType').value;
        item.endpoint = host + ':' + port;
        item.remark = $('#editRemark').value.trim() || '-';
        item.expiresAt = $('#editExpires').value.trim() || '-';
        closeFormModal(true);
        render();
        toast('代理信息已保存', 'success');
      }

      function commitEditApi() {
        clearFieldErrors(modalPanel);
        var item = modalContext.item;
        var name = $('#editApiName').value.trim();
        var urlValue = $('#editApiUrl').value.trim();
        if (!name || name.length > 100) {
          setFieldError('editApiName', 'editApiNameError', !name ? '请输入代理 API 名称' : '代理名称不得超过 100 字');
          return;
        }
        if (urlValue) {
          try {
            var url = new URL(urlValue);
            if (!/^https?:$/.test(url.protocol)) throw new Error('invalid');
          } catch (_) {
            setFieldError('editApiUrl', 'editApiUrlError', '请输入有效的 HTTP 或 HTTPS 提取链接');
            return;
          }
        }
        item.name = name;
        item.protocol = $('#editApiProtocol').value;
        item.extractMode = $('#editApiExtractMode').value;
        if (urlValue) item.endpoint = maskApiUrl(urlValue);
        closeFormModal(true);
        render();
        toast('代理 API 配置已保存', 'success');
      }

      function startCheck() {
        if (modalContext.running) return;
        modalContext.running = true;
        var items = modalContext.items;
        var token = ++checkRunToken;
        $('#formModalConfirm').disabled = true;
        $('#formModalConfirm').textContent = '检测中...';
        $('#checkProgress').querySelector('span').textContent = '检测中';
        $('#checkProgressBar').style.width = '35%';
        items.forEach(function (item) {
          item.checkDetail = { result: '检测中', exitIp: '-', region: '-', latency: '-', reason: '' };
          if (item.source !== 'platform') item.status = '检测中';
        });
        $$('[data-check-item]').forEach(function (badge) { badge.className = 'badge badge-warning'; badge.textContent = '检测中'; });
        render();

        window.setTimeout(function () {
          if (token !== checkRunToken) return;
          var successCount = 0;
          var failureItems = [];
          items.forEach(function (item, index) {
            var success = (item.id.charCodeAt(item.id.length - 1) + index) % 5 !== 0;
            if (success) {
              successCount += 1;
              item.checkDetail = { result: '可用', exitIp: item.endpoint.replace(/:\d+$/, ''), region: ['美国 洛杉矶', '新加坡', '英国 伦敦', '日本 东京'][index % 4], latency: String(41 + index * 4) + 'ms', reason: '' };
              if (item.source !== 'platform') item.status = '可用';
            } else {
              var reason = index % 2 ? '连接超时' : '认证失败';
              item.checkDetail = { result: '不可用', exitIp: '-', region: '-', latency: '-', reason: reason };
              if (item.source !== 'platform') item.status = '不可用';
              failureItems.push({ item: item, reason: reason });
            }
            item.lastCheckedAt = nowText();
          });
          var failureCount = items.length - successCount;
          $('#checkProgressBar').style.width = '100%';
          $('#checkProgress').querySelector('span').textContent = '检测完成';
          $('#checkProgress').querySelector('.mono').textContent = items.length + '/' + items.length;
          $$('[data-check-item]').forEach(function (badge) {
            var item = proxyData.find(function (record) { return record.id === badge.dataset.checkItem; });
            var result = item ? item.checkDetail.result : '待检测';
            badge.className = 'badge ' + (result === '可用' ? 'badge-success' : 'badge-danger');
            badge.textContent = result;
          });
          var summary = $('#checkResultSummary');
          summary.className = 'mt-4 result-panel ' + (failureCount ? 'is-warning' : 'is-success');
          summary.dataset.anno = '34';
          summary.innerHTML = '<b>检测完成：成功 ' + successCount + ' 条，失败 ' + failureCount + ' 条</b>' +
            (failureItems.length ? '<ul class="mt-2 pl-4 list-disc text-[12px] space-y-1">' + failureItems.slice(0, 8).map(function (failure) { return '<li>' + escapeHtml(failure.item.id + ' ' + failure.item.name + '：' + failure.reason) + '</li>'; }).join('') + '</ul>' : '');
          modalContext.running = false;
          modalContext.completed = true;
          $('#formModalConfirm').disabled = false;
          $('#formModalConfirm').textContent = '完成';
          $('#refreshTime').textContent = '更新于 ' + nowText();
          render();
          requestAnimationFrame(renderAnnoBadges);
          toast('代理检测完成：成功 ' + successCount + '，失败 ' + failureCount, failureCount ? 'warning' : 'success');
        }, 800);
      }

      function commitBind() {
        modalContext.item.environments = Array.from(selectedEnvironmentNames);
        closeFormModal(true);
        render();
        toast('环境分配已更新', 'success');
      }

      function commitAuth() {
        var error = $('#memberSelectionError');
        if (!selectedMemberNames.size) {
          error.textContent = '请至少选择一个成员';
          return;
        }
        var itemCount = modalContext.items.length;
        modalContext.items.forEach(function (item) { item.authorizedTo = Array.from(selectedMemberNames); });
        closeFormModal(true);
        render();
        toast('已为 ' + itemCount + ' 个代理更新授权', 'success');
      }

      function commitRemark() {
        var value = $('#remarkInput').value.trim();
        if (value.length > 40) {
          $('#remarkError').textContent = '备注不得超过 40 字';
          return;
        }
        modalContext.items.forEach(function (item) { item.remark = value || '-'; });
        closeFormModal(true);
        render();
        toast('备注已更新', 'success');
      }

      function commitTag() {
        var tags = $$('[data-tag-option]:checked').map(function (input) { return input.dataset.tagOption; });
        var newTag = $('#newTagInput').value.trim();
        if (newTag.length > 30) {
          $('#tagError').textContent = '标签不得超过 30 字';
          return;
        }
        if (newTag && !tags.includes(newTag)) tags.push(newTag);
        modalContext.items.forEach(function (item) { item.tags = tags.slice(); });
        closeFormModal(true);
        render();
        toast(tags.length ? '标签已更新' : '已移除所选代理的全部标签', 'success');
      }

      function commitRenew() {
        var months = Number($('#renewMonths').value || 1);
        var items = modalContext.items;
        items.forEach(function (item) {
          item.expiresAt = addMonths(item.expiresAt, months);
          if (item.status === '已过期' || item.status === '即将到期') item.status = '运行中';
        });
        closeFormModal(true);
        render();
        toast('已为 ' + items.length + ' 个代理续费 ' + months + ' 个月', 'success');
      }

      function confirmFormModal() {
        if (modalMode === 'add-owned') return commitAddOwned();
        if (modalMode === 'add-api') return commitAddApi();
        if (modalMode === 'edit') return commitEdit();
        if (modalMode === 'edit-api') return commitEditApi();
        if (modalMode === 'check') {
          if (modalContext.completed) return closeFormModal(true);
          return startCheck();
        }
        if (modalMode === 'bind') return commitBind();
        if (modalMode === 'auth') return commitAuth();
        if (modalMode === 'remark') return commitRemark();
        if (modalMode === 'tag') return commitTag();
        if (modalMode === 'renew') return commitRenew();
      }

      function openDetailDrawer(item) {
        drawerLastFocus = document.activeElement;
        $('#detailDrawerSubtitle').textContent = item.name + ' · ' + item.id;
        $('#detailDrawerBody').innerHTML = '<section>' +
          '<h4 class="inline-block text-[16px] font-semibold text-ink-title">基础信息</h4>' +
          '<dl class="info-grid mt-3">' +
            '<div class="info-item"><dt>代理名称</dt><dd>' + escapeHtml(item.name) + '</dd></div>' +
            '<div class="info-item"><dt>代理序号</dt><dd class="mono">' + escapeHtml(item.id) + '</dd></div>' +
            '<div class="info-item"><dt>代理信息</dt><dd class="mono">' + escapeHtml(item.endpoint) + '</dd></div>' +
            '<div class="info-item"><dt>协议 / 地址类型</dt><dd>' + escapeHtml(item.protocol + ' / ' + item.addressType) + '</dd></div>' +
            '<div class="info-item"><dt>授权成员</dt><dd>' + escapeHtml(item.authorizedTo.join('、') || '-') + '</dd></div>' +
            '<div class="info-item"><dt>到期时间</dt><dd class="mono">' + escapeHtml(item.expiresAt || '-') + '</dd></div>' +
          '</dl>' +
        '</section>' +
        '<section class="mt-6">' +
          '<h4 class="inline-block text-[16px] font-semibold text-ink-title">最近检测</h4>' +
          '<dl class="info-grid mt-3">' +
            '<div class="info-item"><dt>检测结果</dt><dd>' + statusBadge(item.checkDetail.result) + '</dd></div>' +
            '<div class="info-item"><dt>检测时间</dt><dd class="mono">' + escapeHtml(item.lastCheckedAt) + '</dd></div>' +
            '<div class="info-item"><dt>出口 IP / 地区</dt><dd><span class="mono">' + escapeHtml(item.checkDetail.exitIp) + '</span> · ' + escapeHtml(item.checkDetail.region) + '</dd></div>' +
            '<div class="info-item"><dt>延迟 / 失败原因</dt><dd>' + escapeHtml(item.checkDetail.reason || item.checkDetail.latency || '-') + '</dd></div>' +
          '</dl>' +
        '</section>' +
        '<section class="mt-6">' +
          '<div class="flex items-center justify-between gap-3"><h4 class="inline-block text-[16px] font-semibold text-ink-title">绑定环境</h4><span class="mono text-[12px] text-ink-muted">' + item.environments.length + ' 个</span></div>' +
          '<div class="mt-3 p-3 rounded-md bg-page">' + (item.environments.length ? item.environments.map(function (environment) { return '<span class="tag mr-2 mb-1">' + escapeHtml(environment) + '</span>'; }).join('') : '<span class="text-ink-muted">暂无绑定环境</span>') + '</div>' +
        '</section>' +
        '<section class="mt-6">' +
          '<h4 class="inline-block text-[16px] font-semibold text-ink-title">操作日志</h4>' +
          '<div class="mt-3 overflow-x-auto border border-line rounded-md"><table class="data-table min-w-[680px]"><thead><tr><th>操作时间</th><th>操作类型</th><th>操作内容</th><th>操作人</th></tr></thead><tbody>' +
            '<tr><td class="mono">2026-08-17 15:42</td><td>检测代理</td><td>' + escapeHtml(item.checkDetail.result === '不可用' ? '检测失败：' + item.checkDetail.reason : '检测成功，延迟 ' + item.checkDetail.latency) + '</td><td>1938</td></tr>' +
            '<tr><td class="mono">2026-08-15 10:20</td><td>分配环境</td><td>更新绑定环境，共 ' + item.environments.length + ' 个</td><td>张小登</td></tr>' +
            '<tr><td class="mono">2026-08-12 09:30</td><td>更新代理</td><td>更新代理备注与授权范围</td><td>李运营</td></tr>' +
          '</tbody></table></div>' +
          '<p class="mt-2 text-[12px] text-ink-muted">日志已排除密码、完整账号和完整提取链接。</p>' +
        '</section>';
        drawerOverlay.classList.remove('hidden');
        drawerOverlay.setAttribute('aria-hidden', 'false');
        pushAnnoScope(drawerPanel);
        window.lucide && window.lucide.createIcons();
        requestAnimationFrame(function () { $('[data-close-drawer]', drawerPanel).focus(); });
      }

      function closeDetailDrawer() {
        if (drawerOverlay.classList.contains('hidden')) return;
        drawerOverlay.classList.add('hidden');
        drawerOverlay.setAttribute('aria-hidden', 'true');
        popAnnoScope(drawerPanel);
        var restore = drawerLastFocus;
        drawerLastFocus = null;
        requestAnimationFrame(function () { if (restore && document.contains(restore)) restore.focus({ preventScroll: true }); });
      }

      function openConfirmDialog(options) {
        dialogLastFocus = document.activeElement;
        dialogCallback = options.onConfirm;
        $('#confirmDialogTitle').textContent = options.title;
        $('#confirmDialogDesc').textContent = options.description;
        $('#confirmDialogDetail').textContent = options.detail || '';
        $('#confirmDialogConfirm').textContent = options.confirmText || '确定';
        $('#confirmDialogConfirm').className = 'btn ' + (options.danger ? 'btn-danger' : 'btn-primary');
        dialogPanel.dataset.anno = String(options.annoId);
        dialogOverlay.classList.remove('hidden');
        dialogOverlay.setAttribute('aria-hidden', 'false');
        pushAnnoScope(dialogPanel);
        requestAnimationFrame(function () { $('[data-close-dialog]', dialogPanel).focus(); });
      }

      function closeConfirmDialog() {
        if (dialogOverlay.classList.contains('hidden')) return;
        dialogOverlay.classList.add('hidden');
        dialogOverlay.setAttribute('aria-hidden', 'true');
        popAnnoScope(dialogPanel);
        dialogPanel.removeAttribute('data-anno');
        dialogCallback = null;
        var restore = dialogLastFocus;
        dialogLastFocus = null;
        requestAnimationFrame(function () { if (restore && document.contains(restore)) restore.focus({ preventScroll: true }); });
      }

      function confirmDialogAction() {
        var callback = dialogCallback;
        closeConfirmDialog();
        if (typeof callback === 'function') callback();
      }

      function openAutoRenewConfirmation(items) {
        var targetState = !items.every(function (item) { return item.renew; });
        openConfirmDialog({
          title: targetState ? '开启自动续费' : '关闭自动续费',
          description: '确定为 ' + items.length + ' 个代理' + (targetState ? '开启' : '关闭') + '自动续费吗？',
          detail: targetState ? '扣款账户：余额账户（尾号 1938）；续费周期：每月，到期前 3 天自动扣款。' : '关闭后代理到期前不会自动扣款，请留意到期风险。',
          confirmText: targetState ? '确认开启' : '确认关闭',
          annoId: 32,
          onConfirm: function () {
            items.forEach(function (item) {
              item.renew = targetState;
              if (targetState && item.status === '运行中') item.status = '自动续费中';
              if (!targetState && item.status === '自动续费中') item.status = '运行中';
            });
            render();
            toast('自动续费已' + (targetState ? '开启' : '关闭'), 'success');
          }
        });
      }

      function openDeleteConfirmation(items) {
        if (!items.length) return;
        var ids = items.map(function (item) { return item.id; }).join('、');
        var environments = Array.from(new Set(items.flatMap(function (item) { return item.environments; })));
        openConfirmDialog({
          title: '删除代理',
          description: '确定删除 ' + items.length + ' 个代理吗？删除时不会静默解绑环境。',
          detail: '代理序号：' + ids + (environments.length ? '；已绑定环境：' + environments.join('、') : '；未绑定环境') + '。删除后 30 天内可在回收站恢复，平台代理供应商注销规则优先。',
          confirmText: '确认删除',
          danger: true,
          annoId: 33,
          onConfirm: function () {
            var deleteIds = new Set(items.map(function (item) { return item.id; }));
            proxyData = proxyData.filter(function (item) { return !deleteIds.has(item.id); });
            items.forEach(function (item) { selectedIds.delete(item.id); });
            render();
            toast(items.length + ' 个代理已移入回收站', 'success');
          }
        });
      }

      function toast(message, type) {
        var element = document.createElement('div');
        element.className = 'toast toast-' + (type || 'info');
        element.textContent = message;
        $('#toastContainer').appendChild(element);
        window.setTimeout(function () { element.remove(); }, 2600);
      }
      function proxyById(id) {
        return proxyData.find(function (item) { return item.id === id; });
      }

      function navigateToStore() {
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'yundeng:route', file: '商城.html', search: '', hash: '' }, '*');
          return;
        }
        window.location.href = '系统框架.html?page=store';
      }

      function refreshList(button) {
        var preservedPage = currentPage;
        var preservedSelection = new Set(selectedIds);
        button.disabled = true;
        var refreshIcon = $('.refresh-icon', button);
        if (refreshIcon) refreshIcon.classList.add('animate-spin');
        window.setTimeout(function () {
          currentPage = preservedPage;
          selectedIds = preservedSelection;
          $('#refreshTime').textContent = '更新于 ' + nowText();
          render();
          toast('代理列表已刷新', 'success');
        }, 450);
      }

      function itemsForOperation(preferredItem) {
        if (preferredItem) return [preferredItem];
        var selected = selectedCurrentItems();
        return selected.length ? selected : filteredData();
      }

      function openCheckFor(items) {
        if (!items.length) {
          toast('当前没有可检测的代理', 'warning');
          return;
        }
        openFormModal('check', { items: items });
      }

      function openRowMenu(button, item) {
        closeRowMenu();
        activeMenuProxyId = item.id;
        var menuItems = [
          ['view', 'eye', '查看详情', false],
          ['bind', 'monitor-plus', '分配环境', false],
          ['check', 'scan-line', '检测代理', false]
        ];
        if (item.source === 'owned') menuItems.push(['remark', 'message-square-text', '设置备注', false]);
        menuItems.push(['auth', 'user-round-check', '授权成员', false]);
        if (item.source !== 'platform') menuItems.push(['delete', 'trash-2', '删除代理', true]);
        $('#rowMenu').innerHTML = menuItems.map(function (entry) {
          return '<button type="button" role="menuitem" data-menu-action="' + entry[0] + '" class="' + (entry[3] ? 'is-danger' : '') + '">' + icon(entry[1]) + '<span>' + entry[2] + '</span></button>';
        }).join('');
        var rect = button.getBoundingClientRect();
        var left = Math.min(window.innerWidth - 188, Math.max(8, rect.right - 180));
        var top = Math.min(window.innerHeight - 230, rect.bottom + 4);
        $('#rowMenu').style.left = left + 'px';
        $('#rowMenu').style.top = Math.max(8, top) + 'px';
        $('#rowMenu').classList.remove('hidden');
        button.setAttribute('aria-expanded', 'true');
        requestAnimationFrame(function () { $('[role="menuitem"]', $('#rowMenu')).focus(); });
      }

      function closeRowMenu(restoreFocus) {
        var menu = $('#rowMenu');
        if (menu.classList.contains('hidden')) return;
        menu.classList.add('hidden');
        var trigger = activeMenuProxyId ? $('[data-more-proxy="' + activeMenuProxyId + '"]') : null;
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
        if (restoreFocus && trigger) trigger.focus({ preventScroll: true });
        activeMenuProxyId = null;
      }

      function handleMenuAction(action) {
        var item = proxyById(activeMenuProxyId);
        var trigger = activeMenuProxyId ? $('[data-more-proxy="' + activeMenuProxyId + '"]') : null;
        closeRowMenu();
        if (!item) return;
        if (trigger) trigger.focus({ preventScroll: true });
        if (action === 'view') openDetailDrawer(item);
        if (action === 'bind') openFormModal('bind', { item: item });
        if (action === 'check') openCheckFor([item]);
        if (action === 'remark') openFormModal('remark', { items: [item] });
        if (action === 'auth') openFormModal('auth', { items: [item] });
        if (action === 'delete') openDeleteConfirmation([item]);
      }

      function handlePageAction(action, button) {
        if (action === 'add-owned') openFormModal('add-owned', {});
        if (action === 'add-api') openFormModal('add-api', {});
        if (action === 'check') openCheckFor(itemsForOperation());
        if (action === 'store') navigateToStore();
        if (action === 'refresh') refreshList(button);
      }

      function handleBatchAction(action) {
        var items = selectedCurrentItems();
        if (!items.length) {
          toast('请先选择代理', 'warning');
          return;
        }
        if (action === 'check') openCheckFor(items);
        if (action === 'renew') openFormModal('renew', { items: items });
        if (action === 'auto-renew') openAutoRenewConfirmation(items);
        if (action === 'remark') openFormModal('remark', { items: items });
        if (action === 'tag') openFormModal('tag', { items: items });
        if (action === 'auth') openFormModal('auth', { items: items });
        if (action === 'delete') openDeleteConfirmation(items);
      }

      function focusableElements(panel) {
        if (!panel) return [];
        return $$('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', panel).filter(function (element) {
          return element.offsetParent !== null && !element.closest('.hidden');
        });
      }

      function activeOverlayPanel() {
        if (!annotationPopup.classList.contains('hidden')) return annotationPanel;
        if (!dialogOverlay.classList.contains('hidden')) return dialogPanel;
        if (!drawerOverlay.classList.contains('hidden')) return drawerPanel;
        if (!modalOverlay.classList.contains('hidden')) return modalPanel;
        return null;
      }

      function trapFocus(event, panel) {
        var items = focusableElements(panel);
        if (!items.length) {
          event.preventDefault();
          panel.focus();
          return;
        }
        var first = items[0];
        var last = items[items.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      function setupAnnotationDragging() {
        var handle = $('#annoDragHandle');
        var pointerId = null;
        var startX = 0;
        var startY = 0;
        var startLeft = 0;
        var startTop = 0;

        handle.addEventListener('pointerdown', function (event) {
          if (event.button !== 0 || event.target.closest('button')) return;
          var rect = annotationPanel.getBoundingClientRect();
          pointerId = event.pointerId;
          startX = event.clientX;
          startY = event.clientY;
          startLeft = rect.left;
          startTop = rect.top;
          annotationPanel.style.position = 'fixed';
          annotationPanel.style.left = rect.left + 'px';
          annotationPanel.style.top = rect.top + 'px';
          handle.setPointerCapture && handle.setPointerCapture(pointerId);
        });
        handle.addEventListener('pointermove', function (event) {
          if (event.pointerId !== pointerId) return;
          event.preventDefault();
          var width = annotationPanel.offsetWidth;
          var height = annotationPanel.offsetHeight;
          var left = Math.min(window.innerWidth - width - 8, Math.max(8, startLeft + event.clientX - startX));
          var top = Math.min(window.innerHeight - height - 8, Math.max(8, startTop + event.clientY - startY));
          annotationPanel.style.left = left + 'px';
          annotationPanel.style.top = top + 'px';
        });
        function finish(event) {
          if (event.pointerId !== pointerId) return;
          handle.releasePointerCapture && handle.releasePointerCapture(pointerId);
          pointerId = null;
        }
        handle.addEventListener('pointerup', finish);
        handle.addEventListener('pointercancel', finish);
      }

      $$('.source-tab').forEach(function (button) {
        button.addEventListener('click', function () {
          if (button.dataset.source === currentSource) return;
          currentSource = button.dataset.source;
          selectedIds.clear();
          setCurrentPageToOne();
          closeRowMenu();
          render();
        });
      });

      $('#statusTabs').addEventListener('click', function (event) {
        var button = event.target.closest('[data-status]');
        if (!button) return;
        currentDraft().status = button.dataset.status;
        currentApplied().status = button.dataset.status;
        setCurrentPageToOne();
        render();
      });

      $('#typeFilter').addEventListener('change', function (event) { currentDraft().type = event.target.value; });
      $('#addressFilter').addEventListener('change', function (event) { currentDraft().address = event.target.value; });
      $('#searchInput').addEventListener('input', function (event) {
        currentDraft().search = event.target.value;
        $('#clearSearch').classList.toggle('hidden', !event.target.value);
      });
      $('#searchInput').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          $('#queryButton').click();
        }
      });
      $('#clearSearch').addEventListener('click', function () {
        currentDraft().search = '';
        $('#searchInput').value = '';
        $('#clearSearch').classList.add('hidden');
        $('#searchInput').focus();
      });
      $('#queryButton').addEventListener('click', function () {
        filterState[currentSource].applied = copyFilter(currentDraft());
        setCurrentPageToOne();
        render();
      });
      $('#resetButton').addEventListener('click', function () {
        var reset = defaultFilter(currentSource);
        filterState[currentSource].draft = copyFilter(reset);
        filterState[currentSource].applied = copyFilter(reset);
        setCurrentPageToOne();
        render();
      });

      $('#closeExpiryNotice').addEventListener('click', function () {
        $('#expiryNotice').classList.add('hidden');
        try { sessionStorage.setItem('yundeng-proxy-expiry-notice-closed', 'true'); } catch (_) {}
        renderAnnoBadges();
      });

      $('#pageActions').addEventListener('click', function (event) {
        var button = event.target.closest('[data-page-action]');
        if (button) handlePageAction(button.dataset.pageAction, button);
      });
      $('#batchActions').addEventListener('click', function (event) {
        var button = event.target.closest('[data-batch-action]');
        if (button) handleBatchAction(button.dataset.batchAction);
      });

      $('#tableRegion').addEventListener('change', function (event) {
        var rowCheckbox = event.target.closest('[data-select-proxy]');
        if (rowCheckbox) {
          if (rowCheckbox.checked) selectedIds.add(rowCheckbox.dataset.selectProxy);
          else selectedIds.delete(rowCheckbox.dataset.selectProxy);
          render();
          return;
        }
        if (event.target.id === 'checkAllCurrentPage') {
          visibleRows().forEach(function (item) {
            if (event.target.checked) selectedIds.add(item.id);
            else selectedIds.delete(item.id);
          });
          render();
        }
      });

      $('#tableRegion').addEventListener('click', function (event) {
        var bindButton = event.target.closest('[data-bind-proxy]');
        var viewButton = event.target.closest('[data-view-proxy]');
        var editButton = event.target.closest('[data-edit-proxy]');
        var moreButton = event.target.closest('[data-more-proxy]');
        var renewButton = event.target.closest('[data-auto-renew]');
        if (bindButton) openFormModal('bind', { item: proxyById(bindButton.dataset.bindProxy) });
        if (viewButton) openDetailDrawer(proxyById(viewButton.dataset.viewProxy));
        if (editButton) {
          var editItem = proxyById(editButton.dataset.editProxy);
          openFormModal(editItem.source === 'api' ? 'edit-api' : 'edit', { item: editItem });
        }
        if (moreButton) openRowMenu(moreButton, proxyById(moreButton.dataset.moreProxy));
        if (renewButton) openAutoRenewConfirmation([proxyById(renewButton.dataset.autoRenew)]);
      });

      $('#emptyAction').addEventListener('click', function () {
        if (currentSource === 'platform') navigateToStore();
        else openFormModal(currentSource === 'owned' ? 'add-owned' : 'add-api', {});
      });

      $('#rowMenu').addEventListener('click', function (event) {
        var button = event.target.closest('[data-menu-action]');
        if (button) handleMenuAction(button.dataset.menuAction);
      });

      $('#formModalConfirm').addEventListener('click', confirmFormModal);
      $$('[data-close-modal]').forEach(function (button) { button.addEventListener('click', function () { closeFormModal(false); }); });
      $$('[data-close-drawer]').forEach(function (button) { button.addEventListener('click', closeDetailDrawer); });
      $$('[data-close-dialog]').forEach(function (button) { button.addEventListener('click', closeConfirmDialog); });
      $('#confirmDialogConfirm').addEventListener('click', confirmDialogAction);
      $('#closeAnno').addEventListener('click', closeAnnoPopup);

      modalOverlay.addEventListener('click', function (event) { if (event.target === modalOverlay) closeFormModal(false); });
      drawerOverlay.addEventListener('click', function (event) { if (event.target === drawerOverlay) closeDetailDrawer(); });
      dialogOverlay.addEventListener('click', function (event) { if (event.target === dialogOverlay) closeConfirmDialog(); });
      annotationPopup.addEventListener('click', function (event) { if (event.target === annotationPopup) closeAnnoPopup(); });

      $('#formModalBody').addEventListener('change', function (event) {
        var environmentInput = event.target.closest('[data-environment]');
        var memberInput = event.target.closest('[data-member]');
        if (environmentInput) {
          if (environmentInput.checked) selectedEnvironmentNames.add(environmentInput.dataset.environment);
          else selectedEnvironmentNames.delete(environmentInput.dataset.environment);
          $('#boundEnvironmentCount').textContent = selectedEnvironmentNames.size;
        }
        if (memberInput) {
          if (memberInput.checked) selectedMemberNames.add(memberInput.dataset.member);
          else selectedMemberNames.delete(memberInput.dataset.member);
          $('#memberSelectedCount').textContent = selectedMemberNames.size;
          $('#memberSelectionError').textContent = '';
        }
      });

      document.addEventListener('click', function (event) {
        if (!event.target.closest('#rowMenu,[data-more-proxy]')) closeRowMenu();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          if (!annotationPopup.classList.contains('hidden')) closeAnnoPopup();
          else if (!dialogOverlay.classList.contains('hidden')) closeConfirmDialog();
          else if (!drawerOverlay.classList.contains('hidden')) closeDetailDrawer();
          else if (!modalOverlay.classList.contains('hidden')) closeFormModal(false);
          else if (!$('#rowMenu').classList.contains('hidden')) closeRowMenu(true);
          return;
        }
        if (event.key === 'Tab') {
          var panel = activeOverlayPanel();
          if (panel) trapFocus(event, panel);
        }
      }, true);

      $('#mainContent').addEventListener('scroll', renderAnnoBadges, { passive: true });
      window.addEventListener('resize', function () {
        closeRowMenu();
        renderAnnoBadges();
      });
      setupAnnotationDragging();
      try {
        if (sessionStorage.getItem('yundeng-proxy-expiry-notice-closed') === 'true') $('#expiryNotice').classList.add('hidden');
      } catch (_) {}

      render();
      window.lucide && window.lucide.createIcons();
      requestAnimationFrame(renderAnnoBadges);
    })();
  </script>
