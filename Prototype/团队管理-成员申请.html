<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云登 · 成员申请</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#0066FF",
                hover: "#0052CC",
                active: "#0047B3",
                bg: "#E6F0FF",
              },
              ink: {
                title: "#1A1D24",
                body: "#3A3F4A",
                sub: "#6E7685",
                muted: "#9DA2AC",
              },
              line: {
                DEFAULT: "#DFE1E5",
                light: "#E8EAED",
                lighter: "#F0F1F3",
              },
              page: "#F7F8FA",
              card: "#FFFFFF",
              hover: "#F3F4F6",
              "block-hover": "#F0F1F3",
              price: "#FE5416",
              success: { DEFAULT: "#0FC060", bg: "#E7F9F0" },
              warning: { DEFAULT: "#E7772D", bg: "#FDF2E9" },
              danger: { DEFAULT: "#D9001B", bg: "#FFE8EB" },
              info: { DEFAULT: "#0091D5", bg: "#E4F4FB" },
            },
            borderRadius: { DEFAULT: "4px", md: "6px", lg: "8px" },
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                "Helvetica Neue",
                "Helvetica",
                "Arial",
                "sans-serif",
              ],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      /* 布局、颜色和尺寸取自 design.md §2–5；业务树缩进取 20px 间距梯度。 */
      :root {
        --primary: #0066ff;
        --primary-hover: #0052cc;
        --primary-bg: #e6f0ff;
        --title: #1a1d24;
        --body: #3a3f4a;
        --sub: #6e7685;
        --muted: #9da2ac;
        --line: #dfe1e5;
        --light: #e8eaed;
        --lighter: #f0f1f3;
        --page: #f7f8fa;
        --card: #ffffff;
        --hover: #f3f4f6;
        --danger: #d9001b;
        --success: #0fc060;
        --warning: #e7772d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        color: var(--body);
        background: var(--page);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      input,
      textarea {
        caret-color: var(--primary);
      }
      input[type="checkbox"],
      input[type="radio"] {
        accent-color: var(--primary);
      }
      ::selection {
        background: var(--primary-bg);
        color: var(--primary);
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      h2,
      h3,
      p {
        margin: 0;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
        color: var(--title);
      }
      h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--title);
      }
      a {
        color: var(--primary);
        text-underline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--sub);
      }
      .small {
        font-size: 12px;
      }
      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .spaced {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .btn {
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--body);
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--card);
      }
      .btn.primary:hover {
        background: var(--primary-hover);
      }
      .btn.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--card);
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--sub);
      }
      .icon-btn:hover {
        background: var(--hover);
        color: var(--body);
      }
      .link {
        border: 0;
        background: transparent;
        color: var(--primary);
        padding: 0;
        white-space: nowrap;
      }
      .link:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link.danger {
        color: var(--danger);
      }
      .row-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
      }
      .field {
        height: 32px;
        width: 100%;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--body);
        min-width: 0;
      }
      .field:focus {
        outline: 0;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-bg);
      }
      textarea.field {
        height: 88px;
        padding: 8px 10px;
        resize: vertical;
      }
      .field[aria-invalid="true"] {
        border-color: var(--danger);
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        margin-top: 4px;
        min-height: 0;
      }
      .required {
        color: var(--danger);
        margin-right: 4px;
      }
      .workspace {
        background: var(--card);
        border-radius: 8px;
        /* 顶部 20px 即工具栏与区块上方的间距；左右与底部沿用区块内边距。 */
        padding: 20px 24px 24px;
        min-height: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .team-summary {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        padding-bottom: 20px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--light);
      }
      .team-summary h2 {
        margin-right: 4px;
      }
      /* 成员申请：状态页签与搜索框放在同一个 div（.application-toolbar）内，
         两者同一行、按垂直中线对齐；该 div 与上方内容、下方列表各保持 20px 间距。 */
      .application-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 0 16px;
        margin: 0 0 20px;
      }
      .application-toolbar .tabs {
        flex: 0 1 auto;
        min-width: 0;
        margin-bottom: 0;
        border-bottom: 0;
        overflow-x: auto;
      }
      .application-toolbar .order-search-filter-group {
        flex: 0 1 440px;
      }
      /* design.md §5.4.2：搜索框的结构、样式与交互统一由公共层 YDSearchBox 提供，页面只声明容器。 */
      .application-toolbar .order-global-search {
        min-width: 0;
      }
      .split {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 20px;
        flex: 1;
        min-width: 0;
      }
      .rail {
        min-width: 0;
        border-right: 1px solid var(--light);
        padding-right: 20px;
      }
      .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .rail .field {
        margin-bottom: 12px;
      }
      .detail {
        min-width: 0;
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        border-radius: 4px;
        padding-right: 4px;
      }
      .tree-row:hover {
        background: var(--hover);
      }
      .tree-row.active {
        background: var(--primary-bg);
        color: var(--primary);
      }
      .tree-row .tree-label {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 6px 0;
        color: inherit;
      }
      .tree-label span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree-row .icon-btn {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }
      .tree-row .node-more {
        opacity: 0;
      }
      .tree-row:hover .node-more,
      .tree-row:focus-within .node-more {
        opacity: 1;
      }
      .table-scroll {
        width: 100%;
        overflow-x: auto;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .data-table th {
        text-align: left;
        font-weight: 600;
        font-size: 12px;
        color: var(--sub);
        padding: 9px 12px;
        background: var(--lighter);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .data-table td {
        text-align: left;
        padding: 9px 12px;
        height: 48px;
        border-bottom: 1px solid var(--lighter);
        white-space: nowrap;
      }
      .data-table tbody tr:hover {
        background: var(--hover);
      }
      .data-table tr.selected {
        background: var(--primary-bg);
      }
      .member-table {
        min-width: 1150px;
      }
      .member-cell {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .avatar {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--primary-bg);
        color: var(--primary);
        position: relative;
        font-size: 12px;
        flex-shrink: 0;
      }
      .avatar .owner {
        position: absolute;
        right: -4px;
        top: -4px;
        width: 12px;
        height: 12px;
        color: var(--warning);
        background: var(--card);
        border-radius: 50%;
      }
      .toggle {
        position: relative;
        width: 32px;
        height: 18px;
        background: var(--line);
        border: 0;
        border-radius: 16px;
        padding: 0;
      }
      .toggle::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        left: 2px;
        top: 2px;
        background: var(--card);
        border-radius: 50%;
        transition: transform 0.15s;
      }
      .toggle[aria-checked="true"] {
        background: var(--primary);
      }
      .toggle[aria-checked="true"]::after {
        transform: translateX(14px);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 12px;
        background: var(--page);
        color: var(--sub);
      }
      .badge.success {
        color: var(--success);
        background: #e7f9f0;
      }
      .badge.warning {
        color: var(--warning);
        background: #fdf2e9;
      }
      .badge.danger {
        color: var(--danger);
        background: #ffe8eb;
      }
      .pager {
        padding-top: 20px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 12px;
      }
      .page-nav {
        display: flex;
        gap: 4px;
      }
      .pg-btn {
        height: 30px;
        min-width: 30px;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 4px;
      }
      .pg-btn.current {
        color: var(--card);
        background: var(--primary);
        border-color: var(--primary);
      }
      .pager select {
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
      }
      .jump {
        width: 44px;
        height: 30px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .empty {
        padding: 56px 16px;
        text-align: center;
        color: var(--sub);
      }
      .empty svg {
        display: block;
        width: 32px;
        height: 32px;
        margin: 0 auto 12px;
        color: var(--muted);
      }
      .role-item {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        min-height: 40px;
        border-radius: 4px;
        margin-bottom: 4px;
      }
      .role-item.active {
        background: var(--primary-bg);
        color: var(--primary);
      }
      .role-item:hover {
        background: var(--hover);
      }
      .role-item button {
        border: 0;
        background: none;
        color: inherit;
        text-align: left;
        flex: 1;
        padding: 4px 0;
      }
      .role-item .grip {
        color: var(--muted);
        cursor: grab;
      }
      .role-item .reorder {
        width: 24px;
        flex: 0 0 24px;
        text-align: center;
        opacity: 0;
      }
      .role-item:hover .reorder,
      .role-item:focus-within .reorder {
        opacity: 1;
      }
      .role-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        color: var(--sub);
        font-size: 12px;
        margin: 12px 0 8px;
      }
      .role-note {
        color: var(--sub);
        margin-bottom: 20px;
        overflow-wrap: anywhere;
      }
      .tabs {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid var(--light);
        margin-bottom: 20px;
      }
      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--sub);
        padding: 10px 0;
        white-space: nowrap;
      }
      .tab[aria-selected="true"] {
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 600;
      }
      .tab:hover {
        color: var(--primary);
      }
      dialog.overlay {
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: var(--card);
        color: var(--body);
        width: 760px;
        max-width: 92vw;
        max-height: 90dvh;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      }
      dialog.overlay::backdrop {
        background: rgba(0, 0, 0, 0.3);
      }
      dialog.overlay[open] {
        display: flex;
        flex-direction: column;
      }
      /* 弹窗打开时初始焦点落在容器上用于承接 Esc / 读屏上下文，容器本身不是可交互控件，
         去掉浏览器默认的蓝色聚焦描边；弹窗内部控件仍保留各自的 focus-visible 描边。 */
      dialog.overlay:focus {
        outline: none;
      }
      .dialog-head {
        padding: 0 20px;
        height: 56px;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--light);
      }
      .dialog-body {
        padding: 24px;
        overflow-y: auto;
        min-height: 0;
        flex: 1;
      }
      .dialog-foot {
        height: 64px;
        min-height: 64px;
        border-top: 1px solid var(--light);
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
      }
      .form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 96px minmax(0, 400px);
        gap: 6px 12px;
        justify-content: center;
        align-items: start;
      }
      .form-row > label {
        padding-top: 6px;
        text-align: right;
      }
      .form-row .field-wrap {
        min-width: 0;
      }
      .counter {
        text-align: right;
        color: var(--sub);
        font-size: 12px;
        margin-top: 4px;
      }
      .form-section {
        padding-top: 20px;
        margin-top: 20px;
        border-top: 1px solid var(--light);
      }
      .form-section h3 {
        margin-bottom: 16px;
      }
      .choice-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 240px;
        overflow: auto;
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
      }
      .picker {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .picker > summary {
        list-style: none;
        min-height: 30px;
        padding: 5px 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .picker > summary::-webkit-details-marker {
        display: none;
      }
      .picker-content {
        border-top: 1px solid var(--light);
        padding: 8px;
        max-height: 260px;
        overflow: auto;
      }
      .picker-content > .field {
        margin-bottom: 8px;
      }
      .picker-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      .picker-row:hover {
        background: var(--hover);
      }
      .chips {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .chip {
        background: var(--primary-bg);
        color: var(--primary);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 12px;
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .chip button {
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        display: flex;
      }
      .chip svg {
        width: 12px;
        height: 12px;
      }
      .notice {
        padding: 12px;
        background: var(--page);
        border-radius: 4px;
        color: var(--sub);
        margin-bottom: 16px;
      }
      .notice.warning {
        color: var(--warning);
        background: #fdf2e9;
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20000;
        max-width: calc(100% - 32px);
        padding: 10px 16px;
        border-radius: 4px;
        background: var(--title);
        color: var(--card);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      }
      .permission-node {
        border-bottom: 1px solid var(--lighter);
        padding: 6px 0;
      }
      .permission-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
      }
      .permission-ops {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        padding: 4px 0 8px 32px;
      }
      .selector-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .selector-side {
        min-width: 0;
        max-height: 400px;
        overflow: auto;
      }
      .selector-side + .selector-side {
        border-left: 1px solid var(--light);
        padding-left: 20px;
      }
      .selected-person {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0;
      }
      .dropdown {
        position: relative;
      }
      .dropdown > summary {
        list-style: none;
      }
      .dropdown > summary::-webkit-details-marker {
        display: none;
      }
      .menu {
        position: absolute;
        top: 36px;
        left: 0;
        z-index: 20;
        min-width: 160px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .menu button {
        display: block;
        border: 0;
        border-radius: 4px;
        background: transparent;
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        color: var(--body);
      }
      .menu button:hover {
        background: var(--hover);
      }
      .import-upload {
        padding: 32px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 8px;
        margin: 16px 0;
      }
      .import-upload.dragover {
        border-color: var(--primary);
        background: var(--primary-bg);
      }
      .wrap {
        white-space: normal !important;
        overflow-wrap: anywhere;
      }
      @media (max-width: 1000px) {
        .split {
          grid-template-columns: 180px minmax(0, 1fr);
          gap: 16px;
        }
        .rail {
          padding-right: 16px;
        }
        .workspace {
          padding: 20px;
        }
        .application-toolbar .tabs {
          flex-basis: auto;
        }
        .application-toolbar .order-search-filter-group {
          flex-basis: auto;
        }
      }
      @media (max-width: 900px) {
        /* 本页结构要求页签与搜索框始终同排，因此覆盖 design.md §5.4.2 E 在小屏下的默认换行，让搜索框改为弹性收缩。 */
        .application-toolbar .order-search-filter-group {
          width: auto;
          flex: 0 1 auto;
          margin-left: auto;
          justify-content: flex-end;
        }
        .application-toolbar .order-global-search {
          width: auto;
          flex: 1 1 auto;
        }
      }
      @media (max-width: 720px) {
        .split {
          grid-template-columns: minmax(0, 1fr);
        }
        .rail {
          border-right: 0;
          border-bottom: 1px solid var(--light);
          padding: 0 0 16px;
        }
        .rail-tree,
        .role-list {
          max-height: 200px;
          overflow: auto;
        }
        .workspace {
          padding: 16px;
        }
        .application-toolbar .order-search-filter-group {
          gap: 12px;
        }
        .form-row {
          grid-template-columns: 1fr;
        }
        .form-row > label {
          text-align: left;
          padding: 0;
        }
        .selector-grid {
          grid-template-columns: 1fr;
        }
        .selector-side + .selector-side {
          border-left: 0;
          border-top: 1px solid var(--light);
          padding: 16px 0 0;
        }
        .dialog-body {
          padding: 20px;
        }
        /* 窄屏下拒绝理由卡片改为单列，避免文案与图标挤压。 */
        .reject-reasons {
          grid-template-columns: minmax(0, 1fr);
        }
        .team-summary {
          gap: 8px 12px;
        }
        .tabs {
          gap: 16px;
          overflow-x: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
      /* CDN 的基础样式异步注入；明确业务标题选择器，保持 design.md 的 16px/600 层级。 */
      .workspace h2,
      .overlay h2,
      .workspace h3,
      .overlay h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--title);
      }
      .form-section h3 {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .form-section h3 > span {
        display: inline-flex;
        color: var(--sub);
      }
      /* 宽成员表格固定操作列，滚动时仍可编辑和删除。 */
      .member-table th:last-child,
      .member-table td:last-child {
        position: sticky;
        right: 0;
        min-width: 96px;
        border-left: 1px solid var(--light);
        background: var(--card);
      }
      .member-table th:last-child {
        background: var(--lighter);
      }
      .member-table tbody tr:hover td:last-child {
        background: var(--hover);
      }
      .member-table tr.selected td:last-child {
        background: var(--primary-bg);
      }
      @media (min-width: 721px) {
        .role-rail {
          display: flex;
          flex-direction: column;
          height: calc(100dvh - 80px);
        }
        .role-rail > .field {
          flex-shrink: 0;
        }
        .role-list {
          flex: 1;
          min-height: 0;
          overflow: auto;
        }
        #roleDetail {
          height: calc(100dvh - 80px);
          overflow-y: auto;
          padding-right: 4px;
        }
      }
      /* design.md §5.3：高密度列表状态使用纯语义色文本。 */
      .data-table .badge {
        background: none;
        border: 0;
        border-radius: 0;
        padding: 0;
        font-size: 13px;
        font-weight: 500;
      }
      /* ---------- 审批成员弹窗（design.md §5.6 Modal / §2 语义色） ----------
         通过 / 拒绝共用同一弹窗壳：按参考图去掉标题栏与底部操作区的分隔线，控件填浅灰并铺满控件列。 */
      #businessDialog.approval-dialog .dialog-head {
        border-bottom: 0;
      }
      #businessDialog.approval-dialog .dialog-foot {
        border-top: 0;
      }
      .approval-form {
        gap: 20px;
      }
      /* 标签列 96px 右对齐（末尾中文全角冒号），控件列固定 400px、各字段起点一致。 */
      .approval-form .form-row {
        grid-template-columns: 96px minmax(0, 400px);
        gap: 6px 16px;
        justify-content: center;
      }
      /* 空校验占位不参与排版，保证相邻「字段 + 组件」行间距恒为 20px。 */
      .approval-form .error:empty {
        margin-top: 0;
      }
      .approval-form .form-row > label {
        white-space: nowrap;
      }
      /* 申请人信息回显（真实姓名 / 账号 / 联系方式）：禁用输入框置灰，与控件列同一左边界。 */
      .approval-info {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .approval-form .field.is-readonly {
        background: var(--page);
        border-color: var(--light);
        color: var(--muted);
        cursor: not-allowed;
      }
      /* 浅灰填充控件：参考图的日期 / 时间子控件为浅灰底 + 浅描边，
         就近取 design.md 梯度（bg-page 填充 + line-light 描边），不自造色值。 */
      .approval-form .order-date-trigger,
      .approval-form .time-range-trigger {
        background: var(--page);
        border-color: var(--light);
      }
      .approval-form .field[aria-invalid="true"] {
        border-color: var(--danger);
      }
      /* 自定义下拉（角色多选 / 部门树 / 联系方式）：白底控件，规格取 design.md §5.9（32px 高 / 4px 圆角 / 1px line 描边）。 */
      .ap-select {
        position: relative;
        width: 100%;
        min-width: 0;
      }
      .ap-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 32px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--body);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .ap-trigger:hover {
        border-color: var(--muted);
      }
      .ap-trigger:focus-visible,
      .ap-trigger[aria-expanded="true"] {
        outline: 0;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-bg);
      }
      .ap-trigger[aria-invalid="true"] {
        border-color: var(--danger);
      }
      .ap-value {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }
      .ap-placeholder {
        color: var(--muted);
      }
      .ap-affix {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        color: var(--muted);
      }
      .ap-affix > svg {
        width: 16px;
        height: 16px;
        transition: transform 0.15s;
      }
      .ap-trigger[aria-expanded="true"] .ap-affix > svg {
        transform: rotate(180deg);
      }
      /* 全部清空入口：仅在有已选角色时出现。 */
      .ap-clear {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .ap-clear:hover {
        background: var(--primary-bg);
        color: var(--primary);
      }
      .ap-clear.is-hidden {
        display: none;
      }
      .ap-clear svg {
        width: 12px;
        height: 12px;
      }
      .chip-remove {
        opacity: 0.55;
        border-radius: 2px;
      }
      .chip-remove:hover {
        opacity: 1;
        background: var(--primary-bg);
      }
      .chip-remove:focus-visible {
        opacity: 1;
        outline: 2px solid var(--primary);
        outline-offset: 1px;
      }
      /* 下拉面板：fixed 浮层脱离文档流，展开时只遮挡下方字段、不推动弹窗内其它字段。 */
      .ap-panel {
        position: fixed;
        inset: auto;
        margin: 0;
        z-index: 1200;
        max-height: 260px;
        overflow: auto;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      }
      .ap-panel > .ap-search {
        margin-bottom: 8px;
        background: var(--card);
      }
      .ap-option,
      .ap-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .ap-option:hover,
      .ap-row:hover {
        background: var(--hover);
      }
      .ap-option.is-selected,
      .ap-row.is-selected {
        color: var(--primary);
        font-weight: 600;
      }
      .ap-option {
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      .ap-option input[type="checkbox"] {
        margin: 0;
        flex-shrink: 0;
        accent-color: var(--primary);
      }
      /* 组织树行：只保留展开 / 收起箭头与部门名，去掉单选按钮与结构图标。 */
      .ap-caret {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 16px;
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--sub);
        cursor: pointer;
      }
      .ap-caret:hover {
        color: var(--primary);
      }
      .ap-caret svg {
        width: 12px;
        height: 12px;
        transition: transform 0.15s;
      }
      .ap-caret[aria-expanded="true"] svg {
        transform: rotate(90deg);
      }
      .ap-caret-ph {
        flex: 0 0 16px;
        width: 16px;
      }
      .ap-node {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      /* 登录时间：单选行 + 勾选后启用的「可登录日期 / 可登录时间」子行。 */
      .radio-row {
        display: flex;
        align-items: center;
        gap: 28px;
        min-height: 32px;
      }
      .radio-opt,
      .approval-check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--body);
        white-space: nowrap;
        cursor: pointer;
      }
      .radio-opt input,
      .approval-check input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--primary);
      }
      .approval-fixed-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      /* 子行勾选框落在控件列起点，字段名与控件依次跟随（参考图布局）。 */
      .approval-subrow .field-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .approval-subfield {
        position: relative;
        flex: 1 1 262px;
        max-width: 100%;
        min-width: 0;
      }
      .approval-subfield .order-date-trigger {
        color: var(--muted);
      }
      .approval-subfield .order-date-trigger-value.is-selected {
        color: var(--body);
      }
      /* 日期范围控件与日历浮层（与登录请求页授权设置同源）。 */
      .order-date-control-wrap {
        position: relative;
        display: block;
        width: 100%;
        max-width: 100%;
      }
      .order-date-trigger {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 100%;
        height: 32px;
        padding: 0 10px 0 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--muted);
        font: 14px/1.5 inherit;
        text-align: left;
        cursor: pointer;
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }
      .order-date-trigger:hover {
        background: var(--hover);
      }
      .order-date-trigger:focus-visible {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-bg);
      }
      .order-date-trigger-values {
        display: flex;
        align-items: center;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .order-date-trigger-value {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .order-date-trigger-value.is-selected {
        color: var(--body);
        font-family: "JetBrains Mono", monospace;
        font-variant-numeric: tabular-nums;
      }
      .order-date-trigger-separator {
        margin: 0 10px;
        color: var(--muted);
        flex: 0 0 auto;
      }
      .order-date-trigger .order-date-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        color: var(--muted);
        pointer-events: none;
      }
      /* 浮层提升为 popover 后以 fixed 定位锚定触发器：展开不推动其它字段，允许遮挡下方内容。 */
      .order-date-picker {
        position: fixed;
        inset: auto;
        margin: 0;
        width: 620px;
        max-width: min(620px, calc(100vw - 80px));
        z-index: 1200;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        padding: 16px;
      }
      .order-calendar-months {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .order-calendar-month {
        min-width: 0;
      }
      .order-calendar-month + .order-calendar-month {
        border-left: 1px solid var(--light);
        padding-left: 12px;
      }
      .order-calendar-month-head {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) 58px;
        align-items: center;
        margin-bottom: 8px;
      }
      .order-calendar-nav-group {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .order-calendar-nav {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 4px;
        color: var(--sub);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        cursor: pointer;
      }
      .order-calendar-nav:hover {
        background: var(--hover);
        color: var(--primary);
      }
      .order-calendar-nav-spacer {
        width: 58px;
        height: 28px;
        display: block;
      }
      .order-calendar-title {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        line-height: 28px;
        text-align: center;
        color: var(--body);
      }
      @media (max-width: 720px) {
        .order-calendar-month-head {
          grid-template-columns: 48px minmax(0, 1fr) 48px;
        }
        .order-calendar-title {
          font-size: 13px;
          white-space: nowrap;
        }
        .order-calendar-nav {
          width: 22px;
          height: 26px;
        }
      }
      .order-calendar-week {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 2px;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }
      .order-calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 2px;
      }
      .order-calendar-day {
        height: 30px;
        border: 0;
        border-radius: 4px;
        background: var(--card);
        color: var(--body);
        font: 12px "JetBrains Mono", monospace;
        cursor: pointer;
        position: relative;
      }
      .order-calendar-day:hover {
        background: var(--hover);
        color: var(--primary);
      }
      .order-calendar-day:disabled {
        color: var(--muted);
        cursor: not-allowed;
        background: transparent;
      }
      /* 非本月日期沿用 design.md 的 muted 梯度（降透明度），避免引入规范外色值。 */
      .order-calendar-day.is-other {
        color: var(--muted);
        opacity: 0.72;
      }
      .order-calendar-day.is-range {
        background: var(--primary-bg);
      }
      .order-calendar-day.is-start,
      .order-calendar-day.is-end {
        background: var(--primary);
        color: var(--card);
        border-radius: 4px;
        font-weight: 600;
      }
      .order-calendar-day.is-start:not(.is-end) {
        border-radius: 4px 0 0 4px;
      }
      .order-calendar-day.is-end:not(.is-start) {
        border-radius: 0 4px 4px 0;
      }
      .order-calendar-day.is-start.is-end {
        border-radius: 4px;
      }
      .order-calendar-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--light);
        margin-top: 14px;
        padding-top: 12px;
      }
      .order-calendar-value {
        font-size: 12px;
        color: var(--sub);
        font-family: "JetBrains Mono", monospace;
      }
      .order-calendar-actions {
        display: flex;
        gap: 8px;
      }
      /* 时间范围控件与滚轮浮层（与登录请求页授权设置同源）。 */
      .time-range-control {
        position: relative;
        width: 100%;
      }
      .time-range-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--muted);
        font: 14px/1.5 inherit;
        cursor: pointer;
      }
      .time-range-trigger:hover {
        background: var(--hover);
      }
      .time-range-trigger:focus-visible {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-bg);
      }
      .time-range-value {
        font-family: "JetBrains Mono", monospace;
        font-variant-numeric: tabular-nums;
      }
      .time-range-value.is-selected {
        color: var(--body);
      }
      .time-range-separator {
        color: var(--muted);
        margin: 0 6px;
      }
      .time-range-picker {
        position: fixed;
        inset: auto;
        margin: 0;
        z-index: 1200;
        width: 360px;
        max-width: calc(100vw - 80px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        padding: 12px 0 0;
      }
      .time-range-picker[hidden] {
        display: none;
      }
      .time-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .time-col + .time-col {
        border-left: 1px solid var(--light);
      }
      .time-col h4 {
        margin: 0 0 8px;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: var(--body);
      }
      .time-wheels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        height: 168px;
        overflow: hidden;
        padding: 0 6px;
      }
      .time-wheel {
        height: 100%;
        overflow-y: auto;
        scrollbar-width: none;
        text-align: center;
        padding: 72px 0;
      }
      .time-wheel::-webkit-scrollbar {
        display: none;
      }
      .time-wheel button {
        display: block;
        width: 100%;
        height: 24px;
        border: 0;
        background: transparent;
        color: var(--sub);
        font: 13px "JetBrains Mono", monospace;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .time-wheel button[aria-selected="true"] {
        color: var(--title);
        font-weight: 700;
      }
      .time-wheel button:hover {
        color: var(--primary);
      }
      .time-picker-foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 24px;
        border-top: 1px solid var(--light);
        margin-top: 12px;
        padding: 10px 16px;
      }
      .text-btn {
        border: 0;
        background: transparent;
        color: var(--sub);
        font: 13px inherit;
        cursor: pointer;
      }
      .text-btn:hover {
        color: var(--primary);
      }
      .text-btn.primary {
        color: var(--primary);
        font-weight: 600;
      }
      /* ---------- 拒绝审批：选择拒绝理由（单选卡片 2×2 网格） ----------
         design.md 未覆盖「复选卡片」组件，按下述梯度就近取值：白底卡片 + line 描边 +
         8px 圆角（borderRadius.lg），hover 取 block-hover，选中态取 primary 描边 + primary-bg 填充；
         理由图标使用 32px 圆形底，配色取 §2 语义色（warning / danger / info / ink-muted）。 */
      .reject-form {
        gap: 0;
        margin: 24px 0 40px;
      }
      .reject-reasons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px 20px;
      }
      .reject-reasons:focus {
        outline: none;
      }
      .reject-reasons[aria-invalid="true"] .reject-reason {
        border-color: var(--danger);
      }
      .reject-reason {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 64px;
        padding: 0 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);

      function renderTree() {}

      function applicationMatchesSearch(a) {

      /* ---------- 审批成员弹窗：浮层工具 + 可登录日期 / 时间控件（与登录请求页授权设置同源） ---------- */
      // 展开：面板脱离文档流固定定位在触发器下方（空间不足时翻到上方）；关闭：收回并隐藏。
      function openFloatPanel(panel, trigger, align = "left") {
        if (!panel || !trigger) return;
        panel.hidden = false;
        if (typeof panel.showPopover === "function" && !panel.matches(":popover-open")) {
          try {
            panel.showPopover();
          } catch (err) {
            /* 旧内核不支持时降级为普通固定定位浮层 */
          }
        }
        const rect = trigger.getBoundingClientRect(),
          width = panel.offsetWidth,
          height = panel.offsetHeight,
          pad = 12;
        let left = align === "right" ? rect.right - width : rect.left;
        let top = rect.bottom + 8;
        left = Math.max(pad, Math.min(left, window.innerWidth - width - pad));
        if (height && top + height > window.innerHeight - pad) {
          const above = rect.top - height - 8;
          top = above >= pad ? above : Math.max(pad, window.innerHeight - height - pad);
        }
        panel.style.top = Math.round(top) + "px";
        panel.style.left = Math.round(left) + "px";
      }
      function closeFloatPanel(panel) {
        if (!panel) return;
        if (typeof panel.hidePopover === "function" && panel.matches(":popover-open")) {
          try {
            panel.hidePopover();
          } catch (err) {
            /* 忽略重复收起 */
          }
        }
        panel.style.top = "";
        panel.style.left = "";
        panel.hidden = true;
      }

      const approvalCalState = {

      function approvalDateKey(date) {

        return `${y}-${m}-${d}`;
      }
      function approvalMaxDate() {
        return approvalDateKey(new Date());

      function approvalDateObject(value) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || "");
        return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
      }
      function approvalDateCalendarMarkup() {
        const monthHead = (index, side) => {
          const nav = (dir, label, ico) =>
            `<button type="button" class="order-calendar-nav" data-approval-date-nav="${dir}" aria-label="${label}" title="${label}">${icon(ico)}</button>`;
          const prev = `${nav("prev-year", "上一年", "chevrons-left")}${nav("prev-month", "上个月", "chevron-left")}`;

          return `<div class="order-calendar-month-head">${side === "left" ? `<div class="order-calendar-nav-group">${prev}</div>` : '<span class="order-calendar-nav-spacer" aria-hidden="true"></span>'}<h3 id="approvalDateMonth${index}" class="order-calendar-title"></h3>${side === "right" ? `<div class="order-calendar-nav-group">${next}</div>` : '<span class="order-calendar-nav-spacer" aria-hidden="true"></span>'}</div>`;
        };
        const month = (index, side) =>
          `<section class="order-calendar-month">${monthHead(index, side)}<div id="approvalDateWeeks${index}" class="order-calendar-week"></div><div id="approvalDateGrid${index}" class="order-calendar-grid"></div></section>`;
        return (
          `<div class="order-calendar-months">${month(1, "left")}${month(2, "right")}</div>` +
          '<div class="order-calendar-foot"><span id="approvalDateValue" class="order-calendar-value">未选择</span><div class="order-calendar-actions">' +
          '<button type="button" id="approvalDateClear" class="btn">清空</button><button type="button" id="approvalDateCancel" class="btn">取消</button><button type="button" id="approvalDateConfirm" class="btn primary">确定</button>' +
          "</div></div>"

      function approvalMonthHtml(year, month) {
        const first = new Date(year, month, 1),
          offset = first.getDay(),
          start = approvalCalState.start,
          end = approvalCalState.end,
          validRange = Boolean(start && end && end >= start),
          max = approvalMaxDate(),
          cells = [];
        for (let index = 0; index < 42; index++) {
          const date = new Date(year, month, index - offset + 1),
            key = approvalDateKey(date),
            current = date.getMonth() === month,
            inRange = validRange && key > start && key < end,
            isStart = key === start,
            isEnd = key === end,
            disabled = key > max;
          cells.push(
            `<button type="button" class="order-calendar-day ${current ? "" : "is-other "}${inRange ? "is-range " : ""}${isStart ? "is-start " : ""}${isEnd ? "is-end " : ""}" data-approval-calendar-date="${key}" ${disabled ? 'disabled aria-disabled="true"' : ""} aria-label="${key}">${date.getDate()}</button>`,
          );
        }
        return cells.join("");
      }
      function approvalRenderCalendar() {
        const left = new Date(
            approvalCalState.view.getFullYear(),
            approvalCalState.view.getMonth(),
            1,
          ),
          right = new Date(left.getFullYear(), left.getMonth() + 1, 1),
          weeks =
            "<span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>";
        [left, right].forEach((month, index) => {
          $("#approvalDateMonth" + (index + 1)).textContent =
            month.getFullYear() + " 年 " + (month.getMonth() + 1) + " 月";
          $("#approvalDateWeeks" + (index + 1)).innerHTML = weeks;
          $("#approvalDateGrid" + (index + 1)).innerHTML = approvalMonthHtml(
            month.getFullYear(),
            month.getMonth(),

        });
        $("#approvalDateValue").textContent =

      function approvalSyncDateTrigger() {
        [

          node.classList.toggle("is-selected", Boolean(value));

        $("#approvalDateTrigger").setAttribute("aria-expanded", "false");

      function approvalSetupDatePicker() {

        picker.onclick = (e) => {
          e.stopPropagation();
          const nav = e.target.closest("[data-approval-date-nav]"),
            day = e.target.closest("[data-approval-calendar-date]");
          if (nav) {
            const d = nav.dataset.approvalDateNav,
              view = approvalCalState.view,
              y = d === "prev-year" ? -1 : d === "next-year" ? 1 : 0,
              m = d === "prev-month" ? -1 : d === "next-month" ? 1 : 0;
            approvalCalState.view = y
              ? new Date(view.getFullYear() + y, view.getMonth(), 1)
              : new Date(view.getFullYear(), view.getMonth() + m, 1);

          }
          if (day) {

            if (approvalCalState.active === "start") {
              approvalCalState.start = key;

              approvalCalState.start = key;
              approvalCalState.active = "end";

        $("#approvalDateConfirm").onclick = () => {
          if (approvalCalState.start && !approvalCalState.end)
            approvalCalState.end = approvalCalState.start;
          approvalCloseDatePicker(true);
        };
        approvalSyncDateTrigger();
      }
      const approvalTimeState = {
        // 滚轮默认停靠 09:20:27 / 10:20:27；只有用户在面板中确认后才回填到组件。
        start: { hour: 9, minute: 20, second: 27 },

      const approvalPad = (n) => String(n).padStart(2, "0");
      const approvalTimeString = (t) =>
        `${approvalPad(t.hour)}:${approvalPad(t.minute)}:${approvalPad(t.second)}`;
      function approvalTimePickerMarkup() {
        const col = (side, title) =>
          `<section class="time-col" data-time-side="${side}"><h4>${title}</h4><div class="time-wheels">${[

            "minute",
            "second",
          ]

            .join("")}</div></section>`;
        return `<div class="time-cols">${col("start", "开始时间")}${col("end", "结束时间")}</div><div class="time-picker-foot"><button type="button" id="approvalTimeCancel" class="text-btn">取消</button><button type="button" id="approvalTimeConfirm" class="text-btn primary">确定</button></div>`;
      }
      function approvalHighlightWheel(wheel) {
        const side = wheel.closest("[data-time-side]").dataset.timeSide,
          unit = wheel.dataset.unit,
          value = approvalTimeState[side][unit];

        );

      function approvalFillWheels() {
        $$("#approvalTimePicker .time-wheel").forEach((wheel) => {

            unit = wheel.dataset.unit,
            max = unit === "hour" ? 23 : 59;
          wheel.innerHTML = Array.from(
            { length: max + 1 },
            (_, i) =>
              `<button type="button" data-value="${i}" aria-selected="${i === approvalTimeState[side][unit]}">${approvalPad(i)}</button>`,
          ).join("");

      // 登录时间：默认「不限」；选「固定时间登录」后展开子行，勾选后才启用并作为限制条件，两项均不勾选也可提交。
      function setupApprovalDialog() {

            ...apDeptTree(d.id, level + 1, [...chain, d.id]),

          <input type="hidden" id="${id}" value="${esc(values.join(","))}">
        </div>`;
      }
      // 部门：组织树下拉，默认选中根目录；行点击即选中，面板为浮层不挤压下方字段。
      function approvalDeptPicker(id, value = "d0") {
        const nodes = apDeptTree();
        const expanded = nodes.filter((n) => n.hasChildren).map((n) => n.id);
        const current = deptBy(value);
        return `<div class="ap-select" id="${id}Select" data-expanded="${expanded.join(" ")}">
          <div class="ap-trigger" id="${id}Trigger" role="button" tabindex="0" aria-haspopup="tree" aria-expanded="false" aria-controls="${id}Panel" data-ap-toggle="${id}" data-field-error="${id}">
            <span class="ap-value" id="${id}Label">${current ? esc(current.name) : '<span class="ap-placeholder">请选择部门</span>'}</span>
            <span class="ap-affix">${icon("chevron-down")}</span>
          </div>
          <div class="ap-panel" id="${id}Panel" role="tree" aria-label="选择部门" popover="manual" hidden>
            <input class="field ap-search" placeholder="搜索部门" aria-label="搜索部门">
            <div class="ap-list">${nodes
              .map(
                (n) =>
                  `<div class="ap-row${value === n.id ? " is-selected" : ""}" data-search="${esc(n.name)}" data-ancestors="${n.chain.join(" ")}" data-value="${esc(n.id)}" style="padding-left:${8 + n.level * 20}px">${
                    n.hasChildren
                      ? `<button type="button" class="ap-caret" data-ap-caret="${esc(n.id)}" data-caret-name="${esc(n.name)}" aria-expanded="true" aria-label="收起${esc(n.name)}">${icon("chevron-right")}</button>`
                      : '<span class="ap-caret-ph" aria-hidden="true"></span>'
                  }<button type="button" class="ap-node" data-ap-dept="${id}" data-value="${esc(n.id)}" data-label="${esc(n.name)}">${esc(n.name)}</button></div>`,
              )
              .join("")}</div>
          </div>
          <input type="hidden" id="${id}" value="${esc(value)}">
        </div>`;
      }
      // 联系方式：输入框，默认回显申请人手机号或邮箱（原始值，不脱敏），可编辑。
      function approvalContactField(id, a) {
        return `<input id="${id}" class="field mono" type="text" value="${esc(a.contact || "")}" placeholder="请输入手机号或邮箱" autocomplete="off" spellcheck="false" data-field-error="${id}">`;
      }
      // 申请人信息回显：真实姓名 / 账号使用禁用置灰输入框（不可修改），与控件列同一左边界。
      function approvalInfoRows(a, withContact = false) {
        const row = (label, id, value, mono = false) =>
          `<div class="form-row"><label for="${id}">${label}：</label><div class="field-wrap"><input id="${id}" class="field is-readonly${mono ? " mono" : ""}" value="${esc(value)}" disabled></div></div>`;
        return `<div class="approval-info">${[
          row("真实姓名", "applicationName", a.name),
          row(
            "账号",
            "applicationAccount",
            a.account || (/@/.test(a.contact || "") ? a.contact : "—"),
            true,
          ),
          withContact
            ? row("联系方式", "applicationContactInfo", a.contact, true)
            : "",
        ].join("")}</div>`;
      }
      // 通过审批：角色（多选）/ 部门（组织树）/ 联系方式（输入框）必填，登录时间可配「不限」或「固定时间登录」。
      function approvalMarkup(a) {
        return `<form class="form approval-form" onsubmit="return false">
          ${approvalInfoRows(a)}
          ${formRow("角色", "applicationRole", approvalRolePicker("applicationRole", []), true)}
          ${formRow("部门", "applicationDept", approvalDeptPicker("applicationDept", "d0"), true)}
          ${formRow("联系方式", "applicationContact", approvalContactField("applicationContact", a))}
          <div class="form-row"><label for="applicationLoginUnlimited"><span class="required">*</span>登录时间：</label><div class="field-wrap"><div class="radio-row"><label class="radio-opt"><input type="radio" id="applicationLoginUnlimited" name="approvalLoginMode" value="unlimited" checked><span>不限</span></label><label class="radio-opt"><input type="radio" id="applicationLoginFixed" name="approvalLoginMode" value="fixed"><span>固定时间登录</span></label></div></div></div>
          <div id="approvalFixedWrap" class="approval-fixed-list" hidden>
            <div class="form-row approval-subrow"><span aria-hidden="true"></span><div class="field-wrap"><label class="approval-check" for="approvalDateEnabled"><input type="checkbox" id="approvalDateEnabled"><span>可登录日期</span></label><div id="approvalDateWrap" class="approval-subfield"><div class="order-date-control-wrap" role="group" aria-label="可登录日期"><button id="approvalDateTrigger" type="button" class="order-date-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="approvalDatePicker"><span class="order-date-trigger-values"><span id="approvalDateStartDisplay" class="order-date-trigger-value">开始日期</span><span class="order-date-trigger-separator" aria-hidden="true">→</span><span id="approvalDateEndDisplay" class="order-date-trigger-value">结束日期</span></span>${icon("calendar-days")}</button><div id="approvalDatePicker" class="order-date-picker" role="dialog" aria-label="可登录日期范围选择" popover="manual" hidden>${approvalDateCalendarMarkup()}</div></div></div></div></div>
            <div class="form-row approval-subrow"><span aria-hidden="true"></span><div class="field-wrap"><label class="approval-check" for="approvalTimeEnabled"><input type="checkbox" id="approvalTimeEnabled"><span>可登录时间</span></label><div id="approvalTimeWrap" class="approval-subfield"><div class="time-range-control" role="group" aria-label="可登录时间"><button id="approvalTimeTrigger" type="button" class="time-range-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="approvalTimePicker"><span id="approvalTimeStartDisplay" class="time-range-value">开始时间</span><span class="time-range-separator" aria-hidden="true">→</span><span id="approvalTimeEndDisplay" class="time-range-value">结束时间</span></button><div id="approvalTimePicker" class="time-range-picker" role="dialog" aria-label="可登录时间范围选择" popover="manual" hidden>${approvalTimePickerMarkup()}</div></div></div></div></div>
          </div>
        </form>`;
      }
      // 登录时间设置描述：不限或固定登录时间（含已勾选的维度范围）。
      function approvalLoginSetting() {
        const mode =
          $('input[name="approvalLoginMode"]:checked')?.value || "unlimited";
        if (mode !== "fixed") return "不限";
        const dateOn = Boolean($("#approvalDateEnabled").checked),
          timeOn = Boolean($("#approvalTimeEnabled").checked);
        return (
          "固定登录时间" +
          [
            dateOn
              ? `（可登录日期 ${approvalCalState.start} 至 ${approvalCalState.end}）`
              : "",
            timeOn && approvalTimeState.chosen
              ? `（可登录时间 ${approvalTimeString(approvalTimeState.start)} 至 ${approvalTimeString(approvalTimeState.end)}）`
              : "",
          ].join("")
        );
      }
      // 拒绝审批可选理由：固定 4 项、单选（选中一项即取消其它项）。
      const REJECT_REASONS = [
        { value: "已离职", tone: "warning", icon: "user-x" },
        { value: "非团队成员", tone: "danger", icon: "x" },
        { value: "资料填写有误", tone: "info", icon: "clipboard-x" },
        { value: "其它原因", tone: "muted", icon: "more-horizontal" },
      ];
      // 拒绝审批：2×2 单选卡片选择拒绝理由，必选一项，校验提示落在卡片组下方。
      function rejectApprovalMarkup() {
        return `<form class="form reject-form" onsubmit="return false">
          <div class="reject-reasons" id="applicationReason" role="radiogroup" aria-label="选择拒绝理由" tabindex="-1" data-field-error="applicationReason">
            ${REJECT_REASONS.map(
              (r) => `<label class="reject-reason">
              <input type="radio" name="rejectReason" value="${esc(r.value)}" data-reject-reason>
              <span class="reject-check" aria-hidden="true">${icon("check")}</span>
              <span class="reject-label">${esc(r.value)}</span>
              <span class="reject-icon" data-tone="${r.tone}" aria-hidden="true">${icon(r.icon)}</span>
            </label>`,
            ).join("")}
          </div>
          <p class="error" id="applicationReasonError" role="alert"></p>
        </form>`;
      }
      // 审批成员：通过 / 拒绝共用「审批成员」弹窗壳；通过需选角色、部门与联系方式，拒绝需选择拒绝理由。
      function reviewApplication(id, approve) {
        const a = data.applications.find((a) => a.id === id);
        if (!a || a.status !== "待审批") return;
        openDialog(
          approve ? "审批成员" : "选择拒绝理由",
          approve ? approvalMarkup(a) : rejectApprovalMarkup(),
          () => {
            if (approve) {
              const roleIds = checkedValues("applicationRole"),
                dept = $("#applicationDept").value;
              if (!error("applicationRole", roleIds.length ? "" : "请选择角色"))
                return false;
              if (!error("applicationDept", deptBy(dept) ? "" : "请选择部门"))
                return false;
              const contact = ($("#applicationContact")?.value || "").trim();
              if (!error("applicationContact", contact ? "" : "请输入联系方式"))
                return false;
              const fixed =
                $('input[name="approvalLoginMode"]:checked')?.value === "fixed";
              // 勾选「可登录日期 / 可登录时间」时必须给出完整范围，否则不写入设置。
              if (
                fixed &&
                $("#approvalDateEnabled").checked &&
                !(approvalCalState.start && approvalCalState.end)
              ) {
                toast("请选择完整的可登录日期范围");
                return false;
              }
              if (
                fixed &&
                $("#approvalTimeEnabled").checked &&
                !approvalTimeState.chosen
              ) {
                toast("请选择完整的可登录时间范围");
                return false;
              }
              a.dept = dept;
              a.roles = roleIds;
              a.role = roleIds[0];
              a.contact = contact;
              a.loginSetting = approvalLoginSetting();
              a.status = "已通过";
              if (!data.members.some((m) => m.phone === a.contact))
                data.members.push({
                  id: uid("m"),
                  name: a.name,
                  phone: a.contact,
                  dept,
                  roles: roleIds,
                  entry: "",
                  note: "通过入团申请加入",
                  enabled: true,
                  joined: new Date().toISOString().slice(0, 10),
                  updated: dateTime(),
                  owner: false,
                });
            } else {
              // 拒绝原因为单选：取中选项写入，列表拒绝原因列与检索同步生效。
              const [reason = ""] = checkedValues("rejectReason");
              if (!error("applicationReason", reason ? "" : "请选择拒绝理由"))
                return false;
              a.reason = reason;
              a.status = "已拒绝";
            }
            a.operator = "张小登";
            a.operated = dateTime();
            commit(approve ? "申请已通过" : "申请已拒绝");
          },
          {
            confirm: approve ? "通过" : "确认",
            cancel: "取消",
            variant: "approval",
          },
        );
        setupApprovalDialog();
      }
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-action]");
        if (!t) return;
        const { action, id } = t.dataset;
        if (action === "application-tab") {
          ui.applicationStatus = id;
          ui.page = 1;
          remember();
          render();
        }
        if (action === "application-approve") reviewApplication(id, true);
        if (action === "application-reject") reviewApplication(id, false);
      });
      // 点击日期 / 时间面板之外的区域视为取消展开，不影响弹窗内其它字段。
      document.addEventListener("click", (e) => {
        const dateWrap = $("#approvalDateWrap"),
          datePicker = $("#approvalDatePicker");
        if (dateWrap && datePicker && !datePicker.hidden && !dateWrap.contains(e.target))
          approvalCloseDatePicker(false);
        const timeWrap = $("#approvalTimeWrap"),
          timePicker = $("#approvalTimePicker");
        if (timeWrap && timePicker && !timePicker.hidden && !timeWrap.contains(e.target)) {
          closeFloatPanel(timePicker);
          $("#approvalTimeTrigger").setAttribute("aria-expanded", "false");
        }
      });

      /* ---------- 审批弹窗自定义下拉：开关、树形展开、角色多选与联系方式选择 ---------- */
      function apSelectOf(el) {
        return el?.closest(".ap-select") || null;
      }
      function apCloseSelect(select) {
        if (!select) return;
        closeFloatPanel($(".ap-panel", select));
        $(".ap-trigger", select)?.setAttribute("aria-expanded", "false");
      }
      function apCloseSelects(except = null) {
        $$(".ap-select", $("#dialogBody")).forEach((select) => {
          if (select !== except) apCloseSelect(select);
        });
      }
      // 面板宽度与触发器对齐（窄列不小于 220px），再按可视空间上下翻转，避免被弹窗裁切。
      function apOpenSelect(select) {
        const trigger = $(".ap-trigger", select),
          panel = $(".ap-panel", select);
        if (!trigger || !panel) return;
        apCloseSelects(select);
        panel.style.width =
          Math.max(trigger.getBoundingClientRect().width, 220) + "px";
        openFloatPanel(panel, trigger);
        trigger.setAttribute("aria-expanded", "true");
      }
      function apToggleSelect(select) {
        apSelectOf(select)?.querySelector(".ap-trigger")?.getAttribute(
          "aria-expanded",
        ) === "true"
          ? apCloseSelect(select)
          : apOpenSelect(select);
      }
      // 部门树：箭头只切换子节点显隐，不改变已选部门。
      function apSyncDeptRows(select) {
        const open = new Set(
          (select.dataset.expanded || "").split(" ").filter(Boolean),
        );
        $$(".ap-row", select).forEach((row) => {
          const chain = (row.dataset.ancestors || "").split(" ").filter(Boolean);
          row.hidden = chain.some((id) => !open.has(id));
        });
      }
      function apToggleDeptCaret(caret) {
        const select = apSelectOf(caret),
          id = caret.dataset.apCaret,
          open = new Set(
            (select.dataset.expanded || "").split(" ").filter(Boolean),
          ),
          expanded = open.has(id);
        expanded ? open.delete(id) : open.add(id);
        select.dataset.expanded = [...open].join(" ");
        caret.setAttribute("aria-expanded", String(!expanded));
        caret.setAttribute(
          "aria-label",
          `${expanded ? "展开" : "收起"}${caret.dataset.caretName}`,
        );
        apSyncDeptRows(select);
      }
      function apPickDept(btn) {
        const id = btn.dataset.apDept,
          select = $("#" + id + "Select");
        $("#" + id).value = btn.dataset.value;
        $("#" + id + "Label").textContent = btn.dataset.label;
        $$(".ap-row", select).forEach((row) =>
          row.classList.toggle(
            "is-selected",
            row.dataset.value === btn.dataset.value,
          ),
        );
        error(id, "");
        apCloseSelect(select);
      }
      // 角色多选：勾选、单个 [x] 删除、全部 [x] 清空共用一处重绘。
      function apSyncRoles(values) {
        const id = "applicationRole",
          select = $("#" + id + "Select");
        if (!select) return;
        $$(`input[name="${id}"]`, select).forEach((input) => {
          input.checked = values.includes(input.value);
          input
            .closest(".ap-option")
            ?.classList.toggle("is-selected", input.checked);
        });
        $("#" + id + "Label").innerHTML = apRoleChips(id, values);
        $("#" + id).value = values.join(",");
        $(".ap-clear", select)?.classList.toggle("is-hidden", !values.length);
        icons();
        error(id, "");
      }
      document.addEventListener("input", (e) => {
        if (!e.target.classList?.contains("ap-search")) return;
        const select = apSelectOf(e.target),
          query = e.target.value.trim().toLowerCase();
        $$(".ap-row, .ap-option", select).forEach((row) => {
          row.hidden =
            Boolean(query) && !(row.dataset.search || "").toLowerCase().includes(query);
        });
        if (!query) apSyncDeptRows(select);
      });
      document.addEventListener("change", (e) => {
        if (e.target.dataset.apMulti === "applicationRole")
          apSyncRoles(checkedValues("applicationRole"));
      });
      document.addEventListener("keydown", (e) => {
        const trigger = e.target.closest?.(".ap-trigger[data-ap-toggle]");
        if (trigger && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          apToggleSelect(trigger.closest(".ap-select"));
        }
      });
      // 点击优先级由内到外：chip 删除 → 全部清空 → 树箭头 → 选中项 → 展开收起 → 点击外部收起。
      document.addEventListener("click", (e) => {
        const chip = e.target.closest?.("[data-ap-chip-remove]");
        if (chip) {
          apSyncRoles(
            checkedValues("applicationRole").filter(
              (value) => value !== chip.dataset.apChipValue,
            ),
          );
          return;
        }
        const clear = e.target.closest?.("[data-ap-clear]");
        if (clear) {
          apSyncRoles([]);
          return;
        }
        const caret = e.target.closest?.("[data-ap-caret]");
        if (caret) {
          apToggleDeptCaret(caret);
          return;
        }
        const deptNode = e.target.closest?.("[data-ap-dept]");
        if (deptNode) {
          apPickDept(deptNode);
          return;
        }
        const toggle = e.target.closest?.("[data-ap-toggle]");
        if (toggle) {
          apToggleSelect(apSelectOf(toggle));
          return;
        }
        if (!e.target.closest?.(".ap-select")) apCloseSelects();
      });

      start();
    </script>
  </body>
</html>
