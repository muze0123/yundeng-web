          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        // 三处定位角与其周围一圈分隔区不参与数据填充。
        const reserved = (row, col) =>
          (row < 9 && col < 9) || (row < 9 && col >= size - 9) || (row >= size - 9 && col < 9);
        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            if (reserved(row, col)) continue;
            // 左上角的行列定位模板与右下角对齐模板，保证图案具备二维码的视觉特征。
            if (row === 6 || col === 6) { grid[row][col] = (row + col) % 2 === 0; continue; }
            if (row === size - 9 && col === size - 9) { grid[row][col] = true; continue; }
            grid[row][col] = rand() < 0.47;
          }
        }
        return grid;
      }
      function inviteQrMarkup(text) {
        const grid = inviteMatrix(text),
          size = grid.length,
          modules = [];
        const finder = (row, col) => {
          modules.push(`<rect x="${col}" y="${row}" width="7" height="7" fill="#1a1d24"/>`);
          modules.push(`<rect x="${col + 1}" y="${row + 1}" width="5" height="5" fill="#ffffff"/>`);
          modules.push(`<rect x="${col + 2}" y="${row + 2}" width="3" height="3" fill="#1a1d24"/>`);
        };
        finder(0, 0);
        finder(0, size - 7);
        finder(size - 7, 0);
        grid.forEach((line, row) =>
          line.forEach((on, col) => {
            if (on) modules.push(`<rect x="${col}" y="${row}" width="1" height="1" fill="#1a1d24"/>`);
          }),
        );
        return `<svg viewBox="-1 -1 ${size + 2} ${size + 2}" role="img" aria-label="邀请二维码，仅供原型演示">`
          + `<rect x="-1" y="-1" width="${size + 2}" height="${size + 2}" fill="#ffffff"/>`
          + `${modules.join("")}</svg>`;
      }
      function refreshInviteQr() {
        const box = $("#inviteQr");
        if (box) box.innerHTML = inviteQrMarkup(inviteUrl());
      }
      function invite() {
        openDialog(
          "邀请成员",
          `<div class="invite-layout"><div class="invite-banner">${icon("info")}<span>成员可通过以下两种方式申请加入您的团队，自您审核通过后，即可成功加入<br>成员通过审批后，可直接使用申请手机号获取验证码，登录账号</span></div><div class="invite-panels"><section class="invite-panel"><h3>扫描二维码邀请</h3><p class="invite-panel-text">成员可以通过扫描二维码加入您的团队</p><div class="invite-qr-box" id="inviteQr"></div><p class="invite-panel-note">点击重置生成新的二维码，<br>旧二维码将会失效</p><div class="invite-panel-actions">${button("重置", "reset-invite")}</div></section><section class="invite-panel"><h3>通过链接邀请</h3><p class="invite-panel-text">成员可以通过链接加入您的团队</p><div class="invite-link-box"><p class="invite-link-url" id="inviteLinkText"></p></div><p class="invite-panel-note">点击重置生成新的链接，旧<br>链接将会失效</p><div class="invite-panel-actions">${button("重置", "reset-invite")}${button("复制链接", "copy-invite", "", "primary")}</div></section></div></div>`,
          null,
          { hideFoot: true },
        );
        $("#businessDialog").classList.add("invite-dialog");
        applyInviteCredential();
      }
      // 同步二维码图案与链接文案；重置凭证后由 reset 动作再次调用。
      function applyInviteCredential() {
        const url = inviteUrl(),
          link = $("#inviteLinkText");
        if (link) link.textContent = url;
        refreshInviteQr();
      }
      /* ---------- 授权环境 / 授权设备弹窗（图1） ----------
         入口：「授权资源 → 授权环境 / 授权设备」（选中成员后出现）。
         结构：已选成员摘要 + 分组 / 标签下拉 + 关键词搜索 + 多选表格 + 分页器（design.md §5.5）；
         关键词按中文逗号拆分、按「或」语义匹配，与 §5.4.2 的查询逻辑保持一致。 */
      const authPicker = {
        kind: "env",
        memberIds: [],
        page: 1,
        size: 10,
        group: "",
        keyword: "",
        selected: new Set(),
      };
      const authPickerMembers = () =>
        authPicker.memberIds.map(memberBy).filter(Boolean);
      const authPickerPool = (key, fallback) =>
        Array.isArray(data[key]) ? data[key] : fallback;
      // 环境与设备共用同一套表格骨架，差异只在列定义、下拉选项与搜索占位文案。
      function authPickerConfig() {
        if (authPicker.kind === "env")
          return {
            title: "授权环境",
            allLabel: "全部分组",
            groups: seedEnvGroups,
            placeholder: "搜索环境名称",
            emptyText: "暂无环境数据",
            rows: authPickerPool("environments", seedEnvironments),
          };
        const proxies = authPickerPool("proxies", seedProxies);
        return {
          title: "授权设备",
          allLabel: "全部标签",
          groups: [...new Set(proxies.flatMap((p) => p.tags || []))],
          placeholder: "搜索设备名称",
          emptyText: "暂无设备数据",
          rows: proxies,
        };
      }
      // 分组 / 标签 + 关键词过滤：条件叠加，任一项为空即不参与过滤。
      function authPickerRows() {
        const cfg = authPickerConfig();
        const keywords = authPicker.keyword
          .toLowerCase()
          .split(/[，,]/)
          .map((k) => k.trim())
          .filter(Boolean);
        return cfg.rows.filter((row) => {
          const scope =
            authPicker.kind === "env"
              ? row.group || ""
              : (row.tags || []).join("、");
          if (authPicker.group && scope !== authPicker.group) return false;
          if (!keywords.length) return true;
          const text = [
            row.serial,
            row.id,
            row.name,
            row.group,
            row.note,
            (row.tags || []).join(" "),
          ]
            .join(" ")
            .toLowerCase();
          return keywords.some((k) => text.includes(k));
        });
      }
      function authPickerPageRows() {
        const rows = authPickerRows();
        const pages = Math.max(1, Math.ceil(rows.length / authPicker.size));
        authPicker.page = Math.min(Math.max(1, authPicker.page), pages);
        return rows.slice(
          (authPicker.page - 1) * authPicker.size,
          authPicker.page * authPicker.size,
        );
      }
      // 分页器沿用 design.md §5.5：页码导航 → 条/页下拉 → 跳页 + 统计，视觉类名与页面分页器一致。
      function authPickerPager(total) {
        const pages = Math.max(1, Math.ceil(total / authPicker.size));
        return (
          `<nav class="pager" aria-label="授权资源分页"><div class="page-nav">` +
          `<button type="button" class="pg-btn" data-pick-page="${authPicker.page - 1}" aria-label="上一页"${authPicker.page === 1 ? " disabled" : ""}>${icon("chevron-left")}</button>` +
          Array.from({ length: pages }, (_, i) => i + 1)
            .filter(
              (n) =>
                pages <= 7 ||
                n === 1 ||
                n === pages ||
                Math.abs(n - authPicker.page) <= 1,
            )
            .map(
              (n, i, a) =>
                (i && n - a[i - 1] > 1 ? '<span class="muted">…</span>' : "") +
                `<button type="button" class="pg-btn${n === authPicker.page ? " current" : ""}" data-pick-page="${n}"${n === authPicker.page ? ' aria-current="page"' : ""}>${n}</button>`,
            )
            .join("") +
          `<button type="button" class="pg-btn" data-pick-page="${authPicker.page + 1}" aria-label="下一页"${authPicker.page === pages ? " disabled" : ""}>${icon("chevron-right")}</button></div>` +
          `<select id="authPickerSize" aria-label="每页条数">${[10, 20, 50]
            .map(
              (n) =>
                `<option value="${n}"${authPicker.size === n ? " selected" : ""}>${n} 条/页</option>`,
            )
            .join("")}</select>` +
          `<label>跳至 <input class="jump" id="authPickerJump" type="number" min="1" max="${pages}" value="1" aria-label="跳转页码"> 页</label>` +
          `<span class="muted">共 <span class="mono">${total}</span> 条记录　第 ${authPicker.page}/${pages} 页</span></nav>`
        );
      }
      function authPickerResult() {
        const cfg = authPickerConfig();
        const rows = authPickerRows();
        const shown = authPickerPageRows();
        const isEnv = authPicker.kind === "env";
        const allChecked =
          shown.length > 0 && shown.every((r) => authPicker.selected.has(r.id));
        const head = isEnv
          ? `<th class="col-no">序号</th><th class="col-id">ID</th><th>名称</th><th class="col-group">分组</th><th class="col-note">备注</th>`
          : `<th class="col-no">序号</th><th class="col-id">ID</th><th>设备名称</th><th class="col-tag">标签</th>`;
        const body = shown.length
          ? shown
              .map((r) => {
                const on = authPicker.selected.has(r.id);
                const tail = isEnv
                  ? `<td>${esc(r.group || "—")}</td><td>${esc(r.note || "—")}</td>`
                  : `<td>${esc((r.tags || []).join("、") || "—")}</td>`;
                return `<tr${on ? ' class="selected"' : ""}><td class="col-check"><input type="checkbox" data-pick-row="${r.id}" aria-label="选择 ${esc(r.name)}"${on ? " checked" : ""}></td><td class="col-no">${r.serial}</td><td class="col-id">${r.id}</td><td>${esc(r.name)}</td>${tail}</tr>`;
              })
              .join("")
          : `<tr><td class="col-empty" colspan="${isEnv ? 6 : 5}">${empty(cfg.emptyText)}</td></tr>`;
        return (
          `<div class="auth-picker-body"><table class="data-table auth-picker-table"><thead><tr><th class="col-check"><input id="authPickerAll" type="checkbox" aria-label="全选当前页"${allChecked ? " checked" : ""}></th>${head}</tr></thead><tbody>${body}</tbody></table></div>` +
          authPickerPager(rows.length)
        );
      }
      function authPickerMarkup() {
        const cfg = authPickerConfig();
        // 摘要固定「姓名 | 联系方式 | 部门」，超过 2 人时折叠为「等 N 名成员」。
        const names = authPickerMembers().map(
          (m) =>
            `${m.name} | ${m.account || m.phone || m.email || "—"} | ${deptBy(m.dept)?.name || "未分配部门"}`,
        );
        const summaryText =
          names.length > 2
            ? `${names.slice(0, 2).join("；")}　等 ${names.length} 名成员`
            : names.join("；");
        return (
          `<p class="auth-picker-summary">已选成员：<strong>${esc(summaryText)}</strong></p>` +
          `<div class="auth-picker-toolbar"><select class="field" id="authPickerGroup" aria-label="${esc(cfg.allLabel)}">` +
          [`<option value="">${esc(cfg.allLabel)}</option>`]
            .concat(
              cfg.groups.map(
                (g) =>
                  `<option value="${esc(g)}"${g === authPicker.group ? " selected" : ""}>${esc(g)}</option>`,
              ),
            )
            .join("") +
          `</select><div class="auth-picker-search">${icon("search")}<input class="field" id="authPickerKeyword" type="search" autocomplete="off" placeholder="${esc(cfg.placeholder)}" value="${esc(authPicker.keyword)}" aria-label="${esc(cfg.placeholder)}"></div></div>` +
          `<div id="authPickerResult">${authPickerResult()}</div>`
        );
      }
      // 只重绘结果区：搜索框与下拉的焦点、草稿与展开状态不丢失（design.md §5.4.2 状态恢复）。
      function refreshAuthPicker() {
        const host = $("#authPickerResult");
        if (!host) return;
        host.innerHTML = authPickerResult();
        icons();
      }
      function openAuthPicker(kind, memberId = "") {
        authPicker.memberIds = memberId ? [memberId] : ui.selected.filter((id) => !memberBy(id)?.owner);
        const members = authPickerMembers();
        if (!members.length) {
          toast("请先选择要授权的成员");
          return;
        }
        authPicker.kind = kind === "proxy" ? "proxy" : "env";
        authPicker.page = 1;
        authPicker.size = 10;
        authPicker.group = "";
        authPicker.keyword = "";
        authPicker.selected = new Set(memberId ? (kind === "proxy" ? members[0].deviceIds : members[0].environmentIds) || [] : []);
        openDialog(
          authPickerConfig().title,
          authPickerMarkup(),
          () => {
            const count = authPicker.selected.size;
            if (!count && !memberId) {
              toast(
                authPicker.kind === "env"
                  ? "请选择要授权的环境"
                  : "请选择要授权的设备",
              );
              return false;
            }
            const label = authPicker.kind === "env" ? "环境" : "设备";
            const key = authPicker.kind === "env" ? "environmentIds" : "deviceIds";
            members.forEach((member) => {
              member[key] = memberId
                ? [...authPicker.selected]
                : [...new Set([...(member[key] || []), ...authPicker.selected])];
            });
            if (!memberId) ui.selected = [];
            commit(memberId ? `已更新${label}授权` : `已为 ${members.length} 名成员授权 ${count} 个${label}`);
            return true;
          },
          { wide: true },
        );
        // openDialog 默认聚焦首个可聚焦控件（分组下拉），授权场景改为聚焦关键词搜索框。
        requestAnimationFrame(() => $("#authPickerKeyword")?.focus());
      }
      /* 授权弹窗交互：分组 / 标签筛选、关键词搜索、行与全选、翻页、每页条数与跳页。
         控件只存在于弹窗内，事件统一委托到 document，弹窗关闭后自然失效。 */
      document.addEventListener("input", (e) => {
        if (e.target.id !== "authPickerKeyword") return;
        authPicker.keyword = e.target.value;
        authPicker.page = 1;
        refreshAuthPicker();
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "authPickerGroup") {
          authPicker.group = t.value;
          authPicker.page = 1;
          refreshAuthPicker();
          return;
        }
        if (t.id === "authPickerSize") {
          authPicker.size = Number(t.value) || 10;
          authPicker.page = 1;
          refreshAuthPicker();
          return;
        }
        if (t.id === "authPickerAll") {
          authPickerPageRows().forEach((r) =>
            t.checked
              ? authPicker.selected.add(r.id)
              : authPicker.selected.delete(r.id),
          );
          refreshAuthPicker();
          return;
        }
        if (t.dataset.pickRow !== undefined) {
          if (t.checked) authPicker.selected.add(t.dataset.pickRow);
          else authPicker.selected.delete(t.dataset.pickRow);
          refreshAuthPicker();
        }
      });
      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-pick-page]");
        if (!btn) return;
        authPicker.page = Math.max(1, Number(btn.dataset.pickPage) || 1);
        refreshAuthPicker();
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.id !== "authPickerJump" || e.key !== "Enter") return;
        authPicker.page = Math.max(1, Number(e.target.value) || 1);
        refreshAuthPicker();
      });
      function exportMembers() {
        const rows = memberRows();
        confirmAction(
          "导出成员",
          `将导出当前筛选条件下的 ${rows.length} 名成员，手机号保持脱敏。`,
          () => {
            exportSheet("成员管理导出", [
              [
                "昵称",
                "认证姓名",
                "登录账号",
                "所属角色",
                "手机号",
                "所在部门",
                "添加日期",
                "最近登录时间",
                "是否在线",
                "状态",
              ],
              ...rows.map((m) => [
                m.name,
                m.realName || "未认证",
                maskPhone(m.account || m.phone),
                m.roles.map((id) => roleBy(id)?.name).join("、"),
                maskPhone(m.phone),
                deptBy(m.dept)?.name || "未分配部门",
                m.joined,
                m.lastLogin || "—",
                m.online ? "在线" : "离线",
                m.enabled ? "启用" : "禁用",
              ]),
            ]);
            toast("导出文件已生成");
          },
        );
      }
      document.addEventListener("change", (e) => {
        if (e.target.id === "selectAll") {
          // 全选仅覆盖当前页可勾选成员，主账号不参与批量操作。
          ui.selected = e.target.checked
            ? sliceRows(memberRows())
                .filter((m) => !m.owner)
                .map((m) => m.id)
            : [];
          renderResults();
        }
        if (e.target.dataset.memberSelect) {
          const id = e.target.dataset.memberSelect;
          ui.selected = e.target.checked
            ? [...new Set([...ui.selected, id])]
            : ui.selected.filter((x) => x !== id);
          renderResults();
        }
      });
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-action]");
        if (!t) return;
        const { action, id } = t.dataset;
        if (action === "member-auth-menu" || action === "member-more-menu") {
          toggleMemberRowMenu(t, action === "member-auth-menu" ? "auth" : "more");
          return;
        }
        const rowMenuOrigin = t.closest("#memberRowMenu") ? memberRowMenuTrigger : null;
        if (rowMenuOrigin) closeMemberRowMenu();
        if (t.closest(".menu")) t.closest("details").open = false;
        if (action === "member-add") memberEditor();
        if (action === "member-edit") memberEditor(id);
        if (action === "member-view") viewMember(id);
        if (action === "member-delete") removeMembers([id]);
        if (action === "member-auth-env") openAuthPicker("env", id);
        if (action === "member-auth-proxy") openAuthPicker("proxy", id);
        if (rowMenuOrigin && $("#businessDialog").open) returnFocus = rowMenuOrigin;
        if (action === "batch-delete") removeMembers(ui.selected);
        if (action === "transfer") transferMembers();
        if (action === "batch-enable" || action === "batch-disable")
          setMembersEnabled(action === "batch-enable");
        if (action === "batch-roles") changeMemberRoles();
        if (action === "batch-auth-env") openAuthPicker("env");
        if (action === "batch-auth-proxy") openAuthPicker("proxy");
        if (action === "batch-clear-env") openClearAuthConfirm("env");
        if (action === "batch-clear-proxy") openClearAuthConfirm("proxy");
        if (action === "batch-exit") {
          ui.selected = [];
          renderResults();
        }
        if (action === "member-status") {
          const m = memberBy(id);
          if (m && !m.owner) {
            m.enabled = !m.enabled;
            m.updated = dateTime();
            commit(m.enabled ? "已启用" : "已禁用");
          }
        }
        if (action === "invite") invite();
        if (action === "copy-invite") copyText(inviteUrl());
        if (action === "reset-invite")
          confirmAction(
            "重置邀请凭证",
            "重置后旧二维码和邀请链接将失效。",
            () => {
              data.inviteVersion++;
              saveData();
              applyInviteCredential();
              toast("邀请凭证已重置");
            },
          );
        if (action === "logo-upload") pickCompanyLogo();
        if (action === "cert") openCertification();
        if (action === "cert-tab") selectCertTab(id);
        if (action === "cert-method") startCertification(id);
        if (action === "cert-next") certConfirmStep();
        if (action === "cert-restart") {
          certFlowState.step = 1;
          renderCertFlow();
        }
        if (action === "cert-copy-account")
          copyText(certTransferAccount.accountRaw);
        if (action === "cert-close") closeDialog();
        if (action === "export") exportMembers();
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#memberRowMenu, [data-action='member-auth-menu'], [data-action='member-more-menu']")) closeMemberRowMenu();
        const tab = e.target.closest("#memberViewTabs [data-view-tab]");
        if (tab) {
          memberViewState.tab = tab.dataset.viewTab;
          renderMemberViewTab();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("#memberRowMenu").hidden) {
          e.preventDefault();
          closeMemberRowMenu(true);
        }
        const menuItem = e.target.closest("#memberRowMenu [role=menuitem]");
        if (menuItem && ["ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) {
          e.preventDefault();
          const items = $$("#memberRowMenu [role=menuitem]");
          const index = items.indexOf(menuItem);
          const next = e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : (index + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
          items[next].focus();
        }
        const tab = e.target.closest("#memberViewTabs [role=tab]");
        if (!tab || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
        e.preventDefault();
        memberViewState.tab = memberViewState.tab === "env" ? "proxy" : "env";
        renderMemberViewTab();
        $(memberViewState.tab === "env" ? "#memberViewEnv" : "#memberViewDevice").focus();
      });
      document.addEventListener("scroll", () => closeMemberRowMenu(), true);
      window.addEventListener("resize", () => closeMemberRowMenu());

      start();
    </script>
  </body>
</html>
