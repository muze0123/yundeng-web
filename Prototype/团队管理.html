<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云登 · 团队管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="公共导航.css?v=20260821a">
  <link rel="stylesheet" href="筛选布局.css?v=20260814">
  <link rel="stylesheet" href="分页器.css?v=20260814">
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary:'#0066FF', 'primary-hover':'#0052CC', 'primary-bg':'#E6F0FF',
      'ink-title':'#1A1D24', 'ink-body':'#3A3F4A', 'ink-sub':'#6E7685', 'ink-muted':'#9DA2AC',
      line:'#DFE1E5', 'line-light':'#E8EAED', 'line-lighter':'#F0F1F3',
      page:'#F7F8FA', card:'#FFFFFF', hover:'#F3F4F6',
      success:'#0FC060', 'success-bg':'#E7F9F0', warning:'#E7772D', 'warning-bg':'#FDF2E9',
      danger:'#D9001B', 'danger-bg':'#FFE8EB', info:'#0091D5', 'info-bg':'#E4F4FB'
    } } } };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; }
    body { margin:0; overflow:hidden; color:#3A3F4A; background:#F7F8FA; font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    button, input, select, textarea { font:inherit; }
    button { letter-spacing:0; }
    .mono { font-family:"JetBrains Mono",monospace; }
    .btn { min-height:32px; padding:0 12px; border:0; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:500; white-space:nowrap; transition:background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease; }
    .btn:active:not(:disabled) { transform:translateY(1px); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-primary { color:#FFFFFF; background:#0066FF; }
    .btn-primary:hover:not(:disabled) { background:#0052CC; }
    .btn-default { color:#3A3F4A; background:#FFFFFF; border:1px solid #DFE1E5; }
    .btn-default:hover:not(:disabled) { color:#0066FF; border-color:#0066FF; }
    .btn-danger { color:#FFFFFF; background:#D9001B; }
    .btn-icon { width:32px; padding:0; }
    :where(button, a, input, select, textarea, [tabindex]):focus-visible { outline:2px solid rgba(0,102,255,.22); outline-offset:2px; }
    .field { width:100%; height:32px; padding:0 10px; border:1px solid #DFE1E5; border-radius:4px; outline:0; color:#3A3F4A; background:#FFFFFF; }
    textarea.field { height:auto; min-height:88px; padding-top:8px; padding-bottom:8px; resize:vertical; }
    .field:focus { border-color:#0066FF; box-shadow:0 0 0 2px #E6F0FF; }
    .field.is-error { border-color:#D9001B; }
    .panel { min-width:0; border-radius:8px; background:#FFFFFF; }
    .team-layout { width:100%; display:grid; grid-template-columns:220px minmax(0,1fr); gap:16px; align-items:start; }
    .team-rail { position:sticky; top:0; padding:12px; }
    .team-summary { padding:12px 12px 16px; border-bottom:1px solid #E8EAED; }
    .team-section-nav { padding-top:12px; display:flex; flex-direction:column; gap:4px; }
    .section-tab { width:100%; min-height:36px; padding:8px 10px; border:0; border-radius:4px; display:flex; align-items:center; gap:10px; color:#6E7685; background:transparent; text-align:left; white-space:nowrap; }
    .section-tab:hover { color:#3A3F4A; background:#F3F4F6; }
    .section-tab[aria-selected="true"] { color:#0066FF; background:#E6F0FF; font-weight:600; }
    .section-tab .count { margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; color:#E7772D; background:#FDF2E9; font:500 11px/1 "JetBrains Mono",monospace; }
    .content-stack { min-width:0; display:flex; flex-direction:column; gap:16px; }
    .filter-panel { padding:20px; }
    .data-panel { padding:20px; }
    .panel-head { min-width:0; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .panel-title { color:#1A1D24; font-size:16px; line-height:24px; font-weight:600; }
    .panel-note { color:#6E7685; font-size:12px; }
    .table-scroll { width:100%; min-width:0; overflow-x:auto; border-top:1px solid #E8EAED; }
    table { width:100%; min-width:980px; border-collapse:collapse; }
    th, td { height:48px; padding:8px 12px; border-bottom:1px solid #E8EAED; vertical-align:middle; white-space:nowrap; }
    th { height:40px; color:#6E7685; background:#F7F8FA; font-weight:500; text-align:left; }
    th:last-child, td:last-child { text-align:left; }
    tbody tr:hover { background:#F3F4F6; }
    .text-action { padding:4px 0; border:0; color:#0066FF; background:transparent; }
    .text-action.danger { color:#D9001B; }
    .action-set { display:inline-flex; align-items:center; gap:12px; }
    .badge { min-height:22px; padding:2px 8px; border-radius:4px; display:inline-flex; align-items:center; border:1px solid transparent; font-size:12px; line-height:16px; white-space:nowrap; }
    .badge-success { color:#0FC060; border-color:#0FC060; background:#E7F9F0; }
    .badge-warning { color:#E7772D; border-color:#E7772D; background:#FDF2E9; }
    .badge-danger { color:#D9001B; border-color:#D9001B; background:#FFE8EB; }
    .badge-neutral { color:#6E7685; border-color:#DFE1E5; background:#F7F8FA; }
    .empty-state { padding:56px 16px; color:#6E7685; text-align:center; }
    .workspace-split { min-width:0; display:grid; grid-template-columns:260px minmax(0,1fr); border-top:1px solid #E8EAED; }
    .workspace-nav { min-width:0; padding:16px 16px 16px 0; border-right:1px solid #E8EAED; }
    .workspace-detail { min-width:0; padding:16px 0 0 20px; }
    .subnav-button { width:100%; min-height:34px; padding:7px 10px; border:0; border-radius:4px; display:flex; align-items:center; justify-content:space-between; gap:8px; color:#3A3F4A; background:transparent; text-align:left; }
    .subnav-button:hover { background:#F3F4F6; }
    .subnav-button[aria-selected="true"] { color:#0066FF; background:#E6F0FF; font-weight:600; }
    .status-tabs { display:flex; align-items:center; gap:4px; padding-bottom:16px; border-bottom:1px solid #E8EAED; overflow-x:auto; }
    .status-tab { min-height:32px; padding:0 12px; border:0; border-radius:4px; color:#6E7685; background:transparent; white-space:nowrap; }
    .status-tab:hover { background:#F3F4F6; }
    .status-tab[aria-selected="true"] { color:#0066FF; background:#E6F0FF; font-weight:600; }
    .modal-mask { position:fixed; inset:0; z-index:10000; padding:16px; display:flex; align-items:center; justify-content:center; background:rgba(26,29,36,.30); }
    .modal-mask.hidden { display:none; }
    .modal-panel { width:620px; max-width:100%; max-height:min(84vh,760px); border-radius:8px; display:flex; flex-direction:column; overflow:hidden; background:#FFFFFF; box-shadow:0 6px 24px rgba(0,0,0,.12); }
    .modal-header { min-height:56px; padding:12px 20px; border-bottom:1px solid #E8EAED; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .modal-body { min-height:0; padding:20px; overflow-y:auto; }
    .modal-footer { padding:12px 20px; border-top:1px solid #E8EAED; display:flex; justify-content:flex-end; gap:12px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-item { min-width:0; display:flex; flex-direction:column; gap:6px; }
    .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .choice-block { min-width:0; padding:16px; border:1px solid #DFE1E5; border-radius:6px; }
    .permission-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .check-row { min-height:34px; padding:7px 9px; border:1px solid #E8EAED; border-radius:4px; display:flex; align-items:center; gap:8px; }
    .toast { position:fixed; top:72px; left:50%; z-index:11000; transform:translateX(-50%); max-width:min(520px,calc(100vw - 32px)); padding:9px 14px; border-radius:4px; color:#FFFFFF; background:#1A1D24; box-shadow:0 4px 16px rgba(0,0,0,.16); }
    .anno-badge { position:fixed; width:20px; height:20px; padding:0; border:0; border-radius:50%; display:flex; align-items:center; justify-content:center; pointer-events:auto; color:#FFFFFF; background:#0066FF; box-shadow:0 2px 8px rgba(0,0,0,.16); font:600 11px/1 "JetBrains Mono",monospace; }
    .anno-list { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; }
    #annoToggle { cursor:grab; }
    .hidden { display:none !important; }
    @media (max-width:900px) {
      .team-layout { grid-template-columns:minmax(0,1fr); }
      .team-rail { position:static; padding:8px; overflow:hidden; }
      .team-summary { display:none; }
      .team-section-nav { padding-top:0; flex-direction:row; overflow-x:auto; }
      .section-tab { width:auto; flex:0 0 auto; }
      .section-tab .count { margin-left:2px; }
      .workspace-split { grid-template-columns:minmax(0,1fr); }
      .workspace-nav { padding:16px 0; border-right:0; border-bottom:1px solid #E8EAED; }
      .workspace-detail { padding:16px 0 0; }
    }
    @media (max-width:720px) {
      #mainContent { padding:12px !important; }
      .filter-panel, .data-panel { padding:16px; }
      .panel-head { align-items:flex-start; flex-direction:column; }
      .panel-head .btn { width:100%; }
      .form-grid, .choice-grid, .permission-grid { grid-template-columns:minmax(0,1fr); }
      .modal-mask { padding:12px; }
      .modal-body { padding:16px; }
      .modal-header, .modal-footer { padding-left:16px; padding-right:16px; }
      .modal-footer .btn { flex:1 1 0; }
      .toast { top:64px; }
    }
    @media (prefers-reduced-motion:reduce) { .btn { transition:none; } .btn:active:not(:disabled) { transform:none; } }
  </style>
  <script src="公共导航.js?v=20260821a"></script>
</head>
<body>
  <div id="yundeng-shell" class="flex h-screen min-h-screen overflow-hidden">
    <aside id="sidebar"></aside>
    <div class="min-w-0 flex-1 flex flex-col h-screen">
      <header></header>
      <main id="mainContent" class="flex-1 min-w-0 overflow-y-auto bg-page p-4">
        <div class="team-layout">
          <aside class="panel team-rail" aria-label="团队管理分区">
            <div class="team-summary">
              <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded bg-primary-bg text-primary flex items-center justify-center shrink-0"><i data-lucide="building-2" class="w-5 h-5"></i></span>
                <div class="min-w-0"><h1 class="font-semibold text-ink-title truncate">云登运营团队</h1><p id="teamMemberSummary" class="text-[12px] text-ink-sub mt-0.5">16 名成员</p></div>
              </div>
              <button id="certBtn" type="button" data-anno="1" class="badge badge-warning mt-3">未认证，去认证</button>
              <p class="text-[11px] text-ink-muted mt-2">套餐到期：2026-09-30</p>
            </div>
            <nav id="sectionTabs" class="team-section-nav" role="tablist" aria-orientation="vertical">
              <button type="button" class="section-tab" role="tab" id="tab-members" aria-controls="membersPanel" aria-selected="true" data-section="members"><i data-lucide="users" class="w-4 h-4"></i><span>所有成员</span></button>
              <button type="button" class="section-tab" role="tab" id="tab-departments" aria-controls="departmentsPanel" aria-selected="false" tabindex="-1" data-section="departments"><i data-lucide="network" class="w-4 h-4"></i><span>部门管理</span></button>
              <button type="button" class="section-tab" role="tab" id="tab-roles" aria-controls="rolesPanel" aria-selected="false" tabindex="-1" data-section="roles"><i data-lucide="shield-check" class="w-4 h-4"></i><span>角色管理</span></button>
              <button type="button" class="section-tab" role="tab" id="tab-applications" aria-controls="applicationsPanel" aria-selected="false" tabindex="-1" data-section="applications"><i data-lucide="user-round-plus" class="w-4 h-4"></i><span>成员申请</span><span class="count" aria-label="1 条待审批">1</span></button>
              <button type="button" class="section-tab" role="tab" id="tab-logins" aria-controls="loginsPanel" aria-selected="false" tabindex="-1" data-section="logins"><i data-lucide="monitor-check" class="w-4 h-4"></i><span>登录请求</span></button>
            </nav>
          </aside>

          <div class="content-stack">
            <section id="membersPanel" role="tabpanel" aria-labelledby="tab-members">
              <div class="panel filter-panel mb-4">
                <div class="filter-flow">
                  <label class="filter-item"><span class="filter-label">姓名或账号</span><input id="memberKeyword" class="field" type="search" placeholder="搜索昵称或账号" autocomplete="off"></label>
                  <label class="filter-item"><span class="filter-label">所在部门</span><select id="memberDept" class="field"><option value="">全部部门</option><option>默认部门</option><option>跨境运营</option><option>内容增长</option><option>客户成功</option></select></label>
                  <label class="filter-item"><span class="filter-label">角色</span><select id="memberRole" class="field"><option value="">全部角色</option><option>创始人</option><option>经理</option><option>财务</option><option>环境配置员</option><option>环境操作员</option><option>内容审核员</option></select></label>
                  <label class="filter-item"><span class="filter-label">人员状态</span><select id="memberStatus" data-anno="2" class="field"><option value="">全部状态</option><option>正常</option><option>已禁用</option></select></label>
                  <div class="filter-actions"><button id="memberSearch" type="button" class="btn btn-primary">查询</button><button id="memberReset" type="button" class="btn btn-default">重置</button></div>
                </div>
              </div>
              <div class="panel data-panel">
                <div class="panel-head"><div><h2 data-anno="3" class="panel-title inline-block">成员列表</h2><p id="memberResultText" class="panel-note mt-1">当前显示全部成员</p></div><button id="inviteBtn" type="button" data-anno="4" class="btn btn-primary"><i data-lucide="user-plus" class="w-4 h-4"></i><span>邀请成员</span></button></div>
                <div class="table-scroll"><table><thead><tr><th>姓名 / 账号</th><th>所在部门</th><th>角色</th><th>人员状态</th><th>联系方式</th><th>最后登录时间</th><th>在线状态</th><th>操作</th></tr></thead><tbody id="memberBody"></tbody></table></div>
                <div id="memberPagination" class="pt-5" aria-label="成员列表分页"></div>
              </div>
            </section>

            <section id="departmentsPanel" role="tabpanel" aria-labelledby="tab-departments" hidden>
              <div class="panel data-panel">
                <div class="panel-head"><div><h2 data-anno="5" class="panel-title inline-block">部门管理</h2><p class="panel-note mt-1">按部门维护管理员与成员归属</p></div><button id="addDept" type="button" class="btn btn-primary"><i data-lucide="plus" class="w-4 h-4"></i><span>添加子部门</span></button></div>
                <div class="workspace-split">
                  <div class="workspace-nav" role="tablist" aria-label="部门列表">
                    <button type="button" class="subnav-button" role="tab" aria-selected="true" data-dept-tab="默认部门"><span>默认部门</span><span class="mono">4</span></button>
                    <button type="button" class="subnav-button" role="tab" aria-selected="false" data-dept-tab="跨境运营"><span>跨境运营</span><span class="mono">4</span></button>
                    <button type="button" class="subnav-button" role="tab" aria-selected="false" data-dept-tab="内容增长"><span>内容增长</span><span class="mono">4</span></button>
                    <button type="button" class="subnav-button" role="tab" aria-selected="false" data-dept-tab="客户成功"><span>客户成功</span><span class="mono">4</span></button>
                  </div>
                  <div class="workspace-detail"><div class="table-scroll !border-t-0"><table class="!min-w-[620px]"><thead><tr><th>部门名称</th><th>部门人数</th><th>管理员</th><th>操作</th></tr></thead><tbody id="departmentBody"></tbody></table></div></div>
                </div>
              </div>
            </section>

            <section id="rolesPanel" role="tabpanel" aria-labelledby="tab-roles" hidden>
              <div class="panel data-panel">
                <div class="panel-head"><div><h2 data-anno="6" class="panel-title inline-block">角色管理</h2><p class="panel-note mt-1">配置模块权限和角色成员</p></div><button id="addRole" type="button" class="btn btn-primary"><i data-lucide="plus" class="w-4 h-4"></i><span>添加角色</span></button></div>
                <div class="workspace-split"><div id="roleList" class="workspace-nav" role="tablist" aria-label="角色列表"></div><div id="roleDetail" class="workspace-detail" role="tabpanel"></div></div>
              </div>
            </section>

            <section id="applicationsPanel" role="tabpanel" aria-labelledby="tab-applications" hidden>
              <div class="panel data-panel">
                <div class="panel-head"><div><h2 class="panel-title">成员申请</h2><p class="panel-note mt-1">审批加入当前团队的成员申请</p></div></div>
                <div id="applicationTabs" class="status-tabs" role="tablist" aria-label="申请状态">
                  <button type="button" class="status-tab" role="tab" aria-selected="true" data-app-status="待审批">待审批</button>
                  <button type="button" class="status-tab" role="tab" aria-selected="false" tabindex="-1" data-app-status="已通过">已通过</button>
                  <button type="button" class="status-tab" role="tab" aria-selected="false" tabindex="-1" data-app-status="不通过">不通过</button>
                </div>
                <div id="applicationContent" role="tabpanel" class="pt-4"></div>
              </div>
            </section>

            <section id="loginsPanel" role="tabpanel" aria-labelledby="tab-logins" hidden>
              <div class="panel filter-panel mb-4">
                <div class="filter-flow">
                  <label class="filter-item"><span class="filter-label">开始日期</span><input id="loginStart" type="date" class="field"></label>
                  <label class="filter-item"><span class="filter-label">结束日期</span><input id="loginEnd" type="date" class="field"></label>
                  <label class="filter-item"><span class="filter-label">用户、姓名或终端识别码</span><input id="loginKeyword" type="search" class="field" placeholder="输入关键词" autocomplete="off"></label>
                  <label class="filter-item"><span class="filter-label">审批状态</span><select id="loginStatus" class="field"><option value="">全部状态</option><option>待处理</option><option>已允许</option><option>已拒绝</option></select></label>
                  <div class="filter-actions"><button id="loginSearch" type="button" class="btn btn-primary">查询</button><button id="loginReset" type="button" class="btn btn-default">重置</button></div>
                </div>
              </div>
              <div class="panel data-panel">
                <div class="panel-head"><div><h2 data-anno="7" class="panel-title inline-block">登录请求</h2><p id="loginResultText" class="panel-note mt-1">当前显示全部请求</p></div></div>
                <div class="table-scroll"><table><thead><tr><th>请求授权用户</th><th>请求授权姓名</th><th>终端识别码</th><th>MAC 地址</th><th>本机网络</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="loginBody"></tbody></table></div>
                <div id="loginPagination" class="pt-5" aria-label="登录请求分页"></div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <button id="annoToggle" type="button" class="fixed z-[9997] right-2 top-[120px] h-8 px-3 rounded-full bg-ink-sub text-white shadow flex items-center gap-1.5" aria-pressed="false"><i data-lucide="tags" class="w-4 h-4"></i><span class="text-[12px]">显示标注</span></button>
  <div id="annoLayer" class="fixed inset-0 pointer-events-none z-[9998]"></div>

  <div id="businessModal" class="modal-mask hidden" aria-hidden="true">
    <section id="businessModalPanel" data-anno="8" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="businessModalTitle" tabindex="-1">
      <header class="modal-header"><h2 id="businessModalTitle" class="text-[16px] font-semibold text-ink-title"></h2><button id="businessModalClose" type="button" class="btn btn-default btn-icon" aria-label="关闭弹窗"><i data-lucide="x" class="w-4 h-4"></i></button></header>
      <div id="businessModalBody" class="modal-body"></div>
      <footer class="modal-footer"><button type="button" class="btn btn-default" data-close-business>取消</button><button id="businessModalConfirm" type="button" class="btn btn-primary">确定</button></footer>
    </section>
  </div>

  <div id="annoPopup" class="modal-mask hidden !z-[10003]" aria-hidden="true">
    <section id="annoPanel" class="modal-panel !w-[520px]" role="dialog" aria-modal="true" aria-labelledby="annoTitle" tabindex="-1">
      <header class="modal-header"><h2 id="annoTitle" class="text-[16px] font-semibold text-ink-title"></h2><button id="annoClose" type="button" class="btn btn-default btn-icon" aria-label="关闭标注说明"><i data-lucide="x" class="w-4 h-4"></i></button></header>
      <div id="annoDesc" class="modal-body"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="分页器.js?v=20260814"></script>
  <script>
    const $ = selector => document.querySelector(selector);
    const $$ = selector => Array.from(document.querySelectorAll(selector));
    const members = [

    function focusable(root) {
      return $$('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])').filter(node => root.contains(node) && !node.closest('[hidden]') && node.getClientRects().length);
    }
    function trapFocus(event, root) {
      if (event.key !== 'Tab') return;
      const nodes = focusable(root);
      if (!nodes.length) { event.preventDefault(); root.focus(); return; }
      const first = nodes[0], last = nodes[nodes.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }

      const current = tabs.indexOf(document.activeElement);

      if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = tabs.length - 1;
      else if (event.key === 'ArrowDown' || event.key === 'ArrowRight') next = (current + 1) % tabs.length;

      switchSection(tabs[next].dataset.section, true);

    }
    function roleEditor(isNew) {
      const role = isNew ? {name:'',desc:'',permissions:[]} : roles[activeRoleIndex];
      const modules = ['新建浏览器','环境管理','代理管理','插件管理','费用管理','商城','回收站','窗口同步','API','RPA','团队管理','账号管理','分享转移','日志管理','账号设置'];
      openBusinessModal({title:isNew ? '添加角色' : '编辑角色',confirmText:'保存角色',body:`<div class="form-grid"><label class="form-item"><span>角色名称</span><input id="requiredField" class="field" value="${role.name}" placeholder="请输入角色名称"></label><label class="form-item"><span>归属角色组</span><select class="field"><option>默认角色组</option><option>系统角色组</option></select></label><label class="form-item md:col-span-2"><span>角色描述</span><input class="field" value="${role.desc}" placeholder="请输入角色描述"></label></div><fieldset class="mt-5"><legend class="font-semibold text-ink-title">模块权限</legend><div class="permission-grid mt-3">${modules.map(module => `<label class="check-row"><input type="checkbox" aria-label="授予${module}权限" ${role.permissions.includes(module) ? 'checked' : ''}><span>${module}</span></label>`).join('')}</div></fieldset>`,onConfirm:() => requiredValue('#requiredField','请输入角色名称')});
    }

    document.addEventListener('click', event => {
      const edit = event.target.closest('[data-member-edit]');
      if (edit) {
        const member = members[Number(edit.dataset.memberEdit)];
        openBusinessModal({title:member.role === '创始人' ? '查看成员' : '编辑成员',confirmText:member.role === '创始人' ? '关闭' : '保存',body:`<div class="form-grid"><label class="form-item"><span>昵称</span><input class="field" value="${member.name}" ${member.role === '创始人' ? 'readonly' : ''}></label><label class="form-item"><span>所在部门</span><select class="field" ${member.role === '创始人' ? 'disabled' : ''}><option>${member.dept}</option><option>默认部门</option><option>跨境运营</option><option>内容增长</option><option>客户成功</option></select></label><label class="form-item"><span>角色</span><select class="field" ${member.role === '创始人' ? 'disabled' : ''}><option>${member.role}</option><option>经理</option><option>财务</option><option>环境操作员</option></select></label>${member.role === '创始人' ? '<p class="text-warning md:col-span-2">创始人不可被普通管理员禁用、删除或降级。</p>' : `<label class="check-row self-end"><input type="checkbox" aria-label="启用成员" ${member.status === '正常' ? 'checked' : ''}><span>启用成员</span></label>`}</div>`});
      }
      const transfer = event.target.closest('[data-member-transfer]');
      if (transfer || event.target.closest('[data-dept-action="transfer"]')) openBusinessModal({title:'转移成员',confirmText:'确认转移',body:'<label class="form-item"><span>目标部门</span><select id="requiredField" class="field"><option value="">请选择目标部门</option><option>默认部门</option><option>跨境运营</option><option>内容增长</option><option>客户成功</option></select></label><p class="text-warning mt-3">原部门管理员转至新部门后，将自动获得新部门管理员身份。</p>',onConfirm:() => requiredValue('#requiredField','请选择目标部门')});
      if (event.target.closest('[data-dept-action="invite"]')) inviteModal();
      const roleAction = event.target.closest('[data-role-action]');
      if (roleAction?.dataset.roleAction === 'copy') toast('已创建角色副本，当前为演示数据');
      if (roleAction?.dataset.roleAction === 'members') openBusinessModal({title:'配置角色成员',confirmText:'保存配置',body:`<fieldset><legend class="font-semibold text-ink-title mb-3">选择成员</legend><div class="space-y-2">${members.slice(1,7).map(member => `<label class="check-row"><input type="checkbox" aria-label="选择成员${member.name}"><span>${member.name} · ${member.dept}</span></label>`).join('')}</div></fieldset>`});
      if (roleAction?.dataset.roleAction === 'edit') roleEditor(false);
      const application = event.target.closest('[data-application]');
      if (application?.dataset.application === 'approve') openBusinessModal({title:'通过成员申请',confirmText:'确认通过',body:'<div class="form-grid"><label class="form-item"><span>所在部门</span><select id="requiredField" class="field"><option value="">请选择部门</option><option>默认部门</option><option>跨境运营</option><option>内容增长</option><option>客户成功</option></select></label><label class="form-item"><span>角色</span><select class="field"><option>环境操作员</option><option>经理</option></select></label></div>',onConfirm:() => requiredValue('#requiredField','请选择部门')});
      if (application?.dataset.application === 'reject') openBusinessModal({title:'拒绝成员申请',confirmText:'确认拒绝',danger:true,body:'<label class="form-item"><span>拒绝原因</span><textarea id="requiredField" class="field" placeholder="请输入拒绝原因"></textarea></label>',onConfirm:() => requiredValue('#requiredField','请输入拒绝原因')});
      const loginAction = event.target.closest('[data-login-action]');
      if (loginAction) {
        const item = loginRequests[Number(loginAction.dataset.loginIndex)];
        const allow = loginAction.dataset.loginAction === 'allow';
        openBusinessModal({title:allow ? '允许登录请求' : '拒绝登录请求',confirmText:allow ? '确认允许' : '确认拒绝',danger:!allow,body:`<dl class="grid grid-cols-[120px_1fr] gap-y-3"><dt class="text-ink-sub">请求用户</dt><dd>${item.user} · ${item.name}</dd><dt class="text-ink-sub">终端识别码</dt><dd class="mono">${item.device}</dd><dt class="text-ink-sub">MAC 地址</dt><dd class="mono">${item.mac}</dd><dt class="text-ink-sub">本机网络</dt><dd class="mono">${item.network}</dd></dl><p class="text-ink-sub mt-4">确认后仅更新演示反馈，不会改变真实设备授权。</p>`});
      }
      if (event.target.closest('#copyInvite')) { navigator.clipboard?.writeText($('#inviteLink').value); toast('演示邀请链接已复制'); }
      if (event.target.closest('[data-reset-invite]')) toast('演示邀请凭证已重置');
    });

    $('#memberSearch').addEventListener('click', applyMemberFilters);
    $('#memberKeyword').addEventListener('keydown', event => { if (event.key === 'Enter') applyMemberFilters(); });
    $('#memberReset').addEventListener('click', () => { $('#memberKeyword').value = ''; $('#memberDept').value = ''; $('#memberRole').value = ''; $('#memberStatus').value = ''; applyMemberFilters(); });
    $('#loginSearch').addEventListener('click', applyLoginFilters);
    $('#loginKeyword').addEventListener('keydown', event => { if (event.key === 'Enter') applyLoginFilters(); });
    $('#loginReset').addEventListener('click', () => { $('#loginStart').value = ''; $('#loginEnd').value = ''; $('#loginKeyword').value = ''; $('#loginStatus').value = ''; $('#loginStart').classList.remove('is-error'); applyLoginFilters(); });
    $('#inviteBtn').addEventListener('click', inviteModal);
    $('#certBtn').addEventListener('click', () => openBusinessModal({title:'团队实名认证',confirmText:'知道了',body:'<div class="p-3 rounded bg-warning-bg text-warning mb-4">原型不采集姓名、身份证、企业代码、银行卡或人脸信息。</div><div class="space-y-4"><div><h3 class="font-semibold text-ink-title">个人认证</h3><p class="text-ink-sub mt-1">信息认证、刷脸认证、认证结果</p></div><div><h3 class="font-semibold text-ink-title">企业法人认证</h3><p class="text-ink-sub mt-1">企业资料、法人身份校验、法人人脸认证</p></div><div><h3 class="font-semibold text-ink-title">企业对公转账认证</h3><p class="text-ink-sub mt-1">企业资料、对公银行验证、认证结果</p></div></div>'}));
    $('#addDept').addEventListener('click', () => openBusinessModal({title:'添加子部门',confirmText:'确定添加',body:'<div class="form-grid"><label class="form-item"><span>上级部门</span><select class="field"><option>云登运营团队</option><option>默认部门</option><option>跨境运营</option></select></label><label class="form-item"><span>部门名称</span><input id="requiredField" class="field" placeholder="请输入部门名称"></label></div>',onConfirm:() => requiredValue('#requiredField','请输入部门名称')}));
    $('#addRole').addEventListener('click', () => roleEditor(true));

    function renderAnnoBadges() {
      const layer = $('#annoLayer');
      layer.innerHTML = '';
      if (!annoVisible || !$('#annoPopup').classList.contains('hidden')) return;
      const scope = $('#businessModal').classList.contains('hidden') ? document : $('#businessModalPanel');
      scope.querySelectorAll('[data-anno]').forEach(target => {
        if (!target.getClientRects().length) return;
        const rect = target.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > innerHeight) return;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'anno-badge';
        button.textContent = target.dataset.anno;
        button.style.left = `${Math.max(8,Math.min(innerWidth - 28,rect.right - 10))}px`;
        button.style.top = `${Math.max(8,Math.min(innerHeight - 28,rect.top - 10))}px`;
        button.setAttribute('aria-label',`查看交互说明 ${target.dataset.anno}`);
        button.setAttribute('aria-haspopup','dialog');
        button.dataset.annoId = target.dataset.anno;
        button.addEventListener('click', () => showAnnoPopup(target.dataset.anno, button));
        layer.appendChild(button);
      });
    }
    function showAnnoPopup(id, trigger) {
      const item = annotations[id];
      if (!item) return;
      annoReturnFocus = trigger || document.activeElement;
      annoReturnId = String(id);
      $('#annoTitle').textContent = `${id}. ${item.title}`;
      $('#annoDesc').innerHTML = `<ul class="anno-list">${item.desc.map(text => `<li>${text}</li>`).join('')}</ul>`;
      $('#annoPopup').classList.remove('hidden');
      $('#annoPopup').setAttribute('aria-hidden','false');
      renderAnnoBadges();
      requestAnimationFrame(() => $('#annoClose').focus());
    }
    function closeAnnoPopup() {
      if ($('#annoPopup').classList.contains('hidden')) return;
      $('#annoPopup').classList.add('hidden');
      $('#annoPopup').setAttribute('aria-hidden','true');
      renderAnnoBadges();
      const replacementBadge = $(`#annoLayer [data-anno-id="${annoReturnId}"]`);
      const focusTarget = replacementBadge || (annoReturnFocus?.isConnected ? annoReturnFocus : $('#annoToggle'));
      focusTarget?.focus();
    }
    $('#annoClose').addEventListener('click', closeAnnoPopup);
    $('#annoPopup').addEventListener('click', event => { if (event.target === event.currentTarget) closeAnnoPopup(); });
    $('#mainContent').addEventListener('scroll', renderAnnoBadges, {passive:true});
    window.addEventListener('resize', renderAnnoBadges);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (!$('#annoPopup').classList.contains('hidden')) { event.preventDefault(); closeAnnoPopup(); return; }
        if (!$('#businessModal').classList.contains('hidden')) { event.preventDefault(); closeBusinessModal(); return; }
      }
      if (!$('#annoPopup').classList.contains('hidden')) trapFocus(event,$('#annoPanel'));
      else if (!$('#businessModal').classList.contains('hidden')) trapFocus(event,$('#businessModalPanel'));
    });

    renderDepartment();
    renderRoles();
    renderApplications();
    renderMemberRows();
    renderLoginRows();
    lucide.createIcons();
  </script>
  <script src="标注交互.js?v=20260814"></script>
