          {title:'选择目标环境',description:'在环境管理找到目标环境，通过行级操作进入“修改代理”',asset:'proxy_bind_target.png',alt:'环境管理列表中的目标环境与行级更多操作',focus:[86,10,13,19],position:'center top',inset:'proxy_bind_menu.png',insetAlt:'环境行级操作菜单中的修改代理入口'},
          {title:'选择可用代理',description:'在代理选择弹窗中选择已购买的平台代理',asset:'proxy_bind_select.png',alt:'选择代理弹窗的平台代理分类与代理列表区域',focus:[11,16,82,69],fit:'contain',position:'center center'},
          {title:'检测并保存',description:'检查代理网络，确认信息后保存',asset:'proxy_bind_save.png',alt:'选择代理弹窗底部的检测、取消与确定操作区域',focus:[72,78,26,18],fit:'contain',position:'center center'}
        ]
      },
      {
        title:'启动环境',subtitle:'开始使用独立浏览器',description:'从环境管理启动环境后，云登会按已保存的指纹、代理、账号和启动页配置打开独立浏览器窗口。',tip:'首次启动需初始化内核；长时间未启动请检查网络、代理和权限。',cta:'去启动环境',route:{page:'environment',file:'环境管理.html'},operations:[
          {title:'定位目标环境',description:'通过分组或搜索找到需要使用的环境',asset:'environment_locate.png',alt:'环境管理筛选结果中的目标环境与启动按钮',focus:[83,4,15,20],position:'center top'},
          {title:'启动并等待',description:'点击“启动”，等待状态更新为最终结果',asset:'environment_starting.png',alt:'环境管理目标行进入启动中的等待状态',focus:[83,4,15,20],position:'center top',status:'正在启动'},
          {title:'开始使用环境',description:'启动成功后进入独立浏览器窗口',asset:'environment_running.png',alt:'独立浏览器窗口已打开并显示环境、代理和网络检测通过',focus:[31,12,39,27],position:'center top'}
        ]
      }
    ];
    const annotations={
      1:{title:'主步骤切换',desc:['点击左侧四个步骤切换引导主题。','切换后右侧从该主题的第一个操作开始，并重新计时。']},
      2:{title:'操作步骤轮播',desc:['当前主题的三个操作每 3 秒循环切换。','手动点击后从完整 3 秒重新计时；鼠标悬停、键盘焦点或窗口失焦时暂停。']},
      3:{title:'产品截图联动',desc:['操作卡片与真实 YunLogin 产品截图同步更新。','截图保持完整清晰；涉及账号、IP 或代理端点的素材区域使用不可逆像素化脱敏。']},
      4:{title:'查看完整指南',desc:['在新标签页打开云登帮助中心文章。','当前引导保持打开，窗口失焦期间自动轮播暂停。']},
      5:{title:'前后步骤',desc:['上一步与下一步切换左侧主步骤。','第一项不显示上一步，最后一项不显示下一步。']},
      6:{title:'业务入口',desc:['关闭引导后在当前标签页进入对应业务页面。','新建环境进入新建浏览器，购买代理进入商城，绑定和启动进入环境管理。']},
      7:{title:'关闭与再次打开',desc:['关闭后保留当前业务页面状态。','首次自动展示资格消费后不再自动弹出，顶部导航仍可随时重新打开。']}
    };
    const state={mainIndex:0,operationIndex:0,intervalMs:3000,remainingMs:3000,timerId:null,timerStartedAt:0,pauseReasons:new Set(),shotToken:0};
    const $=id=>document.getElementById(id);
    let annoVisible=false;
    let lastAnnoFocus=null;

    function renderMainTabs(){
      $('mainTabs').innerHTML=steps.map((step,index)=>`<button type="button" id="main-tab-${index}" class="guide-main-tab" role="tab" aria-selected="${index===state.mainIndex}" aria-controls="guideTitle" tabindex="${index===state.mainIndex?0:-1}" data-main-index="${index}"><span class="main-tab-number mono">${index+1}</span><span class="main-tab-copy"><span class="main-tab-title">${step.title}</span><span class="main-tab-subtitle">${step.subtitle}</span></span></button>`).join('');
      $('mainTabs').querySelectorAll('[data-main-index]').forEach(button=>{
        button.addEventListener('click',()=>selectMain(Number(button.dataset.mainIndex),'tab'));
        button.addEventListener('keydown',event=>handleTabKey(event,'main'));
      });
    }

    function renderOperations(){
      const operations=steps[state.mainIndex].operations;
      $('operationTabs').innerHTML=operations.map((operation,index)=>`${index?`<span class="operation-arrow" aria-hidden="true"><img src="${ASSET_ROOT}operation-arrow.png" alt=""></span>`:''}<button type="button" id="operation-tab-${index}" class="operation-card" role="tab" aria-selected="${index===state.operationIndex}" aria-controls="shotStage" tabindex="${index===state.operationIndex?0:-1}" data-operation-index="${index}"><strong>${operation.title}</strong><span>${operation.description}</span><i class="operation-progress" data-running="${index===state.operationIndex}" data-paused="${state.pauseReasons.size>0||document.hidden}" style="--progress-duration:${Math.max(0,state.remainingMs)}ms" aria-hidden="true"></i></button>`).join('');
      $('operationTabs').querySelectorAll('[data-operation-index]').forEach(button=>{
        button.addEventListener('click',()=>selectOperation(Number(button.dataset.operationIndex),'manual'));
        button.addEventListener('keydown',event=>handleTabKey(event,'operation'));
      });
    }

    function renderContent(){
      const step=steps[state.mainIndex];
      $('guideTitle').textContent=step.title;
      $('guideDescription').textContent=step.description;
      $('guideTip').textContent=step.tip;
      $('guideTip').title=step.tip;
      $('ctaButton').querySelector('span').textContent=step.cta;
      $('previousButton').hidden=state.mainIndex===0;
      $('nextButton').hidden=state.mainIndex===steps.length-1;
      renderMainTabs();
      renderOperations();
      renderShot();
      lucide.createIcons();
      requestAnimationFrame(renderAnnoBadges);
    }

    function renderShot(){
      const operation=steps[state.mainIndex].operations[state.operationIndex];
      const token=++state.shotToken;
      const src=ASSET_ROOT+operation.asset;
      $('shotLoading').style.display='flex';
      $('shotError').style.display='none';
      const image=$('shotFocus');
      image.style.opacity='0';
      image.style.objectFit=operation.fit||'contain';
      image.style.objectPosition=operation.position||'center';
      image.src=src;
      $('shotFocus').alt=operation.alt;
      $('shotInset').hidden=!operation.inset;
      if(operation.inset){$('shotInset').src=ASSET_ROOT+operation.inset;$('shotInset').alt=operation.insetAlt||''}
      $('shotStatus').hidden=!operation.status;
      $('shotStatus').querySelector('span').textContent=operation.status||'';
      const onLoad=()=>{
        if(token!==state.shotToken)return;
        $('shotLoading').style.display='none';
        $('shotFocus').style.opacity='1';
      };
      const onError=()=>{
        if(token!==state.shotToken)return;
        $('shotLoading').style.display='none';
        $('shotError').style.display='flex';
      };
      $('shotFocus').onload=onLoad;
      $('shotFocus').onerror=onError;
      preloadAdjacent();
    }

    function preloadAdjacent(){
      const operations=steps[state.mainIndex].operations;
      [state.operationIndex+1,state.operationIndex-1].forEach(index=>{
        const operation=operations[(index+operations.length)%operations.length];
        const image=new Image();image.src=ASSET_ROOT+operation.asset;
      });
    }

    function selectMain(index,source){
      if(index===state.mainIndex)return;
      const restoreFocus=source==='tab'&&Boolean(document.activeElement?.closest?.('[data-main-index]'));
      state.mainIndex=index;
      state.operationIndex=0;
      restartTimer();
      renderContent();
      if(restoreFocus)setTimeout(()=>document.getElementById(`main-tab-${index}`)?.focus({preventScroll:true}),0);
      window.dispatchEvent(new CustomEvent('new-user-guide:main-select',{detail:{index,source}}));
    }

    function selectOperation(index,source){
      const restoreFocus=source==='manual'&&Boolean(document.activeElement?.closest?.('[data-operation-index]'));
      state.operationIndex=index;
      restartTimer();
      renderOperations();
      renderShot();
      lucide.createIcons();
      requestAnimationFrame(renderAnnoBadges);
      if(restoreFocus)setTimeout(()=>document.getElementById(`operation-tab-${index}`)?.focus({preventScroll:true}),0);
      window.dispatchEvent(new CustomEvent('new-user-guide:operation-select',{detail:{mainIndex:state.mainIndex,index,source}}));
    }

    function clearTimer(){
      if(state.timerId){clearTimeout(state.timerId);state.timerId=null}
    }

    function startTimer(reset=false){
      clearTimer();
      if(reset)state.remainingMs=state.intervalMs;
      if(state.pauseReasons.size||document.hidden)return;
      state.timerStartedAt=performance.now();
      state.timerId=setTimeout(()=>{
        state.timerId=null;
        state.remainingMs=state.intervalMs;
        const length=steps[state.mainIndex].operations.length;
        state.operationIndex=(state.operationIndex+1)%length;
        renderOperations();
        renderShot();
        lucide.createIcons();
        requestAnimationFrame(renderAnnoBadges);
        window.dispatchEvent(new CustomEvent('new-user-guide:operation-select',{detail:{mainIndex:state.mainIndex,index:state.operationIndex,source:'auto'}}));
        startTimer(true);
      },Math.max(0,state.remainingMs));
      const progress=$('operationTabs').querySelector('.operation-card[aria-selected="true"] .operation-progress');
      if(progress)progress.dataset.paused='false';
    }

    function restartTimer(){state.remainingMs=state.intervalMs;startTimer(false)}

    function pauseTimer(reason){
      if(state.pauseReasons.has(reason))return;
      state.pauseReasons.add(reason);
      if(state.timerId){state.remainingMs=Math.max(0,state.remainingMs-(performance.now()-state.timerStartedAt))}
      clearTimer();
      const progress=$('operationTabs').querySelector('.operation-card[aria-selected="true"] .operation-progress');
      if(progress)progress.dataset.paused='true';
    }

    function resumeTimer(reason){
      state.pauseReasons.delete(reason);
      if(!state.pauseReasons.size&&!document.hidden){
        const progress=$('operationTabs').querySelector('.operation-card[aria-selected="true"] .operation-progress');
        if(progress)progress.dataset.paused='false';
        startTimer(false);
      }
    }

    function handleTabKey(event,type){
      const max=type==='main'?steps.length:steps[state.mainIndex].operations.length;
      const datasetKey=type==='main'?'mainIndex':'operationIndex';
      const focusedIndex=Number(event.currentTarget?.dataset?.[datasetKey]);
      const current=Number.isInteger(focusedIndex)?focusedIndex:(type==='main'?state.mainIndex:state.operationIndex);
      let next=current;
      if(['ArrowRight','ArrowDown'].includes(event.key))next=(current+1)%max;
      else if(['ArrowLeft','ArrowUp'].includes(event.key))next=(current-1+max)%max;
      else if(event.key==='Home')next=0;
      else if(event.key==='End')next=max-1;
      else return;
      event.preventDefault();
      const id=type==='main'?`main-tab-${next}`:`operation-tab-${next}`;
      document.getElementById(id)?.focus();
    }

    function getGuideFocusables(scope=document){
      return [...scope.querySelectorAll('a[href],button:not([disabled]),[tabindex]:not([tabindex="-1"])')]
        .filter(element=>!element.hidden&&element.getClientRects().length>0);
    }

    function focusGuideEdge(edge='first'){
      const scope=$('annoPopup').classList.contains('hidden')?document:$('annoPanel');
      const focusable=getGuideFocusables(scope);
      const target=edge==='last'?focusable.at(-1):focusable[0];
      requestAnimationFrame(()=>target?.focus({preventScroll:true}));
    }

    function trapGuideFocus(event){
      if(event.key!=='Tab'||window.parent===window)return;
      const popupOpen=!$('annoPopup').classList.contains('hidden');
      const scope=popupOpen?$('annoPanel'):document;
      const focusable=getGuideFocusables(scope);
      if(!focusable.length)return;
      const current=focusable.indexOf(document.activeElement);
      if(current===-1){event.preventDefault();focusable[0].focus();return}
      const leavesForward=!event.shiftKey&&current===focusable.length-1;
      const leavesBackward=event.shiftKey&&current===0;
      if(!leavesForward&&!leavesBackward)return;
      event.preventDefault();
      if(!popupOpen){
        window.parent.postMessage({type:'yundeng:onboarding-focus-annotation'},'*');
        return;
      }
      (leavesForward?focusable[0]:focusable.at(-1)).focus();
    }

    function resetGuide(runTimer=true){
      clearTimer();
      if(!$('annoPopup').classList.contains('hidden'))closeAnno(false);
      setAnnotationVisible(false);
      state.mainIndex=0;
      state.operationIndex=0;
      state.pauseReasons.clear();
      state.remainingMs=state.intervalMs;
      $('ctaButton').disabled=false;
      renderContent();
      if(runTimer)startTimer(true);
    }

    function closeGuide(method='button'){
      resetGuide(false);
      if(window.parent!==window){window.parent.postMessage({type:'yundeng:onboarding-close',method},'*');return}
      location.href='系统框架.html?page=environment';
    }

    function navigateToCurrent(){
      const step=steps[state.mainIndex];
      clearTimer();
      $('ctaButton').disabled=true;
      if(window.parent!==window){window.parent.postMessage({type:'yundeng:onboarding-navigate',...step.route},'*');return}
      location.href=`系统框架.html?page=${encodeURIComponent(step.route.page)}`;
    }

    function showToast(message){
      $('toast').textContent=message;
      $('toast').classList.remove('hidden');
      clearTimeout(showToast.timer);
      showToast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2400);
    }

    function renderAnnoBadges(){
      const layer=$('annoLayer');layer.innerHTML='';if(!annoVisible)return;
      document.querySelectorAll('[data-anno]').forEach(element=>{
        if(element.hidden)return;
        const rect=element.getBoundingClientRect();
        if(!rect.width||!rect.height||rect.bottom<0||rect.top>innerHeight)return;
        const badge=document.createElement('button');
        badge.className='anno-badge';badge.textContent=element.dataset.anno;
        badge.style.left=Math.max(0,rect.right-10)+'px';badge.style.top=Math.max(0,rect.top-10)+'px';
        badge.setAttribute('aria-label',`查看标注 ${element.dataset.anno}`);
        badge.onclick=()=>showAnno(element.dataset.anno);layer.appendChild(badge);
      });
    }

    function notifyAnnotationState(){
      if(window.parent!==window)window.parent.postMessage({type:'yundeng:onboarding-annotation-state',visible:annoVisible},'*');
    }

    function setAnnotationVisible(visible){
      annoVisible=Boolean(visible);
      if(!annoVisible&&!$('annoPopup').classList.contains('hidden'))closeAnno(false);
      renderAnnoBadges();
      notifyAnnotationState();
    }

    function showAnno(id){
      const item=annotations[id];if(!item)return;
      lastAnnoFocus=document.activeElement;
      $('annoTitle').textContent=`${id}. ${item.title}`;
      $('annoDesc').innerHTML=`<ul class="list-disc pl-5 space-y-2">${item.desc.map(line=>`<li>${line}</li>`).join('')}</ul>`;
      $('annoPopup').classList.remove('hidden');$('annoPopup').classList.add('flex');$('closeAnno').focus();
    }

    function closeAnno(restoreFocus=true){
      $('annoPopup').classList.add('hidden');$('annoPopup').classList.remove('flex');
      if(restoreFocus)lastAnnoFocus?.focus();
      lastAnnoFocus=null;
    }

    $('closeGuide').addEventListener('click',()=>closeGuide('button'));
    $('previousButton').addEventListener('click',()=>selectMain(state.mainIndex-1,'previous'));
    $('nextButton').addEventListener('click',()=>selectMain(state.mainIndex+1,'next'));
    $('ctaButton').addEventListener('click',navigateToCurrent);
    $('retryShot').addEventListener('click',renderShot);
    $('fullGuideLink').addEventListener('click',event=>{
      if(!$('fullGuideLink').href){event.preventDefault();showToast('完整指南暂未上线，请稍后再试')}
    });
    const carouselNodes=[$('carouselRegion'),$('shotFigure')];
    const isInsideCarousel=node=>carouselNodes.some(element=>element.contains(node));
    carouselNodes.forEach(element=>{
      element.addEventListener('mouseenter',()=>pauseTimer('hover'));
      element.addEventListener('mouseleave',event=>{if(!isInsideCarousel(event.relatedTarget))resumeTimer('hover')});
      element.addEventListener('focusin',()=>pauseTimer('focus'));
      element.addEventListener('focusout',event=>{if(!isInsideCarousel(event.relatedTarget))resumeTimer('focus')});
    });
    window.addEventListener('blur',()=>pauseTimer('window-blur'));
    window.addEventListener('focus',()=>resumeTimer('window-blur'));
    document.addEventListener('visibilitychange',()=>document.hidden?pauseTimer('document-hidden'):resumeTimer('document-hidden'));
    document.addEventListener('keydown',event=>{
      trapGuideFocus(event);
      if(event.key!=='Escape')return;
      if(!$('annoPopup').classList.contains('hidden'))closeAnno();else closeGuide('escape');
    });
    $('annoPopup').addEventListener('click',event=>{if(event.target===$('annoPopup'))closeAnno()});
    $('closeAnno').addEventListener('click',closeAnno);
    window.addEventListener('resize',()=>{
      renderAnnoBadges();
    });
    window.addEventListener('message',event=>{
      if(event.source!==window.parent||!event.data)return;
      if(event.data.type==='yundeng:onboarding-reset'){
        resetGuide(true);requestAnimationFrame(()=>$('guideTitle').focus({preventScroll:true}));
      }
      if(event.data.type==='yundeng:onboarding-ping'){
        window.parent.postMessage({type:'yundeng:onboarding-ready'},'*');
        notifyAnnotationState();
      }
      if(event.data.type==='yundeng:onboarding-annotation-toggle')setAnnotationVisible(!annoVisible);
      if(event.data.type==='yundeng:onboarding-focus-edge')focusGuideEdge(event.data.edge);
      if(event.data.type==='yundeng:onboarding-navigation-cancelled'){$('ctaButton').disabled=false;startTimer(false);showToast('已取消跳转，当前修改仍保留')}
      if(event.data.type==='yundeng:onboarding-close-request')closeGuide('shell');
    });

    document.documentElement.dataset.embedded=String(window.parent!==window);
    renderContent();
    startTimer(true);
    lucide.createIcons();
    requestAnimationFrame(()=>{
      $('guideTitle').focus({preventScroll:true});
      if(window.parent!==window){
        window.parent.postMessage({type:'yundeng:onboarding-ready'},'*');
        notifyAnnotationState();
      }
    });
  </script>
</body>
</html>
