    function renderPagination(total,page,totalPages){
      const s=currentTabState(),buttons=[];
      const iconButton=(icon,target,disabled,label)=>`<button type="button" class="pg-btn btn btn-default h-[30px]" ${disabled?'disabled':''} data-page="${target}" aria-label="${label}"><i data-lucide="${icon}" class="w-4 h-4"></i></button>`;
      buttons.push(iconButton('chevron-left',page-1,page===1,'上一页'));
      for(let i=1;i<=totalPages;i++){
        if(totalPages>7&&i>2&&i<totalPages-1&&Math.abs(i-page)>1){if(i===3||i===totalPages-2)buttons.push('<span class="pg-ellipsis min-w-[30px] h-[30px] inline-flex items-center justify-center text-ink-muted">...</span>');continue}
        buttons.push(`<button type="button" class="pg-btn btn ${i===page?'btn-primary':'btn-default'} h-[30px]" data-page="${i}" ${i===page?'aria-current="page" disabled':''}>${i}</button>`)
      }
      buttons.push(iconButton('chevron-right',page+1,page===totalPages,'下一页'));
      $('pagination').innerHTML=`<div class="flex items-center gap-1">${buttons.join('')}</div><label class="pg-select-wrap relative"><span class="sr-only">每页条数</span><select id="pageSize" class="control h-[30px] pr-7" aria-label="每页条数"><option ${s.size===10?'selected':''}>10</option><option ${s.size===20?'selected':''}>20</option><option ${s.size===50?'selected':''}>50</option></select></label><label class="flex items-center gap-2 text-ink-sub">跳至<input id="jumpPage" class="control w-11 h-[30px] text-center mono" value="1" inputmode="numeric" aria-label="跳转页码">页</label><span class="text-ink-muted whitespace-nowrap" aria-live="polite">共 ${total} 条记录，第 ${page}/${totalPages} 页</span>`;
      $$('#pagination [data-page]').forEach(button=>button.addEventListener('click',()=>{if(button.disabled)return;s.page=Number(button.dataset.page);renderTable()}));
      $('pageSize').addEventListener('change',event=>{s.size=Number(event.target.value);s.page=1;renderTable()});
      $('jumpPage').addEventListener('keydown',event=>{if(event.key!=='Enter')return;const value=Number(event.target.value);if(!Number.isInteger(value)||value<1||value>totalPages){event.target.value='1';toast(`请输入 1-${totalPages} 之间的页码`,'warning');return}s.page=value;renderTable()});
      lucide.createIcons();
    }

    function proxyTransferFormHtml(){return `<div class="p-3 rounded bg-warning-bg text-warning leading-6 mb-5"><i data-lucide="triangle-alert" class="inline w-4 h-4 mr-1 align-[-2px]"></i>平台代理转移后，源团队将失去该代理的管理权。</div><div class="form-row"><label class="form-label"><span class="text-danger">*</span>选择代理</label><div class="form-control"><div class="scope-list">${platformProxies.map((proxy,index)=>`<label><input type="checkbox" name="transferProxy" value="${proxy.id}" ${index===0?'checked':''}> <span>${esc(proxy.name)} <small class="mono text-ink-muted">${proxy.id}</small><small class="block text-[11px] text-ink-sub">已绑定 ${proxy.envCount} 个环境</small></span></label>`).join('')}</div></div></div><div class="form-row"><label class="form-label"><span class="text-danger">*</span>转移给团队</label><div class="form-control"><input id="proxyTarget" class="control form-control" placeholder="请输入团队 ID"><p id="proxyAffected" class="text-[12px] text-warning mt-2">选择代理后将显示受影响环境。</p><p id="proxyError" class="hidden text-danger text-[12px] mt-1"></p></div></div>`}
    function updateFormCounters(){if($('shareEnvCount'))$('shareEnvCount').textContent=$$('[name="shareEnv"]:checked').length;if($('shareRemark'))$('remarkCount').textContent=`${$('shareRemark').value.length}/200`;if($('proxyAffected')){const count=$$('[name="transferProxy"]:checked').reduce((sum,input)=>sum+(platformProxies.find(x=>x.id===input.value)?.envCount||0),0);$('proxyAffected').textContent=count?`当前选择的平台代理仍绑定 ${count} 个环境，转移后这些环境可能进入“IP 已转移”状态。`:'当前选择的平台代理未绑定其他环境。'}}
    function bindFormEvents(){updateFormCounters();$$('[name="shareEnv"], [name="transferProxy"]').forEach(input=>input.addEventListener('change',updateFormCounters));if($('shareRemark'))$('shareRemark').addEventListener('input',updateFormCounters);if($('durationMinus'))$('durationMinus').onclick=()=>{$('durationDays').value=Math.max(1,Number($('durationDays').value||1)-1)};if($('durationPlus'))$('durationPlus').onclick=()=>{$('durationDays').value=Math.min(365,Number($('durationDays').value||1)+1)};if($('attachmentInput'))$('attachmentInput').addEventListener('change',e=>{const list=$('attachmentList');list.innerHTML='';[...e.target.files].slice(0,5).forEach(file=>{const valid=['image/jpeg','image/png'].includes(file.type)&&file.size<=2*1024*1024;const row=document.createElement('div');row.className=`flex items-center justify-between gap-2 text-[12px] ${valid?'text-ink-sub':'text-danger'}`;row.textContent=valid?`已选择：${file.name}`:`${file.name}：格式或大小不符合要求`;list.append(row)})})}
    function closeForm(){if($('formModal').classList.contains('hidden'))return;$('formModal').classList.add('hidden');popAnnoScope($('formPanel'));if(state.lastFocus?.focus)state.lastFocus.focus();state.modalType=null}
    function validateForm(){if(state.modalType==='share'){const envs=$$('[name="shareEnv"]:checked').map(x=>x.value),days=Number($('durationDays').value),raw=$('targetTeams').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),teams=[...new Set(raw)];if(!envs.length){toast('至少选择一个环境','warning');return false}if(!Number.isInteger(days)||days<1||days>365){$('durationDays').classList.add('invalid');$('durationError').classList.remove('hidden');return false}if(!teams.length){$('targetTeams').classList.add('invalid');$('teamError').textContent='请输入至少一个目标团队 ID';$('teamError').classList.remove('hidden');return false}if(teams.some(team=>team===currentTeamId||team.length<5)){ $('targetTeams').classList.add('invalid');$('teamError').textContent='请检查团队 ID，不能填写当前团队或无效 ID';$('teamError').classList.remove('hidden');return false}if($('includeCache')?.checked&&envs.some(id=>!environments.find(x=>x.id===id)?.snapshot)){toast('所选环境没有可用云端快照，无法分享缓存数据','warning');return false}return true}if(state.modalType==='environment'){const target=$('transferTarget').value.trim(),envs=$$('[name="transferEnv"]:checked');if(!envs.length){toast('至少选择一个可转移环境','warning');return false}if(!target||target===currentTeamId){$('transferTarget').classList.add('invalid');$('transferError').textContent='请输入有效的目标团队 ID，不能填写当前团队';$('transferError').classList.remove('hidden');return false}if($('transferCache')?.checked&&envs.some(input=>!environments.find(x=>x.id===input.value)?.snapshot)){toast('所选环境没有云端快照，无法转移缓存数据','warning');return false}openConfirm({title:'确认转移环境？',description:`已选择 ${envs.length} 个环境，转移给团队 ${target}。转移成功后原团队将不可查看这些环境。`,kind:'danger',action:'environmentTransfer'});return false}if(state.modalType==='proxy'){const target=$('proxyTarget').value.trim(),proxies=$$('[name="transferProxy"]:checked');if(!proxies.length){toast('至少选择一个平台代理','warning');return false}if(!target||target===currentTeamId){$('proxyTarget').classList.add('invalid');$('proxyError').textContent='请输入有效的目标团队 ID，不能填写当前团队';$('proxyError').classList.remove('hidden');return false}openConfirm({title:'确认转移平台代理？',description:`已选择 ${proxies.length} 个平台代理。${$('proxyAffected').textContent}`,kind:'danger',action:'proxyTransfer'});return false}return false}
    function submitShare(){const envs=$$('[name="shareEnv"]:checked').map(x=>x.value),teams=[...new Set($('targetTeams').value.split(/\n+/).map(x=>x.trim()).filter(Boolean))],days=Number($('durationDays').value),remark=$('shareRemark').value.trim();let next=1;envs.forEach(envId=>teams.forEach(team=>{const env=environments.find(x=>x.id===envId);shareRecords.unshift({id:`SH-DEMO-${String(Date.now()).slice(-5)}-${next++}`,group:env.group,name:env.name,account:env.account,proxy:'待检测 · 脱敏线路',envNote:'新建分享',shareNote:remark,target:`${team.slice(0,4)}•••`,expire:new Date(Date.now()+days*86400000).toISOString().slice(0,16).replace('T',' '),operator:'张小登',operated:nowLabel(),status:'active',scope:['指纹环境'],snapshot:env.snapshot})}));closeForm();state.tab='shares';state.tabs.shares.status='active';state.tabs.shares.page=1;state.selected.clear();renderAll();toast(`已创建 ${envs.length*teams.length} 条分享记录`,'success')}
    function submitTransfer(type){closeForm();if(type==='environmentTransfer'){const envs=$$('[name="transferEnv"]:checked').map(x=>x.value),target=$('transferTarget')?.value||'目标团队';envs.forEach((id,index)=>{const env=environments.find(x=>x.id===id);environmentTransfers.unshift({id:`TR-E-DEMO-${String(Date.now()).slice(-4)}-${index+1}`,name:env.name,account:env.account,ip:'203.0.113.••',target:`${target.slice(0,4)}•••`,operator:'张小登',time:nowLabel(),scope:['指纹环境','账号信息'],result:'succeeded'})});state.tab='environment';state.tabs.environment.page=1;renderAll();toast('环境已转移，原团队不再拥有该环境','success')}else{const proxies=$$('[name="transferProxy"]:checked').map(x=>x.value),target=$('proxyTarget')?.value||'目标团队';proxies.forEach((id,index)=>{const proxy=platformProxies.find(x=>x.id===id);proxyTransfers.unshift({id:`TR-P-DEMO-${String(Date.now()).slice(-4)}-${index+1}`,name:proxy.name,ip:proxy.ip,service:proxy.service,target:`${target.slice(0,4)}•••`,operator:'张小登',time:nowLabel(),affected:proxy.envCount,result:'succeeded'})});state.tab='proxy';state.tabs.proxy.page=1;renderAll();toast('平台代理已转移，请检查关联环境状态','success')}}
    function openCancelConfirm(ids){const valid=ids.filter(id=>shareRecords.find(row=>row.id===id)?.status==='active');if(!valid.length){toast('请先选择分享中的记录','warning');return}state.lastFocus=document.activeElement;openConfirm({title:'确认取消分享？',description:`将关闭 ${valid.length} 条分享记录，接收方将不能继续建立新会话。已产生的数据不会被自动删除。`,kind:'warning',action:'cancelShare',ids:valid})}
    function openConfirm(config){state.confirmAction=config;$('confirmTitle').textContent=config.title;$('confirmDescription').textContent=config.description;$('confirmIcon').textContent=config.kind==='danger'?'!':'?';$('confirmIcon').className=`w-5 h-5 rounded-full ${config.kind==='danger'?'bg-danger-bg text-danger':'bg-warning-bg text-warning'} flex items-center justify-center mr-3 font-semibold`;$('acceptConfirm').className=`btn ${config.kind==='danger'?'btn-danger':'btn-primary'}`;$('confirmDialog').classList.remove('hidden');pushAnnoScope($('confirmPanel'));lucide.createIcons()}
    function closeConfirm(){if($('confirmDialog').classList.contains('hidden'))return;$('confirmDialog').classList.add('hidden');popAnnoScope($('confirmPanel'));if(state.lastFocus?.focus)state.lastFocus.focus();state.confirmAction=null}
    function acceptConfirm(){const action=state.confirmAction;if(!action)return;if(action.action==='cancelShare'){action.ids.forEach(id=>{const row=shareRecords.find(x=>x.id===id);if(row)row.status='cancelled'});state.selected.clear();closeConfirm();renderAll();toast(`已取消 ${action.ids.length} 条分享`,'success')}else if(action.action==='environmentTransfer'){closeConfirm();submitTransfer('environmentTransfer')}else if(action.action==='proxyTransfer'){closeConfirm();submitTransfer('proxyTransfer')}}
    function openDetail(type,id){state.lastFocus=document.activeElement;let row,html,title;if(type==='share'){row=shareRecords.find(x=>x.id===id);title='分享详情';html=`<div class="grid grid-cols-2 gap-3 p-4 bg-page rounded mb-5"><div><dt class="text-ink-muted text-[12px]">分享记录 ID</dt><dd class="mono mt-1">${esc(row.id)}</dd></div><div><dt class="text-ink-muted text-[12px]">状态</dt><dd class="mt-1">${statusBadge(row.status)}</dd></div><div><dt class="text-ink-muted text-[12px]">环境名称</dt><dd class="mt-1">${esc(row.name)}</dd></div><div><dt class="text-ink-muted text-[12px]">目标团队</dt><dd class="mt-1">${esc(row.target)}</dd></div><div><dt class="text-ink-muted text-[12px]">分享内容</dt><dd class="mt-1">${row.scope.map(esc).join('、')}</dd></div><div><dt class="text-ink-muted text-[12px]">到期时间</dt><dd class="mono mt-1">${esc(row.expire)}</dd></div><div class="col-span-2"><dt class="text-ink-muted text-[12px]">备注</dt><dd class="mt-1">${esc(row.shareNote||'-')}</dd></div></div><h3 class="text-[15px] font-semibold text-ink-title mb-3">操作记录</h3>${logHtml(row.operated,row.operator,row.status==='active'?'创建分享':'状态变更')}` }else if(type==='environment'){row=environmentTransfers.find(x=>x.id===id);title='环境转移详情';html=`<div class="p-4 bg-danger-bg text-danger rounded mb-5">环境已经转移至目标团队，源团队无法再次编辑或启动。</div><dl class="grid grid-cols-2 gap-4 p-4 bg-page rounded mb-5"><div><dt class="text-ink-muted text-[12px]">转移记录 ID</dt><dd class="mono mt-1">${esc(row.id)}</dd></div><div><dt class="text-ink-muted text-[12px]">环境名称</dt><dd class="mt-1">${esc(row.name)}</dd></div><div><dt class="text-ink-muted text-[12px]">账号</dt><dd class="mt-1">${esc(row.account)}</dd></div><div><dt class="text-ink-muted text-[12px]">IP</dt><dd class="mono mt-1">${esc(row.ip)}</dd></div><div class="col-span-2"><dt class="text-ink-muted text-[12px]">转移内容</dt><dd class="mt-1">${row.scope.map(esc).join('、')}</dd></div><div><dt class="text-ink-muted text-[12px]">转移给团队</dt><dd class="mt-1">${esc(row.target)}</dd></div><div><dt class="text-ink-muted text-[12px]">操作时间</dt><dd class="mono mt-1">${esc(row.time)}</dd></div></dl>${logHtml(row.time,row.operator,'环境转移')}` }else{row=proxyTransfers.find(x=>x.id===id);title='平台代理转移详情';html=`<div class="p-4 bg-warning-bg text-warning rounded mb-5">如果该平台代理仍绑定其他环境，关联环境需要重新绑定新的代理。</div><dl class="grid grid-cols-2 gap-4 p-4 bg-page rounded mb-5"><div><dt class="text-ink-muted text-[12px]">代理名称</dt><dd class="mt-1">${esc(row.name)}</dd></div><div><dt class="text-ink-muted text-[12px]">IP</dt><dd class="mono mt-1">${esc(row.ip)}</dd></div><div><dt class="text-ink-muted text-[12px]">服务商</dt><dd class="mt-1">${esc(row.service)}</dd></div><div><dt class="text-ink-muted text-[12px]">影响环境</dt><dd class="mono mt-1">${row.affected} 个</dd></div><div><dt class="text-ink-muted text-[12px]">转移给团队</dt><dd class="mt-1">${esc(row.target)}</dd></div><div><dt class="text-ink-muted text-[12px]">操作时间</dt><dd class="mono mt-1">${esc(row.time)}</dd></div></dl>${logHtml(row.time,row.operator,'平台代理转移')}`}$('detailTitle').textContent=title;$('detailBody').innerHTML=html;$('detailDrawer').classList.remove('hidden');pushAnnoScope($('detailPanel'));lucide.createIcons()}
    function logHtml(time,operator,action){return `<table class="data-table"><thead><tr><th>操作时间</th><th>操作类型</th><th>操作人</th><th>结果</th></tr></thead><tbody><tr><td class="mono">${esc(time)}</td><td>${esc(action)}</td><td>${esc(operator)}</td><td>${statusBadge('succeeded')}</td></tr></tbody></table>`}
    function closeDetail(){if($('detailDrawer').classList.contains('hidden'))return;$('detailDrawer').classList.add('hidden');popAnnoScope($('detailPanel'));if(state.lastFocus?.focus)state.lastFocus.focus();state.detail=null}

    /* ---------- Portal 标注系统 ---------- */
    function pushAnnoScope(el){const index=state.annoScope.indexOf(el);if(index>=0)state.annoScope.splice(index,1);state.annoScope.push(el);renderAnnoBadges()}
    function popAnnoScope(el){const index=state.annoScope.indexOf(el);if(index>=0)state.annoScope.splice(index,1);renderAnnoBadges()}
    function resolveAnnoTarget(el){const rect=el.getBoundingClientRect();return rect.width>800||rect.width>window.innerWidth*.7?el.querySelector('h1,h2,h3,button,input,select')||el:el}
    function renderAnnoBadges(){const layer=$('annoLayer');layer.innerHTML='';if(!state.annoVisible)return;const root=state.annoScope.at(-1)||document;const seen=new Set();root.querySelectorAll('[data-anno]').forEach(el=>{if(seen.has(el.dataset.anno)||el.offsetParent===null)return;const target=resolveAnnoTarget(el),rect=target.getBoundingClientRect();if(!rect.width||!rect.height||rect.bottom<0||rect.top>innerHeight)return;seen.add(el.dataset.anno);const badge=document.createElement('button');badge.className='anno-badge';badge.textContent=el.dataset.anno;badge.style.left=Math.max(0,rect.right-10)+'px';badge.style.top=Math.max(0,rect.top-10)+'px';badge.setAttribute('aria-label',`查看交互说明 ${el.dataset.anno}`);badge.onclick=()=>showAnnoPopup(el.dataset.anno);layer.append(badge)})}
    let annoReturnFocus=null;
    function showAnnoPopup(id){const item=annotations[id];if(!item)return;const origin=document.querySelector(`[data-anno="${id}"]`);annoReturnFocus=origin?.matches('button,a,input,select,textarea,[tabindex]')?origin:origin?.querySelector('button,a,input,select,textarea,[tabindex]')||$('annoToggle');$('annoTitle').textContent=`${id}. ${item.title}`;$('annoDesc').innerHTML=`<ul class="list-disc pl-5 space-y-2">${item.desc.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;$('annoPopup').classList.remove('hidden');renderAnnoBadges();$('closeAnno').focus()}
    function closeAnnoPopup(){if($('annoPopup').classList.contains('hidden'))return;$('annoPopup').classList.add('hidden');renderAnnoBadges();annoReturnFocus?.focus?.({preventScroll:true});annoReturnFocus=null}
    function setupAnnoToggleDrag(){const toggle=$('annoToggle');let timer=null,drag=null,dragged=false;const moveTo=y=>{if(!drag)return;toggle.style.top=Math.max(8,Math.min(innerHeight-toggle.offsetHeight-8,drag.top+y-drag.startY))+'px'};const finish=e=>{clearTimeout(timer);if(!drag)return;if(drag.active){dragged=true;moveTo(drag.latest);localStorage.setItem('yundeng-share-anno-top',parseInt(toggle.style.top,10))}if(toggle.hasPointerCapture(e.pointerId))toggle.releasePointerCapture(e.pointerId);drag=null};toggle.style.top=(Number(localStorage.getItem('yundeng-share-anno-top'))||120)+'px';toggle.addEventListener('pointerdown',e=>{drag={startY:e.clientY,latest:e.clientY,top:toggle.getBoundingClientRect().top,active:false};toggle.setPointerCapture(e.pointerId);timer=setTimeout(()=>{if(!drag)return;drag.active=true;toggle.classList.add('cursor-grabbing');},350)});toggle.addEventListener('pointermove',e=>{if(!drag)return;drag.latest=e.clientY;if(drag.active){e.preventDefault();moveTo(e.clientY)}});toggle.addEventListener('pointerup',finish);toggle.addEventListener('pointercancel',finish);toggle.addEventListener('click',()=>{if(dragged){dragged=false;return}state.annoVisible=!state.annoVisible;toggle.classList.toggle('bg-primary',state.annoVisible);toggle.classList.toggle('bg-ink-muted',!state.annoVisible);toggle.setAttribute('aria-pressed',String(state.annoVisible));toggle.querySelector('span').textContent=state.annoVisible?'隐藏标注':'显示标注';renderAnnoBadges()})}

    $('closeForm').onclick=$('cancelForm').onclick=closeForm;$('formModal').addEventListener('click',e=>{if(e.target===$('formModal'))closeForm()});$('confirmForm').onclick=()=>{if(validateForm())state.modalType==='share'?submitShare():null};
    $('closeConfirm').onclick=$('cancelConfirm').onclick=closeConfirm;$('acceptConfirm').onclick=acceptConfirm;$('confirmDialog').addEventListener('click',e=>{if(e.target===$('confirmDialog'))closeConfirm()});$('closeDetail').onclick=$('detailDone').onclick=closeDetail;$('detailDrawer').addEventListener('click',e=>{if(e.target===$('detailDrawer'))closeDetail()});
    $('collapseBtn').onclick=()=>{$('sidebar').classList.toggle('compact');$('collapseBtn').innerHTML=`<i data-lucide="${$('sidebar').classList.contains('compact')?'panel-left-open':'panel-left-close'}" class="w-[18px] h-[18px]"></i>`;lucide.createIcons();renderAnnoBadges()};$('mobileMenu').onclick=()=>{$('sidebar').classList.toggle('open');};$('helpBtn').onclick=()=>showPopover('helpPopover');$('noticeBtn').onclick=()=>showPopover('noticePopover');$('languageBtn').onclick=()=>showPopover('languagePopover');$('accountBtn').onclick=()=>showPopover('accountPopover');$('helpLink').onclick=()=>showPopover('helpPopover');$('settingsLink').onclick=()=>toast('偏好设置将在设置模块中管理','info');document.addEventListener('click',e=>{if(!e.target.closest('.popover,#helpBtn,#noticeBtn,#languageBtn,#accountBtn,#helpLink'))closePopovers()});$('languagePopover').innerHTML=['简体中文','English','日本語'].map(x=>`<button class="w-full text-left px-3 py-2 rounded hover:bg-hover ${x==='简体中文'?'text-primary font-medium':''}">${x}</button>`).join('');
    $('closeAnno').onclick=closeAnnoPopup;$('annoPopup').onclick=e=>{if(e.target===$('annoPopup'))closeAnnoPopup()};document.addEventListener('keydown',e=>{if(e.key==='Tab'&&!$('annoPopup').classList.contains('hidden')){e.preventDefault();$('closeAnno').focus();return}if(e.key==='Escape'){if(!$('annoPopup').classList.contains('hidden'))closeAnnoPopup();else if(!$('confirmDialog').classList.contains('hidden'))closeConfirm();else if(!$('formModal').classList.contains('hidden'))closeForm();else if(!$('detailDrawer').classList.contains('hidden'))closeDetail();else closePopovers()}});$('mainContent').addEventListener('scroll',renderAnnoBadges);window.addEventListener('resize',renderAnnoBadges);setupAnnoToggleDrag();renderNav();renderAll();lucide.createIcons();
